"Rotação de culturas e fixação de nitrogênio":["Bactérias fixadoras de nitrogênio, como <i>Rhizobium</i>, vivem em nódulos nas raízes de leguminosas (feijão, soja) e convertem o N<sub>2</sub> do ar em amônia, aproveitada pela planta; em troca, a planta fornece compostos orgânicos (mutualismo). A rotação de culturas alterna leguminosas e outras culturas, repõe nitrogênio no solo e reduz a necessidade de adubos nitrogenados, que, em excesso, podem contaminar a água e causar eutrofização.",["N<sub>2</sub> do ar → amônia pelas bactérias fixadoras","<i>Rhizobium</i> + leguminosa: mutualismo (nódulos)","Rotação de culturas: menos adubo nitrogenado"],"Leguminosa com nódulos nas raízes = fixação biológica de nitrogênio.","Um agricultor alternou, em uma mesma área, o plantio de milho com o de soja. Após alguns ciclos, percebeu que a produtividade do milho se manteve com menor uso de adubo nitrogenado. Ao arrancar a soja, observou pequenos nódulos nas raízes.","A redução da necessidade de adubo é explicada porque:",["a soja absorve todo o nitrogênio do solo e o transfere ao milho pelas raízes.","os nódulos são tumores que produzem nitrogênio por fotossíntese.","bactérias dos nódulos da soja fixam o N<sub>2</sub> do ar em formas assimiláveis, enriquecendo o solo com nitrogênio para a cultura seguinte.","o milho fixa o nitrogênio do ar diretamente por suas folhas.","a soja libera nitrogênio na forma de gás para a atmosfera, adubando o milho."],2,"C: bactérias fixadoras nos nódulos convertem N<sub>2</sub> em formas assimiláveis, que enriquecem o solo. A é falsa: a soja não retira nitrogênio para o milho. B é falsa: os nódulos abrigam bactérias, não são tumores, e nada tem a ver com fotossíntese. D é falsa: o milho não fixa N<sub>2</sub>. E é falsa: o N<sub>2</sub> gasoso não adubaria a planta."],
"Fator Rh e eritroblastose fetal":["O fator Rh é determinado por um gene com dois alelos: R (Rh+, dominante) e r (Rh−, recessivo). Uma mulher Rh− (rr) que gera um bebê Rh+ pode produzir anticorpos anti-Rh se tiver contato com o sangue fetal, principalmente no parto; em gestações seguintes de bebês Rh+, esses anticorpos podem atravessar a placenta e destruir hemácias do feto (eritroblastose fetal). O acompanhamento pré-natal permite identificar o risco e adotar medidas preventivas.",["Rh+: RR ou Rr; Rh−: rr","Mãe Rh− com filho Rh+: risco de sensibilização","Anticorpos anti-Rh atravessam a placenta em gestações seguintes"],"O risco existe quando a mãe é Rh− e o feto é Rh+.","Uma mulher Rh− (rr) e um homem Rh+ heterozigoto (Rr) esperam o primeiro filho. Considere que o alelo R é dominante sobre r e ignore mutações.","A probabilidade de o filho ser Rh+ e, portanto, de haver risco de sensibilização materna é de:",["1/4","3/4","1","1/2","0"],3,"Rr × rr gera 1/2 Rr (Rh+) e 1/2 rr (Rh−); P(Rh+) = 1/2 (D). A (1/4) é a proporção de rr em Rr × Rr; B (3/4) é a de Rh+ em Rr × Rr; C (1) supõe que todo filho de pai Rh+ é Rh+; E (0) supõe que a mãe Rh− impede um filho Rh+."],
"Nutrientes, vitaminas e carências":["Vitaminas são nutrientes necessários em pequenas quantidades, obtidos principalmente da alimentação. A carência de vitamina C causa escorbuto; a de vitamina D, raquitismo em crianças (menor absorção de cálcio); a de vitamina B1, beribéri; a de vitamina A, problemas de visão, como cegueira noturna. A falta de ferro causa anemia ferropriva, e a de iodo, bócio. Uma dieta variada previne a maioria das carências.",["Vitamina C: escorbuto","Vitamina D: raquitismo (absorção de cálcio)","Vitamina A: cegueira noturna","Ferro: anemia; iodo: bócio"],"Associe a doença ao nutriente: escorbuto → C; raquitismo → D; bócio → iodo.","Marinheiros em longas viagens, no passado, apresentavam gengivas sangrantes e má cicatrização, sintomas que desapareciam quando passavam a consumir frutas cítricas frescas.","Essa doença e o nutriente cuja falta a causa são, respectivamente:",["raquitismo e vitamina D.","beribéri e vitamina B1.","bócio e iodo.","anemia ferropriva e ferro.","escorbuto e vitamina C."],4,"E: os sintomas descritos são do escorbuto, causado pela falta de vitamina C, abundante em frutas cítricas. A (raquitismo) afeta os ossos por falta de vitamina D; B (beribéri) afeta nervos e coração por falta de B1; C (bócio) é aumento da tireoide por falta de iodo; D (anemia) está ligada à falta de ferro."],
"Adaptações das plantas a diferentes ambientes":["Plantas de ambientes secos (xerófitas), como os cactos, têm adaptações para reduzir a perda de água: cutícula espessa, poucos estômatos, folhas reduzidas a espinhos, caules suculentos que armazenam água e raízes profundas ou muito ramificadas. Plantas aquáticas (hidrófitas) têm espaços de ar nos tecidos (aerênquima) e pouca sustentação. Plantas de sombra têm folhas largas e finas.",["Xerófitas: cutícula espessa, espinhos, caule suculento","Hidrófitas: aerênquima (espaços de ar)","Folhas reduzidas a espinhos: menos transpiração"],"No cacto, o espinho é uma folha modificada que reduz a perda de água; a fotossíntese ocorre no caule.","Um cacto do semiárido tem caule carnoso, cutícula espessa, poucas aberturas estomáticas e folhas reduzidas a espinhos. Em dias muito quentes, a perda de água do cacto é muito menor do que a de uma planta de folhas largas.","Essas características são adaptações que:",["reduzem a perda de água por transpiração e permitem armazenar água, favorecendo a sobrevivência em ambientes secos.","aumentam a transpiração, resfriando a planta.","impedem a fotossíntese, reduzindo o gasto de energia.","servem para absorver água do ar por meio dos espinhos, sem raízes.","aumentam a captação de luz, pois as folhas são largas."],0,"A: cutícula espessa, poucos estômatos, folhas reduzidas e caule suculento diminuem a perda de água e armazenam água. B contraria o texto: a perda de água é menor. C é falsa: o cacto faz fotossíntese no caule. D é falsa: o cacto tem raízes. E contraria o texto: as folhas são reduzidas."],
"Metamorfose em insetos e anfíbios":["Na metamorfose completa (holometabolia), os insetos passam por ovo, larva, pupa e adulto, e a larva é muito diferente do adulto (borboletas, moscas, besouros). Na incompleta (hemimetabolia), o ovo origina uma ninfa, semelhante ao adulto, que cresce por mudas (gafanhotos, baratas). Nos anfíbios, o girino aquático, com brânquias, sofre metamorfose e forma o adulto com pulmões e patas. A diferença entre larva e adulto pode reduzir a competição entre eles.",["Completa: ovo → larva → pupa → adulto","Incompleta: ovo → ninfa → adulto","Anfíbios: girino (brânquias) → adulto (pulmões)"],"Pupa (ou crisálida) indica metamorfose completa; ninfa, incompleta.","Em uma criação de insetos, observou-se que as lagartas de uma espécie se alimentam de folhas e o adulto, de néctar. Entre as duas fases há um estágio imóvel, envolto em casulo, no qual o corpo se reorganiza.","Esse ciclo de vida caracteriza:",["metamorfose incompleta, com ninfa semelhante ao adulto.","metamorfose completa, com as fases ovo, larva, pupa e adulto, e larva e adulto usam recursos diferentes, o que reduz a competição entre eles.","desenvolvimento direto, sem fases distintas, como em mamíferos.","reprodução assexuada por partenogênese.","metamorfose dos anfíbios, com girino e adulto."],1,"B: lagarta, pupa (casulo) e adulto indicam metamorfose completa, e dietas diferentes reduzem a competição. A contraria o texto: a lagarta é muito diferente do adulto e há estágio de pupa. C contraria as fases descritas. D não tem relação com o texto. E descreve outro grupo."],
"Decompositores e ciclagem de nutrientes":["Decompositores (bactérias e fungos) degradam restos de organismos e excretas, liberando nutrientes inorgânicos (como nitrato, fosfato e CO<sub>2</sub>), que são reaproveitados pelos produtores. Sem eles, a matéria orgânica se acumularia e os nutrientes ficariam indisponíveis. A energia flui em sentido único, enquanto a matéria circula. A decomposição é mais rápida em ambientes quentes e úmidos.",["Decompositores: bactérias e fungos","Liberam nutrientes inorgânicos para os produtores","Decomposição mais rápida com calor e umidade"],"Os decompositores fecham o ciclo da matéria; a energia, porém, se dissipa.","Em uma floresta tropical úmida, a camada de folhas caídas desaparece em poucas semanas. Em uma região fria e seca, a mesma quantidade de folhas leva anos para se decompor.","A diferença na velocidade de decomposição está relacionada ao fato de que:",["em ambientes frios e secos, os decompositores são mais ativos e mais numerosos.","os decompositores só atuam em ambientes frios, e por isso as folhas somem mais lentamente na floresta.","a atividade de bactérias e fungos decompositores é maior em condições quentes e úmidas, o que acelera a ciclagem de nutrientes.","as folhas de florestas tropicais não são orgânicas.","os decompositores são consumidores de topo e dependem da altitude."],2,"C: calor e umidade favorecem bactérias e fungos, acelerando a decomposição. A e B invertem a relação. D é falsa: folhas são matéria orgânica. E é falsa: decompositores não são consumidores de topo."],
"Resistência bacteriana e uso responsável de antibióticos":["O uso inadequado de antibióticos (doses incompletas, uso sem necessidade ou sem prescrição) favorece a seleção de bactérias resistentes: as sensíveis morrem, e as que têm mutações ou genes de resistência sobrevivem, se reproduzem e transmitem esses genes, inclusive a outras bactérias por conjugação. Isso torna infecções mais difíceis de tratar. O uso responsável, seguindo orientação de profissionais de saúde, e a higiene reduzem a disseminação.",["Antibiótico atua em bactérias, não em vírus","Uso inadequado seleciona bactérias resistentes","Genes de resistência podem passar por conjugação"],"Resistência é seleção natural: o antibiótico é o agente seletivo.","Em um hospital, o uso frequente e, muitas vezes, desnecessário de um mesmo antibiótico foi seguido pelo aumento de casos de infecção por bactérias que não respondem mais a esse medicamento.","Qual explicação é compatível com a teoria evolutiva?",["O antibiótico induziu, em todas as bactérias, a mutação que as tornou resistentes.","As bactérias aprenderam a resistir ao medicamento durante o tratamento e ensinaram as demais.","O antibiótico fortaleceu as bactérias, que passaram a ser mais agressivas.","O uso intenso do antibiótico selecionou bactérias já resistentes, que se multiplicaram, e seus genes podem passar a outras bactérias.","As bactérias sensíveis se transformaram em vírus."],3,"D: o antibiótico seleciona bactérias com resistência preexistente, que se reproduzem e podem transferir genes a outras. A é falsa: o antibiótico não induz mutações direcionadas. B e C atribuem aprendizado ou fortalecimento às bactérias, o que não ocorre. E é falsa: bactérias não se transformam em vírus."],
"Espécies invasoras":["Espécies exóticas invasoras são introduzidas fora de sua área de origem, estabelecem-se e proliferam, prejudicando espécies nativas por competição, predação, parasitismo ou alteração do hábitat. Em geral, faltam predadores e parasitas naturais no novo ambiente, o que favorece a expansão. Exemplos no Brasil: o caramujo-gigante-africano e o mexilhão-dourado. A prevenção envolve controle do transporte de espécies, educação ambiental e monitoramento.",["Exótica: fora da área de origem; invasora: se espalha e causa danos","Falta de predadores naturais favorece a expansão","Impactos: competição, predação e perda de biodiversidade nativa"],"Nem toda espécie exótica é invasora: a invasora é a que prolifera e causa impactos.","Um peixe de lago de outro continente foi introduzido em uma represa brasileira para a pesca esportiva. Poucos anos depois, a população do peixe cresceu muito e várias espécies de peixes nativos diminuíram. Na região não há predadores naturais do peixe introduzido.","O que explica a redução dos peixes nativos?",["O peixe introduzido não compete com os nativos, pois é de outro continente.","O peixe introduzido produz alimento para os nativos, e isso reduz suas populações.","Os peixes nativos migram para outro continente por competição com o ambiente.","A introdução aumentou a diversidade, o que, por definição, reduz a população dos nativos.","O peixe introduzido, sem predadores naturais, proliferou e passou a competir com os nativos por alimento e espaço, ou a predá-los."],4,"E: sem predadores naturais, o peixe exótico proliferou e pressionou os nativos por competição e predação. A contraria os fatos: a origem não impede a competição. B é falsa e contradiz a redução observada. C é falsa: peixes de represa não migram entre continentes. D é falsa: aumento de diversidade não reduz populações por definição."],
"Biomoléculas e valor energético dos alimentos":["Carboidratos são a principal fonte rápida de energia; lipídios são reserva energética de longo prazo e compõem membranas; proteínas têm funções estrutural, enzimática e de defesa e podem fornecer energia; ácidos nucleicos armazenam informação genética. Em média, carboidratos e proteínas fornecem cerca de 4 kcal/g e lipídios, cerca de 9 kcal/g; a água não fornece energia.",["Carboidratos e proteínas: ≈ 4 kcal/g","Lipídios: ≈ 9 kcal/g","Enzimas, anticorpos e hemoglobina: proteínas","Ácidos nucleicos: informação genética"],"Multiplique a massa de cada nutriente pelo seu valor: carboidrato e proteína × 4; lipídio × 9.","O rótulo de um lanche informa, por porção: 50 g de carboidratos, 20 g de proteínas e 10 g de lipídios. Considere os valores energéticos de 4 kcal/g para carboidratos e proteínas e de 9 kcal/g para lipídios, e ignore os demais componentes.","O valor energético dessa porção é de:",["370 kcal","320 kcal","280 kcal","720 kcal","80 kcal"],0,"4 × 50 + 4 × 20 + 9 × 10 = 200 + 80 + 90 = 370 kcal (A). B usa 4 kcal/g também para os lipídios; C omite os lipídios; D usa 9 kcal/g para todos os nutrientes; E soma as massas, sem converter em energia."],
"Células procariontes e eucariontes":["Células procariontes (bactérias e arqueias) não têm núcleo delimitado por membrana nem organelas membranosas; o DNA fica no nucleoide, e há ribossomos. Células eucariontes têm núcleo organizado e organelas membranosas. Células vegetais têm parede de celulose, cloroplastos e vacúolo grande; células animais não têm parede; fungos têm parede de quitina; bactérias, de peptideoglicano.",["Procarionte: sem núcleo organizado; DNA no nucleoide","Eucarionte: núcleo e organelas membranosas","Ribossomos: presentes nos dois tipos","Parede: planta (celulose), fungo (quitina), bactéria (peptideoglicano)"],"Todas as células têm ribossomos; núcleo e mitocôndrias só nos eucariontes.","Ao microscópio eletrônico, uma célula apresentou DNA circular disperso em uma região sem membrana, ribossomos e parede celular, mas não apresentou núcleo delimitado nem mitocôndrias.","Essa célula é:",["eucarionte animal, pois tem ribossomos.","procarionte, como uma bactéria, pois o DNA não está envolto por membrana e faltam organelas membranosas.","eucarionte vegetal, pois tem parede celular.","um vírus, pois tem DNA circular.","eucarionte fúngico, pois não tem cloroplastos."],1,"B: ausência de núcleo e de organelas membranosas, DNA circular e parede indicam procarionte. A erra: ribossomos existem em todas as células, e células animais não têm parede. C erra: células vegetais têm núcleo e cloroplastos. D erra: vírus não têm ribossomos nem parede celular. E erra: fungos são eucariontes, com núcleo."],
"Interação gênica e epistasia":["Na interação gênica, mais de um gene influencia uma característica. Na epistasia, um gene (epistático) mascara a expressão de outro (hipostático). Em Labradores, o gene B determina a cor do pigmento (B_ preto; bb marrom) e o gene E determina se o pigmento é depositado nos pelos (E_ permite; ee impede, e o pelo fica dourado, qualquer que seja o genótipo para B). O cruzamento BbEe × BbEe dá 9 pretos : 3 marrons : 4 dourados.",["Epistasia: um gene mascara a expressão de outro","BbEe × BbEe → 9 B_E_ : 3 bbE_ : 4 (B_ee + bbee)","ee → dourado (epistático sobre B)"],"Some as classes mascaradas: aqui, 3 + 1 = 4 de 16 são dourados.","Em Labradores, o pelo é preto (B_E_), marrom (bbE_) ou dourado (qualquer genótipo ee). Dois cães pretos de genótipo BbEe foram cruzados. Considere que os genes estão em cromossomos diferentes e ignore mutações.","A probabilidade de nascer um filhote dourado é de:",["1/16","3/16","9/16","1/4","3/8"],3,"Filhote dourado = ee, com qualquer genótipo para B: P(ee) = 1/4, que é 3/16 (B_ee) + 1/16 (bbee) = 4/16 (D). A (1/16) é só bbee; B (3/16) é a de marrom (ou de B_ee); C (9/16) é a de preto; E (3/8) soma classes de modo incorreto."],
"Mamíferos e adaptações":["Os mamíferos têm pelos, glândulas mamárias (que produzem leite), diafragma, coração com quatro cavidades e endotermia. A maioria é placentária, com desenvolvimento do embrião no útero; os monotremados, como o ornitorrinco, põem ovos; nos marsupiais, como o canguru, os filhotes completam o desenvolvimento no marsúpio. Pelos e endotermia permitem manter a temperatura corporal constante em ambientes frios.",["Pelos, glândulas mamárias e diafragma","Coração com 4 cavidades; circulação dupla e completa","Monotremados: põem ovos; marsupiais: marsúpio; placentários: placenta"],"A característica exclusiva dos mamíferos é a presença de glândulas mamárias.","Um zoólogo estuda um animal que tem pelos, amamenta os filhotes e põe ovos. Ele precisa classificá-lo entre os vertebrados.","Essas características indicam que o animal é:",["uma ave, pois põe ovos.","um réptil, pois põe ovos de casca.","um mamífero monotremado, pois tem pelos e glândulas mamárias, mas põe ovos.","um mamífero placentário, pois amamenta os filhotes e põe ovos.","um anfíbio, pois tem pele sem pelos."],2,"C: pelos e amamentação indicam mamífero, e a postura de ovos indica um monotremado, como o ornitorrinco. A e B ignoram pelos e glândulas mamárias. D erra: placentários não põem ovos. E contraria o texto, que cita pelos."],
"Equinodermos":["Equinodermos (estrelas-do-mar, ouriços-do-mar, pepinos-do-mar) são animais marinhos de simetria radial no adulto (as larvas são bilaterais), com esqueleto interno calcário e sistema ambulacral, rede de canais com água do mar que movimenta os pés ambulacrais, usados na locomoção e na alimentação. Muitos regeneram partes do corpo. São deuterostômios, grupo próximo dos cordados.",["Simetria radial no adulto; larva bilateral","Esqueleto interno calcário","Sistema ambulacral: pés ambulacrais","Deuterostômios, próximos dos cordados"],"Equinodermo: exclusivamente marinho, com sistema ambulacral.","Uma estrela-do-mar perdeu um braço em um ataque de predador e, meses depois, o braço estava parcialmente regenerado. Ao observar o animal virado, um biólogo notou centenas de pequenos tubos que se estendem e se retraem na face inferior dos braços.","Esses tubos e a capacidade de regeneração são características de:",["artrópodes, que se movem por patas articuladas e trocam o exoesqueleto.","moluscos, que se movem por um pé muscular e têm concha.","equinodermos, que se movem por pés ambulacrais ligados ao sistema ambulacral e podem regenerar partes do corpo.","anelídeos, que se movem por cerdas e têm corpo segmentado.","cnidários, que se movem por cnidócitos."],2,"C: os tubos são pés ambulacrais, típicos de equinodermos, que também podem regenerar braços. A, B e D descrevem a locomoção de outros grupos. E erra: cnidócitos são células urticantes, não estruturas de locomoção."],
"Sistema tegumentar e pele":["A pele é formada por epiderme (camada externa, com células queratinizadas e melanócitos), derme (com vasos, nervos e glândulas) e hipoderme (tecido adiposo). A melanina, produzida pelos melanócitos, absorve parte da radiação ultravioleta e protege o DNA das células; a exposição intensa à radiação UV aumenta o risco de danos ao DNA e de câncer de pele. A pele participa da termorregulação: o suor, ao evaporar, retira calor do corpo.",["Epiderme: queratina e melanócitos","Melanina: absorve UV","Suor: a evaporação resfria o corpo","Pele: barreira contra microrganismos e perda de água"],"A queratina e a melanina estão na epiderme.","Em um dia de verão intenso, uma pessoa passou horas ao sol e, depois, observou que a pele ficou mais escura e que ela suava bastante.","Qual explicação relaciona corretamente as respostas da pele a esses estímulos?",["O escurecimento ocorre por acúmulo de queratina na derme, e o suor retém calor no corpo.","O escurecimento é causado pela produção de sebo, e o suor impede a perda de calor.","O escurecimento ocorre por redução de melanina, e o suor aquece a pele.","O escurecimento é causado por glóbulos vermelhos que migram para a epiderme, e o suor protege contra o frio.","A pele aumenta a produção de melanina, que absorve parte da radiação UV, e o suor, ao evaporar, retira calor e ajuda a resfriar o corpo."],4,"E: a melanina aumenta com a exposição ao UV e o suor, ao evaporar, resfria. A, B, C e D atribuem causas erradas ao escurecimento (queratina, sebo, redução de melanina, hemácias) ou funções contrárias ao suor."],
"Ilhas de calor e urbanização":["Nas cidades, a substituição da vegetação por asfalto e concreto, que absorvem e armazenam calor, a impermeabilização do solo e a concentração de edifícios e veículos formam as ilhas de calor: áreas urbanas mais quentes que as áreas rurais vizinhas. A vegetação reduz a temperatura por sombreamento e evapotranspiração. Áreas verdes, telhados verdes e superfícies claras ajudam a atenuar o efeito. A impermeabilização também aumenta o escoamento superficial e o risco de enchentes.",["Asfalto e concreto absorvem e retêm calor","Vegetação: sombra e evapotranspiração resfriam","Solo impermeável: mais escoamento e enchentes"],"A evapotranspiração consome calor: áreas verdes são mais frescas.","Medições em uma cidade mostraram que, à noite, a temperatura em um bairro muito construído e asfaltado era alguns graus maior que a de um parque arborizado a poucos quilômetros dali.","Qual explicação é compatível com a diferença de temperatura?",["Materiais como asfalto e concreto absorvem e armazenam calor, e a vegetação do parque sombreia e resfria o ambiente por evapotranspiração.","O parque recebe menos radiação solar, pois está em outra latitude.","O bairro é mais quente porque tem mais árvores, que retêm calor.","O asfalto reflete toda a radiação solar, aquecendo o ar ao redor.","A diferença é aleatória, pois a cobertura do solo não influencia a temperatura."],0,"A: asfalto e concreto armazenam calor e o liberam à noite, enquanto a vegetação resfria por sombra e evapotranspiração. B erra: a distância é de poucos quilômetros, sem diferença de latitude. C inverte a relação: o bairro construído tem menos árvores. D é falsa: asfalto absorve boa parte da radiação. E é falsa: a cobertura do solo influencia a temperatura."],
"Monocultura e biodiversidade agrícola":["A monocultura é o cultivo de uma única espécie em grandes áreas. Reduz a diversidade de plantas e de animais associados, favorece a proliferação de pragas e doenças (há muito alimento da mesma espécie) e aumenta a dependência de agrotóxicos e fertilizantes. A diversificação, o plantio consorciado, a rotação de culturas e os sistemas agroflorestais aumentam a diversidade, reduzem pragas e conservam o solo.",["Monocultura: baixa diversidade; pragas se espalham","Consórcio, rotação e agrofloresta: mais diversidade","Agrotóxico em excesso: contaminação e resistência"],"Menos diversidade significa ecossistema mais frágil diante de pragas.","Duas propriedades vizinhas cultivam na mesma região: a X, extensas lavouras de uma só espécie; a Y, várias espécies consorciadas, com árvores e faixas de vegetação nativa. Depois de um ano chuvoso, uma praga atingiu fortemente a propriedade X, mas causou danos menores na Y.","A diferença entre as propriedades é explicada porque:",["a monocultura oferece predadores naturais em maior quantidade.","a monocultura concentra muito alimento de uma única espécie, favorecendo a multiplicação da praga, enquanto a diversidade da propriedade Y sustenta inimigos naturais e dificulta sua expansão.","a diversidade da propriedade Y atrai mais pragas, que se dispersam entre as espécies.","a praga só ataca plantas nativas, que são mais numerosas em X.","as pragas não dependem da disponibilidade de alimento."],1,"B: muito alimento da mesma espécie favorece a praga; mais diversidade sustenta inimigos naturais. A inverte a relação. C contraria o resultado. D contraria o texto: X é monocultura, sem destaque a espécies nativas. E é falsa: a disponibilidade de alimento limita a população de pragas."],
"Espécies-chave e cascata trófica":["Espécie-chave é aquela cujo impacto sobre a comunidade é desproporcional à sua abundância; sua remoção pode alterar muito a estrutura do ecossistema. Em uma cascata trófica, mudanças em um nível trófico se propagam aos demais: por exemplo, a redução de predadores de topo pode aumentar herbívoros e reduzir a vegetação. Predadores de topo, polinizadores e engenheiros de ecossistemas, como os castores, são exemplos.",["Espécie-chave: grande impacto, mesmo pouco abundante","Cascata trófica: o efeito se propaga pelos níveis","Remoção de predador de topo → herbívoros ↑ → vegetação ↓"],"Remoção de predador de topo: pense em herbívoros em alta e vegetação em queda.","Em uma região costeira, a caça excessiva de lontras marinhas, que predam ouriços-do-mar, foi seguida por aumento da população de ouriços e pelo desaparecimento de florestas de algas gigantes, que eles consomem. Anos depois, com a proteção das lontras, os ouriços diminuíram e as algas se recuperaram.","Esse caso ilustra que:",["a lontra é uma espécie sem importância, pois sua abundância é pequena.","os ouriços-do-mar são produtores, e as algas, decompositoras.","os efeitos da remoção de uma espécie se limitam ao seu próprio nível trófico.","as algas dependem diretamente do número de lontras, pois se alimentam delas.","a lontra atua como espécie-chave: ao predar os ouriços, controla o consumo das algas, e sua remoção gerou uma cascata trófica."],4,"E: a lontra controla os ouriços, que consomem as algas; sua remoção afetou vários níveis. A contraria o grande impacto observado. B inverte os papéis: ouriços são consumidores, e algas, produtores. C contraria o caso, em que o efeito atingiu as algas. D erra: as lontras não se alimentam de algas."],
"Sistema reprodutor humano":["No sistema reprodutor masculino, os espermatozoides são produzidos nos testículos, amadurecem no epidídimo e seguem pelo ducto deferente; o sêmen recebe secreções das vesículas seminais e da próstata e sai pela uretra. No feminino, o óvulo é liberado pelo ovário e captado pela tuba uterina, onde ocorre a fecundação; o embrião se implanta no útero. A testosterona controla características masculinas e participa da espermatogênese.",["Espermatozoides: testículos → epidídimo → ducto deferente → uretra","Fecundação: tuba uterina; implantação: útero","Próstata e vesículas seminais: secreções do sêmen"],"Fecundação na tuba uterina; implantação no útero.","Uma estudante precisa montar o percurso de um espermatozoide até a fecundação.","Qual sequência descreve corretamente o caminho dos gametas masculinos e o local da fecundação?",["Testículo, uretra, ducto deferente, epidídimo, útero (fecundação).","Epidídimo, testículo, ducto deferente, uretra, ovário (fecundação).","Ducto deferente, testículo, epidídimo, uretra, útero (fecundação).","Testículo, epidídimo, ducto deferente, uretra e, então, no sistema feminino, até a tuba uterina, onde ocorre a fecundação.","Próstata, testículo, uretra, tuba uterina (fecundação)."],3,"D: os espermatozoides se formam nos testículos, amadurecem no epidídimo, passam pelo ducto deferente e saem pela uretra; a fecundação ocorre na tuba uterina. A, B, C e E trocam a ordem das estruturas masculinas ou o local da fecundação (útero ou ovário)."]
};
/*E*/
const $=s=>document.querySelector(s),A=$('#app');
const SB=[];M.forEach((m,mi)=>m.s.split(';').forEach(x=>{const[n,l]=x.split('|');SB.push({n,l,mi})}));
const LV={A:'Alta',M:'Média',B:'Baixa'};
let S={done:{},fav:{},st:{},hist:[],wr:[],study:0,theme:null};
try{Object.assign(S,JSON.parse(localStorage.getItem('bioenem')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bioenem',JSON.stringify(S))}catch(e){}};
let V={v:'home',f:'T',q:'',mi:0,id:0},sel=null,Z=null,tmr=null,F={i:0,b:0};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),p=n=>String(n).padStart(2,'0');return(h?h+':':'')+p(m)+':'+p(s%60)};
const pc=(a,b)=>b?Math.round(100*a/b):0;
const modIds=mi=>SB.map((s,i)=>i).filter(i=>SB[i].mi==mi);
const doneN=ids=>ids.filter(i=>S.done[SB[i].n]).length;
const sample=n=>SB.map((s,i)=>i).sort(()=>Math.random()-.5).slice(0,n);
const dark=()=>S.theme?S.theme=='dark':matchMedia('(prefers-color-scheme:dark)').matches;
const applyTheme=()=>{document.documentElement.dataset.theme=dark()?'dark':'light'};
function tt(){S.theme=dark()?'light':'dark';save();applyTheme()}
function go(v,o){if(v!='quiz')clearInterval(tmr);Object.assign(V,{v},o||{});sel=null;render(1);scrollTo(0,0)}
function render(f){applyTheme();A.innerHTML=({home,mod,sub,quiz,flash,stats})[V.v]();if(f){A.classList.remove('fade');void A.offsetWidth;A.classList.add('fade')}if(V.v=='home'){$('#q').value=V.q;list()}}
const ring=p=>`<svg class="ring" viewBox="0 0 80 80"><circle class="tr" cx="40" cy="40" r="34"/><circle class="fg" cx="40" cy="40" r="34" style="--o:${(213.6*(1-p/100)).toFixed(1)}"/><text x="40" y="45" text-anchor="middle">${p}%</text></svg>`;
function tg(k,i){const n=SB[i].n;S[k][n]=!S[k][n];save();render(0)}
function home(){const p=pc(SB.filter(s=>S.done[s.n]).length,SB.length);
return `<section class="hero"><div><h1>Biologia <em>ENEM</em></h1><p>Caderno de campo: os temas em ordem de incidência, com teoria, dicas e questões comentadas.</p></div>${ring(p)}</section>
<div class="acts"><button class="btn" onclick="startQ(sample(10),'sim')">Simulado · 10</button><button class="btn" onclick="startQ(sample(SB.length),'sim')">Simulado completo · ${SB.length}</button><button class="btn" onclick="go('flash')">Flashcards</button><button class="btn" onclick="go('stats')">Estatísticas</button>${S.wr.length?`<button class="btn" onclick="startQ(S.wr,'rev')">Refazer erradas · ${S.wr.length}</button>`:''}</div>
<div class="tools"><input id="q" placeholder="Buscar assunto  ( / )" oninput="V.q=this.value;list()"><div class="chips">${[['T','Todas'],['A','Alta'],['M','Média'],['B','Baixa']].map(([k,t])=>`<button class="chip ${V.f==k?'on':''}" onclick="V.f='${k}';render(0)">${t}</button>`).join('')}</div></div><div id="lst"></div>`}
function list(){const q=norm(V.q.trim());let h='';
if(q){const r=SB.map((s,i)=>i).filter(i=>norm(SB[i].n).includes(q)&&(V.f=='T'||M[SB[i].mi].l==V.f));h=r.length?`<div class="rows">${r.map((i,k)=>`<div class="row" style="--d:${k}" onclick="go('sub',{id:${i}})"><span>${S.fav[SB[i].n]?'★ ':''}${SB[i].n}</span><small>${M[SB[i].mi].n}</small></div>`).join('')}</div>`:'<p class="empty">Nenhum assunto encontrado.</p>'}
else h=`<div class="grid">${M.map((m,mi)=>[m,mi]).filter(([m])=>V.f=='T'||m.l==V.f).map(([m,mi],k)=>{const ids=modIds(mi),p=pc(doneN(ids),ids.length);return `<article class="card l${m.l}" style="--d:${k}" onclick="go('mod',{mi:${mi}})"><div class="pp">${m.p}<small>%</small></div><div><h3>${m.n}</h3><span class="tag">Incidência ${LV[m.l]}</span><p>${m.d}</p><div class="bar"><i style="width:${p}%"></i></div><small>${p}% concluído · ${ids.length} assunto(s)</small></div></article>`}).join('')}</div>`;
$('#lst').innerHTML=h}
function mod(){const m=M[V.mi],ids=modIds(V.mi),p=pc(doneN(ids),ids.length);
return `<button class="back" onclick="go('home')">← Início</button><h2>${m.n}</h2><p class="empty">${m.d} · ${m.p}% das questões (estimativa)</p><div class="bar"><i style="width:${p}%"></i></div><small>${p}% concluído</small><div class="acts"><button class="btn" onclick="startQ(modIds(${V.mi}),'quiz')">Quiz do módulo</button></div>
<div class="rows">${ids.map((i,k)=>`<div class="row" style="--d:${k}" onclick="go('sub',{id:${i}})"><span>${SB[i].n} <small>· ${LV[SB[i].l]}</small></span><span><button class="ic ${S.fav[SB[i].n]?'on':''}" onclick="event.stopPropagation();tg('fav',${i})" title="Favorito">★</button> <button class="ic ${S.done[SB[i].n]?'on':''}" onclick="event.stopPropagation();tg('done',${i})" title="Concluído">✓</button></span></div>`).join('')}</div>`}
function qBlock(id,s){const c=C[SB[id].n];let h=`<div class="txt">${c[3]}</div><h4>${c[4]}</h4>`;
c[5].forEach((a,i)=>{let k='alt';if(s!=null){if(i==c[6])k+=' ok';else if(i==s)k+=' bad'}h+=`<button class="${k}" ${s!=null?'disabled':''} onclick="pick(${i})"><b>${'ABCDE'[i]}</b><span>${a}</span></button>`});
if(s!=null)h+=`<div class="res ${s==c[6]?'g':'r'}"><b>${s==c[6]?'Correto!':'Resposta certa: '+'ABCDE'[c[6]]+'.'}</b> ${c[7]}</div>`;return h}
function sub(){const s=SB[V.id],c=C[s.n];
return `<button class="back" onclick="go('mod',{mi:${s.mi}})">← ${M[s.mi].n}</button><div class="head"><h2>${s.n}</h2><div><button class="ic ${S.fav[s.n]?'on':''}" onclick="tg('fav',${V.id})" title="Favorito">★</button><button class="ic ${S.done[s.n]?'on':''}" onclick="tg('done',${V.id})" title="Concluído">✓</button></div></div>
<section class="box"><h4>Resumo</h4><p>${c[0]}</p></section><section class="box"><h4>Regras-chave</h4><ul>${c[1].map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="box tip"><h4>Dica ENEM</h4><p>${c[2]}</p></section><section class="box">${qBlock(V.id,sel)}</section>
<nav class="pn"><button class="btn" ${V.id>0?'':'disabled'} onclick="go('sub',{id:${V.id-1}})">← Anterior</button><button class="btn" ${V.id<SB.length-1?'':'disabled'} onclick="go('sub',{id:${V.id+1}})">Próximo →</button></nav>`}
function rec(id,ok){const mi=SB[id].mi;(S.st[mi]=S.st[mi]||[0,0])[ok?0:1]++;if(ok)S.wr=S.wr.filter(x=>x!=id);else if(!S.wr.includes(id))S.wr.push(id);save()}
function pick(i){if(sel!=null)return;const id=V.v=='quiz'?Z.ids[Z.i]:V.id,ok=i==C[SB[id].n][6];sel=i;rec(id,ok);if(V.v=='quiz'){if(ok)Z.ok++;else Z.wr.push(id)}render(0)}
function startQ(ids,mode){clearInterval(tmr);Z={ids:[...ids].sort(()=>Math.random()-.5),i:0,ok:0,wr:[],t0:Date.now(),mode,fin:0};go('quiz');tmr=setInterval(()=>{const e=$('#tm');if(e&&Z&&!Z.fin)e.textContent=fmt((Date.now()-Z.t0)/1000)},1000)}
function quiz(){if(Z.fin)return result();const id=Z.ids[Z.i];
return `<div class="qh"><button class="back" onclick="go('home')">✕ Sair</button><b>Questão ${Z.i+1}/${Z.ids.length}</b><span id="tm" class="tm">${fmt((Date.now()-Z.t0)/1000)}</span></div><div class="bar"><i style="width:${100*Z.i/Z.ids.length}%"></i></div><small>${M[SB[id].mi].n} · ${SB[id].n}</small><section class="box">${qBlock(id,sel)}</section><div class="pn"><span></span><button class="btn" ${sel==null?'disabled':''} onclick="nextQ()">${Z.i+1<Z.ids.length?'Próxima →':'Finalizar'}</button></div>`}
function nextQ(){if(sel==null)return;sel=null;if(Z.i+1<Z.ids.length)Z.i++;else{Z.fin=1;clearInterval(tmr);Z.sec=Math.round((Date.now()-Z.t0)/1000);if(Z.mode=='sim'){S.hist.unshift({d:new Date().toLocaleDateString('pt-BR'),n:Z.ids.length,ok:Z.ok,s:Z.sec});S.hist=S.hist.slice(0,15);save()}}render(1)}
function result(){const p=pc(Z.ok,Z.ids.length);return `<h2>Resultado</h2><div class="big">${Z.ok}/${Z.ids.length} · ${p}%</div><p>Tempo: <b>${fmt(Z.sec)}</b></p>${ring(p)}<div class="acts">${Z.wr.length?`<button class="btn" onclick="startQ(Z.wr,'rev')">Refazer as erradas (${Z.wr.length})</button>`:'<p>Sem erros nesta rodada. 🌱</p>'}<button class="btn" onclick="go('home')">Início</button></div>`}
function flash(){const s=SB[F.i],c=C[s.n];return `<button class="back" onclick="go('home')">← Início</button><h2>Flashcards</h2><div class="fc ${F.b?'flip':''}" onclick="F.b=!F.b;render(0)"><small>${F.i+1}/${SB.length} · ${M[s.mi].n}</small>${F.b?`<ul>${c[1].map(x=>`<li>${x}</li>`).join('')}</ul>`:`<h3>${s.n}</h3><p class="empty">Toque para ver as regras-chave</p>`}</div><div class="pn"><button class="btn" onclick="fc(-1)">←</button><button class="btn" onclick="fc(1)">→</button></div>`}
function fc(d){F.i=(F.i+d+SB.length)%SB.length;F.b=0;render(0)}
function stats(){return `<button class="back" onclick="go('home')">← Início</button><h2>Estatísticas</h2><p>Tempo de estudo: <b>${fmt(S.study)}</b></p><table><tr><th>Módulo</th><th>Acertos</th><th>Erros</th><th>%</th></tr>${M.map((m,i)=>{const[a,e]=S.st[i]||[0,0];return `<tr><td>${m.n}</td><td>${a}</td><td>${e}</td><td>${pc(a,a+e)}%</td></tr>`}).join('')}</table><h3>Histórico de simulados</h3>${S.hist.length?`<div class="rows">${S.hist.map(h=>`<div class="row"><span>${h.d}</span><span>${h.ok}/${h.n} (${pc(h.ok,h.n)}%) · ${fmt(h.s)}</span></div>`).join('')}</div>`:'<p class="empty">Nenhum simulado ainda.</p>'}`}
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'){if(e.key=='Escape')e.target.blur();return}
const k=e.key,i='abcde'.indexOf(k.toLowerCase());
if(k=='/'&&V.v=='home'){e.preventDefault();$('#q').focus();return}
if(k=='Escape'){if(V.v=='sub')go('mod',{mi:SB[V.id].mi});else if(V.v!='home')go('home');return}
if(k.length==1&&i>=0&&(V.v=='sub'||V.v=='quiz'&&!Z.fin)){pick(i);return}
if(k=='Enter'){if(V.v=='quiz'&&!Z.fin)nextQ();else if(V.v=='sub'&&sel!=null&&V.id<SB.length-1)go('sub',{id:V.id+1})}
if(k=='ArrowRight'){if(V.v=='sub'&&V.id<SB.length-1)go('sub',{id:V.id+1});else if(V.v=='quiz'&&!Z.fin)nextQ();else if(V.v=='flash')fc(1)}
if(k=='ArrowLeft'){if(V.v=='sub'&&V.id>0)go('sub',{id:V.id-1});else if(V.v=='flash')fc(-1)}});
setInterval(()=>{if(!document.hidden){S.study++;if(S.study%15==0)save();$('#st').textContent=fmt(S.study)}},1000);
$('#st').textContent=fmt(S.study);render(1);
</script></body></html>
