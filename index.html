m pesquisas de engenharia tecidual regenerativa para reparo de lesões traumáticas encefálicas e queimaduras cutâneas severas, cientistas reprogramam células-tronco pluripotentes induzidas (iPS) direcionando sua diferenciação nos folhetos embrionários que naturalmente originam o tecido nervoso e a epiderme.</p>", "O folheto germinativo primitivo a partir do qual se formam simultaneamente o sistema nervoso e a camada epidérmica é o(a):", ["ectoderme embrionária externa.", "endoderme embrionária interna.", "mesoderme lateral intermediária.", "sinciciotrofoblasto de fixação.", "hipoblasto primário do blastocisto."], 0, "No desenvolvimento embrionário humano, a ectoderme é o folheto germinativo mais externo formado na gastrulação. Por meio da neurulação — induzida pela notocorda —, a ectoderme dorsal dobra-se originando a placa neural, o tubo neural e a crista neural (que formarão o encéfalo, medula espinhal e nervos), enquanto a ectoderme remanescente forma o revestimento epidérmico do corpo e anexos córneos. Alternativa correta: A. Distratores: A forma o tubo digestório e respiratório; C forma ossos, músculos e sangue; D e E são anexos extraembrionários."], "Dinâmica de populações e curvas de crescimento": ["O tamanho de uma população biológica é regulado por quatro taxas fundamentais: natalidade e imigração (que aumentam o número de indivíduos) e mortalidade e emigração (que diminuem). Sem fatores limitantes, o potencial biótico de uma espécie propicia um crescimento exponencial, representado graficamente pela curva em 'J'. Na realidade ambiental, contudo, a resistência do meio (espaço, alimento, predadores e doenças) impõe um limite máximo sustentável denominado capacidade de carga (K), gerando a clássica curva sigmoide ou logística em 'S'. Métodos como marcação e recaptura de Lincoln-Petersen permitem estimar o tamanho de populações naturais.", ["Curva em J: crescimento exponencial teórico (sem resistência do meio)", "Curva em S (logística): crescimento real limitado pela capacidade de suporte (K)", "Capacidade de suporte (K): teto populacional que o ecossistema sustenta", "Equação de Lincoln-Petersen: N = (M × C) / R"], "No gráfico sigmoide em S: o ponto de inflexão é onde a taxa de crescimento é máxima; quando a curva atinge o platô superior (K), a taxa de natalidade mais imigração se iguala à taxa de mortalidade mais emigração.", "<p>Para estimar o tamanho da população de lambaris em uma lagoa isolada, biólogos capturaram 60 peixes, marcaram cada um com uma anilha inofensiva e os soltaram de volta à água. Uma semana depois, realizaram uma nova captura de 100 peixes na mesma lagoa, constatando que exatamente 15 deles possuíam a marcação prévia.</p>", "Considerando que a população permaneceu fechada durante o intervalo e aplicando o método de marcação e recaptura (Lincoln-Petersen), o tamanho populacional total estimado (N) nessa lagoa é de:", ["400 peixes.", "250 peixes.", "160 peixes.", "600 peixes.", "900 peixes."], 0, "Pelo modelo de Lincoln-Petersen: N = (M × C) / R, onde M = número inicial de indivíduos marcados (60), C = total capturado na segunda amostragem (100) e R = indivíduos recapturados com marca (15). N = (60 × 100) / 15 = 6.000 / 15 = 400 peixes. Alternativa correta: A. Distratores: A apenas soma as duas capturas (60+100); B erra o quociente de proporção; D multiplica 60 por 10; E multiplica 60 por 15."], "Drogas psicoativas, neurotransmissores e dependência química": ["As substâncias psicoativas atuam no sistema nervoso central modificando a neurotransmissão química nas sinapses interneuronais, alterando percepção, humor e comportamento. Classificam-se em depressoras (como o álcool etílico, barbitúricos e ansiolíticos benzodiazepínicos, que potencializam a ação inibitória do neurotransmissor GABA, reduzindo a atividade cortical e os reflexos motores), estimulantes (como a cocaína, anfetaminas e nicotina, que bloqueiam a recaptação de dopamina, noradrenalina e serotonina na fenda sináptica, mantendo esses neurotransmissores estimulando os receptores pós-sinápticos e gerando euforia e taquicardia) e perturbadoras/alucinógenas (como LSD e maconha/THC). A dependência química crônica envolve a ativação do circuito mesolímbico dopaminérgico de recompensa cerebral; com o uso continuado, os neurônios reduzem o número de receptores (downregulation), exigindo doses progressivamente maiores da droga para obter o mesmo efeito (tolerância) e gerando sintomas de sofrimento físico e psicológico na abstinência (síndrome de abstinência).", ["Circuito de recompensa cerebral: via dopaminérgica mesolímbica (prazer e vício)", "Depressores: álcool e ansiolíticos potencializam o GABA (neurotransmissor inibitório)", "Estimulantes: cocaína e anfetaminas bloqueiam a recaptação de dopamina na fenda", "Tolerância farmacológica: redução de receptores celulares (downregulation) exige doses maiores", "Abstinência: manifestações clínicas severas com a interrupção abrupta da substância"], "O mecanismo da cocaína cai no ENEM: a cocaína NÃO estimula a produção de dopamina! Ela BLOQUEIA A RECAPTAÇÃO da dopamina pelos transportadores da membrana pré-sináptica. Como a dopamina não é recolhida, ela fica acumulada na fenda sináptica estimulando os receptores sem parar.", "<p>A cocaína é uma droga ilícita alcaloide com potente ação sobre o sistema nervoso central. No circuito de recompensa cerebral, ela se liga especificamente às proteínas transportadoras de recaptação de dopamina localizadas na membrana do neurônio pré-sináptico, inativando o seu funcionamento normal.</p>", "A sensação efêmera de euforia e hiperestimulação psicomotora provocada pelo uso da cocaína decorre do(a):", ["destruição das vesículas sinápticas antes da liberação de qualquer neurotransmissor.", "bloqueio imediato da entrada de íons sódio nos dendritos dos neurônios sensoriais.", "transformação da dopamina em acetilcolina inibidora do miocárdio ventricular.", "acúmulo prolongado de dopamina livre na fenda sináptica, hiperestimulando continuamente os receptores pós-sinápticos.", "paralisação da respiração celular mitocondrial nos astrócitos da substância cinzenta."], 3, "Em condições fisiológicas normais, a dopamina liberada na fenda sináptica estimula os receptores pós-sinápticos por frações de segundo e é prontamente recolhida de volta ao neurônio pré-sináptico por transportadores de recaptação específicos. Ao bloquear esses transportadores, a cocaína impede que a dopamina seja retirada da fenda, fazendo com que o neurotransmissor permaneça estimulando os receptores do circuito de prazer e recompensa de forma excessiva e repetitiva. Alternativa correta: D. Distratores: A cita destruição de vesículas; C, D e E formulam proposições incoerentes com a neurofarmacologia da droga."], "Efeito estufa e mudanças climáticas": ["O efeito estufa é um fenômeno natural essencial para a manutenção da vida na Terra, mantendo a temperatura média global em torno de 15 °C. A radiação solar incide na superfície terrestre sob a forma de luz visível e ondas curtas, sendo absorvida e reemitida como radiação infravermelha (calor). Gases de efeito estufa (GEE), como gás carbônico (CO₂), metano (CH₄), óxido nitroso (N₂O) e vapor d'água, retêm parte desse infravermelho na troposfera. A intensificação antropogênica decorrente da queima de combustíveis fósseis, do desmatamento e da pecuária intensiva amplia essa retenção térmica, acarretando aumento do nível do mar, acidificação dos oceanos e intensificação de eventos climáticos extremos.", ["Efeito estufa natural: retenção de calor por gases estufa (essencial à vida)", "Aquecimento global: intensificação antrópica (CO₂, CH₄, N₂O)", "Acidificação oceânica: CO₂ + H₂O → H₂CO₃ → H⁺ + HCO₃⁻ (corrói corais)", "Diferença vital: Efeito estufa ≠ Buraco na camada de ozônio (CFCs / UV)"], "NÃO confunda efeito estufa com destruição da camada de ozônio! Camada de ozônio retém radiação ULTRAVIOLETA (UV). O efeito estufa retém radiação INFRAVERMELHA (calor emitido pela Terra). Essa é a clássica pegadinha do ENEM.", "<p>Relatórios do Painel Intergovernamental sobre Mudanças Climáticas (IPCC) alertam que os oceanos absorveram cerca de 30% do CO₂ emitido por atividades humanas desde a era pré-industrial. Além do aquecimento térmico das águas superficiais, a dissolução contínua desse gás altera o equilíbrio químico marinho, comprometendo recifes de coral e organismos dotados de conchas calcárias.</p>", "O declínio estrutural dos recifes de corais decorre da acidificação marinha porque o aumento de íons hidrogênio (H⁺) livres na água:", ["oxida as proteínas de clorofila das macroalgas, convertendo-as em lipídios insolúveis.", "bloqueia a difusão de oxigênio pelas brânquias dos polvos e moluscos bentônicos.", "estimula a precipitação espontânea de urânio dissolvido nas fossas abissais.", "reduz a disponibilidade de íons carbonato (CO₃²⁻), dificultando a síntese de carbonato de cálcio.", "inibe a meiose nos cnidários por meio da quebra das pontes de hidrogênio do DNA ribossômico."], 3, "O CO₂ dissolvido forma ácido carbônico (H₂CO₃), que se dissocia liberando H⁺ e bicarbonato (HCO₃⁻). Os prótons H⁺ em excesso reagem com os íons carbonato livres (CO₃²⁻), formando mais bicarbonato e diminuindo drasticamente a concentração de carbonato disponível para que corais e moluscos calcifiquem seus esqueletos e conchas de CaCO₃ (além de favorecer a dissolução do calcário existente). Alternativa correta: D. Distratores: A, B, D e E apresentam mecanismos bioquímicos fantasiosos ou desconexos do processo de calcificação."], "Eixo hipotálamo-hipófise e glândula tireoide": ["A regulação endócrina da tireoide é um modelo clássico de retroalimentação negativa (feedback negativo) ao longo do eixo hipotálamo-hipófise-tireoide. O hipotálamo secreta o hormônio liberador de tireotrofina (TRH), que estimula a adenoipófise a secretar o hormônio tireoestimulante (TSH). O TSH atua nos folículos tireoidianos promovendo a captação de iodo e a síntese dos hormônios tireoidianos tiroxina (T4) e tri-iodotironina (T3). O T3 e o T4 aumentam a taxa metabólica basal de praticamente todas as células somáticas, regulando o consumo de oxigênio, a produção de calor e o desenvolvimento do sistema nervoso. Níveis elevados de T3 e T4 na circulação inibem a liberação de TRH e TSH. Na carência alimentar de iodo, a falta de T3/T4 elimina o feedback inibitório: o TSH elevado estimula cronicamente a glândula, originando o bócio endêmico.", ["Eixo: Hipotálamo (TRH) → Adenoipófise (TSH) → Tireoide (T3 e T4)", "T3 e T4: aumentam a taxa de metabolismo basal e o consumo de O₂ celular", "Iodo: mineral essencial na estrutura molecular de T3 e T4", "Hipotireoidismo: T3/T4 baixos, metabolismo lento, cansaço, ganho de peso e TSH elevado", "Hipertireoidismo: T3/T4 altos, emagrecimento, taquicardia, intolerância ao calor e exoftalmia"], "No Brasil, a adição obrigatória por lei federal de iodato de potássio ao sal de cozinha foi uma medida de saúde pública crucial para erradicar o bócio carencial e o cretinismo endêmico em populações interioranas distantes do litoral.", "<p>Em regiões interioranas montanhosas onde o solo e as águas são historicamente deficientes em iodo, populações que não consumiam sal iodado desenvolviam frequentemente aumento volumoso visível na base anterior do pescoço (bócio endêmico ou papeira), acompanhado de lentidão psicomotora e fadiga crônica.</p>", "O aumento volumoso da tireoide (hiperplasia) nessas condições de privação nutricional de iodo ocorre porque:", ["o excesso de T3 e T4 na circulação estimula a necrose das células foliculares tireoidianas.", "a carência de iodo impede a síntese de T3/T4, eliminando o feedback negativo e gerando hipersecreção crônica de TSH hipofisário que hipertrofia a glândula.", "as bactérias da microbiota gástrica migram para o pescoço e realizam fixação biológica de iodo nos folículos.", "o hormônio paratormônio substitui o iodo por cristais de chumbo nos ductos tireoidianos.", "os anticorpos produzidos pelas plaquetas reagem contra a cartilagem cricoide da laringe."], 1, "O iodo é o substrato inorgânico essencial para a síntese de T3 e T4. Sem iodo, a tireoide não produz esses hormônios; sem T3 e T4 circulantes, cessa a retroalimentação negativa sobre a adenoipófise. A hipófise responde secretando níveis continuamente elevados de TSH (hormônio tireoestimulante) no sangue. Sob estímulo trófico contínuo do TSH, a tireoide prolifera e aumenta de tamanho na tentativa frustrada de compensar a produção hormonal, formando o bócio carencial. Alternativa correta: B. Distratores: A erra pois falta T3/T4; C, D e E formulam absurdos biológicos sem sentido."], "Eletroforese em gel de DNA e identificação forense": ["A eletroforese em gel de agarose ou poliacrilamida é a técnica analítica molecular basilar empregada para separar fragmentos de ácidos nucleicos (DNA ou RNA) ou proteínas de acordo com a sua massa molecular e carga elétrica líquida. Como a molécula de DNA possui carga elétrica líquida fortemente negativa em pH neutro — decorrente dos grupos fosfato desprotonados (PO4 3-) presentes em seu esqueleto glicídico —, ela migra uniformemente em direção ao polo elétrico positivo (ânodo) quando submetida a um campo elétrico contínuo em cuba tampão. A malha tridimensional porosa do gel de agarose atua como uma peneira molecular física: os fragmentos menores de DNA atravessam os poros com facilidade e migram distâncias maiores, enquanto os fragmentos maiores encontram maior atrito hidrodinâmico e migram distâncias menores. Na perícia forense e em testes de paternidade, sequências repetitivas de DNA microssatélites (STRs) são amplificadas por PCR e separadas no gel, gerando perfis de bandas de DNA exclusivos para cada indivíduo.", ["Carga negativa do DNA: grupos fosfato (PO4 3-) repelem o polo negativo (cátodo) e migram para o positivo (ânodo)", "Separação por tamanho: fragmentos curtos correm mais rápido e chegam mais longe no gel", "Teste de paternidade: 50% das bandas de DNA de um filho devem obrigatoriamente coincidir com o pai biológico", "Perícia criminal: o perfil de bandas do DNA extraído no local do crime deve ser idêntico ao do suspeito", "Visualização com corantes fluorescentes (ex: brometo de etídio ou GelRed) sob radiação ultravioleta"], "No teste de paternidade do ENEM: olhe as bandas do filho; risque todas as bandas que vieram da mãe. As bandas que SOBRAREM no filho DEVEM estar presentes no pai biológico verdadeiro!", "<p>Em uma investigação pericial de homicídio, a polícia científica coletou gotas de sangue sob as unhas da vítima e realizou a amplificação por PCR de seis locos polimórficos de microssatélites (STR), submetendo as amostras à eletroforese em gel de agarose juntamente com o DNA de três suspeitos (S1, S2 e S3) detidos na vizinhança.</p>", "O princípio biofísico que permite a separação dos fragmentos de DNA durante a eletroforese baseia-se na:", ["afinidade diferencial das bases nitrogenadas purinas pelo polo negativo da cuba de vidro.", "repulsão dos açúcares desoxirribose pelo polo positivo gerando bandas eletrostáticas flutuantes.", "atração das histonas nucleares empacotadas pelos íons hidrogênio presentes no tampão salino.", "migração de moléculas de DNA carregadas negativamente em direção ao ânodo com velocidade inversamente proporcional ao tamanho.", "destruição das ligações fosfodiéster do DNA pelas correntes elétricas de alta amperagem."], 3, "Devido aos grupamentos fosfato ionizados negativamente em seu esqueleto externo, o DNA possui carga líquida negativa uniforme e migra espontaneamente em direção ao polo positivo (ânodo). A matriz porosa do gel de agarose oferece resistência proporcional ao comprimento da cadeia de DNA: fragmentos menores migram com maior velocidade e alcançam regiões mais distantes no gel, separando com extrema precisão os alelos por peso molecular. Alternativa correta: D. Distratores: A, C, D e E contêm erros químicos e conceituais."], "Embriogênese e anexos embrionários": ["O desenvolvimento embrionário inicia-se com a fecundação na tuba uterina, originando o zigoto (2n). Seguem-se as etapas: Clivagem ou Segmentação (divisões mitóticas rápidas sem aumento de volume total, formando a mórula e depois a blástula/blastocisto, que realiza a nidação na parede uterina), Gastrulação (movimentos morfogenéticos que originam os três folhetos embrionários — ectoderme, mesoderme e endoderme — e o arquêntero com o blastóporo) e Organogênese (formação do tubo neural pela neurulação e diferenciação dos órgãos). Os anexos embrionários são estruturas adaptativas cruciais: o Âmnio (bolsa amniótica com líquido) protege contra dessecação mecânica e choques térmicos em répteis, aves e mamíferos; o Saco vitelínico nutre o embrião; o Alantoide armazena excretas (ácido úrico) e realiza trocas gasosas em répteis/aves; e a Placenta e o Cordão umbilical assumem essas funções nos mamíferos placentários.", ["Etapas: Zigoto → Mórula → Blástula (blastocisto / nidação) → Gástrula (3 folhetos) → Nêurula", "Ectoderme: epiderme, anexos cutâneos e todo o SISTEMA NERVOSO central e periférico", "Mesoderme: ossos, músculos, sistema cardiovascular, derme e sistema urogenital", "Endoderme: revestimento interno dos tratos digestório e respiratório, fígado e pâncreas", "Âmnio: bolsa líquida contra dessecação e choques (conquista do ambiente terrestre)"], "Qual anexo embrionário foi indispensável para répteis, aves e mamíferos conquistarem em definitivo a terra firme sem depender da água para reprodução? O ÂMNIO (com seu líquido amniótico aquoso interno, criando um 'microaquário' protetor contra o ressecamento do embrião).", "<p>A evolução dos vertebrados amniotas (répteis, aves e mamíferos) representou a conquista definitiva do ambiente terrestre independente do meio aquático para o desenvolvimento da prole. Uma das principais inovações anatômicas desse grupo foi o surgimento de uma membrana que delimita uma cavidade preenchida por líquido aquoso claro que envolve diretamente o corpo do embrião durante toda a gestação ou incubação.</p>", "Esse anexo embrionário e sua função biológica primária são identificados como:", ["Alantoide; armazenar gás carbônico e produzir dentes decíduos.", "Placenta; produzir hemácias dotadas de cloroplastos para fotossíntese embrionária.", "Âmnio; proteger o embrião contra o dessecamento e choques mecânicos.", "Saco vitelínico; absorver a casca calcária do ovo por endocitose direta.", "Córion; filtrar urina materna e impedir a fecundação polispérmica tardia."], 2, "O âmnio (ou bolsa amniótica) é uma membrana extraembrionária que secreta o líquido amniótico, criando um meio líquido protegido que envolve o embrião de répteis, aves e mamíferos. Esse 'ambiente aquático interno' protege o feto contra choques mecânicos, oscilações térmicas e, crucialmente, contra a dessecação provocada pelo ar seco terrestre, liberando a reprodução da dependência de lagoas e rios. Alternativa correta: C. Distratores: A erra a função do alantoide (que armazena ácido úrico e troca gases); C atribui cloroplastos a mamíferos; D e E atribuem papéis biologicamente incorretos."], "Epistasia e interações gênicas não-alélicas": ["A epistasia é um tipo de interação gênica não-alélica na qual um determinado gene (denominado epistático) inibe, mascara ou impede a expressão fenotípica de outro par de alelos não-alelos situado em locus gênico distinto (denominado hipostático). Na epistasia recessiva, a manifestação do gene epistático em dose dupla homozigota recessiva (ex.: ee) impede a deposição ou manifestação do pigmento codificado pelo gene hipostático, independentemente de haver alelos dominantes nele (ex.: B_). O exemplo clássico ocorre na pelagem de cães labradores: o locus B determina a cor do pigmento (B_ preto, bb marrom), mas o homozigoto recessivo 'ee' no locus E impede a deposição de qualquer pigmento nos pelos, originando labradores dourados/amarelos, gerando a proporção fenotípica 9:3:4. Na epistasia dominante (proporção 12:3:1), basta a presença de um único alelo dominante epistático para inibir o hipostático.", ["Epistasia: um gene interfere na manifestação de outro gene independente em outro locus", "Gene Epistático: o gene que inibe ou mascara a expressão do outro", "Gene Hipostático: o gene cuja manifestação é bloqueada ou mascarada", "Epistasia Recessiva (ex: Labradores): proporção modificada 9 pretos : 3 chocolates : 4 dourados", "Diferença de dominância: dominância ocorre entre alelos do mesmo locus; epistasia ocorre entre loci diferentes"], "Cuidado com a confusão conceitual no ENEM: DOMINÂNCIA é a relação entre alelos de um MESMO gene (A domina a). EPISTASIA é a inibição entre genes de LOCI DIFERENTES (o alelo E inibe a expressão do gene B).", "<p>Em cães da raça Labrador retriever, a pigmentação da pelagem envolve dois pares de genes independentes. O alelo 'B' condiciona a síntese de pigmento preto, enquanto seu alelo recessivo 'b' condiciona pigmento chocolate (marrom). No entanto, um segundo gene independente 'E' condiciona a deposição do pigmento na haste do pelo; cães de genótipo homozigoto recessivo 'ee' não depositam pigmento e apresentam pelagem amarela (dourada), independentemente dos alelos no locus B.</p>", "Do cruzamento entre dois labradores pretos di-híbridos (BbEe x BbEe), a proporção fenotípica esperada na prole é de:", ["12 pretos : 3 chocolates : 1 dourado.", "9 pretos : 7 dourados.", "9 pretos : 3 chocolates : 4 dourados.", "15 pretos : 1 chocolate.", "9 dourados : 3 pretos : 4 chocolates."], 2, "O cruzamento entre di-híbridos (BbEe x BbEe) gera as proporções genotípicas mendelianas clássicas: 9 B_E_ (pretos com pigmento depositado); 3 bbE_ (chocolates com pigmento depositado); 3 B_ee (pigmento preto produzido mas não depositado = dourados); 1 bbee (pigmento marrom produzido mas não depositado = dourados). Agrupando os indivíduos 'ee' (3 + 1 = 4), obtém-se a razão epistática recessiva clássica de 9 pretos : 3 chocolates : 4 dourados. Alternativa correta: C. Distratores: B, C, D e E refletem outras proporções epistáticas ou inversões de fenótipo."], "Equinodermos, deuterostomia e sistema ambulacrário": ["O filo Echinodermata reúne invertebrados marinhos de vida livre bentônica (estrelas-do-mar, ouriços-do-mar, bolachas-da-praia e pepinos-do-mar) que compartilham afinidades embriológicas e evolutivas singulares e decisivas com o filo Chordata (dos vertebrados). Diferente de artrópodes, anelídeos e moluscos (que são protostômios), os equinodermos e cordados são animais deuterostômios: no desenvolvimento embrionário, o blastóporo dá origem primariamente ao ânus, enquanto a boca se forma secundariamente em outra extremidade do embrião. Além disso, possuem endosqueleto calcário de origem mesodérmica situado logo abaixo da epiderme e simetria pentarradial secundária nos adultos (embora suas larvas exibam simetria bilateral primária). Sua característica anatômica mais marcante é o sistema ambulacrário (ou aquífero): uma rede interna de canais celômicos preenchidos por água do mar que opera pés ambulacrários hidráulicos responsáveis pela locomoção, fixação, trocas gasosas e captura de presas.", ["Deuterostômios: o blastóporo origina o ânus (parentesco evolutivo basal com os cordados/vertebrados)", "Endosqueleto calcário mesodérmico: placas de carbonato de cálcio situadas sob a epiderme", "Sistema ambulacrário (hidráulico): canais aquíferos e pés ambulacrários para locomoção e respiração", "Simetria bilateral larval vs Pentarradial no adulto: comprova que seus ancestrais eram bilaterais", "Alta capacidade de regeneração: estrelas-do-mar podem regenerar braços inteiros por mitose e diferenciação"], "O ENEM ama cobrar a árvore filogenética dos animais! A pergunta clássica é: 'Qual invertebrado é o parente mais próximo dos vertebrados?' Resposta: EQUINODERMOS, porque ambos são DEUTEROSTÔMIOS e têm endosqueleto mesodérmico!", "<p>Em uma aula de zoologia comparada sobre as relações filogenéticas entre os grandes filos do reino animal, o professor apresentou um cladograma no qual os animais eram categorizados de acordo com a origem do tubo digestório e o destino embrionário do blastóporo formado durante a gastrulação.</p>", "Nessa classificação evolutiva, o filo invertebrado que compartilha com os vertebrados a condição embrionária de deuterostomia é o dos:", ["artrópodes, dotados de exoesqueleto quitinoso impermeabilizante e apêndices articulados.", "anelídeos, vermes segmentados que exibem metameria e sistema circulatório fechado.", "moluscos, invertebrados de corpo mole com manto secretor de conchas helicoidais.", "equinodermos, animais marinhos dotados de sistema ambulacrário e endosqueleto calcário mesodérmico.", "platelmintos, vermes acelomados achatados dorsoventralmente com boca na face ventral."], 3, "No desenvolvimento embrionário dos equinodermos e dos cordados, o blastóporo dá origem primária ao orifício anal (deuterostomia), diferindo dos demais filos bilaterais (protostômios, nos quais o blastóporo origina a boca). Essa característica ontogenética compartilhada, somada à enterocelia e à origem mesodérmica do esqueleto interno, fundamenta o agrupamento evolutivo irmão entre equinodermos e cordados na árvore filogenética animal. Alternativa correta: D. Distratores: A, C, D e E são todos protostômios."], "Especiação e isolamento reprodutivo": ["Especiação é o processo evolutivo que culmina na formação de novas espécies biológicas a partir de uma linhagem ancestral. Segundo o conceito biológico de espécie proposto por Ernst Mayr, espécies são grupos de populações naturais cujos indivíduos são capazes de cruzar entre si e produzir descendentes férteis em condições naturais. A especiação alopátrica (geográfica) é a mais comum: uma barreira geográfica física (como surgimento de um cânion, rio ou cadeia montanhosa) divide uma população original em subpopulações isoladas. Sob diferentes pressões seletivas e sem fluxo gênico, as populações acumulam mutações e sofrem deriva genética de forma independente ao longo de milhares de anos, até estabelecerem mecanismos de isolamento reprodutivo pré-zigóticos (comportamentais, temporais, mecânicos) ou pós-zigóticos (inviabilidade ou esterilidade do híbrido, como o burro/mula).", ["Conceito biológico de espécie: cruzam e geram descendentes FÉRTEIS na natureza", "Especiação alopátrica: isolamento geográfico prévio → diferenciação → isolamento reprodutivo", "Especiação simpátrica: sem separação geográfica (ex: poliploidia em plantas)", "Isolamento pré-zigótico: impede a fecundação (ecológico, temporal, comportamental, mecânico)", "Isolamento pós-zigótico: óvulo fertilizado mas embrião morre ou híbrido é estéril"], "O isolamento geográfico NÃO é sinônimo de especiação concluída! Duas populações só se tornam espécies diferentes de fato quando atingem o ISOLAMENTO REPRODUTIVO, ou seja, se forem colocadas juntas novamente e não conseguirem mais gerar descendentes férteis.", "<p>A formação do Grand Canyon do Rio Colorado nos Estados Unidos separou uma população ancestral contínua de esquilos em duas margens opostas. Ao longo de milhões de anos de separação intransponível pela fenda rochosa, os esquilos da margem norte desenvolveram cauda branca e orelhas tufadas (esquilo-de-kaibab), enquanto os da margem sul mantiveram pelagem cinzenta e cauda preta (esquilo-de-abert). Experimentos laboratoriais demonstraram que indivíduos de margens opostas não se reconhecem mais para o cortejo e acasalamento.</p>", "O modelo evolutivo responsável pela diferenciação e surgimento dessas duas espécies distintas de esquilos é a:", ["especiação simpátrica mediada por hibridização poliplóide floral.", "reversão atávica provocada por transmissão de caracteres adquiridos pelo frio.", "especiação alopátrica iniciada pelo isolamento geográfico que culminou em isolamento reprodutivo.", "convergência adaptativa acelerada pela ingestão de musgos venenosos nas rochas.", "clonagem somática natural resultante da autofecundação meiótica obrigatória."], 2, "O surgimento de uma barreira geográfica física intransponível (o desfiladeiro do Grand Canyon) interrompeu o fluxo gênico entre os dois grupos de esquilos. Isoladas geograficamente em biomas com microclimas distintos, as duas subpopulações acumularam mutações aleatórias e sofreram seleção natural divergente ao longo de milhares de gerações até desenvolverem isolamento reprodutivo comportamental (etológico) no cortejo, consolidando a especiação alopátrica. Alternativa correta: C. Distratores: A trata de especiação simpátrica em plantas; C invoca lamarckismo; D confunde especiação com convergência; E formula um processo reprodutivo biologicamente impossível em mamíferos."], "Espécies exóticas invasoras e desequilíbrios ecológicos": ["A introdução de espécies exóticas invasoras (não nativas) é considerada a segunda maior causa global de perda de biodiversidade, superada apenas pela perda direta de habitat. Desprovidas de predadores naturais, parasitas ou patógenos reguladores no novo ambiente, essas espécies proliferam descontroladamente, competindo desvantajosamente com as espécies nativas por espaço, abrigo e alimento. No Brasil, exemplos notórios incluem o mexilhão-dourado (que entope turbinas de hidrelétricas e altera teias aquáticas), o caramujo-gigante-africano (praga agrícola e vetor de meningite eosinofílica) e o javali/javaporco (que devasta lavouras e destrói ninhos de animais silvestres nativos). O controle biológico clássico exige rigorosos estudos ecotoxicológicos para evitar que o agente de controle se torne uma nova praga invasora.", ["Espécie exótica invasora: prolifera sem predadores naturais e desequilibra a teia nativa", "Competição interespecífica assimétrica: elimina espécies nativas por sobreposição de nicho", "Exemplos no Brasil: mexilhão-dourado, caramujo-africano, javali e peixe-leão", "Controle biológico: introdução planejada de inimigo natural específico sob rigor científico"], "No ENEM, espécies exóticas invasoras são tratadas como grave ameaça ecológica. O motivo do seu sucesso invasivo é a AUSÊNCIA DE PREDAÇÃO E PARASITISMO NATURAL e a sua alta taxa reprodutiva com nicho ecológico generalista.", "<p>O mexilhão-dourado (<i>Limnoperna fortunei</i>), molusco bivalve originário do sudeste asiático, foi introduzido acidentalmente na bacia do Rio da Prata pela água de lastro de navios cargueiros. Em poucos anos, colonizou rios brasileiros, incrustando-se massivamente em tubulações e turbinas de hidrelétricas e dizimando populações de moluscos nativos.</p>", "A proliferação descontrolada do mexilhão-dourado nos rios da bacia hidrográfica brasileira é facilitada primordialmente pela:", ["capacidade do molusco de realizar fotossíntese anoxigênica em águas profundas.", "ausência de predadores e competidores naturais eficientes no ecossistema receptor.", "hibridização fértil e espontânea com peixes carnívoros nativos de grande porte.", "produção de esporos celulósicos que resistem a tratamentos químicos de cloração.", "secreção de substâncias radioativas que alteram o campo magnético fluvial."], 1, "Espécies exóticas invasoras não coevoluíram com a comunidade receptora. A carência de predadores naturais adaptados ao seu consumo, de parasitas específicos e de competidores ecológicos restritivos propicia vantagem competitiva avassaladora, levando ao crescimento populacional exponencial e expulsão das espécies nativas. Alternativa correta: B. Distratores: A, C, D e E formulam absurdos biológicos sem fundamentação científica."], "Evidências da evolução e órgãos homólogos": ["A evolução biológica é sustentada por diversas linhas convergentes de evidências científicas: o registro fóssil (que atesta modificações morfológicas ao longo de estratos geológicos e formas de transição), a anatomia comparada, a embriologia comparada e a biologia molecular (análise comparativa de sequências de DNA, RNA e proteínas como o citocromo c). Estruturas homólogas compartilham a mesma origem embrionária e plano anatômico básico herdados de um ancestral comum, mesmo desempenhando funções diferentes em virtude de divergência evolutiva ou irradiação adaptativa (ex.: braço humano, nadadeira da baleia e asa do morcego). Estruturas análogas possuem origens embrionárias distintas, mas desempenham a mesma função ecológica devido à convergência evolutiva sob pressões seletivas semelhantes (ex.: asa de inseto e asa de ave; corpo hidrodinâmico de tubarão e golfinho).", ["Homologia: mesma origem embrionária (ancestral comum) → divergência adaptativa", "Analogia: origens embrionárias distintas, mesma função → convergência adaptativa", "Exemplo de homologia: braço humano, pata do cavalo, asa do morcego, nadadeira da baleia", "Exemplo de analogia: asa de inseto (quitina) e asa de ave (ossos/penas)", "Biologia molecular: quanto maior a similaridade de DNA/proteínas, mais próximo o parentesco"], "Homologia = Mesma origem embrionária (Parentesco evolutivo real!). Analogia = Mesma função em animais distantes sem parentesco próximo imediato (Adaptação ao mesmo meio, ex.: tubarão peixe e golfinho mamífero com corpo fusiforme).", "<p>Considere os membros anteriores de quatro vertebrados tetrápodes: o braço do ser humano, a pata dianteira do cavalo, a nadadeira peitoral da baleia e a asa do morcego. Embora esses membros desempenhem funções mecânicas inteiramente distintas no cotidiano (manipulação, locomoção terrestre, natação e voo), a dissecação anatômica revela uma rigorosa correspondência nos mesmos ossos esqueléticos (úmero, rádio, ulna, carpos, metacarpos e falanges) e idêntica origem nos folhetos mesodérmicos do embrião.</p>", "As estruturas esqueléticas descritas são classificadas biologicamente como:", ["órgãos análogos resultantes de convergência evolutiva sob o mesmo regime alimentar.", "estruturas vestigiais sem qualquer função que atestam degeneração tecidual patológica.", "órgãos homólogos resultantes de irradiação adaptativa a partir de um ancestral comum compartilhado.", "mutações teratogênicas induzidas por parasitas nematódeos aquáticos ancestrais.", "tecidos epiteliais de revestimento derivados exclusivamente do folheto ectodérmico."], 2, "Estruturas que apresentam a mesma arquitetura óssea fundamental e a mesma origem embrionária (mesoderme de vertebrado), mesmo modificadas para atender a exigências funcionais distintas em diferentes nichos ecológicos, constituem órgãos homólogos. Seu surgimento decorre de um processo de irradiação adaptativa (divergência evolutiva) a partir de um ancestral mamífero tetrápode comum. Alternativa correta: C. Distratores: A confunde homologia com analogia e divergência com convergência; C erra pois os membros são plenamente funcionais; D e E citam aberrações conceituais absurdas."], "Excreção e osmorregulação comparada nos animais": ["A excreção nitrogenada nos animais resulta do catabolismo oxidativo de proteínas (aminoácidos) e ácidos nucleicos, originando três tipos principais de excretas segundo a toxicidade e solubilidade em água. Animais amoniotélicos (como peixes ósseos teleósteos dulcícolas e invertebrados aquáticos) excretam amônia (NH₃), uma molécula altamente tóxica que exige grande volume de água para eliminação por difusão contínua branquial. Animais ureotélicos (como mamíferos, anfíbios adultos e peixes cartilaginosos tubarões/raias) sintetizam ureia no fígado via ciclo da ornitina; a ureia tem toxicidade moderada e requer volume intermediário de água. Animais uricotélicos (como répteis, aves e insetos) excretam ácido úrico, praticamente atóxico e insolúvel, eliminado como pasta semissólida com baixíssima perda de água, adaptação anatômica primordial para o desenvolvimento embrionário no interior de ovos com casca calcária impermeável e colonização de ambientes áridos.", ["Amoniotélicos (amônia): peixes ósseos; alta toxicidade e grande dependência de água", "Ureotélicos (ureia): mamíferos e anfíbios; toxicidade e solubilidade moderadas", "Uricotélicos (ácido úrico): aves, répteis e insetos; atóxico e insolúvel em água", "Ovo amniótico com casca: ácido úrico insolúvel precipita sem intoxicar o embrião no ovo!"], "Por que aves e répteis excretam ácido úrico em vez de ureia? Porque o embrião se desenvolve preso dentro de um ovo com casca! Se produzisse amônia ou ureia solúvel, a substância dissolvida no líquido amniótico alcançaria níveis letais e intoxicaria o embrião; o ácido úrico, insolúvel, precipita em cristais inofensivos no alantoide.", "<p>Aves e répteis terrestres excretam seus resíduos nitrogenados na forma de ácido úrico, uma pasta esbranquiçada e pastosa eliminada junto com as fezes pela cloaca, com perda mínima de água corporal.</p>", "Essa forma de excreção nitrogenada representou uma adaptação evolutiva decisiva para esses animais porque permitiu:", ["aumentar a densidade óssea para o mergulho em grandes profundidades marinhas.", "o desenvolvimento embrionário no interior de ovos com casca calcária sem risco de auto-intoxicação.", "a conversão direta de resíduos nitrogenados em glicogênio hepático durante o voo.", "a respiração branquial eficiente sob elevadas temperaturas no deserto.", "a neutralização do ácido clorídrico gástrico durante a mastigação de sementes duras."], 1, "Como o ovo com casca dos répteis e aves é um sistema fechado para solutos, qualquer excreta nitrogenada solúvel e tóxica (como amônia ou ureia) acumular-se-ia na água circundante, intoxicando os tecidos do feto. O ácido úrico, por ser praticamente atóxico e insolúvel em água, precipita no alantoide em forma de cristais inofensivos, além de garantir máxima economia de água para o organismo adulto em terras secas. Alternativa correta: B. Distratores: A, C, D e E formulam proposições fisiologicamente sem sentido."], "Febre maculosa e transmissão por carrapatos": ["A febre maculosa brasileira é uma infecção febril aguda grave, de notificação compulsória imediata e alta letalidade, causada pela bactéria intracelular obrigatória Rickettsia rickettsii. O agente etiológico é transmitido ao ser humano pela picada do carrapato-estrela (Amblyomma sculptum), um aracnídeo ectoparasita hematófago que necessita permanecer aderido à pele por várias horas para regurgitar a bactéria na corrente sanguínea do hospedeiro. No ambiente natural e periurbano brasileiro, as capivaras e equinos atuam como os principais amplificadores e hospedeiros dos carrapatos, favorecendo a dispersão do artrópode ao longo de cursos d'água e parques municipais. A bactéria ataca seletivamente as células endoteliais dos vasos sanguíneos, provocando vasculite sistêmica, lesões hemorrágicas na pele (máculas), necrose microvascular e falência orgânica múltipla quando não tratada precocemente com doxiciclina.", ["Agente etiológico: Rickettsia rickettsii (bactéria intracelular obrigatória gram-negativa)", "Vetor biológico: Carrapato-estrela (Amblyomma sculptum), classe Arachnida", "Hospedeiros amplificadores: capivaras e cavalos mantêm altas densidades do carrapato no ambiente", "Fisiopatologia: invasão e lesão das células endoteliais vasculares, gerando vasculite e manchas purpúreas (máculas)", "Prevenção e controle: evitar áreas de capim alto próximas a rios, usar roupas claras, examinar o corpo e tratar com antibiótico rápido"], "No ENEM, febre maculosa é cobrada para testar a diferença entre AGENTE ETIOLÓGICO (bactéria) e VETOR (carrapato, que é um aracnídeo, não inseto!). Antibiótico mata a bactéria, mas repelente e inspeção corporal evitam o vetor.", "<p>Em áreas ribeirinhas de parques municipais no Sudeste do Brasil, autoridades sanitárias intensificaram o alerta epidemiológico após a confirmação de óbitos por febre maculosa em frequentadores de áreas gramadas onde capivaras pastam livremente. Os pacientes apresentaram febre alta súbita, mialgia intensa e máculas avermelhadas nas palmas das mãos e plantas dos pés.</p>", "Para interromper o ciclo de transmissão dessa enfermidade aos humanos, as medidas profiláticas corretas envolvem:", ["eliminar as capivaras por meio de caça esportiva indiscriminada em áreas urbanas.", "inspecionar o corpo após transitar em áreas de risco e combater a fixação do carrapato-estrela vetor.", "distribuir vermífugos anti-helmínticos à população ribeirinha nos postos de saúde.", "ferver a água das lagoas municipais para esterilizar as formas císticas do protozoário patogênico.", "promover campanhas de imunização em massa com vacinas de RNA contra o vírus da febre maculosa."], 1, "A profilaxia da febre maculosa baseia-se na prevenção do contato com o carrapato-estrela (Amblyomma sculptum) vetor da bactéria: usar roupas claras para facilitar a visualização do aracnídeo, calçados fechados com meias presas e inspecionar cuidadosamente a pele após transitar em matas e gramados frequentados por capivaras e equinos, removendo os carrapatos com pinça antes que transmitam a bactéria. Alternativa correta: B. Distratores: A é crime ambiental e ineficaz; C, D e E erram a natureza biológica do patógeno (bactéria, não protozoário, vírus ou verme)."], "Fecundação humana, reação acrossômica e clivagem": ["A fecundação humana ocorre normalmente no terço distal da tuba uterina (ampola), onde o espermatozoide fertiliza o ovócito secundário estacionado na metáfase II. Ao atingir o ovócito, o espermatozoide atravessa a corona radiata e atinge a zona pelúcida glicoproteica, desencadeando a reação acrossômica: a bolsa acrossômica da cabeça do gameta masculino rompe-se por exocitose, liberando enzimas hidrolíticas (como a hialuronidase e a acrosina) que digerem a zona pelúcida. A fusão das membranas dos dois gametas dispara a reação cortical (bloqueio da poliespermia): grânulos corticais ovocitários descarregam enzimas que endurecem a zona pelúcida, impedindo a entrada de outros espermatozoides. O ovócito conclui a meiose II expulsando o segundo corpúsculo polar, e os pronúcleos fundem-se (anfimixia), originando o zigoto (2n). Segue-se a clivagem (segmentação), com divisões mitóticas sucessivas sem aumento de volume formando a mórula e depois o blastocisto, que realiza a nidação no endométrio.", ["Local da fecundação: terço distal da tuba uterina (ampola tubária)", "Reação acrossômica: enzimas do acrossomo (acrosina/hialuronidase) perfuram a zona pelúcida", "Bloqueio da poliespermia (reação cortical): impede que mais de um espermatozoide fecunde o óvulo", "Clivagem: mitoses rápidas sem crescimento celular (Zigoto → Mórula → Blastocisto)", "Nidação: implantação do blastocisto no endométrio cerca de 6 a 7 dias após a fertilização"], "Se mais de um espermatozoide fecundasse o ovócito (poliespermia), o embrião seria triploide (3n = 69 cromossomos) e inviável! A liberação dos grânulos corticais logo após o primeiro contato endurece a zona pelúcida em segundos, barrando todos os outros espermatozoides.", "<p>Durante o processo de fertilização humana in vitro em laboratório de reprodução assistida, embriologistas observaram que a penetração do primeiro espermatozoide na membrana do ovócito desencadeia uma onda imediata de liberação de íons cálcio intracelular, seguida pela exocitose maciça de enzimas contidas em vesículas periféricas denominadas grânulos corticais.</p>", "Essa reação cortical é biologicamente indispensável para o sucesso do desenvolvimento embrionário porque promove o(a):", ["transformação do ovócito secundário em uma célula vegetal pluricelular fotossintetizante.", "digestão da carioteca do pronúcleo feminino por enzimas proteolíticas da vesícula biliar.", "bloqueio imediato da poliespermia por endurecimento e modificação química da zona pelúcida.", "duplicação do volume citoplasmático antes da primeira divisão mitótica do zigoto.", "liberação de anticorpos maternos que destroem a cabeça do primeiro espermatozoide fértil."], 2, "A entrada de um único espermatozoide na membrana do ovócito ativa a liberação de cálcio intracelular, deflagrando a reação cortical. As enzimas exocitadas pelos grânulos corticais clivam os receptores espermáticos ZP3 e endurecem a matriz glicoproteica da zona pelúcida (reação de zona), criando uma barreira impenetrável que impede a fertilização por espermatozoides adicionais (bloqueio da poliespermia) e assegurando a diplodia (2n = 46 cromossomos) da espécie humana. Alternativa correta: C. Distratores: A, B, D e E formulam proposições biologicamente incoerentes."], "Filos animais e suas adaptações evolutivas": ["O reino Animalia (Metazoa) abrange organismos eucariontes, multicelulares e heterótrofos por ingestão, cujos filos principais ilustram marcos evolutivos fundamentais. Os Poríferos (esponjas) são animais basais sem tecidos verdadeiros (parazoários) com coanócitos filtradores. Os Cnidários (águas-vivas e corais) inovam com tecidos verdadeiros (diblásticos), simetria radial e cnidócitos urticantes. Platelmintos são os primeiros triblásticos e acelomados, com simetria bilateral e cefalização. Nematelmintos são pseudocelomados com sistema digestório completo (boca e ânus). Anelídeos inovam com celoma verdadeiro, metameria (segmentação) e circulação fechada com hemoglobina. Moluscos possuem corpo mole com concha calcária e manto. Equinodermos (estrelas-do-mar) são deuterostômios marinhos com endoesqueleto calcário e sistema ambulacrário. Cordados compartilham quatro características fundamentais no embrião: notocorda, tubo nervoso dorsal oco, fendas faríngeas e cauda pós-anal.", ["Poríferos: sem tecidos verdadeiros, coanócitos filtradores, digestão exclusivamente intracelular", "Cnidários: diblásticos, cnidócitos defensivos, sistema nervoso difuso", "Celoma verdadeiro: surge nos Anelídeos, Moluscos, Artrópodes, Equinodermos e Cordados", "Deuterostômios (blastóporo origina o ânus): apenas Equinodermos e Cordados!", "Cordados: notocorda, tubo neural dorsal, fendas branquiais e cauda pós-anal embrionária"], "Deuterostomia: na embriogênese, o blastóporo dá origem primeiro ao ÂNUS, e a boca surge secundariamente. Os únicos dois grandes filos do reino animal deuterostômios são os EQUINODERMOS e os CORDADOS, provando seu parentesco filogenético próximo!", "<p>Em uma aula de zoologia comparada sobre a árvore filogenética dos metazoários, o professor destacou que, do ponto de vista do desenvolvimento embrionário inicial, os seres humanos (filo Chordata) compartilham com as estrelas-do-mar e ouriços-do-mar (filo Echinodermata) uma afinidade evolutiva muito mais estreita do que com insetos ou polvos.</p>", "Essa proximidade filogenética compartilhada exclusivamente entre equinodermos e cordados decorre do fato de ambos serem classificados como animais:", ["protostômios, nos quais o blastóporo embrionário origina primariamente a cavidade bucal.", "deuterostômios, nos quais o blastóporo origina o ânus e a boca forma-se secundariamente.", "diblásticos, dotados exclusivamente de folhetos ectodérmico e endodérmico.", "acelomados primitivos desprovidos de mesoderme somática funcional.", "assimétricos marinhos cuja locomoção é restrita à propulsão a jato por sifão."], 1, "Animais bilaterais dividem-se em protostômios (onde o blastóporo origina a boca — anelídeos, artrópodes, moluscos) e deuterostômios (onde o blastóporo dá origem ao ânus, e a boca é perfurada secundariamente na extremidade oposta). Os únicos filos triploblásticos celomados deuterostômios são Echinodermata e Chordata, o que estabelece uma linhagem monofilética compartilhada confirmada por análises moleculares genômicas. Alternativa correta: B. Distratores: A descreve protostomia; C classifica cnidários; D descreve platelmintos; E confunde com cefalópodes ou poríferos."], "Fisiologia cardiovascular e regulação da pressão arterial": ["A pressão arterial sistêmica é determinada pelo produto entre o débito cardíaco (volume de sangue ejetado por minuto) e a resistência vascular periférica oferecida pelos vasos sanguíneos. A regulação a curto prazo é neural e mediada por barorreceptores situados no arco aórtico e no seio carotídeo: quedas de pressão ativam o sistema nervoso autônomo simpático (liberando noradrenalina), que aumenta a frequência cardíaca, a força de contração miocárdica e promove vasoconstrição arteriolar generalizada. A regulação a médio e longo prazo é hormonal e mediada pelo Sistema Renina-Angiotensina-Aldosterona (SRAA): diante de hipotensão ou baixa perfusão renal, o aparelho justaglomerular secreta a enzima renina, que converte o angiotensinogênio em angiotensina I, convertida nos pulmões pela ECA em angiotensina II (um potente vasoconstritor que também estimula o córtex da suprarrenal a secretar aldosterona, retendo Na⁺ e água nos rins). Em contrapartida, a distensão atrial por hipervolemia estimula a secreção do Peptídeo Natriurético Atrial (ANP), promovendo natriurese e vasodilatação para reduzir a pressão arterial.", ["PA = Débito Cardíaco × Resistência Vascular Periférica", "Barorreceptores (aorta/carótida): regulação nervosa reflexa imediata de pressão", "Sistema Renina-Angiotensina-Aldosterona: vasoconstrição e retenção de sal/água para subir a pressão", "Medicamentos anti-hipertensivos: inibidores da ECA (captopril/enalapril) e bloqueadores de receptores de angiotensina", "Peptídeo Natriurético Atrial (ANP): secretado pelo coração para baixar a pressão e eliminar sódio"], "O medicamento captopril e enalapril atuam inibindo a Enzima Conversora de Angiotensina (ECA). Ao impedir a formação de angiotensina II, os vasos dilatam e os rins eliminam mais sal e água, baixando a pressão arterial de pacientes hipertensos.", "<p>Milhões de brasileiros hipertensos utilizam diariamente medicamentos inibidores da Enzima Conversora de Angiotensina (como o enalapril e o captopril) para manter a pressão arterial em níveis saudáveis e prevenir infartos e acidentes vasculares encefálicos.</p>", "A administração continuada desses fármacos reduz eficazmente a pressão arterial porque impede a:", ["contração involuntária dos músculos ciliares que sustentam a córnea ocular.", "liberação de gás oxigênio pelas hemácias nas arteríolas musculares dos membros inferiores.", "síntese de insulina pelas células beta do pâncreas durante a absorção de glicose.", "reabsorção de glicose pelo túbulo contorcido proximal dos néfrons renais.", "conversão da angiotensina I em angiotensina II, promovendo vasodilatação e redução da retenção de sódio estimulada pela aldosterona."], 4, "A Enzima Conversora de Angiotensina (ECA), expressa principalmente no endotélio capilar dos pulmões, cliva a angiotensina I na sua forma ativa, a angiotensina II. A angiotensina II é uma das substâncias mais vasoconstritoras do corpo humano e potente estimuladora da secreção de aldosterona na suprarrenal. Ao inibir a ECA, o medicamento reduz a síntese de angiotensina II e de aldosterona, resultando em vasodilatação arteriolar e maior natriurese e diurese pelos rins, diminuindo o débito cardíaco e a resistência periférica. Alternativa correta: E. Distratores: B, C, D e E citam processos alheios à farmacologia anti-hipertensiva cardiovascular."], "Fisiologia da coagulação sanguínea e vitamina K": ["A hemostasia é o conjunto integrado de processos biológicos que previne e estanca hemorragias vasculares, compreendendo três etapas sequenciais: espasmo vascular local (vasoconstrição reflexa temporária para diminuir a perda de sangue), hemostasia primária (adesão e agregação plaquetária formando o tampão plaquetário hemostático) e hemostasia secundária (cascata de coagulação sanguínea). Na cascata enzimática, íons cálcio (Ca²⁺) e a tromboplastina ativam a protrombina em trombina; a trombina, por sua vez, cliva a proteína solúvel fibrinogênio em filamentos insolúveis de fibrina, formando uma malha tridimensional resistente que aprisiona hemácias e plaquetas para selar a lesão vascular. A síntese hepática dos fatores de coagulação II (protrombina), VII, IX e X depende criticamente da vitamina K (lipossolúvel), sintetizada em parte pela microbiota bacteriana intestinal humana.", ["Hemostasia: vasoespasmo → tampão plaquetário → rede de fibrina (coágulo estável)", "Cascata: Protrombina → (Ca²⁺ + tromboplastina) → Trombina → cliva Fibrinogênio em Fibrina", "Vitamina K: indispensável para o fígado sintetizar protrombina e fatores hemostáticos", "Hemofilia: deficiência genética ligada ao X de fatores de coagulação (sangramento contínuo)"], "Uso prolongado de antibióticos de largo espectro pode provocar tendência a sangramentos! O antibiótico destrói as bactérias da microbiota do cólon intestinal, que são responsáveis por sintetizar boa parte da vitamina K necessária para o fígado produzir os fatores de coagulação.", "<p>Após um tratamento prolongado de três meses com antibióticos orais de largo espectro para erradicar uma infecção óssea crônica, um paciente começou a apresentar sangramentos gengivais espontâneos ao escovar os dentes e manchas arroxeadas (equimoses) na pele com facilidade anormal.</p>", "Essa alteração na coagulação sanguínea decorreu da destruição da microbiota intestinal e consequente carência de qual micronutriente essencial?", ["Vitamina C hidrossolúvel, necessária para a oxidação do ferro hemoglobínico.", "Vitamina K lipossolúvel, cofator imprescindível para a síntese hepática de protrombina e fatores de coagulação.", "Vitamina D esteárica, estimuladora direta da secreção gástrica de ácido clorídrico.", "Vitamina B12 cianocobalamina, responsável pela absorção osmótica de glicose.", "Cálcio quelado, inibidor fisiológico da agregação de eritrócitos nos rins."], 1, "As bactérias mutualísticas da microbiota intestinal produzem quantidades significativas de vitamina K2 (menaquinona). O uso prolongado de antibióticos dizima essas bactérias e, se o aporte alimentar for baixo, instala-se carência de vitamina K. Como essa vitamina atua como cofator enzimático indispensável na carboxilação hepática de resíduos de ácido glutâmico para sintetizar a protrombina e outros fatores da coagulação, a cascata hemostática fica comprometida, gerando diátese hemorrágica. Alternativa correta: B. Distratores: A cita escorbuto (vitamina C); C, D e E formulam proposições incorretas."], "Fisiologia do pâncreas endócrino (insulina e glucagon)": ["O pâncreas é uma glândula anfícrina (mista) fundamental no controle da glicemia. A porção endócrina corresponde às ilhotas de Langerhans, compostas por células beta (secretoras de insulina) e células alfa (secretoras de glucagon). A insulina é um hormônio anabólico e hipoglicemiante: liberada após as refeições ricas em carboidratos, estimula a translocação de vesículas com transportadores GLUT-4 para a membrana de células musculares e adipócitos, promovendo a captação de glicose e a síntese de glicogênio (glicogênese) no fígado e músculos. O glucagon é um hormônio catabólico e hiperglicemiante: liberado durante períodos de jejum ou exercício, liga-se a receptores hepáticos estimulando a quebra de glicogênio (glicogenólise) e a conversão de aminoácidos e glicerol em glicose (gliconeogênese), mantendo a glicemia fisiológica estável.", ["Insulina (células beta): hipoglicemiante; estimula captação celular de glicose e glicogênese", "Glucagon (células alfa): hiperglicemiante; estimula glicogenólise e gliconeogênese hepática", "Diabetes mellitus tipo 1: destruição autoimune das células beta (dependência de insulina)", "Diabetes mellitus tipo 2: resistência periférica à insulina associada a obesidade e sedentarismo", "Gliconeogênese: síntese de glicose a partir de precursores não-glicídicos no fígado"], "Cuidado: o glucagon estimula a quebra de glicogênio no FÍGADO, mas NÃO quebra o glicogênio dos músculos! O glicogênio muscular é de uso exclusivo da própria fibra muscular esquelética durante a contração.", "<p>Após 12 horas de jejum noturno antes de um exame de sangue de rotina, a glicemia de um voluntário saudável manteve-se rigorosamente dentro dos limites normais de referência (em torno de 85 mg/dL), sem manifestação de sintomas de hipoglicemia cerebral.</p>", "A manutenção da concentração estável de glicose plasmática durante esse período prolongado de jejum foi assegurada pela ação do hormônio:", ["insulina, que acelerou o armazenamento de glicose na forma de amido tecidual.", "calcitonina, que bloqueou a absorção de lipídios pelas microvilosidades do duodeno.", "paratormônio, que hidrolisou os fosfatos de cálcio da cartilagem articular.", "glucagon, que estimulou a glicogenólise hepática liberando glicose na corrente sanguínea.", "ocitocina, que induziu contrações peristálticas no parênquima pulmonar."], 3, "No estado de jejum pós-absortivo, a leve queda na glicemia inibe as células beta e estimula as células alfa das ilhotas pancreáticas a secretarem glucagon. O glucagon atua nos hepatócitos ativando a enzima glicogênio fosforilase, que hidrolisa as reservas de glicogênio hepático em glicose livre (glicogenólise), exportada para a circulação para nutrir órgãos vitais dependentes de glicose, como o cérebro. Alternativa correta: D. Distratores: A erra pois insulina atua na abundância e humanos não estocam amido; C, D e E citam hormônios alheios à regulação glicêmica."], "Fisiologia dos músculos esqueléticos e tipos de fibras musculares": ["O músculo estriado esquelético compõe-se de fascículos de fibras musculares com sarcômeros contráteis. O mecanismo de contração sliding filament envolve a liberação de Ca²⁺ pelo retículo sarcoplasmático (ativada pelo potencial de ação da placa motora), que se liga à troponina, deslocando a tropomiosina e expondo o sítio ativo da actina para que as cabeças da miosina realizem a tração mecânica impulsionada pela hidrólise de ATP. As fibras musculares dividem-se em dois tipos fisiológicos principais: Fibras Tipo I (vermelhas ou de contração lenta), ricas em mioglobina, mitocôndrias e capilares, dependentes da fosforilação oxidativa aeróbia e altamente resistentes à fadiga (predominantes em maratonistas e nos músculos posturais da coluna); e Fibras Tipo II (brancas ou de contração rápida), com elevado teor de glicogênio e enzimas glicolíticas, alta velocidade de quebra de ATP por contração anaeróbia e rápida fadiga por ácido lático (predominantes em velocistas de 100 metros rasos e levantadores de peso).", ["Fibras Tipo I (vermelhas/lentas): aeróbias, muitas mitocôndrias, mioglobina, resistentes à fadiga (maratona)", "Fibras Tipo II (brancas/rápidas): anaeróbias glicolíticas, contração explosiva, fadigam rápido (tiro 100m)", "Contração muscular: Ca²⁺ se liga à troponina e ATP recarrega a cabeça da miosina", "Rigor mortis: ausência de ATP após a morte impede o desligamento miosina-actina"], "Corredores de maratona (42 km) têm predomínio genético e adaptativo de fibras vermelhas lentas (Tipo I, aeróbias). Velocistas de 100 metros rasos possuem grande proporção de fibras brancas rápidas (Tipo II, anaeróbias glicolíticas).", "<p>Biópsias musculares do músculo gastrocnêmio (panturrilha) realizadas em dois atletas de elite demonstraram perfis histológicos contrastantes: o Atleta 1 apresentou 80% de fibras musculares com alto teor de mioglobina, densa rede capilar e numerosas mitocôndrias volumosas. O Atleta 2 apresentou 75% de fibras com alta concentração de glicogênio citoplasmático e elevadas taxas de enzimas da glicólise anaeróbia.</p>", "Com base nessas características metabólicas e estruturais, os atletas 1 e 2 são especializados com maior eficiência, respectivamente, em provas esportivas de:", ["arremesso de peso e salto em altura explosivo.", "levantamento de peso olímpico e caminhada pós-cirúrgica lenta.", "tiro de velocidade curto e natação de 50 metros nado livre.", "maratona de longa duração e corrida de velocidade de 100 metros rasos.", "mergulho autônomo com cilindro e xadrez de alta velocidade mental."], 3, "O Atleta 1 possui predomínio de fibras do Tipo I (vermelhas, lentas, altamente aeróbias e resistentes à fadiga graças à mioglobina transportadora de O₂ e mitocôndrias oxidativas), características ideais para modalidades de resistência contínua prolongada como a maratona. O Atleta 2 possui predomínio de fibras Tipo II (brancas, rápidas, de alta força contrátil anaeróbia imediata que utilizam a fermentação láctica), ideais para esforços de velocidade pura de curta duração como os 100 metros rasos. Alternativa correta: D. Distratores: A, C, D e E invertem os tipos de fibras ou associam modalidades incompatíveis com a bioenergética muscular."], "Fisiologia hepática e metabolismo de nutrientes": ["O fígado é a maior e mais versátil glândula metabólica do organismo humano, exercendo funções homeostáticas indispensáveis no metabolismo de carboidratos, lipídios, proteínas e substâncias xenobióticas. No metabolismo glicídico, realiza a glicogênese sob estímulo da insulina e a glicogenólise e gliconeogênese sob ação do glucagon para manter a glicemia constante. Na digestão lipídica, sintetiza e secreta continuamente a bile, composta por sais biliares anfipáticos que emulsificam as gorduras no duodeno, ampliando a área de contato para a lipase pancreática. No metabolismo proteico, realiza a desaminação oxidativa de aminoácidos excedentes, convertendo a amônia altamente tóxica em ureia hidrossolúvel e menos tóxica por meio do ciclo da ureia, além de inativar toxinas, álcool e medicamentos através das enzimas do citocromo P450.", ["Produção de bile: emulsificação de lipídios no intestino delgado (sais biliares atuam como detergentes)", "Glicostato hepático: reserva glicogênio e faz gliconeogênese a partir de lactato, glicerol e aminoácidos", "Ciclo da ornitina (ureia): transforma amônia tóxica em ureia para excreção renal", "Síntese proteica plasmática: produz albumina (pressão coloidosmótica) e fatores de coagulação (protrombina/fibrinogênio)", "Desintoxicação celular: biotransformação de fármacos e álcool pelo retículo endoplasmático liso e peroxissomos"], "Atenção máxima no ENEM: A BILE NÃO CONTÉM ENZIMAS DIGESTIVAS! Sua função é estritamente física e detergente (EMULSIFICAÇÃO), quebrando gotas grandes de gordura em micelas minúsculas para facilitar o ataque das lipases.", "<p>Um paciente com quadro crônico de cirrose hepática decorrente de hepatite viral desenvolveu acentuada perda de massa muscular, sangramentos gengivais frequentes, icterícia (coloração amarelada da pele), edemas periféricos nos membros inferiores e intolerância acentuada a refeições ricas em lipídios.</p>", "A intolerância a alimentos gordurosos apresentada por esse paciente decorre da redução hepática na síntese de:", ["ácido clorídrico gástrico responsável pela quebra das ligações peptídicas.", "pepsina ativa encarregada da hidrólise de triglicerídeos no duodeno.", "sais biliares encarregados da emulsificação física das gorduras no trato entérico.", "ptialina salivar necessária para a clivagem do amido resistente em glicose livre.", "insulina pancreática reguladora da absorção celular de ácidos graxos essenciais."], 2, "Com o parênquima hepático comprometido pela cirrose, os hepatócitos perdem a capacidade de produzir volumes adequados de bile e sais biliares. Sem a emulsificação dos lipídios da dieta em micelas menores no lúmen do duodeno, as enzimas lipases encontram uma superfície de ataque muito reduzida, resultando em má digestão das gorduras e esteatorreia (fezes gordurosas). Alternativa correta: C. Distratores: A é secreção do estômago; B atua sobre proteínas; D atua sobre amido; E é produzida pelo pâncreas."], "Fisiologia renal, osmorregulação e hormônio ADH": ["A osmorregulação em mamíferos ajusta o balanço hídrico e eletrolítico do plasma por meio dos rins. O hormônio antidiurético (ADH ou vasopressina), sintetizado no hipotálamo e liberado pela neuroipófise, é secretado quando osmorreceptores detectam aumento da osmolaridade plasmática (desidratação ou consumo excessivo de sal). O ADH liga-se a receptores nas células dos ductos coletores do néfron, induzindo a inserção de canais de aquaporina na membrana apical, promovendo a reabsorção maciça de água de volta aos capilares sanguíneos e resultando em urina concentrada e de baixo volume. Quando o indivíduo ingere grande volume de água, a secreção de ADH é inibida, promovendo diurese abundante de urina diluída. O álcool etílico inibe farmacologicamente o ADH.", ["ADH (vasopressina): reabsorve água nos ductos coletores renais via aquaporinas", "Alta osmolaridade plasmática (sede/desidratação) → MAIS ADH → urina concentrada", "Álcool etílico: inibe a secreção de ADH na neuroipófise → micção volumosa e desidratação", "Diabetes insipidus: deficiência de produção ou ação do ADH com sede intensa e poliúria extrema", "Aldosterona: reabsorve sódio (Na⁺) no túbulo contorcido distal, puxando água por osmose"], "Lembre-se: ADH = ANTIDIURÉTICO. 'Anti-diurese' significa impedir a perda de água na urina. Mais ADH = menos xixi e mais concentrado; Menos ADH = muito xixi e bem diluído.", "<p>Em um dia quente, um montanhista fez uma longa caminhada sem levar água suficiente. Ao final do percurso, sentia muita sede e, ao urinar, notou que o volume expelido era muito reduzido e apresentava coloração amarelo-escura e alta densidade.</p>", "A resposta endócrina adaptativa que atuou nos rins do montanhista para evitar a desidratação severa foi o(a):", ["bloqueio da aldosterona pelas suprarrenais com eliminação acelerada de sódio na urina.", "aumento na liberação de ADH (vasopressina), promovendo maior reabsorção de água nos ductos coletores.", "inibição da filtração de ureia pelos glomérulos induzida pela adrenalina medular.", "secreção de glucagon diretamente no líquido sinovial das articulações femorais.", "destruição das aquaporinas tubulares pela alta temperatura atmosférica externa."], 1, "A perda de água pelo suor sem reposição hídrica aumenta a osmolaridade do sangue. O hipotálamo detecta essa hipertonicidade e estimula a neuroipófise a liberar ADH na corrente sanguínea. O ADH atua nos ductos coletores e túbulos distais inserindo aquaporinas, que promovem reabsorção facultativa de água para o sangue, conservando água corpórea e gerando urina escassa e hiperconcentrada. Alternativa correta: B. Distratores: A promoveria diurese adicional; C, D e E citam mecanismos incorretos ou absurdos."], "Fisiologia sensorial da visão humana e acomodação visual": ["A visão humana é mediada por fotorreceptores localizados na retina que convertem estímulos luminosos em impulsos nervosos conduzidos pelo nervo óptico ao córtex occipital cerebral. Os cones são fotorreceptores responsáveis pela visão nítida em cores sob boa iluminação (alta acuidade na fóvea central), utilizando opsinas pigmentares sensíveis ao vermelho, verde e azul. Os bastonetes são fotorreceptores de alta sensibilidade à luz que utilizam a rodopsina (pigmento dependente de vitamina A / retinol), permitindo a visão noturna acromática em tons de cinza. A acomodação visual é a alteração na curvatura e espessura da lente natural (cristalino), mediada pelos músculos ciliares, para focar objetos próximos ou distantes na fóvea retiniana.", ["Cones: visão de cores e detalhes diurnos (pigmentos iodopsinas; concentrados na fóvea)", "Bastonetes: visão noturna escotópica em preto e branco (pigmento rodopsina; dependem de vitamina A)", "Carência de Vitamina A: cegueira noturna (hemeralopia) e xeroftalmia", "Cristalino: lente biconvexa que ajusta o foco por contração do músculo ciliar", "Miopia (globo ocular longo, imagem antes da retina) vs Hipermetropia (imagem atrás)"], "Cegueira noturna (dificuldade de enxergar em ambientes de penumbra) é um sintoma clássico de avitaminose A, pois o retinol é precursor da molécula de retinal que compõe a rodopsina dos bastonetes da retina.", "<p>Um médico voluntário em uma região desprovida de saneamento e com alimentação precária atendeu crianças em idade escolar com queixas de extrema dificuldade para enxergar ao entardecer e à noite (cegueira noturna), além de ressecamento da conjuntiva ocular (xeroftalmia). A dieta das famílias era desprovida de vegetais verde-escuros e alaranjados, laticínios e fígado.</p>", "O quadro visual apresentado pelas crianças decorre da carência nutricional de qual micronutriente e afeta primariamente qual estrutura sensorial retiniana?", ["Vitamina C; cones da fóvea central responsáveis pela detecção do espectro infravermelho.", "Complexo B (tiamina); músculos ciliares que dilatam mecanicamente o diâmetro da córnea.", "Vitamina D; células ganglionares do quiasma óptico mediadoras da dor ocular.", "Vitamina A (retinol); bastonetes da retina responsáveis pela visão em condições de baixa luminosidade.", "Ferro iônico; cristalino ocular provocando opacificação congênita precoce."], 3, "A vitamina A (retinol) é essencial para a síntese do retinal, cromóforo que se acopla à opsina para formar a rodopsina nos bastonetes da retina. Em condições de hipovitaminose A, a regeneração da rodopsina é prejudicada, resultando em cegueira noturna (hemeralopia) e queratinização epitelial (xeroftalmia). Alternativa correta: D. Distratores: A cita vitamina C e cones; C, D e E associam vitaminas e minerais a patologias e tecidos oculares de forma incorreta."], "Fitormônios e tropismos vegetais": ["Os fitormônios regulam o desenvolvimento, crescimento e respostas ambientais dos vegetais. As auxinas (como o ácido indolacético - AIA), sintetizadas na gema apical, estimulam o alongamento celular, promovem a dominância apical (inibindo o crescimento de gemas laterais) e medeiam os tropismos: no fototropismo positivo do caule, a auxina migra para o lado sombreado da planta, estimulando maior elongação daquele lado e curvando o caule em direção à luz. As giberelinas promovem a quebra da dormência de sementes e o crescimento de entrenós. As citocininas estimulam divisões celulares (mitose) e retardam a senescência foliar. O ácido abscísico (ABA) atua como hormônio de estresse, fechando os estômatos sob seca e mantendo a dormência. O etileno é um fitormônio gasoso que induz o amadurecimento dos frutos e a abscisão (queda) de folhas e flores.", ["Auxina (AIA): dominância apical, alongamento celular, fototropismo e geotropismo", "Etileno (gasoso): acelera o amadurecimento de frutos e a queda de folhas (abscisão)", "Ácido Abscísico (ABA): estresse hídrico (fecha estômatos) e mantém dormência de sementes", "Citocininas: induzem divisão celular e retardam o envelhecimento foliar", "Giberelinas: quebra de dormência de sementes e germinação ativa"], "O truque popular de enrolar bananas verdes em folhas de jornal ou colocá-las dentro de sacos de papel para amadurecer mais rápido tem respaldo científico direto: o jornal aprisiona o gás ETILENO liberado pela fruta, aumentando sua concentração local e acelerando o amadurecimento em cadeia.", "<p>Dona Maria comprou no supermercado bananas verdes e maçãs maduras para o consumo semanal da família. Sabendo que precisava das bananas maduras em poucos dias para fazer um bolo, sua filha colocou as bananas verdes e duas maçãs maduras juntas dentro de uma fruteira plástica hermeticamente fechada por 48 horas.</p>", "A prática caseira adotada acelerou eficazmente o amadurecimento das bananas verdes porque as maçãs maduras:", ["liberam no ar o gás etileno, um fitormônio volátil que desencadeia a hidrólise de amido em açúcares simples nos frutos.", "absorvem todo o gás oxigênio do recipiente, induzindo as bananas a realizarem fermentação alcoólica amadurecedora.", "secretam cristais de ácido abscísico que abrem os estômatos da casca das bananas.", "irradiam calor metabólico que desnatura as enzimas clorofiladas do fruto verde.", "produzem giberelinas líquidas que induzem a germinação das sementes da banana."], 0, "O etileno é o fitormônio gasoso responsável pelo amadurecimento de frutos climatéricos (como banana e maçã). Frutos maduros liberam quantidades elevadas de etileno na atmosfera. Ao aprisionar as maçãs com as bananas em recipiente fechado, a concentração do gás se acumula ao redor dos tecidos, estimulando a degradação da clorofila (casca fica amarela), a quebra de amido em glicídios doces pela amilase e o amolecimento da polpa pelas pectinases. Alternativa correta: A. Distratores: B erra pois o amadurecimento consome O₂ e não requer anaerobiose; C erra pois ABA promove estresse e dormência; D e E citam mecanismos incorretos."], "Fluxo de energia e produtividade": ["O fluxo de energia em um ecossistema é unidirecional e decrescente ao longo dos níveis tróficos. Pela regra dos 10% (eficiência ecológica de Lindeman), apenas cerca de 10% da energia química potencial disponível em um nível trófico é incorporada como biomassa no nível seguinte; os 90% restantes são dissipados em calor metabólico, excretas e processos vitais como respiração. A Produtividade Primária Bruta (PPB) representa o total de matéria orgânica fixada pelos autótrofos, enquanto a Produtividade Primária Líquida (PPL) corresponde à energia restante após o desconto da respiração celular dos vegetais (PPL = PPB − R).", ["Regra dos 10%: ~10% de transferência energética entre elos", "PPL = PPB − R (Líquida = Bruta − Respiração)", "Fluxo unidirecional e aberto (requer aporte solar contínuo)", "Cadeias alimentares curtas são mais eficientes energeticamente"], "Quanto mais curta for a cadeia alimentar que abastece a espécie humana (por exemplo, grãos diretamente para humanos vs grãos para gado e depois carne para humanos), menor é a perda energética acumulada. Essa é uma clássica questão socioambiental do ENEM.", "<p>Em um estudo ecológico sobre pastagens cultivadas, constatou-se que a vegetação de gramíneas disponibilizou 50.000 kJ/m²/ano de energia acumulada aos herbívoros. Considere uma taxa média de transferência energética entre níveis tróficos subsequentes de exatamente 10%.</p>", "Qual quantidade aproximada de energia estará disponível para os carnívoros terciários que se alimentam nessa cadeia trófica?", ["5.000 kJ/m²/ano", "500 kJ/m²/ano", "50 kJ/m²/ano", "5 kJ/m²/ano", "0,5 kJ/m²/ano"], 2, "Cálculo passo a passo: Produtores oferecem 50.000 kJ ao nível seguinte. Consumidores primários (herbívoros) assimilam 10% de 50.000 = 5.000 kJ. Consumidores secundários (carnívoros primários) assimilam 10% de 5.000 = 500 kJ. Consumidores terciários assimilam 10% de 500 = 50 kJ/m²/ano. Logo, o valor disponível para os carnívoros terciários é 50 kJ/m²/ano (Alternativa C). Distratores: A é o nível dos herbívoros; B é o nível dos carnívoros secundários; D e E resultam de divisões adicionais equivocadas."], "Fosforilação oxidativa e quimiosmose mitocondrial": ["A fosforilação oxidativa é a etapa final e mais eficiente da respiração celular aeróbia eucariótica, responsável pela produção da imensa maioria das moléculas de ATP consumidas pelo metabolismo celular. Ela ocorre na membrana mitocondrial interna (cristas mitocondriais) e baseia-se na hipótese quimiosmótica proposta por Peter Mitchell. Conforme os carreadores de elétrons reduzidos nas etapas anteriores (NADH e FADH2) descarregam seus elétrons de alta energia na cadeia respiratória formada pelos complexos proteicos I a IV, a energia liberada pelo fluxo exergônico de elétrons é aproveitada para bombear ativamente íons H+ (prótons) da matriz mitocondrial para o espaço intermembranas. Isso cria um gradiente eletroquímico de prótons acentuado. Ao retornarem espontaneamente para a matriz mitocondrial através do canal rotor da enzima ATP sintase, o fluxo força a fosforilação rotatória de ADP + Pi em ATP, com o oxigênio (O2) atuando como aceptor final de elétrons e prótons, formando água metabólica.", ["Cadeia de transporte de elétrons: elétrons de NADH e FADH2 fluem pelos complexos I, II, III e IV", "Gradiente de prótons: bombeamento de H+ para o espaço intermembranas gera força próton-motriz", "ATP sintase: turbina molecular que sintetiza ATP conforme prótons retornam à matriz mitocondrial", "Aceptor final: o gás oxigênio (O2) recebe os elétrons terminais e íons H+, formando H2O", "Desacopladores (ex: termogenina na gordura marrom): dissipam o gradiente de prótons na forma de calor térmico"], "Se o oxigênio faltar (asfixia) ou a cadeia for bloqueada por cianeto: os elétrons acumulam-se nos complexos, o bombeamento de prótons cessa, a ATP sintase para e a célula morre por falência energética instantânea!", "<p>O cianeto de potássio é um veneno letal de ação ultrarrápida que se liga de forma irreversível ao átomo de ferro da enzima citocromo c oxidase (complexo IV da cadeia respiratória mitocondrial), impedindo a transferência de elétrons para o gás oxigênio molecular.</p>", "A toxicidade aguda do cianeto e o óbito celular quase instantâneo decorrem diretamente da:", ["interrupção imediata da glicólise anaeróbia no citosol por esgotamento de glicose livre.", "digestão enzimática da membrana nuclear por liberação desordenada de hidrolases ácidas.", "cessação do transporte de elétrons, do gradiente de prótons e da síntese de ATP pela ATP sintase.", "hiperativação da fermentação alcoólica com toxicidade crônica por etanol no tecido nervoso.", "oxidação espontânea do oxigênio gasoso em gás carbônico no espaço intermembranas."], 2, "Ao inibir o complexo IV da cadeia transportadora de elétrons, o cianeto interrompe o fluxo de elétrons, paralisando a extrusão de prótons (H+) para o espaço intermembranas. Sem o gradiente quimiosmótico de prótons, cessa a rotação da ATP sintase e a produção de ATP aeróbio despenca para zero, matando os neurônios e o miocárdio em minutos por falência bioenergética. Alternativa correta: C. Distratores: A, C, D e E apresentam mecanismos bioquimicamente incorretos."], "Fotoperiodismo e fitocromos no desenvolvimento vegetal": ["O fotoperiodismo é a capacidade das plantas de sincronizarem eventos do seu desenvolvimento (especialmente o florescimento e a dormência de gemas) com a duração relativa dos períodos diários de luz (fotoperíodo) e de escuridão contínua ao longo das estações do ano. Essa percepção luminosa é realizada pelo pigmento fotorreceptor fitocromo, que existe em duas formas interconversíveis: o fitocromo inativo (Fv ou Pr, que absorve luz vermelha curta de 660 nm e converte-se na forma ativa) e o fitocromo ativo (Fve ou Pfr, que absorve luz vermelho-distante de 730 nm e atua como interruptor biológico nuclear). As plantas classificam-se segundo a resposta floral em: Plantas de Dia Curto (PDC), que florescem apenas quando o período contínuo de escuridão supera o período crítico (na verdade, são plantas de noite longa, como o crisântemo e morango, que florescem no outono/inverno); Plantas de Dia Longo (PDL), que florescem quando a noite é mais curta que o período crítico (florescem na primavera/verão, como espinafre e alface); e Plantas Indiferentes/Neutras (como o tomateiro).", ["Fitocromo: pigmento proteico fotorreceptor que alterna entre Fv (inativo) e Fve (ativo)", "O fator decisivo para a floração é a DURAÇÃO DA NOITE ESCURA CONTÍNUA (não do dia!)", "Plantas de Dia Curto (PDC): exigem noite longa ininterrupta para florescer (outono/inverno)", "Interrupção da noite: um breve flash de luz vermelha no meio da noite impede a floração de uma PDC!", "Plantas de Dia Longo (PDL): florescem com noites curtas (primavera/verão)"], "Pegadinha de ouro de botânica: o nome 'Planta de Dia Curto' engana! O que a planta realmente mede é o PERÍODO DE ESCURIDÃO CONTÍNUA (a noite). Se você acender a luz por 5 minutos no meio de uma noite de 12 horas, a planta 'acha' que a noite foi partida em duas e NÃO floresce!", "<p>Um floricultor comercial cultiva crisântemos (plantas de dia curto que florescem no outono quando as noites são longas). Para atender à demanda do Dia das Mães em maio e atrasar a floração para que os botões se abram exatamente na data comercial festiva, o produtor instalou lâmpadas incandescentes automáticas nas estufas programadas para emitir flashes de luz no meio de cada noite escura.</p>", "O procedimento de iluminar brevemente a estufa durante a madrugada impede a floração prematura dos crisântemos porque:", ["interrompe o período crítico contínuo de escuridão noturna necessário para a ação do fitocromo na floração de PDC.", "destrói as paredes celulares das folhas por aquecimento térmico mitocondrial.", "induz as raízes da planta a realizarem fermentação alcoólica com
