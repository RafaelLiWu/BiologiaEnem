perda maciça de água.", "bloqueia a transpiração do xilema e estimula a perda das gemas apicais por ecdise foliar.", "converte o gás carbônico do estroma em cristais tóxicos de oxalato de cálcio."], 0, "As plantas de dia curto (PDC) são fisiologicamente plantas de 'noite longa': elas exigem um período contínuo e ininterrupto de escuridão de duração superior a um valor crítico para permitirem o florescimento. Quando um flash de luz é emitido no meio da madrugada, o fitocromo Fv inativo absorve luz vermelha e converte-se instantaneamente na forma Fve ativa, reiniciando a contagem temporal e quebrando a noite em dois períodos curtos insuficientes, bloqueando o estímulo hormonal do florescimento (florígeno). Alternativa correta: A. Distratores: B, C, D e E formulam proposições absurdas."], "Fotossíntese C3, C4 e CAM e estresse hídrico": ["As plantas desenvolveram três vias fotossintéticas distintas — C3, C4 e CAM — com adaptações fisiológicas e anatômicas evolutivas cruciais para otimizar o ganho de carbono e minimizar a perda de água por transpiração sob estresse hídrico e altas temperaturas. Nas plantas C3 (como trigo e soja), o CO2 é fixado diretamente pela enzima Rubisco no mesofilo foliar; sob clima quente e seco, o fechamento estomático reduz o CO2 interno, levando a Rubisco a fixar O2 em vez de CO2 no processo fotorrespiratório energeticamente ineficiente. As plantas C4 (como milho e cana-de-açúcar) possuem separação espacial: a enzima PEP carboxilase (que não tem afinidade por O2) fixa inicialmente o CO2 no mesofilo em ácido com 4 carbonos, que é transportado para a bainha perivascular selada (anatomia de Kranz), onde o CO2 é concentrado ao redor da Rubisco, suprimindo a fotorrespiração. As plantas CAM (como cactos e abacaxi na Caatinga) realizam separação temporal: abrem os estômatos exclusivamente à noite para absorver CO2 e estocá-lo em malato vacuolar, mantendo os estômatos hermeticamente fechados durante o dia para economizar água.", ["Plantas C3: fixação direta pela Rubisco no ciclo de Calvin; vulneráveis à fotorrespiração no calor", "Plantas C4: separação espacial da fixação; anatomia de Kranz concentra CO2 na bainha e elimina fotorrespiração", "Plantas CAM: separação temporal; estômatos abrem à noite (armazena ácido málico) e fecham de dia (economia hídrica)", "PEP carboxilase: enzima presente em C4 e CAM com afinidade exclusiva por CO2, sem ligação com O2", "Adaptação a biomas áridos: cactáceas da Caatinga usam metabolismo CAM para sobreviver a secas extremas"], "No ENEM, planta que abre estômato À NOITE e fecha DE DIA é sempre CAM (Metabolismo Ácido das Crassuláceas)! É a adaptação definitiva para resistir ao calor causticante da Caatinga ou deserto.", "<p>Em uma expedição botânica pelo semiárido nordestino (Caatinga), pesquisadores monitoraram a condutância estomática e as variações de acidez foliar em cactos mandacaru ao longo de um ciclo de 24 horas. Constatou-se que as folhas modificadas e o caule verde apresentavam estômatos abertos e acúmulo de ácido málico vacuolar durante a madrugada, enquanto durante o dia ensolarado os estômatos permaneciam vedados e o pH citoplasmático se elevava.</p>", "A principal vantagem adaptativa dessa estratégia fisiológica temporal para as plantas da Caatinga é:", ["eliminar a necessidade de luz solar para a ocorrência das reações da fase fotoquímica clara.", "ampliar a absorção de oxigênio gasoso durante o período noturno para sintetizar celulose.", "estimular a fotorrespiração acelerada para enriquecer o solo com nitritos e aminas orgânicas.", "minimizar a perda de água por transpiração enquanto se mantém a assimilação de carbono atmosférico.", "reduzir a temperatura das raízes tuberosas através do fechamento estomático periférico."], 3, "As plantas CAM abrem seus estômatos durante a noite — quando a umidade do ar é maior e as temperaturas são mais amenas —, minimizando drasticamente a perda de vapor de água por transpiração. O CO2 captado à noite é fixado na forma de ácido málico nos vacúolos e, durante o dia com luz solar abundante e estômatos fechados, o ácido é descarboxilado, liberando CO2 para a Rubisco realizar o ciclo de Calvin sem perda hídrica. Alternativa correta: D. Distratores: A, B, C e E formulam proposições biologicamente incoerentes."], "Fotossíntese e quimiossíntese": ["A fotossíntese oxigênica realizada por plantas, algas e cianobactérias converte energia luminosa em energia química, fixando CO₂ em carboidratos e liberando oxigênio. Ocorre nos cloroplastos em duas fases interdependentes: a etapa fotoquímica (fase clara), nos tilacoides, onde a clorofila absorve fótons, ocorre a fotólise da água (quebrando H₂O e liberando O₂ para a atmosfera) e são produzidos ATP e NADPH. A etapa química (ciclo de Calvin / fase escura), no estroma, utiliza o ATP e o NADPH da fase clara para fixar o CO₂ atmosférico catalisado pela enzima Rubisco, sintetizando glicídios. A quimiossíntese é realizada por bactérias autotróficas que oxidam substâncias minerais (como enxofre ou ferro) para obter energia na síntese orgânica.", ["Fase clara (tilacoides): quebra da H₂O (fotólise) → libera O₂ gasoso!", "Fase escura/Ciclo de Calvin (estroma): consome ATP, NADPH e CO₂ → glicose", "Origem do O₂ liberado: vem EXCLUSIVAMENTE da água (H₂O), não do CO₂!", "Rubisco: enzima chave na fixação de CO₂ vegetal", "Ponto de compensação fótico: fotossíntese iguala a respiração celular (P = R)"], "O oxigênio (O₂) liberado na fotossíntese NÃO vem do CO₂! Ele é liberado durante a quebra (fotólise) da ÁGUA (H₂O) nos tilacoides na etapa fotoquímica. O carbono do CO₂ vai exclusivamente para a formação da glicose.", "<p>Em um experimento clássico de biologia vegetal, plantas de feijão foram cultivadas em câmara de vidro fechada sob iluminação constante. No Grupo 1, as plantas receberam água enriquecida com o isótopo pesado de oxigênio (H₂¹⁸O) e gás carbônico comum (C¹⁶O₂). No Grupo 2, receberam água comum (H₂¹⁶O) e gás carbônico contendo oxigênio marcado (C¹⁸O₂).</p>", "A análise espectrométrica do gás oxigênio (O₂) liberado na atmosfera das câmaras revelou que o isótopo ¹⁸O foi detectado:", ["exclusivamente no gás O₂ liberado pelas plantas do Grupo 2.", "exclusivamente no gás O₂ liberado pelas plantas do Grupo 1.", "em igual proporção no gás O₂ de ambos os grupos experimentais.", "apenas na urina transpirada pelos estômatos do Grupo 2.", "em nenhuma das amostras gasosas de ambos os grupos."], 1, "O gás oxigênio (O₂) liberado pelas plantas durante a fotossíntese provém integralmente da quebra fotocatalítica (fotólise) da molécula de água (H₂O) no fotossistema II da fase clara dos tilacoides: 2 H₂O → 4 H⁺ + 4 e⁻ + O₂. Portanto, somente as plantas do Grupo 1, que receberam água marcada com ¹⁸O, liberaram gás oxigênio com o isótopo ¹⁸O. O oxigênio presente no CO₂ (Grupo 2) é incorporado aos carboidratos (glicose) e água metabólica. Alternativa correta: B. Distratores: B inverte a origem bioquímica dos átomos; C ignora a especificidade da reação; D e E formulam absurdos fisiológicos."], "Frutos verdadeiros, pseudofrutos e dispersão zoocórica": ["O fruto é o órgão vegetal exclusivo das angiospermas resultante do desenvolvimento e espessamento das paredes do ovário da flor após a fecundação da oosfera e dos núcleos polares, atuando primordialmente na proteção mecânica das sementes e na promoção de sua dispersão biológica. Nos chamados frutos verdadeiros (como tomate, manga e abacate), a porção carnosa comestível origina-se estritamente das camadas do ovário (epicarpo, mesocarpo e endocarpo). Em contrapartida, quando a polpa suculenta e comestível origina-se de outras estruturas florais adjacentes, a estrutura é classificada como pseudofruto: no caju, o fruto verdadeiro seco é a castanha, enquanto a haste carnosa é o pedúnculo floral hipertrofiado; na maçã e pera, a polpa carnosa provém do receptáculo floral. A atratividade visual e aromática dos frutos carnosos com polpa açucarada coevoluiu com animais vertebrados frugívoros na dispersão zoocórica, na qual as sementes resistem aos sucos digestivos e são defecadas a longas distâncias adubadas.", ["Fruto verdadeiro: desenvolve-se exclusivamente a partir das paredes do ovário fecundado (ex: tomate, laranja)", "Pseudofrutos: a parte carnosa deriva do receptáculo floral (maçã, morango) ou do pedúnculo (caju)", "Partenocarpia: desenvolvimento do fruto sem prévia fecundação, resultando em frutos sem sementes (ex: banana comercial)", "Dispersão Zoocórica: animais consomem a polpa e dispersam as sementes viáveis nas fezes longe da planta-mãe", "Dispersão Anemocórica (vento) e Hidrocórica (água): sementes aladas (dente-de-leão) ou fibrosas flutuantes (coco)"], "Armadilha clássica do ENEM: O caju NÃO é um fruto carnoso! O caju que comemos é um PSEUDOFRUTO (pedúnculo floral hipertrofiado). O verdadeiro fruto biológico é a CASTANHA cinzenta dura presa na ponta!", "<p>Durante uma aula de botânica econômica sobre a produção de frutas no Nordeste brasileiro, o professor explicou que, ao degustarmos um caju fresco, a polpa amarelada e suculenta rica em vitamina C que consumimos não se desenvolveu a partir do ovário da flor, enquanto na goiaba a polpa macia que envolve as sementes deriva diretamente da parede ovariana fecundada.</p>", "De acordo com a morfologia vegetal clássica, o caju e a goiaba são classificados, respectivamente, como:", ["infrutescência múltipla e fruto partenocárpico artificial.", "fruto seco deiscente e pseudofruto originado do cálice gamossépalo.", "raiz tuberosa de reserva e caule do tipo rizóforo subterrâneo.", "baga apocárpica sem sementes e legume monocarpelar seco indeiscente.", "pseudofruto derivado do pedúnculo floral e fruto verdadeiro carnoso derivado do ovário."], 4, "No caju, a estrutura carnosa e sumarenta que é consumida comercialmente é um pseudofruto resultante da hipertrofia e acúmulo de açúcares no pedúnculo floral da flor; o fruto verdadeiro em sentido botânico restrito é a castanha (fruto seco do tipo aquênio que abriga a semente). A goiaba, por sua vez, é um fruto verdadeiro do tipo baga originado integralmente do desenvolvimento das paredes do ovário da flor. Alternativa correta: E. Distratores: A, C, D e E trazem classificações organográficas errôneas."], "Fungos e micoses na saúde humana e na biotecnologia": ["Os fungos constituem o reino Fungi, compreendendo organismos eucariontes aclorofilados (sempre heterótrofos por absorção extracelular), unicelulares (como as leveduras <i>Saccharomyces cerevisiae</i>) ou pluricelulares filamentosos formados por hifas que compõem o micélio. Possuem parede celular constituída pelo polissacarídeo estrutural quitina (o mesmo presente no exoesqueleto de artrópodes) e armazenam glicogênio como carboidrato de reserva energética, comprovando maior proximidade filogenética com os animais do que com as plantas. Apresentam enorme importância ecológica como decompositores saprófagos da matéria orgânica junto com as bactérias. Na biotecnologia, leveduras realizam a fermentação alcoólica para panificação, produção de etanol e bebidas, e fungos filamentosos produzem antibióticos (como a penicilina sintetizada por <i>Penicillium</i>). Podem atuar como patógenos humanos provocando micoses superficiais (frieira, tinha) ou sistêmicas oportunistas (candidíase e aspergilose em imunodeprimidos).", ["Eucariontes heterótrofos por absorção: parede de quitina e reserva de glicogênio (semelhança animal)", "Decompositores vitais: reciclam matéria orgânica morta na biosfera", "Biotecnologia: levedura (fermentação do pão e cerveja) e <i>Penicillium</i> (penicilina)", "Micoses oportunistas: afetam indivíduos com imunidade deprimida (HIV, quimioterapia)", "Líquens: mutualismo entre fungo (micobionte) e alga/cianobactéria (fotobionte)"], "Fungo NÃO é vegetal e NÃO faz fotossíntese! Fisiologicamente, o fungo é mais parente dos animais: tem parede celular de quitina (como casca de camarão) e guarda energia na forma de glicogênio (como o fígado humano), nunca amido.", "<p>Em 1928, o médico escocês Alexander Fleming observou que colônias de bactérias estafilococos não cresciam ao redor de uma mancha de bolor verde (fungo <i>Penicillium notatum</i>) que havia contaminado acidentalmente suas placas de Petri no laboratório, descobrindo o primeiro antibiótico natural da história.</p>", "A relação ecológica estabelecida entre o fungo <i>Penicillium</i> e as bactérias na placa de cultivo e o benefício trazido por essa descoberta para a medicina humana foram, respectivamente:", ["mutualismo obrigatório; desenvolvimento de vacinas orais contra a malária.", "competição interespecífica simétrica; eliminação das micoses cutâneas superficiais.", "predação carnívora; síntese artificial de insulina por clonagem nuclear somática.", "inquilinismo comensal; erradicação de viroses respiratórias sazonais.", "amensalismo (antibiose); obtenção da penicilina para o combate eficaz a infecções bacterianas."], 4, "A relação em que uma espécie secreta substâncias metabólicas que inibem ou impedem o crescimento e a reprodução de outra espécie sem obter benefício direto imediato da morte daquela é denominada amensalismo ou antibiose. A substância secretada pelo bolor era a penicilina, primeiro antibiótico natural utilizado em escala industrial para salvar milhões de vidas contra infecções bacterianas causadoras de pneumonia, meningite e sífilis. Alternativa correta: E. Distratores: A cita mutualismo e vacina; C cita predação e insulina; D confunde bactéria com vírus; E confunde ação antibacteriana com antimicótica."], "Gametogênese e ciclo menstrual feminino": ["A reprodução sexuada humana envolve a produção de gametas haploides pela gametogênese. Na espermatogênese masculina, uma espermatogônia 2n origina continuamente quatro espermatozoides n móveis a partir da puberdade. Na ovogênese feminina, o processo inicia-se ainda na vida intrauterina: as ovogônias multiplicam-se e entram na meiose I, estacionando em prófase I como ovócitos primários até a menarca. A cada ciclo ovariano (cerca de 28 dias), um ovócito completa a meiose I sob estímulo do FSH e LH, estacionando em metáfase II como ovócito secundário (que só conclui a meiose II se houver fecundação). O pico pré-ovulatório do hormônio luteinizante (LH) por volta do 14º dia desencadeia a ovulação. O corpo lúteo remanescente no ovário secreta progesterona e estrogênio para espessar e vascularizar o endométrio uterino para nidação; sem fecundação, o corpo lúteo regride, os hormônios despencam e ocorre a menstruação.", ["Espermatogênese: contínua na vida adulta (1 espermatócito I → 4 espermatozoides)", "Ovogênese: inicia na vida fetal; gera 1 ovócito secundário viável e corpúsculos polares", "Pico de LH (14º dia): estimula diretamente a OVULAÇÃO", "Progesterona (corpo lúteo): mantém o endométrio secretor preparado para a gravidez", "Menstruação: descamação do endométrio decorrente da queda de progesterona e estrógeno"], "O que a mulher libera na ovulação NÃO é um 'óvulo' maduro pronto: é um OVÓCITO SECUNDÁRIO (ou ovócito II), travado na metáfase da meiose II! Ele só completa a segunda divisão meiótica se for penetrado por um espermatozoide na tuba uterina.", "<p>As pílulas anticoncepcionais orais combinadas contêm doses sintéticas de estrogênio e progesterona administradas diariamente ao longo de três semanas do ciclo. Essas concentrações hormonais exógenas atuam sobre a adenoipófise por retroalimentação negativa (feedback negativo), impedindo a liberação das gonadotrofinas hipofisárias FSH e LH.</p>", "O mecanismo fisiológico primário pelo qual a pílula combinada impede a gravidez é o bloqueio da:", ["produção de líquido amniótico pelo sinciciotrofoblasto placentário.", "contração peristáltica do miocárdio durante o parto normal.", "ovulação, em virtude da ausência do pico secretório de LH no meio do ciclo.", "clivagem inicial dos espermatócitos primários nos testículos masculinos.", "fagocitose dos espermatozoides pelos neutrófilos da mucosa vaginal."], 2, "Os hormônios esteroides da pílula (estrógeno e progesterona sintéticos) exercem feedback negativo constante sobre o hipotálamo e a hipófise anterior (adenoipófise), inibindo a secreção de FSH e suprimindo o pico agudo de hormônio luteinizante (LH). Sem o pico de LH no meio do ciclo menstrual (por volta do 14º dia), o folículo ovariano não se rompe e a ovulação não ocorre, tornando a concepção impossível. Alternativa correta: C. Distratores: A cita anexos embrionários da gestação; C confunde útero com coração; D refere-se ao aparelho reprodutor masculino; E inventa um mecanismo imunológico inexistente."], "Genética de populações e Hardy-Weinberg": ["O Princípio do Equilíbrio de Hardy-Weinberg demonstra matematicamente que as frequências alélicas e genotípicas de uma população mendeliana tendem a permanecer constantes ao longo das gerações, desde que a população seja ideal: infinitamente grande (panmítica, com acasalamentos ao acaso), sem mutações, sem migrações e sem ação de seleção natural. Para um gene dialélico com alelos A (frequência p) e a (frequência q), tem-se que p + q = 1. A distribuição dos genótipos na população em equilíbrio é expressa pelo binômio p² + 2pq + q² = 1, onde p² é a frequência de homozigotos dominantes (AA), 2pq é a frequência de heterozigotos (Aa) e q² é a frequência de homozigotos recessivos (aa). Fatores evolutivos quebram o equilíbrio.", ["Equação alélica: p + q = 1 (onde p = freq(A) e q = freq(a))", "Equação genotípica: p² + 2pq + q² = 1 (AA + Aa + aa = 1)", "q² = frequência de indivíduos com fenótipo recessivo (aa)", "População panmítica ideal: muito grande, cruzamentos ao acaso, sem fatores evolutivos", "Fatores que quebram o equilíbrio: seleção natural, mutação, migração, deriva genética"], "Para resolver contas de Hardy-Weinberg: SEMPRE comece pelos indivíduos recessivos (aa)! A porcentagem ou fração de indivíduos com fenótipo recessivo é q². Extraia a raiz quadrada para achar q, depois calcule p = 1 − q, e por fim calcule os heterozigotos com 2pq.", "<p>Em uma população humana isolada em equilíbrio de Hardy-Weinberg, a frequência de indivíduos afetados por uma anomalia autossômica recessiva (genótipo aa) é de 4% (0,04).</p>", "Com base nessas informações genéticas, a porcentagem esperada de indivíduos heterozigotos portadores (Aa) nessa população é de:", ["32%", "16%", "48%", "64%", "96%"], 0, "Cálculo matemático passo a passo auditado: 1) Frequência do genótipo recessivo: q² = 0,04. 2) Frequência do alelo recessivo a: q = √0,04 = 0,2. 3) Frequência do alelo dominante A: p = 1 − q = 1 − 0,2 = 0,8. 4) Frequência esperada de heterozigotos (Aa): 2pq = 2 × 0,8 × 0,2 = 0,32 = 32%. (E os homozigotos dominantes AA são p² = 0,8² = 0,64 = 64%). Total: 64% + 32% + 4% = 100%. Alternativa correta: A. Distratores: A usa pq sem dobrar (0,8 × 0,2 = 0,16); C erra a multiplicação; D é a porcentagem dos homozigotos dominantes AA (64%); E é a soma de todos os indivíduos com fenótipo normal (AA + Aa = 64 + 32 = 96%)."], "Glândulas suprarrenais e resposta hormonal ao estresse": ["As glândulas suprarrenais (ou adrenais) situam-se sobre os polos superiores dos rins e são morfofisiologicamente divididas em duas regiões anatômicas com origens embrionárias e funções endócrinas distintas: o córtex suprarrenal externo (de origem mesodérmica) e a medula suprarrenal interna (de origem ectodérmica neural). A medula suprarrenal atua como uma extensão do sistema nervoso autônomo simpático, secretando as catecolaminas adrenalina (epinefrina) e noradrenalina em resposta a estímulos de estresse agudo de 'luta ou fuga'. Esses hormônios aceleram os batimentos cardíacos, promovem broncodilatação para aumentar a hematose, dilatam as pupilas e estimulam a glicogenólise hepática instantânea. O córtex suprarrenal, sob estímulo do hormônio adrenocorticotrófico (ACTH) hipofisário, secreta os glicocorticoides (principalmente o cortisol) e mineralocorticoides (aldosterona). O cortisol medeia o estresse crônico, estimulando a gliconeogênese, a lipólise e exercendo potente efeito anti-inflamatório e imunossupressor sistêmico.", ["Medula adrenal (estresse agudo): adrenalina e noradrenalina (taquicardia, broncodilatação e glicogenólise rápida)", "Córtex adrenal (estresse crônico): cortisol (gliconeogênese a partir de proteínas e gorduras, imunossupressão)", "Aldosterona: mineralocorticoide cortical que reabsorve Na+ e água no túbulo distal renal, elevando a pressão", "Origem embrionária dupla: córtex mesodérmico (hormônios esteroides lipossolúveis); medula ectodérmica (aminas hidrossolúveis)", "Imunossupressão por cortisol alto: estresse psicológico prolongado reduz linfócitos e facilita infecções oportunistas"], "No ENEM, divida na mente: Medula = ADRENALINA (estresse de 30 segundos ao ver um leão: coração dispara, pupilas dilatam). Córtex = CORTISOL (estresse de 6 meses pré-vestibular: glicose no sangue sobe, imunidade cai e engorda).", "<p>Em uma situação de perigo iminente — como o encontro súbito com uma serpente venenosa em uma trilha ecológica —, o organismo humano reage em frações de segundo: os batimentos cardíacos disparam, a frequência respiratória aumenta, as pupilas dilatam-se e o fígado quebra glicogênio, lançando glicose em profusão no sangue para municiar os músculos.</p>", "Essa resposta neuroendócrina coordenada de emergência imediata é deflagrada pela secreção de:", ["paratormônio sintetizado pelas paratireoides em resposta à hipercalcemia tecidual periférica.", "calcitonina secretada pelas células parafoliculares da tireoide para reduzir o lactato sanguíneo.", "adrenalina liberada pela medula suprarrenal sob estímulo do sistema nervoso simpático.", "glucagon produzido pelas células beta do pâncreas endócrino nos ilhéus de Langerhans.", "melatonina exocitada pela glândula pineal para reduzir a sensibilidade do miocárdio aos estímulos."], 2, "Diante de um estresse súbito de emergência, o hipotálamo ativa fibras nervosas pré-ganglionares do sistema nervoso autônomo simpático que inervam diretamente a medula das glândulas suprarrenais. A medula libera adrenalina e noradrenalina na corrente sanguínea, que se ligam a receptores adrenérgicos no coração, vasos, brônquios e hepatócitos, deflagrando a reação de luta ou fuga. Alternativa correta: C. Distratores: A, C e E regulam minerais ou sono; D cita glucagon vindo das células beta (são as alfa)."], "Grandes grupos vegetais (briófitas a angiospermas)": ["As plantas terrestres (embriófitas) dividem-se evolutivamente em quatro grandes grupos monofiléticos sucessivos. As Briófitas (musgos) são avasculares, de pequeno porte, dependentes de água para a fecundação (gametas flagelados) e com fase gametofítica (haploide, n) duradoura e esporófito (2n) efêmero dependente. As Pteridófitas (samambaias) são traqueófitas (vasculares, com xilema e floema), possuindo esporófito (2n) dominante e independente, mas ainda dependentes de água líquida para os anterozoides nadarem até a oosfera. As Gimnospermas (pinheiros, araucárias) conquistaram a independência da água para a fecundação com o surgimento do grão de pólen (tubo polínico por anemofilia) e sementes nuas (sem fruto). As Angiospermas representam o clímax da diversidade vegetal, inovando com flores atrativas para polinização biótica e frutos que protegem e dispersam as sementes após dupla fecundação.", ["Briófitas: avasculares, gametófito (n) dominante, dependem de água para fecundação", "Pteridófitas: primeiras vasculares (xilema/floema), esporófito (2n) dominante", "Gimnospermas: primeiras espermatófitas (sementes nuas) e tubo polínico (sifonogamia)", "Angiospermas: flores verdadeiras, frutos carnosos/secos e dupla fecundação (endosperma 3n)"], "Memorize a linha evolutiva vegetal: Briófita (sem vasos) → Pteridófita (ganha vasos condutores) → Gimnosperma (ganha pólen e semente) → Angiosperma (ganha flor e fruto!). Fruto é EXCLUSIVIDADE de angiospermas (o pinhão da araucária é semente nua, não é fruto!).", "<p>Considere o cladograma evolutivo simplificado dos grandes grupos vegetais terrestres:</p><div style='text-align:center;margin:12px 0'><svg viewBox='0 0 340 120' style='width:100%;max-width:340px;height:auto;background:var(--hi);border-radius:12px;padding:8px'><line x1='30' y1='100' x2='310' y2='100' stroke='var(--tx)' stroke-width='3'/><line x1='70' y1='100' x2='70' y2='25' stroke='var(--tx)' stroke-width='2'/><line x1='140' y1='100' x2='140' y2='25' stroke='var(--tx)' stroke-width='2'/><line x1='210' y1='100' x2='210' y2='25' stroke='var(--tx)' stroke-width='2'/><line x1='280' y1='100' x2='280' y2='25' stroke='var(--tx)' stroke-width='2'/><text x='70' y='20' text-anchor='middle' font-size='10' font-weight='700' fill='var(--tx)'>Briófitas</text><text x='140' y='20' text-anchor='middle' font-size='10' font-weight='700' fill='var(--tx)'>Pteridófitas</text><text x='210' y='20' text-anchor='middle' font-size='10' font-weight='700' fill='var(--tx)'>Gimnospermas</text><text x='280' y='20' text-anchor='middle' font-size='10' font-weight='700' fill='var(--ac)'>Angiospermas</text><circle cx='105' cy='100' r='4' fill='var(--ok)'/><text x='105' y='115' text-anchor='middle' font-size='8' fill='var(--mu)'>Vasos</text><circle cx='175' cy='100' r='4' fill='var(--ok)'/><text x='175' y='115' text-anchor='middle' font-size='8' fill='var(--mu)'>Sementes</text><circle cx='245' cy='100' r='4' fill='var(--ok)'/><text x='245' y='115' text-anchor='middle' font-size='8' fill='var(--mu)'>Flores/Frutos</text></svg><br><small style='color:var(--mu)'>Cladograma esquemático das sinapomorfias vegetais na conquista do ambiente terrestre</small></div><p>A araucária (<i>Araucaria angustifolia</i>), árvore símbolo do bioma Mata dos Pinhais no sul do Brasil, produz anualmente grandes quantidades de pinhões que servem de alimento para a fauna nativa e populações humanas.</p>", "No contexto da evolução vegetal, o pinhão corresponde anatomicamente a uma:", ["semente nua desenvolvida a partir de um óvulo fecundado, desprovida de fruto circundante.", "inflorescência hermafrodita rica em pólen de fecundação aquática.", "briófita parasita aclorofilada associada aos vasos floemáticos do caule.", "folha modificada carnosa originada de raízes tuberosas adventícias subterrâneas.", "drupa típica carnosa contendo um endocarpo lenhoso de proteção embrionária."], 0, "A araucária é uma gimnosperma da família Araucariaceae. Como em todas as gimnospermas (espermatófitas sem carpelos fechados/ovário), a fecundação do óvulo presente na estróbilo feminino (pinha) origina sementes desprovidas de ovário desenvolvido (sementes nuas). Portanto, o pinhão é a semente da araucária, e não um fruto carnoso. Frutos são estruturas exclusivas das angiospermas. Alternativa correta: A. Distratores: A cita inflorescência e fecundação dependente de água; C confunde semente com briófita; D confunde semente com folha ou raiz; E classifica erroneamente o pinhão como drupa (fruto de angiosperma)."], "Gêmeos univitelinos versus bivitelinos e poliembrionia": ["A gestação múltipla na espécie humana pode ocorrer por dois mecanismos biológicos completamente distintos que geram os gêmeos monozigóticos (univitelinos ou idênticos) e os gêmeos dizigóticos (bivitelinos ou fraternos). Os gêmeos dizigóticos resultam da ovulação simultânea de dois ovócitos secundários distintos, fecundados independentemente por dois espermatozoides diferentes. Consequentemente, formam-se dois zigotos com patrimônios genéticos singulares: esses gêmeos compartilham cerca de 50% de seus genes (como quaisquer irmãos biológicos de gestações diferentes), podem ter sexos biológicos iguais ou distintos e implantam-se no útero com placentas e sacos amnióticos individuais (dicoriônicos e diamnióticos). Por outro lado, os gêmeos monozigóticos originam-se da fecundação de um único ovócito por um único espermatozoide, gerando um único zigoto que, durante as etapas iniciais de clivagem (blastocisto) ou na formação do nó embrionário, subdivide-se em dois agrupamentos celulares independentes. Eles compartilham 100% do genoma e são obrigatoriamente do mesmo sexo biológico.", ["Gêmeos Monozigóticos (Idênticos): 1 óvulo + 1 espermatozoide → 1 zigoto que se divide (mesmo sexo e genoma)", "Gêmeos Dizigóticos (Fraternos): 2 óvulos + 2 espermatozoides → 2 zigotos distintos (sexos iguais ou diferentes)", "Placenta em monozigóticos: pode ser monocoriônica (uma placenta compartilhada) ou dicoriônica conforme o dia da separação", "Gêmeos xifópagos (siameses): separação tardia e incompleta da massa celular interna do blastocisto após o 13º dia", "Poliembrionia em animais: o tatu-galinha (Dasypus) realiza poliembrionia obrigatória, gerando 4 filhotes geneticamente idênticos"], "Regra de ouro do ENEM: Gêmeos de sexos biológicos diferentes (um menino e uma menina) são SEMPRE E OBRIGATORIAMENTE DIZIGÓTICOS (bivitelinos)! Gêmeos idênticos (monozigóticos) têm obrigatoriamente o mesmo sexo.", "<p>Uma gestante realizou exame de ultrassonografia morfológica no segundo trimestre de gestação, e o médico obstetra confirmou a presença de gravidez gemelar, identificando que um dos fetos apresentava genitália biológica masculina (menino) e o outro genitália biológica feminina (menina).</p>", "Com base nos princípios da embriologia humana, é biologicamente correto afirmar sobre essa gestação que:", ["os embriões se desenvolveram a partir de um único zigoto que sofreu mutação no cromossomo sexual Y.", "os fetos possuem genoma 100% idêntico, compartilhando os mesmos marcadores de DNA nos microssatélites.", "houve fecundação simultânea de um único ovócito secundário por dois espermatozoides diferentes (poliespermia).", "trata-se obrigatoriamente de gêmeos dizigóticos decorrentes da fecundação de dois óvulos distintos.", "a formação dos sexos distintos decorreu da inativação aleatória do cromossomo somático maternal durante a clivagem."], 3, "Gêmeos monozigóticos (univitelinos) provêm de um único zigoto e, portanto, compartilham rigorosamente o mesmo par de cromossomos sexuais (ou ambos são XY ou ambos são XX). A ocorrência de fetos de sexos diferentes atesta de forma inequívoca que a gestação é dizigótica (bivitelina), originada pela maturação e liberação de dois ovócitos secundários distintos fecundados por espermatozoides portadores de cromossomos sexuais diferentes (um X e um Y). Alternativa correta: D. Distratores: A, C, D e E contêm disparates genéticos e embriológicos."], "Helmintos nematódeos e doenças negligenciadas": ["Os nematelmintos (nematódeos) são vermes cilíndricos com corpo afilado nas extremidades, triblásticos, pseudocelomados e dotados de sistema digestório completo (com boca e ânus, inovação evolutiva sobre os platelmintos). São protegidos por uma cutícula proteica resistente e possuem tubo digestório unidirecional. Destacam-se como causadores de graves endemias tropicais negligenciadas ligadas à ausência de saneamento. A ascaridíase (<i>Ascaris lumbricoides</i> ou lombriga) é adquirida pela ingestão de ovos embrionados em água ou verduras mal lavadas; as larvas realizam o ciclo pulmonar de Looss nos alvéolos antes de atingirem o intestino. A ancilostomíase ou necatoríase ('amarelão', causada por <i>Ancylostoma duodenale</i> e <i>Necator americanus</i>) ocorre pela penetração ativa de larvas filarioides através da pele descalça em contato com solo contaminado por fezes; os vermes fixam-se com dentes à mucosa intestinal provocando sangramento crônico e anemia ferropriva severa (o Jeca Tatu de Monteiro Lobato). A larva migrans cutânea ('bicho-geográfico') é causada por ancilóstomos de cães e gatos que penetram na pele humana sem completar o ciclo.", ["Pseudocelomados com sistema digestório completo: boca e ânus", "Ancilostomíase (amarelão): penetração ativa de larvas filarioides pelo solo nos pés descalços", "Anemia ferropriva do amarelão: vermes mastigam a parede intestinal gerando perda contínua de sangue", "Ascaridíase: ingestão fecal-oral de ovos embrionados com ciclo pulmonar de Looss", "Profilaxia: saneamento básico, uso de calçados, higiene alimentar e tratamento dos doentes"], "Como se pega o 'amarelão' (ancilostomíase)? Andando descalço em solo contaminado por fezes humanas! A larva penetra ativamente pela pele do pé, cai na corrente sanguínea, passa pelos pulmões e vai para o intestino, causando anemia profunda crônica.", "<p>O escritor Monteiro Lobato imortalizou o personagem Jeca Tatu como o estereótipo do caipira empobrecido do interior paulista do início do século XX: descalço, desanimado, pálido e com fraqueza muscular contínua. Campanhas sanitárias pioneiras demonstraram que Jeca 'não era assim, mas estava assim' por ser vítima crônica do amarelão.</p>", "A forma de infecção primária responsável pelo amarelão de Jeca Tatu e a medida profilática individual mais simples para prevenir essa verminose são:", ["ingestão de carne bovina malpassada com cisticercos; vacinação do gado de corte.", "picada de mosquitos flebótomos em lagoas paradas; aplicação de repelentes cutâneos.", "penetração ativa de larvas através da pele dos pés descalços; uso rotineiro de sapatos e calçados.", "inalação de esporos bacterianos em galinheiros; uso de máscaras respiratórias com filtro.", "consumo de peixes de água doce crus; congelamento de pescados em salmoura."], 2, "A ancilostomíase é contraída quando larvas filarioides (que eclodiram de ovos eliminados nas fezes humanas no solo sem saneamento) penetram ativamente pela pele, geralmente através dos pés descalços de trabalhadores e crianças. Os vermes adultos instalam-se no duodeno, onde se alimentam de sangue pelas placas orais, causando anemia ferropriva crônica que induz letargia e palidez ('amarelão'). O uso regular de calçados impermeáveis e a instalação de fossas sépticas/saneamento básico interrompem a infecção. Alternativa correta: C. Distratores: A descreve teníase bovina; C descreve leishmaniose; D e E citam vias de transmissão inexistentes para ancilóstomos."], "Herança ligada ao sexo": ["A herança ligada ao sexo refere-se a genes situados na região não-homóloga do cromossomo sexual X. Como os homens são hemizigotos (possuem apenas um cromossomo X e um Y, XY) e as mulheres são homogaméticas (XX), anomalias recessivas ligadas ao X manifestam-se com frequência muito superior no sexo masculino. Um único alelo mutado no cromossomo X masculino já determina o fenótipo da doença (XᵃY), pois o cromossomo Y não possui alelo correspondente. As mulheres, para serem afetadas, necessitam herdar o alelo recessivo de ambos os genitores (XᵃXᵃ); mulheres heterozigotas (XᴬXᵃ) são portadoras assintomáticas. Exemplos clássicos cobrados no ENEM incluem o daltonismo (insensibilidade visual às cores verde e vermelha) e a hemofilia A (deficiência do fator VIII de coagulação sanguínea).", ["Herança recessiva ligada ao X: homens XᵃY (afetados), mulheres XᴬXᵃ (portadoras normais)", "Homens recebem seu único cromossomo X da MÃE (nunca do pai)", "Pai afetado (XᵃY) transmite o alelo recessivo para TODAS as filhas mulheres", "Daltonismo e hemofilia: muito mais frequentes em homens do que em mulheres"], "Lembre-se: um homem afetado por hemofilia ou daltonismo NUNCA transmite a doença para seus filhos homens, pois ele doa o cromossomo Y para seus filhos do sexo masculino! Ele transmite o cromossomo X portador do alelo para todas as suas filhas.", "<p>Um homem daltônico (XᵈY) casou-se com uma mulher com visão de cores normal, filha de um pai daltônico. O casal consultou um geneticista para saber os riscos de nascimento de crianças com daltonismo.</p>", "Qual a probabilidade de esse casal ter um primeiro filho que seja homem e daltônico?", ["0%", "75%", "50%", "25%", "100%"], 3, "O genótipo do homem daltônico é XᵈY. A mulher tem visão normal, mas seu pai era daltônico (XᵈY), doando obrigatoriamente um Xᵈ para ela; logo, a mulher é heterozigota portadora (XᴰXᵈ). Cruzamento: XᵈY × XᴰXᵈ. Possíveis descendentes: XᴰXᵈ (menina normal portadora - 1/4), XᵈXᵈ (menina daltônica - 1/4), XᴰY (menino normal - 1/4) e XᵈY (menino daltônico - 1/4). A probabilidade de nascer um filho que seja 'homem E daltônico' (XᵈY) é de 1/4 ou 25%. Alternativa correta: D. Distratores: A considera falsamente que mães normais não passam o alelo; C calcula a probabilidade restrita aos filhos homens (1/2 de daltônico se já for homem); D e E usam proporções incorretas."], "Herança mitocondrial e DNA extranuclear": ["A herança mitocondrial (ou materna) é um padrão atípico de transmissão genética no qual características e doenças são transmitidas exclusivamente pela linhagem materna a todos os seus descendentes biológicos, sem seguir a segregação mendeliana nuclear. As mitocôndrias possuem genoma próprio circular (DNA mitocondrial ou mtDNA) semelhante ao das bactérias, contendo genes que codificam subunidades proteicas da cadeia respiratória de fosforilação oxidativa e RNAs transportadores e ribossômicos. Durante a fecundação humana, o óvulo volumoso contribui com quase a totalidade do citoplasma e suas dezenas de milhares de mitocôndrias para o zigoto. Embora o espermatozoide possua mitocôndrias na peça intermediária, estas são marcadas com ubiquitina e degradadas enzimaticamente no óvulo logo após a penetração, garantindo que o embrião herde exclusivamente o genoma mitocondrial materno.", ["Transmissão exclusivamente materna: mães afetadas transmitem a mutação a 100% dos filhos (homens e mulheres)", "Homens afetados NÃO transmitem a doença mitocondrial a nenhum filho ou filha", "DNA mitocondrial circular: não possui histonas, não recombina e tem alta taxa de mutação", "Rastreador de linhagem evolutiva: o mtDNA é utilizado em estudos filogenéticos (Eva Mitocondrial)", "Heteroplasmia: coexistência de mitocôndrias normais e mutadas no citoplasma da mesma célula"], "No heredograma do ENEM: se uma mãe afetada tiver 10 filhos (homens e mulheres) e TODOS herdarem a condição, enquanto os filhos de um homem afetado forem todos normais, marque sem medo: HERANÇA MITOCONDRIAL (MATERNA).", "<p>Em uma consulta de aconselhamento genético, um casal busca esclarecimentos sobre uma síndrome neuromuscular rara associada a um defeito de produção de ATP. A análise da árvore genealógica revelou que a mãe do homem e suas três irmãs apresentavam os sintomas, assim como todos os filhos dessas irmãs. O homem, embora diagnosticado com a doença, gerou quatro filhos biológicos perfeitamente saudáveis com sua esposa não afetada.</p>", "O padrão de transmissão hereditária observado nesse caso clínico é classificado como herança:", ["autossômica recessiva ligada ao cromossomo sexual Y.", "epigenética decorrente de metilação transitória de histonas nucleares somáticas.", "recessiva ligada ao cromossomo sexual X com penetrância incompleta nos homens.", "autossômica codominante expressa exclusivamente no sexo biológico feminino.", "mitocondrial, condicionada por mutação no DNA citoplasmático de herança estritamente materna."], 4, "Na fecundação humana, apenas as mitocôndrias do ovócito permanecem no zigoto, de modo que todo o genoma mitocondrial é herdado exclusivamente da mãe. Uma mulher com mutação mitocondrial transmite a alteração para todos os seus descendentes biológicos de ambos os sexos, ao passo que homens afetados não repassam suas mitocôndrias aos filhos. Alternativa correta: E. Distratores: A é impossível (Y não é autossômico); C geraria filhas portadoras; D e E não explicam a transmissão universal materna."], "Herança quantitativa e poligenia": ["Na herança quantitativa (poligenia ou herança poligênica), uma única característica fenotípica contínua é determinada pela ação aditiva e cumulativa de múltiplos pares de genes não-alelos com efeitos aditivos discretos, fortemente influenciados por fatores ambientais. O fenótipo não se divide em categorias qualitativas discretas (como sementes lisas ou rugosas de Mendel), mas varia gradualmente ao longo de uma escala contínua que descreve uma curva de distribuição normal em sino (curva de Gauss). Exemplos clássicos na espécie humana incluem a cor da pele humana (determinada por múltiplos alelos aditivos que sintetizam melanina), a estatura corporal humana, a massa corpórea e a produção de leite em bovinos. O número de classes fenotípicas em um cruzamento entre polímeros heterozigotos é dado pela fórmula (2n + 1), onde n é o número de pares de genes aditivos envolvidos.", ["Poligenia: múltiplos pares de genes com efeito aditivo cumulativo somatório", "Distribuição contínua: curva de Gauss em forma de sino (média na maioria, extremos raros)", "Exemplos humanos: tom de pele (pigmentação melânica), altura corporal e peso", "Classes fenotípicas: (2n + 1), onde n = número de pares de genes atuantes", "Influência ambiental: nutrição e radiação solar modulam a expressão final do fenótipo"], "Se uma característica tem distribuição em curva de sino (curva normal de Gauss), onde a maioria das pessoas está no meio e os extremos são raros, isso é HERANÇA QUANTITATIVA (poligênica), e NÃO herança mendeliana simples monogênica.", "<p>Em um estudo demográfico de uma população jovem de 5.000 indivíduos saudáveis, os pesquisadores mediram a altura de todos os voluntários e plotaram os dados em um histograma. O gráfico resultante demonstrou uma distribuição contínua simétrica com a imensa maioria dos indivíduos medindo entre 1,65 m e 1,75 m, com poucos indivíduos extremamente baixos (< 1,45 m) ou extremamente altos (> 1,95 m).</p>", "O padrão gráfico contínuo em sino (curva de Gauss) obtido é característico de qual modelo de herança biológica?", ["Herança monogênica autossômica com dominância completa e alelos letais.", "Codominância exclusiva entre cromossomos extranucleares de origem paterna.", "Herança holândrica ligada à porção não-homóloga do cromossomo sexual Y.", "Epistasia recessiva pura com penetrância celular nula em machos.", "Herança quantitativa (poligênica), resultante do efeito aditivo de múltiplos pares de genes com influência ambiental."], 4, "Características contínuas (como altura, peso e pigmentação da pele) são reguladas por múltiplos pares de alelos aditivos atuando de forma cumulativa, com forte modulação por fatores ambientais (nutrição, hormônios e saúde na infância). A combinação aleatória de alelos aditivos na população gera uma variação contínua descrita por uma curva de distribuição normal gaussiana, com os fenótipos intermediários sendo os mais frequentes e os extremos os mais raros. Alternativa correta: E. Distratores: A geraria apenas duas classes discretas; C, D e E descrevem padrões mendelianos e cromossômicos incompatíveis com variação fenotípica contínua."], "Hipóteses sobre a origem da vida (Oparin-Haldane e Miller-Urey)": ["A origem da vida na Terra primitiva (há cerca de 3,8 bilhões de anos) é explicada cientificamente pela Teoria da Evolução Química ou Pré-Biótica formulada por Aleksandr Oparin e J.B.S. Haldane. Segundo essa hipótese, a atmosfera primitiva da Terra continha metano (CH₄), amônia (NH₃), hidrogênio (H₂) e vapor d'água (sem O₂ livre e sem camada de ozônio). Sob intensas descargas elétricas e radiação ultravioleta solar, esses gases reagiram formando moléculas orgânicas simples (aminoácidos e açúcares), carreadas pelas chuvas aos mares primitivos mornos ('sopa primordial'), onde se agruparam em coacervados. Em 1953, Stanley Miller e Harold Urey simularam essas condições em um aparelho fechado de laboratório e demonstraram experimentalmente a síntese abiótica espontânea de diversos aminoácidos.", ["Hipótese de Oparin-Haldane: evolução química na atmosfera e mares primitivos", "Experimento de Miller-Urey (1953): provou que aminoácidos podem surgir abioticamente", "Atmosfera primitiva redutora: CH₄, NH₃, H₂, H₂O (SEM oxigênio livre O₂)", "Coacervados: aglomerados proteicos hidratados sem membrana nem DNA (pré-células)", "Hipótese do Mundo do RNA: o RNA foi o primeiro ácido nucleico com função catalítica e genética"], "Coacervados NÃO são seres vivos! Eles eram apenas aglomerados coloidais de proteínas e água que isolavam temporariamente um microambiente interno, precursor das primeiras células ancestrais.", "<p>Em 1953, Stanley Miller montou um sistema de tubos de vidro lacrado contendo uma mistura de gases (CH₄, NH₃, H₂ e vapor de H₂O) submetida a faíscas elétricas contínuas simulando relâmpagos primordiais. Após uma semana de circulação e condensação, o líquido acumulado foi analisado quimicamente, revelando a presença espontânea de glicina, alanina e outros aminoácidos fundamentais.</p>", "O experimento de Miller-Urey foi um marco para a ciência porque demonstrou experimentalmente que:", ["moléculas orgânicas complexas essenciais à vida podem ser formadas de modo abiótico sob condições pré-bióticas.", "células eucariontes fotossintetizantes podem surgir diretamente a partir de rochas magmáticas.", "vírus envelopados foram os primeiros organismos heterótrofos a colonizar a litosfera terrestre.", "a camada de ozônio primitiva foi gerada pela oxidação de metano por bactérias aeróbias.", "a mitocôndria surgiu antes da membrana plasmática durante a solidificação da crosta."], 0, "O experimento de Miller e Urey forneceu a primeira corroboração experimental sólida para a hipótese de Oparin e Haldane, demonstrando que precursores orgânicos essenciais à vida (como os aminoácidos que formam as proteínas) podiam se formar por síntese abiótica a partir de gases inorgânicos e fontes energéticas plausíveis na Terra primitiva. Alternativa correta: A. Distratores: B, C, D e E formulam anacronismos e processos biologicamente incorretos."], "Homeostase do cálcio e remodelamento ósseo": ["O tecido ósseo é uma estrutura altamente dinâmica e vascularizada, continuamente remodelada pela ação combinada de duas linhagens celulares especializadas: os osteoblastos e os osteoclastos. Os osteoblastos sintetizam e secretam a matriz orgânica colágena (osteoide) e promovem a precipitação de cristais de hidroxiapatita (fosfato de cálcio), formando novo tecido ósseo e consumindo cálcio do sangue. Já os osteoclastos são células multinucleadas gigantes que secretam ácidos e enzimas proteolíticas, reabsorvendo a matriz mineralizada e liberando íons cálcio (Ca2+) de volta à corrente sanguínea. Essa dinâmica é finamente controlada por dois hormônios antagônicos: o paratormônio (PTH), secretado pelas paratireoides em resposta à hipocalcemia, que estimula os osteoclastos a reabsorver osso e elevar o cálcio plasmático; e a calcitonina, liberada pela tireoide em hipercalcemia, que inibe os osteoclastos.", ["Osteoblastos (B de 'Build'): formam matriz óssea e fixam cálcio no esqueleto", "Osteoclastos (C de 'Clash'/Consumir): reabsorvem matriz óssea e liberam cálcio no sangue", "Paratormônio (PTH): hormônio hipercalcemiante (estimula reabsorção óssea, absorção intestinal e retenção renal)", "Calcitonina: hormônio hipocalcemiante (inibe reabsorção óssea e favorece a mineralização)", "Vitamina D (Calcitriol): essencial para a absorção intestinal de cálcio; sua carência causa raquitismo e osteomalácia"], "Mnemônico clássico do ENEM: Paratormônio tira cálcio do osso e joga PARA o sangue (hipercalcemiante). Calcitonina joga o cálcio PARA DENTRO do osso (hipocalcemiante).", "<p>Mulheres na pós-menopausa apresentam queda acentuada na produção ovariana de estrogênios, hormônios que exercem efeito inibitório natural sobre a atividade dos osteoclastos. Na ausência desse freio fisiológico, a taxa de degradação da matriz mineral passa a superar a síntese óssea pelos osteoblastos, resultando em osteoporose severa e fragilidade mecânica do esqueleto.</p>", "Nesse cenário clínico, a perda de densidade óssea acelerada é consequência direta do(a):", ["predomínio da reabsorção óssea realizada por osteoclastos sobre a formação pelos osteoblastos.", "acúmulo excessivo de calcitonina na circulação sistêmica inibindo o paratormônio.", "mutação nos osteócitos que os transforma em adipócitos armazenadores de fosfato de sódio.", "mineralização descontrolada de hidroxiapatita que obstrui os canais de Havers corticais.", "destruição das cartilagens articulares por ataque autoimune de linfócitos citotóxicos B."], 0, "Com o déficit estrogênico, ocorre desequilíbrio na remodelagem esquelética: a taxa de reabsorção óssea mediada pelos osteoclastos supera a capacidade proliferativa e sintética dos osteoblastos. Consequentemente, as trabéculas ósseas tornam-se finas, porosas e frágeis, caracterizando a osteoporose senil. Alternativa correta: A. Distratores: A cita excesso de calcitonina (que é protetora do osso); C, D e E trazem formulações patológicas descabidas."], "Impactos ambientais e poluição das águas": ["A ação antrópica desordenada provoca impactos ecológicos graves em corpos hídricos. A eutrofização artificial é desencadeada pelo descarte excessivo de esgoto doméstico e fertilizantes agrícolas ricos em compostos de nitrogênio e fósforo. Esse aporte excessivo estimula a proliferação explosiva de algas superficiais (bloom), que bloqueia a passagem de luz solar e mata a vegetação fotossintetizante submersa. Com a morte maciça de algas, bactérias decompositoras aeróbias multiplicam-se intensamente, consumindo todo o oxigênio dissolvido na água (hipóxia/anóxia) e provocando a asfixia em massa de peixes e outros organismos aeróbios, culminando na proliferação de bactérias anaeróbias produtoras de gases fétidos (como sulfeto de hidrogênio).", ["Eutrofização: esgoto/adubos → excesso de N e P", "Bloom de algas: bloqueio da luz solar nas profundezas", "Decomposição aeróbia intensa: queda drástica de O₂ dissolvido", "Morte de peixes: asfixia por anóxia provocada pelos decompositores", "Decomposição anaeróbia final: liberação de H₂S e metano"], "Pegadinha perigosa: a morte dos peixes na eutrofização NÃO é causada pela falta de alimento, nem pelo envenenamento imediato pelas algas vivas, mas sim pela FALTA DE OXIGÊNIO CONSUMIDO PELAS BACTÉRIAS AERÓBIAS DECOMPOSITORAS.", "<p>Moradores vizinhos a uma lagoa urbana relataram que as águas ficaram esverdeadas e turvas semanas após o rompimento de uma galeria pluvial clandestina que recebia dejetos domésticos. Poucos dias depois, milhares de peixes apareceram boiando mortos na superfície, exalando odor sulfuroso.</p>", "Nesse cenário de eutrofização, a causa biológica imediata que conduziu à mortalidade dos peixes foi:", ["a elevação exagerada do pH da água devido ao aumento da fotossíntese profunda.", "a diminuição drástica do oxigênio dissolvido provocada pela decomposição aeróbia da biomassa algal.", "a predação direta dos peixes por colônias de bactérias anaeróbias metanogênicas.", "o consumo de todo o nitrogênio e fósforo dissolvidos pelos peixes carnívoros.", "a formação de placas de gelo no fundo da lagoa decorrente da retenção de radiação infravermelha."], 1, "O excesso de matéria orgânica provoca a morte das algas superficiais e a consequente proliferação massiva de bactérias decompositoras aeróbias. Essa biomassa bacteriana consome aceleradamente o oxigênio dissolvido no meio (alta demanda bioquímica de oxigênio - DBO), levando a água à anóxia e asfixiando os peixes. Alternativa correta: B. Distratores: A erra pois a fotossíntese é suprimida pela falta de luz nas camadas profundas; C, D e E formulam hipóteses absurdas sem respaldo biológico."], "Lamarckismo versus Darwinismo": ["As teorias evolutivas explicam como as espécies se modificam e diversificam ao longo do tempo geológico. Jean-Baptiste de Lamarck propôs o transformismo baseado em duas leis: a Lei do Uso e Desuso (estruturas muito utilizadas pelo organismo desenvolvem-se, enquanto as em desuso atrofiam-se) e a Lei da Transmissão dos Caracteres Adquiridos (modificações corporais induzidas pelo ambiente seriam repassadas à prole), postulando que o meio cria a necessidade e induz a adaptação ativa. Charles Darwin e Alfred Russel Wallace propuseram a Teoria da Seleção Natural: dentro de qualquer população existem variações individuais prévias; na luta pela sobrevivência frente a recursos finitos, os indivíduos portadores de características mais vantajosas ao meio sobrevivem e deixam mais descendentes (reprodução diferencial), aumentando a frequência dessas características na população ao longo das gerações.", ["Lamarck: o ambiente INDUZ a modificação (uso e desuso + herança dos caracteres adquiridos)", "Darwin: o ambiente SELECIONA variações pré-existentes vantajosas (seleção natural)", "Lamarck: visão finalista e ativa ('o ser vivo se adapta para sobreviver')", "Darwin: variabilidade prévia espontânea e reprodução diferencial dos mais aptos"], "Identifique o verbo no texto da questão: se o texto diz que o organismo 'desenvolveu uma estrutura PARA sobreviver no calor', isso é LAMARCKISMO (finalista). Se diz que 'indivíduos que já possuíam a característica sobreviveram e geraram mais descendentes', isso é DARWINISMO.", "<p>Em cavernas totalmente escuras e profundas no sudeste da Europa, vivem populações isoladas de peixes cegos (<i>Proteus anguinus</i>) cujos olhos são atrofiados e recobertos por uma espessa camada de pele, embora seus ancestrais de superfície tivessem olhos normais funcionais.</p>", "Segundo a Teoria da Seleção Natural proposta por Charles Darwin, a atrofia ocular desses animais é explicada pelo fato de que:", ["o desuso contínuo dos olhos na escuridão provocou sua atrofia somática, sendo esse fenótipo transmitido aos filhotes.", "peixes ancestrais que nasceram com olhos menores ou atrofiados não gastavam energia com uma estrutura inútil no escuro, sobrevivendo e deixando mais descendentes.", "a água das cavernas provocou mutações direcionadas com a finalidade de converter fotorreceptores em barbilhões olfativos.", "a escuridão forçou os peixes a absorverem sua própria retina para iluminar quimicamente as escamas.", "a ausência de luz desintegrou os ribossomos oculares por falta de fotossíntese nas brânquias."], 1, "Para Darwin, variações morfológicas já existiam espontaneamente na população ancestral. Na escuridão perpétua, olhos bem desenvolvidos representavam um alto custo metabólico e risco de infecções sem benefício adaptativo. Indivíduos com menor investimento ocular apresentavam vantagem bioenergética, sobrevivendo melhor e transmitindo seus alelos preferencialmente aos descendentes (seleção natural). Alternativa correta: B. Distratores: A é a explicação lamarckista clássica (uso/desuso e herança de caracteres adquiridos); C, D e E formulam concepções finalistas absurdas e biologicamente insustentáveis."], "Ligação gênica (linkage), mapas genéticos e recombinação": ["A 2ª Lei de Mendel só se aplica quando dois ou mais pares de alelos estão localizados em cromossomos homólogos diferentes. Quando dois ou mais genes residem no mesmo cromossomo, diz-se que estão em ligação gênica (linkage), tendendo a ser herdados juntos para o mesmo gameta. A ligação gênica pode ser quebrada pelo crossing-over (permutação meiótica na prófase I), originando gametas recombinantes em frequência menor que os gametas parentais. A taxa de recombinação meiótica (medida em porcentagem de gametas recombinantes) é diretamente proporcional à distância física entre os dois locos gênicos no cromossomo: quanto mais distantes, maior a chance de ocorrer quebra e troca cromossômica. Convencionou-se que 1% de frequência de recombinação equivale a uma distância de 1 morganídeo (cM ou centimorgan), permitindo a construção de mapas genéticos cromossômicos lineares.", ["Linkage: genes situados no MESMO cromossomo (violam a 2ª Lei de Mendel)", "Gametas parentais: sempre em maior proporção que os recombinantes", "Taxa de recombinação meiótica (% recombinantes) = distância em centimorgans (cM)", "Configuração Cis (AB/ab) vs Trans (Ab/aB)", "Distância máxima de recombinação: 50% (quando a frequência atinge 50%, a segregação assemelha-se à independente)"], "Se um cruzamento teste de um duplo heterozigoto resulta em: 40% AB, 40% ab, 10% Ab e 10% aB, os genes estão em LINKAGE! Os recombinantes são Ab e aB, e a soma das porcentagens deles (10 + 10 = 20%) dá diretamente a distância entre os genes: 20 centimorgans (cM).", "<p>Em experimentos genéticos com a mosca-das-frutas (<i>Drosophila melanogaster</i>), analisou-se a progênie de um cruzamento entre fêmeas duplo-heterozigotas para corpo cinza/preto e asas longas/vestigiais e machos duplo-homozigotos recessivos. Dos 1.000 descendentes analisados, obtiveram-se: 415 de corpo cinza e asas longas, 415 de corpo preto e asas vestigiais, 85 de corpo cinza e asas vestigiais e 85 de corpo preto e asas longas.</p>", "Com base nesses dados de segregação genética, a distância cromossômica entre os dois genes no mapa genético é de:", ["17,0 centimorgans (cM).", "8,5 centimorgans (cM).", "41,5 centimorgans (cM).", "50,0 centimorgans (cM).", "83,0 centimorgans (cM)."], 0, "Os descendentes com genótipos recombinantes são os que apresentam menor frequência na prole: 85 (cinza/vestigial) + 85 (preto/longa) = 170 moscas recombinantes. A taxa de recombinação é calculada dividindo o número total de recombinantes pelo total de descendentes: 170 / 1.000 = 0,17 = 17%. Como 1% de recombinação meiótica equivale à distância de 1 centimorgan (cM), os dois locos gênicos estão separados por exatamente 17 centimorgans no mesmo cromossomo. Alternativa correta: A. Distratores: A usa a frequência de apenas uma das classes recombinantes; C usa a frequência de uma classe parental; D e E utilizam frações não relacionadas à taxa de crossing-over."], "Meiose e variabilidade genética": ["A meiose é uma divisão celular reducional que ocorre em células germinativas para a formação de gametas haploides (animais) ou esporos (vegetais), reduzindo a ploidia à metade (2n → n). É constituída por duas divisões celulares sucessivas precedidas por uma única duplicação do DNA. A Meiose I é reducional: na Prófase I ocorre o emparelhamento dos cromossomos homólogos (sinapse) e o crossing-over (permutação gênica) entre cromátides não-irmãs nos quiasmas, gerando novas combinações alélicas. Na Anáfase I separam-se os cromossomos homólogos com segregação independente. A Meiose II é equacional: na Anáfase II separam-se as cromátides-irmãs. A meiose e a fecundação aleatória são as principais fontes de variabilidade genética em organismos de reprodução sexuada.", ["Meiose: 1 célula 2n → 4 células haploides (n) geneticamente distintas", "Prófase I: crossing-over (permutação) entre cromátides não-irmãs homólogas", "Anáfase I: segregação independente de cromossomos homólogos (reducional)", "Anáfase II: separação de cromátides-irmãs (equacional)", "Não-disjunção meiótica: gera aneuploidias (ex: trissomia 21 / Síndrome de Down)"], "O crossing-over (permutação gênica) ocorre especificamente no PAQUÍTENO da PRÓFASE I da meiose I, entre cromátides NÃO-IRMÃS de cromossomos homólogos. Isso recombina alelos maternos e paternos, aumentando a diversidade dos gametas.", "<p>A reprodução sexuada promove ampla diversidade fenotípica nas populações biológicas, o que confere maior capacidade adaptativa frente a mudanças ambientais e pressões seletivas patogênicas.</p>", "O evento meiótico molecular que promove diretamente o surgimento de novas combinações de alelos em uma mesma molécula cromossômica é a:", ["duplicação conservativa de telômeros na anáfase II.", "separação de cromossomos sexuais mediada por lisossomos na telófase I.", "fusão de nucléolos durante a citocinese meiótica secundária.", "permutação gênica (crossing-over) entre cromátides não-irmãs na prófase I.", "desnaturação de histonas pela alta temperatura citoplasmática."], 3, "O crossing-over (permutação gênica) ocorre na prófase I da meiose entre cromátides não-irmãs de cromossomos homólogos emparelhados. Enzimas provocam quebras e religamentos recíprocos de segmentos de DNA, trocando alelos entre os cromossomos de origem materna e paterna e criando novas combinações gênicas nos gametas resultantes. Alternativa correta: D. Distratores: A erra a fase e o tipo de replicação; C, D e E citam mecanismos biológicos inexistentes ou desprovidos de efeito recombinante."], "Membrana plasmática e transportes celulares": ["A membrana plasmática segue o modelo do mosaico fluido de Singer e Nicolson, sendo composta por uma bicamada de fosfolipídios anfipáticos intercalada por proteínas integrais e periféricas, além de colesterol em células animais e glicocálice externo. Apresenta permeabilidade seletiva. Os transportes passivos ocorrem a favor do gradiente de concentração, sem gasto de ATP celular: difusão simples (gases apolares O₂ e CO₂), difusão facilitada (por permeases ou canais de aquaporina) e osmose (movimento da água do meio hipotônico para o hipertônico). Os transportes ativos ocorrem contra o gradiente eletroquímico com hidrólise de ATP, como a bomba de sódio e potássio (bombeia 3 Na⁺ para fora e 2 K⁺ para dentro da célula).", ["Mosaico fluido: bicamada fosfolipídica fluida com proteínas inseridas", "Transporte passivo (sem ATP): difusão simples, facilitada e osmose", "Osmose: fluxo de solvente (H₂O) do meio HIPOtônico → HIPERtônico", "Transporte ativo (com ATP): Bomba de Na⁺/K⁺ (3 Na⁺ saem, 2 K⁺ entram)", "Endocitose (fagocitose/pinocitose) e Exocitose (secreção celular)"], "Célula vegetal colocada em solução hipertônica (muito salgada): NÃO se rompe e NÃO murcha totalmente por fora, pois tem parede celular rígida! Ela perde água do vacúolo e a membrana descola da parede celular: isso é PLASMÓLISE.", "<p>Em uma aula prática de biologia celular, hemácias humanas saudáveis foram colocadas em três tubos de ensaio contendo soluções aquosas com diferentes concentrações de cloreto de sódio: Tubo 1 (solução de NaCl a 0,2%), Tubo 2 (solução de NaCl a 0,9%) e Tubo 3 (solução de NaCl a 3,0%). Após repouso, as células do Tubo 1 incharam e romperam-se (hemólise), as do Tubo 2 mantiveram seu formato bicôncavo característico e as do Tubo 3 murcharam (crenação).</p>", "O rompimento celular observado exclusivamente no Tubo 1 decorreu da:", ["entrada maciça de água por osmose em razão da solução ser hipotônica em relação ao citoplasma da hemácia.", "perda ativa de íons cloreto por transporte mediado por bombas de ATP.", "saída de hemoglobina por difusão simples facilitada pela alta concentração salina externa.", "precipitação de glicocálice no interior do retículo endoplasmático rugoso.", "síntese acelerada de fosfolipídios pela membrana celular plasmática."], 0, "A solução de NaCl a 0,2% é hipotônica em relação ao meio intracelular da hemácia (~0,9%). Por osmose, a água desloca-se do meio menos concentrado (externo) para o mais concentrado (interno da célula). Como a célula animal não possui parede celular para conter a pressão de turgor, o influxo descontrolado de água provoca o rompimento osmótico da membrana (lise celular ou hemólise). Alternativa correta: A. Distratores: A erra o tipo de transporte e o sentido do fluxo; C erra pois hemoglobina não atravessa a membrana íntegra; D e E inventam fenômenos sem base biológica."], "Mitose e ciclo celular": ["O ciclo celular compreende a intérfase (dividida nas fases G1, S de duplicação do DNA e G2) e a divisão celular. A mitose é uma divisão celular equacional (2n → 2n) que gera duas células-filhas geneticamente idênticas à célula-mãe, sendo essencial para crescimento somático, renovação tecidual, cicatrização e reprodução assexuada. Divide-se em quatro fases clássicas: Prófase (condensação dos cromossomos, desintegração da carioteca e formação do fuso acromático), Metáfase (cromossomos alinhados na placa equatorial com máxima espiralação), Anáfase (separação e migração das cromátides-irmãs para os polos opostos) e Telófase (descondensação cromossômica e reorganização nuclear), seguida pela citocinese.", ["Intérfase: fase S é onde ocorre a REPLICAÇÃO semiconservativa do DNA", "Mitose: 1 divisão → 2 células-filhas diploides idênticas (2n → 2n)", "Fases: Prófase, Metáfase (placa equatorial), Anáfase (separa cromátides), Telófase", "Anáfase mitótica: separação das cromátides-irmãs (não dos cromossomos homólogos)", "Finalidade: crescimento tecidual, regeneração e cicatrização"], "Cuidado para não confundir: na ANÁFASE DA MITOSE separam-se CROMÁTIDES-IRMÃS. Na ANÁFASE I DA MEIOSE separam-se CROMOSSOMOS HOMÓLOGOS. Essa distinção cai com frequência em questões de citogenética.", "<p>A colchicina é um alcaloide vegetal utilizado em citogenética clínica que impede a polimerização dos microtúbulos de tubulina, impedindo a formação e o encurtamento das fibras do fuso mitótico.</p>", "Células humanas submetidas à ação da colchicina têm sua divisão celular mitótica interrompida em qual fase e por qual motivo?", ["Telófase, por impossibilidade de descondensação da cromatina nuclear.", "Prófase inicial, devido à ausência de duplicação do DNA na fase S.", "Metáfase, por impossibilidade de tração e separação das cromátides-irmãs para a anáfase.", "Intérfase, por ausência de transcrição de ribossomos nucleolares.", "Glicólise mitocondrial, pela perda de receptores de insulina na carioteca."], 2, "Sem microtúbulos funcionais para formar as fibras do fuso acromático e se ligarem aos cinetócoros, os cromossomos conseguem se condensar e atingir a placa equatorial, mas o fuso não consegue tracionar e separar as cromátides-irmãs para os polos celulares na anáfase. As células ficam travadas em metáfase com máxima espiralação cromossômica, sendo esta a técnica padrão para montagem de cariótipos humanos. Alternativa correta: C. Distratores: A e D indicam fases posteriores ou anteriores ao ponto de checagem do fuso; B erra pois a fase S ocorre na intérfase antes da mitose; E mistura vias metabólicas aleatórias."], "Mitose, pontos de checagem e câncer": ["O ciclo celular é estritamente regulado por complexos de ciclinas e quinases dependentes de ciclinas (CDKs) e por pontos de checagem (checkpoints) nas transições G1/S, G2/M e na metáfase (ponto de checagem do fuso). Proteínas supressoras de tumor, como a p53 (denominada 'guardiã do genoma'), monitoram a integridade do DNA celular: diante de danos genéticos irreversíveis, a p53 ativa o gene p21 para pausar o ciclo ou induz a apoptose (morte celular programada). Mutações com perda de função em genes supressores de tumor (como TP53) ou mutações de ganho de função em proto-oncogenes (transformando-os em oncogenes) provocam proliferação celular desregulada, invasão tecidual e angiogênese, culminando no desenvolvimento de neoplasias malignas (câncer).", ["Pontos de checagem: verificam replicação do DNA e alinhamento do fuso mitótico", "Proteína p53: supressor tumoral que repara o DNA ou aciona apoptose", "Proto-oncogenes: genes normais de proliferação que, mutados, viram oncogenes ativos", "Câncer: divisões mitóticas contínuas descontroladas, perda de inibição por contato e angiogênese"], "Mais de 50% dos cânceres humanos apresentam mutações inativadoras no gene TP53. Sem p53 funcional, células com danos no DNA continuam se dividindo por mitose em vez de sofrerem apoptose, acumulando novas aberrações cromossômicas.", "<p>Em uma biópsia de tecido tumoral cutâneo (melanoma), geneticistas sequenciaram o DNA das células malignas e detectaram a inativação mutacional de ambos os alelos do gene supressor tumoral TP53.</p>", "Essa alteração genética favorece o crescimento neoplásico descontrolado porque as células:", ["perdem a capacidade de realizar glicólise anaeróbia para obtenção de ATP.", "passam a sofrer meiose sucessiva no tecido epitelial produzindo gametas anômalos.", "deixam de interromper o ciclo celular ou acionar apoptose frente a danos severos no DNA.", "sintetizam espessas paredes celulares de sílica resistentes à fagocitose imune.", "bloqueiam a entrada de oxigênio pelas mitocôndrias da matriz extracelular."], 2, "A proteína p53 é ativada quando o DNA sofre quebras ou mutações; ela pausa o ciclo celular para reparo ou desencadeia a apoptose se o dano for irreparável. Com a perda de função da p53, células portadoras de mutações continuam a se duplicar mitóticamente sem restrição, acumulando alterações genéticas adicionais e formando tumores invasivos. Alternativa correta: C. Distratores: A erra pois tumores aumentam a glicólise (efeito Warburg); C confunde mitose tumoral com meiose; D e E criam afirmações fantasiosas."], "Moluscos, bioindicação e importância ambiental": ["O filo Mollusca reúne animais invertebrados celomados, triblásticos e protostômios de corpo mole desprovido de metameria, tipicamente dividido em cabeça, pé locomotor musculoso e massa visceral recoberta pelo manto secretor de concha calcária. O filo abrange classes de extraordinária relevância ecológica e econômica, destacando-se os bivalves (ostras e mexilhões), gastrópodes (caramujos e caracóis) e cefalópodes (polvos e lulas). Os moluscos bivalves são organismos sésseis ou sedentários dotados de brânquias ciliadas adaptadas à alimentação por filtração contínua de partículas orgânicas em suspensão na água. Como bombeiam centenas de litros de água por dia acumulando contaminantes químicos, coliformes fecais e metais pesados em seus tecidos sem sofrer mortalidade imediata, ostras e mexilhões são amplamente empregados na ecologia aplicada como bioindicadores sentinelas da qualidade ambiental costeira.", ["Manto e concha: o manto secreta a concha calcária (CaCO3) e delimita a cavidade paleal", "Bivalves filtradores: brânquias com cílios filtram fitoplâncton e acumulam poluentes (bioindicadores)", "Rádula: fita denticulada quitinosa raspadora de alimentos em gastrópodes e cefalópodes (ausente em bivalves)", "Cefalópodes: moluscos de alta complexidade sensorial com olhos semelhantes aos de vertebrados e sistema circulatório fechado", "Importância médica: caramujos de água doce (Biomphalaria) são hospedeiros intermediários obrigatórios do Schistosoma mansoni"], "Questão certa do ENEM: BIVALVES (ostras/mexilhões) NÃO POSSUEM RÁDULA raspadora porque são FILTRADORES. Exatamente por filtrarem grandes volumes de água, são os melhores BIOINDICADORES de poluição marinha.", "<p>Em uma baía estuarina próxima a um polo portuário e industrial, analistas ambientais implantaram estações de monitoramento ecológico utilizando bules de cultivo de mexilhões (Perna perna). Periodicamente, amostras do tecido visceral desses moluscos eram coletadas e submetidas a espectrometria para quantificar os teores de cádmio, chumbo e hidrocarbonetos policíclicos aromáticos presentes na água costeira.</p>", "A escolha dos moluscos bivalves como bioindicadores sentinelas da poluição aquática fundamenta-se no fato de serem organismos:", ["sésseis e filtradores contínuos que bioacumulam substâncias dissolvidas e particuladas na água.", "carnívoros de topo dotados de mandíbulas esclerotizadas que trituram macroplásticos.", "parasitas de peixes marinhos capazes de metabolizar metais pesados em glicose.", "hermafroditas obrigatórios imunes aos efeitos citotóxicos de radiações ionizantes.", "autótrofos fotossintetizantes que produzem a concha calcária por fixação de metano."], 0, "Os moluscos bivalves são animais sésseis que alimentam-se por filtração contínua através das brânquias ciliadas. Ao filtrarem dezenas de litros de água diariamente, retêm partículas em suspensão e acumulam poluentes químicos lipofílicos e íons metálicos em suas brânquias e glândula digestiva em concentrações proporcionais à poluição do corpo hídrico, tornando-se excelentes bioindicadores biológicos. Alternativa correta: A. Distratores: A, C, D e E atribuem hábitos alimentares e bioquímicos falsos a esses animais."], "Morfologia da raiz, caule e folha e adaptações ecológicas": ["Os órgãos vegetativos das plantas vasculares (raiz, caule e folha) exibem extraordinária plasticidade fenotípica e especializações morfofisiológicas adaptativas modeladas pela seleção natural aos mais diversos biomas do planeta. As raízes realizam fixação e absorção de água e sais minerais, desenvolvendo especializações como pneumatóforos com lenticelas respiratórias em plantas de manguezal (solos lodosos anóxicos), haustórios em parasitas como o cipó-chumbo que penetram vasos condutores, e raízes tuberosas ricas em amido como mandioca e cenoura. Os caules promovem sustentação e condução de seivas, destacando-se caules subterrâneos de reserva (rizomas, tubérculos e bulbos) e cladódios verdes fotossintetizantes com reserva de água em cactos. As folhas, órgãos primordiais da fotossíntese e transpiração, apresentam modificações extremas como espinhos em xerófitas para reduzir a área de transpiração e predadores, gavinhas para fixação em trepadeiras e folhas carnívoras especializadas na captura e digestão de insetos em solos pobres em nitrogênio.", ["Pneumatóforos (raízes respiratórias): crescem verticalmente para fora da lama do mangue para captar oxigênio", "Haustórios: raízes sugadoras que invadem xilema ou floema da planta hospedeira em hemiparasitas/holoparasitas", "Cladódios: caules carnosos achatados e verdes adaptados à fotossíntese e acúmulo de água em cactos", "Espinhos foliares: reduzem a transpiração cuticular e protegem contra herbivoria em biomas secos", "Folhas insetívoras: adaptação a solos ácidos e lixiviados deficientes em nitrogênio e fósforo"], "No ENEM: ESPINHO DE CACTO É FOLHA MODIFICADA (evita perda de água e protege contra animais). O caule verde e suculento é quem faz fotossíntese e armazena água (CLADÓDIO).", "<p>Em um manguezal da costa brasileira, biólogos constataram que árvores da espécie Avicennia schaueriana projetavam inúmeras estruturas radiculares verticais para fora da lama lodosa e alagada. Essas estruturas possuíam orifícios superficiais denominados pneumatódios e um tecido interno parenquimático com amplas lacunas de ar.</p>", "Essa especialização morfoanatômica da raiz é uma adaptação selecionada para contornar o estresse decorrente da:", ["escassez de luz solar ultravioleta na copa das árvores do dossel florestal.", "baixa disponibilidade de gás oxigênio no solo lamoso saturado de água salobra.", "alta concentração de alumínio tóxico nas camadas profundas do horizonte de terra firme.", "necessidade de absorver glicose orgânica dissolvida na água das marés enchente.", "incapacidade dos estômatos foliares de absorver gás carbônico no período diurno."], 1, "Os solos lodosos de manguezal são permanentemente alagados, ricos em matéria orgânica em decomposição e extremamente pobres em oxigênio dissolvido (anóxicos). Os pneumatóforos projetam-se acima do nível da maré e possuem aerênquima interno e pneumatódios externos que captam o gás oxigênio do ar atmosférico e o conduzem até as células radiculares profundas, viabilizando a respiração aeróbia das raízes. Alternativa correta: B. Distratores: A, C, D e E descrevem situações irreais nos manguezais."], "Morfologia e polinização floral em angiospermas": ["A flor é a estrutura reprodutiva exclusiva das angiospermas, especializada na atração de polinizadores e na fecundação cruzada. Uma flor completa apresenta quatro verticilos florais inseridos no receptáculo: cálice (sépalas estéreis protetoras), corola (pétalas frequentemente coloridas e aromáticas), androceu (estames com anteras produtoras de grãos de pólen) e gineceu/pistilo (carpelos com estigma receptivo, estilete e ovário contendo óvulos). A síndrome de polinização reflete coevolução íntima entre plantas e animais: flores polinizadas por insetos (entomofilia) produzem néctar doce, odores atrativos e pétalas vistosas com guias ultravioleta; flores polinizadas por morcegos (quiropterofilia) abrem à noite, são claras e exalam odores fermentados fortes; flores polinizadas pelo vento (anemofilia, como o milho e gramíneas) possuem estigmas plumosos e anteras pêndulas, sem pétalas vistosas nem néctar.", ["Verticilos florais: Cálice (sépalas), Corola (pétalas), Androceu (estames) e Gineceu (carpelos)", "Entomofilia (insetos): flores coloridas, nectários, pólen pegajoso e guias de néctar", "Anemofilia (vento): flores discretas, sem néctar, estigmas plumosos e grande quantidade de pólen leve", "Coevolução: adaptações mútuas recíprocas entre a morfologia floral e o corpo do polinizador"], "Plantas polinizadas pelo vento (como gramíneas, milho e trigo) NÃO gastam energia produzindo pétalas coloridas, perfumes nem néctar! Elas investem exclusivamente em produzir milhões de grãos de pólen leves e estigmas ramificados em forma de pluma para capturar o pólen disperso pelo ar.", "<p>Em uma lavoura de milho (gramínea anemófila), as flores masculinas situam-se na extremidade superior da planta (pendão), enquanto as flores femininas ficam nas espigas axilares protegidas por palhas verdes, projetando longos estigmas filamentosos para o exterior ('cabelo do milho'). As flores não possuem pétalas coloridas, não exalam perfume e não produzem néctar.</p>", "A ausência de estruturas florais vistosas e atrativas no milho é coerente com o fato de que a sua polinização depende exclusivamente do(a):", ["fecundação aquática obrigatória mediada por anterozoides flagelados nadadores.", "atração eletrostática de besouros mastigadores subterrâneos na raiz.", "absorção de pólen dissolvido na água da chuva acumulada nos nós caulinares.", "dispersão de sementes carnosas pelo trato digestório de aves frugívoras.", "transporte passivo de grãos de pólen leves pelas correntes de ar atmosféricas."], 4, "Plantas anemófilas dependem do vento como vetor abiótico para transportar o pólen das anteras até os estigmas. Por não dependerem de insetos ou vertebrados polinizadores, não há pressão seletiva para a manutenção de pétalas vistosas, glândulas odoríferas ou nectários, sendo essas estruturas energeticamente custosas eliminadas pela seleção natural ao longo da evolução das gramíneas. Alternativa correta: E. Distratores: B cita besouros que visitam flores entomófilas; C, D e E citam mecanismos incorretos de dispersão ou reprodução incompatíveis com o milho."], "Mutações e código genético": ["O código genético é a correspondência entre a sequência de trincas de bases nitrogenadas (códons) do RNA mensageiro e os aminoácidos incorporados na síntese proteica. É universal (com raríssimas exceções em protozoários e mitocôndrias, os mesmos códons codificam os mesmos aminoácidos em quase todas as espécies), degenerado ou redundante (vários códons sinônimos podem especificar o mesmo aminoácido, pois existem 64 códons para apenas 20 aminoácidos) e não-ambíguo (cada códon específico codifica apenas um aminoácido determinado). Mutações pontuais por substituição de bases podem ser silenciosas (quando geram um códon sinônimo sem alterar o aminoácido), de perda de sentido (missense, alterando o aminoácido) ou sem sentido (nonsense, gerando um códon de parada precoce UAA, UAG ou UGA). Mutações por inserção ou deleção causam deslocamento na matriz de leitura (frameshift).", ["Código universal: compartilhado por quase todos os seres vivos (prova da evolução)", "Código degenerado/redundante: 64 códons para 20 aminoácidos (proteção contra mutações)", "Códon de início: AUG (codifica Metionina)", "Códons de parada (stop códons): UAA, UAG e UGA (não codificam aminoácidos)", "Mutações silenciosas: substituição de base sem alterar o aminoácido resultante"], "A 'degeneração' do código genético NÃO é um defeito biológico: é uma vantagem evolutiva protetora! Se uma mutação altera a terceira base de um códon de GAA para GAG, ambos codificam ácido glutâmico, e a proteína permanece 100% funcional sem sofrer alteração estrutural.", "<p>Na engenharia genética moderna, pesquisadores conseguiram isolar o gene humano da insulina e inseri-lo no genoma da bactéria <i>Escherichia coli</i>. Ao se multiplicar em biorreatores, a bactéria passou a sintetizar e secretar a proteína da insulina humana biologicamente ativa, com a exata mesma sequência de aminoácidos da proteína humana original.</p>", "O sucesso biotecnológico da expressão de genes humanos em células bacterianas é possível em razão de qual propriedade fundamental do código genético?", ["Ambiguidade das ligações peptídicas bacterianas.", "Universalidade compartilhada entre procariontes e eucariontes.", "Degeneração exclusiva do DNA cromossômico humano.", "Capacidade das bactérias de realizarem
