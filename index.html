<style>
:root{--bg:#f3eddc;--ink:#26321f;--mut:#6b7160;--card:#fbf7ea;--line:#d8cfb3;--moss:#3e6b39;--terra:#b4522d;--ok:#2f7d3a;--bad:#b3392b;--okb:#e0f0d8;--badb:#f6dcd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#141a13;--ink:#e9e5d2;--mut:#9aa38d;--card:#1d261b;--line:#33402f;--moss:#92c683;--terra:#e48d65;--ok:#8fd38a;--bad:#f09a8a;--okb:#223b22;--badb:#40231e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) radial-gradient(circle at 1px 1px,rgba(120,110,70,.16) 1px,transparent 0) 0 0/22px 22px;color:var(--ink);font:17px/1.55 'Source Sans 3',system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:2px solid var(--ink);max-width:980px;margin:0 auto}
.logo{font:800 1.2rem Fraunces,Georgia,serif;background:none;border:0;color:var(--ink);cursor:pointer}.hr{display:flex;gap:12px;align-items:center;color:var(--mut)}
main{max-width:980px;margin:0 auto;padding:18px}.fade{animation:fade .35s both}
h1,h2,h3,h4{font-family:Fraunces,Georgia,serif;margin:.3em 0}h1{font-size:2.6rem;line-height:1}h1 em{color:var(--terra)}h2{font-size:1.9rem}
button{font:inherit;color:inherit;cursor:pointer}

.ring{width:96px;height:96px;flex:none}.ring circle{fill:none;stroke-width:7}.ring .tr{stroke:var(--line)}.ring .fg{stroke:var(--moss);stroke-linecap:round;stroke-dasharray:213.6;transform:rotate(-90deg);transform-origin:center;animation:ring 1.1s ease-out both;stroke-dashoffset:var(--o)}.ring text{fill:var(--ink);font:700 15px Fraunces,serif}
.acts,.chips,.pn{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.pn{justify-content:space-between}
.btn,.chip,.back{border:1.5px solid var(--ink);background:var(--card);padding:8px 14px;border-radius:99px;transition:.2s}.btn:hover:not(:disabled),.chip:hover{background:var(--ink);color:var(--bg)}.btn:disabled{opacity:.4;cursor:default}.chip.on{background:var(--moss);color:#fff;border-color:var(--moss)}.back{border:0;background:none;padding:4px 0;color:var(--mut)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 16px}input{flex:1;min-width:200px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-left:7px solid var(--moss);border-radius:4px 20px 4px 20px;padding:16px;cursor:pointer;animation:rise .5s both;animation-delay:calc(var(--d)*60ms);transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 8px 18px rgba(0,0,0,.12)}
.lA{border-left-color:var(--terra)}.lB{border-left-color:#8a9a9e}.pp{font:800 2.3rem Fraunces,serif;color:var(--terra);line-height:1}.pp small{font-size:1rem}.card h3{margin:0 0 4px;font-size:1.15rem}.card p{margin:6px 0;color:var(--mut);font-size:.95rem}
.tag{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--moss);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--moss);border-radius:9px;animation:grow .9s ease-out both}small{color:var(--mut)}
.rows{display:grid;gap:8px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;animation:rise .4s both;animation-delay:calc(var(--d,0)*50ms)}.row:hover{border-color:var(--moss)}
.ic{border:1.5px solid var(--line);background:var(--card);border-radius:50%;width:38px;height:38px;color:var(--mut);transition:.2s}.ic.on{background:var(--terra);border-color:var(--terra);color:#fff;transform:scale(1.08)}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.head div{display:flex;gap:6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:6px 18px 6px 18px;padding:14px 18px;margin:14px 0;animation:rise .45s both}.box h4{margin:0 0 4px;color:var(--moss)}.box ul{margin:4px 0;padding-left:20px}.tip{border-left:6px solid var(--terra)}.tip h4{color:var(--terra)}
.txt{color:var(--mut);margin-bottom:8px}.alt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:11px 13px;margin:8px 0;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;transition:.2s}.alt b{color:var(--terra)}.alt:hover:not(:disabled){transform:translateX(4px);border-color:var(--moss)}.alt:disabled{cursor:default}.alt:disabled:not(.ok):not(.bad){opacity:.55}
.alt.ok{background:var(--okb);border-color:var(--ok);animation:pop .4s}.alt.bad{background:var(--badb);border-color:var(--bad);animation:shake .4s}
.res{padding:12px 14px;border-radius:12px;margin-top:10px;animation:rise .35s both}.res.g{background:var(--okb)}.res.r{background:var(--badb)}
.qh{display:flex;justify-content:space-between;align-items:center}.tm{font-variant-numeric:tabular-nums;font-weight:700}
.fc{background:var(--card);border:2px dashed var(--moss);border-radius:20px;padding:28px 22px;min-height:220px;cursor:pointer;text-align:center;animation:fade .3s both}.fc.flip{animation:flip .45s both;text-align:left}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}.empty{color:var(--mut)}.big{font:800 3rem Fraunces,serif;color:var(--terra)}
footer{max-width:980px;margin:20px auto 30px;padding:14px 18px;border-top:2px solid var(--ink);color:var(--mut);font-size:.88rem}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}@keyframes rise{from{opacity:0;transform:translateY(14px)}}@keyframes grow{from{width:0}}@keyframes ring{from{stroke-dashoffset:213.6}}
@keyframes pop{50%{transform:scale(1.03)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes flip{from{transform:rotateY(80deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media(max-width:560px){h1{font-size:2rem}.ring{width:76px;height:76px}}

{"n":"Origem da Vida e Classificação dos Seres Vivos","p":2,"l":"B","d":"Taxonomia, nomenclatura e domínios da vida.","s":"Classificação e nomenclatura biológica|M;Teorias sobre a origem da vida|M;Hipótese endossimbiótica|M;Filogenia e cladogramas|M"}];
const C={
"Fluxo de energia e cadeias alimentares":["A energia entra nos ecossistemas pela fotossíntese e flui em sentido único pelos níveis tróficos: parte é usada na respiração e perdida como calor, e só uma fração passa ao nível seguinte. Por isso as cadeias alimentares têm poucos níveis.",["Produtor = 1º nível trófico; consumidor primário = 2º nível","Transferência média entre níveis ≈ 10% da energia","Energia: fluxo unidirecional; matéria: ciclo"],"Conte os níveis com cuidado: consumidor terciário é o 4º nível trófico, ou seja, três transferências a partir do produtor.","Em uma pastagem, a energia fixada pelas gramíneas sustenta gafanhotos, que são comidos por sapos, que por sua vez servem de alimento para cobras. Estimou-se que as gramíneas fixam 20 000 kJ por metro quadrado ao ano.","Considere que, em cada transferência entre níveis tróficos, apenas 10% da energia do nível anterior fica disponível ao nível seguinte. A energia disponível para as cobras, em kJ/m²/ano, é de:",["2 000","200","20","2","20 000"],2,"Gramíneas (produtores) → gafanhotos (consumidores primários) → sapos (secundários) → cobras (terciários): são três transferências de 10%. 20 000 × 0,1 = 2 000; × 0,1 = 200; × 0,1 = 20 kJ/m²/ano (C). A (2 000) é a energia disponível aos gafanhotos, após apenas uma transferência; B (200) é a dos sapos, após duas; D (2) resulta de aplicar uma transferência a mais; E (20 000) é a energia fixada pelos produtores, sem perdas."],
"Ciclos biogeoquímicos":["Elementos como carbono, nitrogênio e fósforo circulam entre seres vivos, atmosfera, solo e água. No ciclo do carbono, a fotossíntese fixa CO<sub>2</sub>; a respiração, a decomposição e a combustão o devolvem à atmosfera. A queima de combustíveis fósseis acrescenta ao ciclo carbono que ficou armazenado por milhões de anos.",["Fotossíntese: retira CO<sub>2</sub> da atmosfera","Respiração, decomposição e combustão: devolvem CO<sub>2</sub>","Combustíveis fósseis = carbono estocado há milhões de anos"],"Distinga o carbono do ciclo rápido (organismos e matéria orgânica recente) do carbono geológico (petróleo, carvão, gás natural).","A concentração de CO<sub>2</sub> na atmosfera aumentou desde a Revolução Industrial. Parte do CO<sub>2</sub> provém de processos naturais que já faziam parte do ciclo do carbono, e parte vem de atividades humanas que mobilizam carbono antes isolado do ciclo.","Qual processo adiciona à atmosfera carbono que estava armazenado em depósitos geológicos havia milhões de anos?",["A respiração celular de plantas e animais","A fotossíntese realizada pelo fitoplâncton","A queima de petróleo e de carvão mineral","A decomposição de folhas na serrapilheira","A dissolução do CO<sub>2</sub> nas águas oceânicas"],2,"A combustão de petróleo e carvão (C) libera carbono de depósitos geológicos, que estava fora do ciclo rápido. A respiração (A) e a decomposição (D) devolvem carbono de matéria orgânica recente, que já circulava no ciclo. A fotossíntese do fitoplâncton (B) retira CO<sub>2</sub> do ambiente, e a dissolução nos oceanos (E) apenas transfere CO<sub>2</sub> da atmosfera para a água; nenhuma delas libera carbono geológico."],
"Imunidade e vacinas":["A imunidade ativa é produzida pelo próprio organismo após contato com um antígeno, por infecção ou vacina; gera anticorpos e células de memória, com proteção duradoura. A imunidade passiva é obtida por anticorpos prontos, como os do soro, e age rápido, mas é temporária.",["Vacina → imunidade ativa → células de memória (proteção duradoura)","Soro → anticorpos prontos → imunidade passiva (proteção temporária)","Resposta secundária: mais rápida e intensa que a primária"],"Associe vacina a prevenção (ativa) e soro a ação imediata (passiva). Se a questão falar em memória imunológica, pense em vacina.","Após uma picada de cobra peçonhenta, aplica-se soro antiofídico, que contém anticorpos produzidos em outro animal. Já a vacina contra o tétano é aplicada antes de qualquer exposição e requer doses de reforço para manter a proteção.","A principal diferença entre a ação do soro antiofídico e a da vacina é que:",["a vacina estimula o organismo a produzir anticorpos e células de memória, enquanto o soro fornece anticorpos prontos, de ação rápida e temporária.","o soro estimula a produção de células de memória, enquanto a vacina fornece anticorpos prontos.","a vacina contém anticorpos de outro animal, o que garante proteção imediata e duradoura.","o soro e a vacina conferem imunidade ativa, diferindo apenas no tempo de aplicação.","a vacina altera o material genético do indivíduo, tornando-o resistente de forma permanente."],0,"A: vacina = imunidade ativa, com anticorpos e células de memória; soro = imunidade passiva, com anticorpos prontos que são degradados com o tempo. B inverte os conceitos. C atribui à vacina os anticorpos prontos, característicos do soro, e a proteção do soro não é duradoura. D erra ao classificar o soro como ativo: o organismo não produz os anticorpos. E é falsa: vacinas não alteram o genoma do indivíduo."],
"Primeira Lei de Mendel":["Cada característica é condicionada por um par de alelos que se separam na formação dos gametas (segregação). Em um cruzamento Aa × Aa, os gametas A e a são formados em proporções iguais. Nascimentos distintos são eventos independentes.",["Aa × Aa → 1 AA : 2 Aa : 1 aa","Fenótipos: 3 dominante : 1 recessivo","Eventos independentes: multiplicam-se as probabilidades"],"Pais sem a doença com filho afetado são heterozigotos. Verifique se o enunciado exige uma ordem específica de nascimentos.","A fenilcetonúria é uma doença hereditária de herança autossômica recessiva. Um casal sem a doença, ambos heterozigotos para o alelo causador, deseja estimar a chance de ocorrência em seus filhos.","Qual é a probabilidade de que o primeiro filho do casal seja afetado e o segundo não seja afetado, nessa ordem?",["1/4","1/16","9/16","3/8","3/16"],4,"Aa × Aa: P(aa) = 1/4 e P(não afetado) = 3/4. Eventos independentes: 1/4 × 3/4 = 3/16 (E). A (1/4) é a chance para um único filho; B (1/16) é a de dois filhos afetados; C (9/16) é a de dois filhos não afetados; D (3/8) corresponde a um afetado e um não afetado em qualquer ordem (2 × 3/16), mas o enunciado fixa a ordem."],
"Equilíbrio de Hardy-Weinberg":["Em uma população grande, com cruzamentos ao acaso, sem mutação, migração nem seleção, as frequências alélicas e genotípicas permanecem constantes. Com os alelos A (frequência p) e a (frequência q), p + q = 1 e as frequências genotípicas são p², 2pq e q².",["p + q = 1","p² + 2pq + q² = 1","q² = frequência dos recessivos (aa); 2pq = heterozigotos"],"Parta dos recessivos: q = √(q²). Depois calcule p = 1 − q e só então a frequência pedida.","A fibrose cística é uma doença autossômica recessiva. Em certa população europeia, considerada em equilíbrio de Hardy-Weinberg, 1 em cada 2 500 nascidos tem a doença.","Ignorando mutações e migrações, a frequência esperada de portadores heterozigotos nessa população é de:",["0,04%","2,00%","96,04%","3,92%","98,00%"],3,"q² = 1/2 500 = 0,0004 → q = 0,02 → p = 0,98. Heterozigotos: 2pq = 2 × 0,98 × 0,02 = 0,0392 = 3,92% (D). A (0,04%) é q², a frequência dos afetados; B (2%) é q, a frequência do alelo recessivo; C (96,04%) é p², dos homozigotos dominantes; E (98%) é p, a frequência do alelo dominante."],
"Seleção natural":["Populações apresentam variação hereditária, originada por mutação e recombinação, que ocorre ao acaso. O ambiente favorece as variantes mais bem-sucedidas na sobrevivência e na reprodução, e a frequência dessas características aumenta ao longo das gerações. A seleção atua sobre variação já existente; não a cria.",["Variação hereditária + reprodução diferencial → evolução","Mutações surgem ao acaso, não em resposta à necessidade","O indivíduo não evolui; a população muda ao longo das gerações"],"Desconfie de alternativas com ideia de necessidade ou esforço (“precisou…”, “passou a…”): isso é lamarckismo, não seleção natural.","Em laboratório, uma população de bactérias sensíveis a um antibiótico foi exposta ao medicamento. Quase todas morreram, mas algumas sobreviveram e se multiplicaram. Testes mostraram que a resistência decorria de uma mutação hereditária que já existia em raros indivíduos antes da exposição.","Do ponto de vista da teoria evolutiva atual, o aumento de bactérias resistentes na população ocorreu porque:",["o antibiótico induziu nas bactérias a mutação que confere resistência.","o antibiótico eliminou as bactérias sensíveis, e as resistentes, que já existiam, sobreviveram e transmitiram a mutação.","as bactérias desenvolveram resistência por necessidade e a transmitiram aos descendentes.","o uso constante do medicamento fortaleceu as bactérias, e essa característica adquirida foi herdada.","as bactérias sensíveis se aclimataram ao medicamento durante a exposição."],1,"B: a mutação era preexistente; o antibiótico foi o agente seletivo, e as bactérias portadoras sobreviveram e se reproduziram, aumentando a frequência da mutação. A é falsa: o texto diz que a mutação já existia, e mutações não são induzidas de forma direcionada pelo antibiótico. C e D expressam ideias lamarckistas (necessidade, uso e herança de características adquiridas). E trata de aclimatação, que não é hereditária e não explica a mudança na população."],
"Transporte através da membrana":["A osmose é a difusão de água através de membrana semipermeável, do meio de menor concentração de solutos para o de maior, sem gasto de ATP. Em meio hipertônico, a célula perde água; em meio hipotônico, ganha água. Células vegetais sofrem plasmólise em meio hipertônico e ficam túrgidas em meio hipotônico.",["Osmose: água do meio hipotônico → hipertônico","Hipertônico: mais soluto → a célula perde água","Difusão simples e osmose: transporte passivo (sem ATP)"],"Compare a concentração de solutos fora e dentro da célula: a água vai para onde há mais soluto.","Folhas de alface temperadas com sal murcham depois de alguns minutos. Considere que o citoplasma das células da folha tem concentração de solutos de cerca de 0,15 mol/L, que o molho de sal e vinagre tem cerca de 0,50 mol/L e que a membrana é permeável à água, mas pouco permeável ao sal.","O murchamento ocorre porque:",["o sal entra nas células por difusão simples e elas incham.","a água sai das células por transporte ativo, com gasto de ATP.","o molho é hipotônico em relação ao citoplasma e a água entra nas células.","a água sai das células por osmose, pois o molho é hipertônico em relação ao citoplasma.","o sal entra nas células por osmose, aumentando a pressão sobre a parede celular."],3,"O molho (0,50 mol/L) tem mais soluto que o citoplasma (0,15 mol/L): é hipertônico. A água sai por osmose, um transporte passivo, as células perdem turgor e a folha murcha (D). A contraria o dado de baixa permeabilidade ao sal e prevê inchaço, não murchamento; B exige ATP, mas a osmose é passiva; C inverte a relação de tonicidade; E aplica o termo osmose ao sal, quando ele se refere à água."],
"Fotossíntese e respiração celular":["Na fotossíntese, organismos clorofilados usam energia luminosa para converter CO<sub>2</sub> e água em glicose, liberando O<sub>2</sub>. Na respiração celular, a glicose é oxidada para produzir ATP, com consumo de O<sub>2</sub> e liberação de CO<sub>2</sub>. As plantas realizam as duas, e a respiração ocorre também no escuro.",["6 CO<sub>2</sub> + 6 H<sub>2</sub>O + luz → C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6 O<sub>2</sub>","C<sub>6</sub>H<sub>12</sub>O<sub>6</sub> + 6 O<sub>2</sub> → 6 CO<sub>2</sub> + 6 H<sub>2</sub>O + ATP","Plantas respiram o tempo todo; fotossintetizam só com luz"],"Plantas respiram 24 horas por dia. Em experimentos, compare as condições de luz: sem luz só resta a respiração.","Em um experimento, dois tubos fechados com água, azul de bromotimol e um ramo de planta aquática foram usados. O indicador é azul em meio neutro ou básico e amarelo em meio ácido; o CO<sub>2</sub> dissolvido forma ácido carbônico e acidifica a água. Após algumas horas, o tubo exposto à luz permaneceu azul, e o tubo mantido no escuro ficou amarelo.","A mudança de cor no tubo mantido no escuro deve-se ao fato de que:",["no escuro a planta fotossintetiza mais, liberando CO<sub>2</sub>.","sem luz não há fotossíntese, mas a respiração continua e libera CO<sub>2</sub>, que acidifica a água.","no escuro a planta interrompe a respiração e acumula ácidos produzidos pela fotossíntese.","a fotossíntese libera CO<sub>2</sub>, e sem luz esse gás permanece dissolvido.","a planta absorve O<sub>2</sub> no escuro, o que acidifica a água."],1,"B: sem luz a fotossíntese não ocorre, mas a respiração continua liberando CO<sub>2</sub>, que forma ácido carbônico e torna o indicador amarelo. Com luz, a fotossíntese consome o CO<sub>2</sub> da respiração e o meio permanece azul. A é falsa: a fotossíntese depende de luz e consome CO<sub>2</sub>. C é falsa: a respiração não para. D erra: a fotossíntese consome CO<sub>2</sub> e libera O<sub>2</sub>. E: absorver O<sub>2</sub> não acidifica a água."],
"Arboviroses e controle do vetor":["Dengue, zika e chikungunya são arboviroses causadas por vírus e transmitidas, no Brasil, principalmente pela fêmea do mosquito <i>Aedes aegypti</i>. O mosquito se reproduz em água parada acumulada em recipientes. A doença não passa de pessoa a pessoa por contato direto, e antibióticos não agem contra vírus.",["Ciclo do mosquito: ovo → larva → pupa → adulto (as três primeiras fases são aquáticas)","Controle do vetor: eliminar criadouros de água parada","Antibiótico: age em bactérias, não em vírus"],"Medidas “sobre o vetor” quase sempre envolvem eliminar criadouros, isto é, recipientes com água parada.","Em um bairro com aumento de casos de dengue, agentes de saúde visitaram residências e encontraram larvas do mosquito em pratos de vasos de plantas, pneus e tampas de caixas-d’água.","Qual medida atua diretamente sobre o ciclo de vida do vetor?",["Administrar antibióticos aos doentes para impedir que o mosquito se contamine.","Isolar os doentes em hospitais, pois o vírus passa de pessoa a pessoa por contato direto.","Aplicar inseticida nos rios da região, pois o mosquito se desenvolve em água corrente.","Ferver a água de beber, pois o vírus é transmitido por ingestão de água contaminada.","Eliminar recipientes com água parada, pois ovos, larvas e pupas do mosquito se desenvolvem na água."],4,"E: as fases imaturas do <i>Aedes aegypti</i> são aquáticas; sem água parada, o ciclo é interrompido. A é falsa: a dengue é viral e antibióticos não agem em vírus. B: não há transmissão direta entre pessoas; a transmissão é pela picada da fêmea. C: o mosquito se desenvolve em água parada, não em correnteza de rios. D: o vírus não é transmitido pela ingestão de água."],
"DNA recombinante":["A tecnologia do DNA recombinante combina DNA de espécies diferentes. Enzimas de restrição cortam o DNA em sítios específicos, as DNA-ligases unem fragmentos e plasmídeos funcionam como vetores que levam o gene às bactérias. Como o código genético é praticamente universal, a bactéria transformada pode sintetizar a proteína humana.",["Enzima de restrição: corta o DNA","DNA-ligase: une fragmentos de DNA","Plasmídeo: vetor que leva o gene à bactéria","Código genético praticamente universal"],"Memorize os papéis: restrição = tesoura; ligase = cola; plasmídeo = veículo.","A insulina humana para uso médico passou a ser produzida em larga escala por bactérias geneticamente modificadas, e não mais apenas extraída de pâncreas de animais.","Qual conjunto de etapas descreve corretamente esse processo?",["Isolar o gene da insulina humana, cortá-lo com enzimas de restrição, uni-lo a um plasmídeo com DNA-ligase e introduzir o plasmídeo em bactérias, que passam a sintetizar a proteína.","Extrair de bactérias o gene da insulina que elas já possuem naturalmente e multiplicá-lo em cultura.","Substituir todo o DNA bacteriano pelo genoma humano para que a bactéria se comporte como célula humana.","Usar DNA-ligases para cortar o gene humano e enzimas de restrição para uni-lo ao plasmídeo.","Introduzir RNA ribossômico humano nas bactérias, que passam a produzir insulina por tradução direta."],0,"A descreve o processo correto: a restrição corta, a ligase une, o plasmídeo é o vetor e a bactéria expressa a proteína graças ao código genético universal. B é falsa: bactérias não possuem naturalmente o gene da insulina humana. C é inviável e não corresponde à técnica. D troca as funções das enzimas. E é incorreta: o RNA ribossômico não carrega a informação da insulina, que está no gene (e no RNA mensageiro)."],
"Relações ecológicas":["Relações ecológicas podem ser harmônicas (sem prejuízo a nenhum dos envolvidos) ou desarmônicas (há prejuízo a ao menos um). No mutualismo, ambos se beneficiam; no comensalismo, um se beneficia e o outro não é afetado; no parasitismo, o parasita se beneficia e o hospedeiro é prejudicado; na competição, ambos são prejudicados pela disputa por recursos.",["Mutualismo (+/+)","Comensalismo (+/0)","Parasitismo (+/−)","Competição (−/−)","Predação (+/−, com morte da presa)"],"Monte o par de sinais (+, 0, −) para cada espécie e compare com as definições.","Os liquens resultam da associação entre um fungo e uma alga. A alga realiza fotossíntese e fornece compostos orgânicos ao fungo, enquanto o fungo fixa o líquen ao substrato e retém água e sais minerais que a alga utiliza. Em rochas nuas, essa associação consegue se estabelecer.","Do ponto de vista ecológico, a relação entre o fungo e a alga no líquen é classificada como:",["comensalismo, pois o fungo se beneficia e a alga não é afetada.","mutualismo, pois ambos os organismos se beneficiam da associação.","parasitismo, pois o fungo retira compostos da alga e a prejudica.","competição, pois alga e fungo disputam os mesmos recursos na rocha.","predação, pois o fungo mata as células da alga para se alimentar."],1,"B: ambos ganham (a alga fornece compostos orgânicos; o fungo oferece fixação, água e sais), o que caracteriza mutualismo. A ignora o benefício que a alga recebe; C e E supõem prejuízo ou morte da alga, o que o texto não indica; D descreve disputa, enquanto o texto descreve cooperação."],
"Efeito estufa e mudanças climáticas":["O efeito estufa é um fenômeno natural em que gases como CO<sub>2</sub>, CH<sub>4</sub> e vapor de água retêm parte do calor emitido pela superfície, mantendo a temperatura média do planeta adequada à vida. O problema atual é a intensificação desse efeito pelo aumento da concentração desses gases, principalmente pela queima de combustíveis fósseis e pelo desmatamento.",["Efeito estufa natural: necessário à vida","Intensificação: mais CO<sub>2</sub> e CH<sub>4</sub> → aquecimento global","Fontes humanas: combustíveis fósseis, desmatamento, queimadas, pecuária"],"Não confunda efeito estufa com o buraco na camada de ozônio: são fenômenos distintos.","Em debates sobre mudanças climáticas, é comum ouvir que o efeito estufa é “o grande vilão” do planeta. No entanto, sem os gases que retêm calor, a temperatura média da superfície terrestre seria bem inferior à atual, o que inviabilizaria a vida como a conhecemos.","Está correta a seguinte afirmação sobre o efeito estufa e o aquecimento global:",["O efeito estufa só existe por causa das atividades humanas e deve ser totalmente eliminado.","O aquecimento global é causado pelo buraco na camada de ozônio, que é o mesmo fenômeno do efeito estufa.","O efeito estufa resulta exclusivamente das emissões de gases por vulcões.","O efeito estufa é natural e mantém o planeta habitável; o aquecimento atual está associado ao aumento da concentração de gases estufa por atividades humanas, como a queima de combustíveis fósseis.","O aumento do CO<sub>2</sub> impede a entrada da radiação solar na atmosfera, o que resfria a superfície."],3,"D: o efeito estufa natural é necessário à vida (como diz o texto); o aquecimento atual decorre da intensificação do fenômeno por gases emitidos pelas atividades humanas. A é falsa: o fenômeno é natural. B confunde dois fenômenos distintos. C é falsa: as emissões humanas são a principal causa do aumento recente. E inverte o mecanismo: os gases retêm calor, não impedem a entrada da radiação solar."],
"Dinâmica de populações":["O tamanho de uma população varia por natalidade, mortalidade, imigração e emigração. O crescimento é limitado pela resistência do meio (alimento, espaço, predadores, doenças). O potencial biótico é o crescimento máximo sem essas limitações, e a capacidade de suporte é o tamanho máximo que o ambiente sustenta.",["ΔN = (natalidade + imigração) − (mortalidade + emigração)","Potencial biótico − resistência do meio = crescimento real","Capacidade de suporte (K): limite que o ambiente sustenta"],"Liste as entradas (nascimentos e imigrantes) e as saídas (mortes e emigrantes) antes de calcular.","Em uma ilha, uma população de 1 000 roedores de uma mesma espécie foi monitorada durante um ano. Nesse período, houve 120 nascimentos e 70 mortes; além disso, 30 indivíduos chegaram à ilha vindos de outras áreas e 20 deixaram a ilha.","Considerando apenas esses fatores, o tamanho da população ao final de um ano é de:",["1 060","1 050","1 150","1 080","1 120"],0,"ΔN = (120 + 30) − (70 + 20) = 60, logo N = 1 000 + 60 = 1 060 (A). B (1 050) ignora a migração (120 − 70); C (1 150) soma apenas as entradas; D (1 080) ignora a emigração (120 − 70 + 30); E (1 120) considera apenas os nascimentos."],
"Sucessão ecológica":["Sucessão ecológica é a substituição gradual das comunidades em uma área até uma comunidade estável, o clímax. A sucessão primária ocorre onde não havia solo nem vida (rocha nua, lava); a secundária, onde já havia solo e comunidade prévia, como em uma área abandonada após desmatamento. Ao longo do processo, tendem a aumentar a diversidade, a biomassa e a complexidade das teias alimentares.",["Pioneiros (liquens, musgos) → comunidade intermediária → clímax","Primária: sem solo prévio; secundária: solo já existente","Tendência: diversidade e biomassa crescem até o clímax"],"Se o enunciado diz que havia solo, pense em sucessão secundária, que é mais rápida.","Após uma erupção, a lava solidificada formou uma extensa área de rocha nua. Anos depois, os primeiros organismos a colonizá-la foram liquens, seguidos por musgos, plantas herbáceas e, muito tempo depois, arbustos e árvores.","Sobre o processo descrito, é correto afirmar que:",["os organismos pioneiros são substituídos por espécies mais simples, e a biomassa total diminui até o clímax.","trata-se de sucessão secundária, pois a colonização começou com a rocha já coberta por solo.","a comunidade clímax apresenta menor diversidade de espécies que a comunidade pioneira.","os liquens impedem a chegada de outras espécies e se mantêm como comunidade final.","trata-se de sucessão primária, em que os pioneiros modificam o substrato, formando solo e facilitando a chegada de outras espécies."],4,"E: a lava não tinha solo nem vida, portanto é sucessão primária; os liquens ajudam a formar solo e permitem a colonização por outras espécies. A inverte a tendência (a biomassa aumenta); B contraria o enunciado (rocha nua, sem solo); C inverte a tendência (a diversidade tende a aumentar até o clímax); D contraria o texto, que descreve a substituição por musgos, ervas e árvores."],
"Biomas brasileiros":["O Cerrado é a savana brasileira, localizada principalmente no Brasil Central, com estações seca e chuvosa bem definidas. Seus solos são ácidos e pobres em nutrientes, e a vegetação inclui gramíneas e árvores de troncos retorcidos e casca grossa, com raízes profundas e adaptações à seca e ao fogo. É considerado um hotspot de biodiversidade e tem sido muito convertido em áreas agrícolas.",["Cerrado: savana, duas estações, solos ácidos, adaptação ao fogo","Amazônia: floresta densa e úmida","Caatinga: clima semiárido, plantas caducifólias e espinhosas","Pampa: campos de gramíneas, clima subtropical"],"Associe cada bioma a uma palavra-chave: Cerrado = savana e fogo; Caatinga = semiárido; Pampa = campos; Amazônia = floresta úmida.","O Brasil possui seis biomas continentais, com clima, solo e vegetação distintos. Reconhecer essas características é essencial para planejar a conservação e o uso do solo em cada região.","Em relação ao Cerrado, é correto afirmar que ele apresenta:",["floresta densa e úmida, com chuvas bem distribuídas ao longo do ano e dossel contínuo.","vegetação de plantas espinhosas e caducifólias, em clima semiárido.","estações seca e chuvosa bem definidas, solos ácidos e vegetação de gramíneas e árvores esparsas de troncos retorcidos, com adaptações ao fogo.","predomínio de campos de gramíneas em clima subtropical, com poucas árvores.","vegetação de dunas e restingas ao longo do litoral, sob influência marinha."],2,"C descreve o Cerrado. A descreve a Amazônia; B, a Caatinga; D, o Pampa; E, formações litorâneas como as restingas, que não constituem o bioma de interior descrito."],
"Bioacumulação e biomagnificação":["Substâncias persistentes e pouco eliminadas, como o mercúrio e alguns pesticidas, acumulam-se nos tecidos dos organismos (bioacumulação). Como cada consumidor ingere muitos indivíduos do nível anterior, a concentração aumenta ao longo da cadeia alimentar (biomagnificação), e os predadores de topo são os mais afetados.",["Bioacumulação: acúmulo da substância nos tecidos de um organismo","Biomagnificação: aumento da concentração a cada nível trófico","Maiores concentrações: consumidores de topo"],"Energia diminui ao longo da cadeia; substâncias persistentes aumentam de concentração. Não confunda os dois padrões.","Em uma bacia hidrográfica contaminada por mercúrio, pesquisadores mediram a concentração do metal em organismos de uma cadeia alimentar: fitoplâncton, 0,01 mg/kg; peixe herbívoro, 0,10 mg/kg; peixe carnívoro, 1,00 mg/kg; ave piscívora, 10,0 mg/kg.","O padrão observado é explicado pela:",["biomagnificação: o mercúrio é persistente e pouco excretado, acumulando-se nos tecidos e se concentrando a cada transferência de nível trófico.","degradação do mercúrio pelo metabolismo dos consumidores, o que reduz sua concentração ao longo da cadeia.","produção de mercúrio pelo metabolismo dos predadores, que o sintetizam a partir da água.","diminuição da energia disponível em cada nível, que dilui o metal nos tecidos dos predadores.","absorção de mercúrio apenas pela ave, que o obtém diretamente do ar."],0,"A: o metal persistente se acumula nos tecidos e se concentra a cada nível trófico, o que explica o aumento de 0,01 para 10,0 mg/kg. B prevê queda da concentração, o contrário do observado. C é falsa: o mercúrio é um elemento químico, não é sintetizado por seres vivos. D mistura os conceitos: a energia diminui, mas isso não dilui o metal. E contraria os dados, que mostram contaminação em todos os níveis."],
"Pirâmides ecológicas":["Pirâmides ecológicas representam números, biomassa ou energia em cada nível trófico. A de energia nunca é invertida, pois a energia diminui a cada transferência. As de números e de biomassa podem ser invertidas: um grande produtor pode sustentar muitos herbívoros pequenos, e o fitoplâncton, de biomassa baixa mas renovação rápida, pode sustentar zooplâncton de maior biomassa.",["Pirâmide de energia: sempre com base larga","Pirâmide de números: pode ser invertida (1 árvore → milhares de insetos)","Pirâmide de biomassa: pode ser invertida em ambientes aquáticos (fitoplâncton)"],"Se a questão fala em pirâmide invertida, pense em números ou biomassa; a de energia é sempre normal.","Em uma floresta, um único ipê de grande porte (produtor) sustenta 8 000 lagartas, que servem de alimento para 300 aves insetívoras. Desenhada com o número de indivíduos por nível trófico, a pirâmide tem a base estreita, ou seja, é invertida. Já a pirâmide de energia desse mesmo ecossistema tem forma normal.","A pirâmide de energia não é invertida porque:",["o ipê armazena menos energia do que as lagartas, já que um único indivíduo tem pouco alimento.","a pirâmide de energia considera apenas o número de indivíduos de cada nível.","as aves insetívoras obtêm mais energia do que as lagartas, pois estão no topo.","a energia diminui a cada nível trófico, por perdas na respiração e como calor, independentemente do tamanho e do número de indivíduos.","os decompositores devolvem toda a energia aos produtores, mantendo a base larga."],3,"D: a energia disponível diminui a cada transferência, então a base da pirâmide de energia é sempre a maior. A é falsa: as lagartas só podem obter a energia que o ipê fixou, e parte dela se perde. B confunde energia com número de indivíduos. C inverte a relação: o topo recebe menos energia. E é falsa: a energia não é reciclada, ela se dissipa como calor."],
"Mitose e meiose":["Na mitose, uma célula origina duas células geneticamente idênticas, com o mesmo número de cromossomos (crescimento e renovação). Na meiose, uma célula diploide origina, por duas divisões sucessivas, quatro células haploides geneticamente diferentes. A redução do número de cromossomos ocorre na meiose I.",["Mitose: 1 célula 2n → 2 células 2n","Meiose: 1 célula 2n → 4 células n","Meiose I: separa homólogos (reducional); meiose II: separa cromátides-irmãs","Crossing-over: ocorre na prófase I e aumenta a variabilidade"],"Se o enunciado fala em gametas ou variabilidade, pense em meiose; crescimento e renovação, em mitose.","Em uma espécie de inseto, as células somáticas têm 12 cromossomos (2n = 12). Em um macho adulto, uma célula germinativa diploide entra em meiose completa para a formação de espermatozoides. Ignore falhas na divisão.","Ao término da meiose, essa célula terá originado:",["2 células, cada uma com 12 cromossomos.","2 células, cada uma com 6 cromossomos.","4 células, cada uma com 6 cromossomos.","4 células, cada uma com 12 cromossomos.","4 células, cada uma com 3 cromossomos."],2,"A meiose completa gera 4 células haploides (n = 6) (C). A descreve o resultado de uma mitose; B corresponde ao fim da meiose I, antes da segunda divisão; D mantém o número diploide, o que não ocorre na meiose; E divide o número de cromossomos mais uma vez, o que não acontece."],
"Herança ligada ao sexo":["Genes no cromossomo X têm herança ligada ao sexo. Em genes recessivos, homens (XY) manifestam a condição com um único alelo, pois não há outro alelo no Y; mulheres (XX) precisam de dois alelos recessivos. Por isso, essas condições são mais frequentes em homens, que recebem o X da mãe.",["X<sup>D</sup>X<sup>d</sup> × X<sup>D</sup>Y → 1/4 X<sup>D</sup>X<sup>D</sup> : 1/4 X<sup>D</sup>X<sup>d</sup> : 1/4 X<sup>D</sup>Y : 1/4 X<sup>d</sup>Y","Filho homem herda o X da mãe e o Y do pai","Sexo e fenótipo juntos: multiplique as probabilidades"],"Leia bem a pergunta: “menino E daltônico” (1/4) é diferente de “daltônico, sendo menino” (1/2).","O daltonismo para vermelho e verde é causado, em geral, por um alelo recessivo localizado no cromossomo X. Considere um casal em que a mulher é portadora do alelo (heterozigota) e o homem tem visão normal. Ignore mutações e considere que cada sexo tem probabilidade 1/2.","A probabilidade de o casal ter uma criança do sexo masculino e daltônica é de:",["1/2","1/4","1/8","3/4","0"],1,"X<sup>D</sup>X<sup>d</sup> × X<sup>D</sup>Y gera 1/4 X<sup>D</sup>X<sup>D</sup>, 1/4 X<sup>D</sup>X<sup>d</sup>, 1/4 X<sup>D</sup>Y e 1/4 X<sup>d</sup>Y. Menino daltônico (X<sup>d</sup>Y) = 1/2 × 1/2 = 1/4 (B). A (1/2) é a probabilidade de um menino ser daltônico, dado que é menino; C (1/8) multiplica por 1/2 mais uma vez; D (3/4) é a probabilidade complementar (não ser menino daltônico); E (0) supõe que o pai de visão normal impede o daltonismo nos filhos, mas o alelo vem da mãe."],
"Sistema circulatório":["Na circulação humana, que é dupla e completa, o sangue passa duas vezes pelo coração em cada volta. Na pequena circulação, o sangue pobre em O<sub>2</sub> sai do ventrículo direito pelas artérias pulmonares até os pulmões e retorna oxigenado pelas veias pulmonares ao átrio esquerdo. Na grande circulação, o ventrículo esquerdo bombeia o sangue pela aorta ao corpo, e ele retorna pelas veias cavas ao átrio direito.",["Artéria: sai do coração; veia: chega ao coração","Pequena: VD → artérias pulmonares → pulmões → veias pulmonares → AE","Grande: VE → aorta → corpo → veias cavas → AD"],"A artéria pulmonar é a exceção que leva sangue pobre em O<sub>2</sub>; a veia pulmonar leva sangue rico em O<sub>2</sub>.","Para estudar a circulação, um estudante convencionou chamar de artéria o vaso que sai do coração e de veia o vaso que chega a ele, independentemente do tipo de sangue transportado. Ele quer descrever o caminho do sangue após a troca de gases nos pulmões.","Qual descrição corresponde ao retorno do sangue oxigenado ao coração?",["Pelas artérias pulmonares, que levam o sangue ao átrio direito.","Pela veia cava superior, que leva o sangue ao átrio direito.","Pela aorta, que leva o sangue ao ventrículo esquerdo.","Pelas veias pulmonares, que levam o sangue ao átrio direito.","Pelas veias pulmonares, que levam o sangue ao átrio esquerdo."],4,"E: o sangue oxigenado deixa os pulmões pelas veias pulmonares e chega ao átrio esquerdo. A erra o tipo de vaso e o destino: as artérias pulmonares saem do coração. B descreve o retorno de sangue pobre em O<sub>2</sub> do corpo ao átrio direito. C descreve a saída do sangue do coração, e não o retorno. D acerta o vaso, mas erra o destino: o átrio direito recebe sangue pobre em O<sub>2</sub>."],
"Grupos vegetais e reprodução":["As plantas dividem-se em briófitas (sem vasos condutores), pteridófitas (com vasos, sem sementes), gimnospermas (sementes sem frutos) e angiospermas (flores, frutos e sementes). Os vasos condutores e a semente foram adaptações importantes para a vida fora da água.",["Briófitas: sem vasos; pteridófitas: com vasos, sem sementes","Gimnospermas: semente sem fruto; angiospermas: flor, fruto e semente","O fruto origina-se do ovário da flor; a semente, do óvulo"],"Fruto só existe em angiospermas. O pinhão, por exemplo, é semente de gimnosperma, não fruto.","Um estudante coletou quatro plantas em uma trilha: um musgo, uma samambaia, uma araucária (pinheiro-do-paraná) e um ipê. Ele precisa classificá-las pelas estruturas de condução de água e de reprodução.","Qual alternativa classifica corretamente essas plantas?",["O musgo não tem vasos condutores; a samambaia tem vasos, mas não produz sementes; a araucária produz sementes sem frutos; o ipê produz flores, frutos e sementes.","O musgo e a samambaia produzem sementes, mas só a samambaia tem vasos condutores.","A araucária produz flores e frutos, e por isso é uma angiosperma.","A samambaia não tem vasos condutores, e o ipê produz sementes sem frutos.","O musgo tem vasos condutores, e o ipê é uma gimnosperma."],0,"A descreve corretamente cada grupo. B erra ao atribuir sementes a musgos e samambaias, que se reproduzem por esporos. C erra: a araucária é gimnosperma, com sementes sem fruto. D inverte os dados: a samambaia tem vasos, e o ipê, como angiosperma, produz frutos. E erra duas vezes: o musgo não tem vasos, e o ipê é angiosperma."],
"Artrópodes e exoesqueleto":["Artrópodes (insetos, aracnídeos, crustáceos e miriápodes) têm corpo segmentado, apêndices articulados e exoesqueleto de quitina. Como o exoesqueleto rígido não acompanha o crescimento, o animal cresce por mudas (ecdise). O exoesqueleto protege contra predadores e contra a perda de água.",["Exoesqueleto de quitina → crescimento por ecdise (muda)","Insetos: 3 pares de patas; aracnídeos: 4 pares de patas, sem antenas","Crustáceos: 2 pares de antenas"],"Aranha não é inseto: tem 4 pares de patas e não tem antenas.","Um caranguejo cresce em etapas: em certos momentos abandona o exoesqueleto antigo, fica com o corpo mole por algum tempo e, em seguida, endurece o novo revestimento, agora maior.","Esse padrão de crescimento por etapas ocorre porque:",["o exoesqueleto de quitina cresce continuamente com o animal, mas é renovado periodicamente por desgaste.","o caranguejo possui esqueleto interno de cálcio, que se quebra e se refaz a cada estação.","o exoesqueleto rígido não acompanha o crescimento do corpo e é substituído por outro maior na ecdise.","o animal adulto passa a viver sem exoesqueleto depois da primeira muda.","o corpo mole é uma fase larval que ocorre uma única vez, logo após o nascimento."],2,"C: o exoesqueleto de quitina é rígido e não se expande, então o animal precisa trocá-lo (ecdise) para crescer, e o novo endurece depois. A contraria o texto: o exoesqueleto não cresce junto com o animal. B é falsa: crustáceos têm exoesqueleto, não esqueleto interno de cálcio. D é falsa: o animal continua com exoesqueleto. E contraria o texto, que descreve a repetição do processo."],
"Folhetos embrionários e tecidos":["Na gastrulação, o embrião forma os folhetos germinativos: ectoderme, mesoderme e endoderme. A ectoderme origina a epiderme e o sistema nervoso; a mesoderme, músculos, ossos, sangue e rins; a endoderme, o revestimento do tubo digestório e das vias respiratórias, além de fígado e pâncreas.",["Ectoderme: epiderme e sistema nervoso","Mesoderme: músculos, ossos, sangue, rins","Endoderme: revestimento do tubo digestório e respiratório, fígado, pâncreas"],"Ecto = fora (pele e nervos); endo = dentro (tubo digestório); meso = meio (músculos e ossos).","Em um laboratório de embriologia, estudantes acompanham o desenvolvimento de um embrião de vertebrado após a gastrulação. Eles marcaram células de cada folheto embrionário com corantes diferentes, para observar o destino de cada uma.","Qual associação entre o folheto embrionário e o tecido ou órgão que ele origina está correta?",["Endoderme — epiderme e neurônios.","Ectoderme — músculos e ossos.","Mesoderme — revestimento interno do intestino.","Ectoderme — fígado e pâncreas.","Mesoderme — músculos esqueléticos e sangue."],4,"E: a mesoderme origina músculos, ossos, sangue e rins. A atribui à endoderme derivados da ectoderme (epiderme e neurônios). B atribui à ectoderme derivados da mesoderme. C atribui à mesoderme o revestimento do intestino, que vem da endoderme. D atribui à ectoderme órgãos de origem endodérmica."],
"Classificação e nomenclatura biológica":["Os seres vivos são agrupados em categorias taxonômicas hierárquicas: espécie, gênero, família, ordem, classe, filo, reino e domínio. Pela nomenclatura binomial, de Lineu, o nome científico da espécie combina o gênero (inicial maiúscula) e o epíteto específico (minúscula), em itálico. Hoje se reconhecem três domínios: Bacteria, Archaea e Eukarya.",["Hierarquia: domínio → reino → filo → classe → ordem → família → gênero → espécie","Nome científico: <i>Gênero espécie</i> (gênero com inicial maiúscula)","Três domínios: Bacteria, Archaea, Eukarya"],"Espécies do mesmo gênero são mais próximas entre si do que de espécies de gêneros diferentes.","Quatro espécies foram listadas em um catálogo de mamíferos: <i>Panthera leo</i>, <i>Panthera tigris</i>, <i>Felis catus</i> e <i>Canis lupus</i>.","De acordo com a nomenclatura biológica, é correto afirmar que:",["<i>Panthera leo</i> e <i>Felis catus</i> pertencem ao mesmo gênero.","<i>Panthera leo</i> e <i>Panthera tigris</i> pertencem ao mesmo gênero, mas a espécies diferentes.","<i>Felis catus</i> e <i>Canis lupus</i> pertencem à mesma espécie, mas a gêneros diferentes.","<i>tigris</i> é o gênero e <i>Panthera</i> é a espécie.","<i>Canis lupus</i> e <i>Panthera tigris</i> pertencem ao mesmo gênero, por serem mamíferos carnívoros."],1,"B: o primeiro termo é o gênero (<i>Panthera</i>) e o segundo, o epíteto específico, que diferencia as espécies <i>leo</i> e <i>tigris</i>. A é falsa: os gêneros são <i>Panthera</i> e <i>Felis</i>. C é falsa: uma espécie não pode ter dois gêneros. D inverte gênero e epíteto. E confunde gênero com grupos mais amplos: ser mamífero carnívoro não define o gênero."],
"Métodos contraceptivos e prevenção de ISTs":["Métodos contraceptivos atuam impedindo a ovulação (como a pílula hormonal), a fecundação ou a implantação. O preservativo (masculino ou feminino) é uma barreira física que, além de reduzir o risco de gravidez, reduz o risco de transmissão de várias infecções sexualmente transmissíveis (ISTs), como HIV e sífilis. Pílula, DIU e outros métodos hormonais ou de implantação não protegem contra ISTs.",["Preservativo: barreira física; reduz risco de gravidez e de ISTs","Pílula hormonal: atua sobretudo impedindo a ovulação; não protege contra ISTs","DIU: não protege contra ISTs"],"Se a questão pede proteção contra ISTs, só o preservativo atende; métodos hormonais e DIU não protegem.","Em uma campanha de saúde em uma escola, o objetivo era informar os estudantes sobre métodos que evitam a gravidez e sobre a prevenção de infecções sexualmente transmissíveis (ISTs).","Qual afirmação descreve corretamente a ação desses métodos?",["A pílula anticoncepcional hormonal previne a gravidez e também protege contra o HIV.","O DIU de cobre protege contra ISTs por formar uma barreira entre os parceiros.","O preservativo atua apenas na prevenção da gravidez, sem relação com as ISTs.","O preservativo é uma barreira física que reduz o risco de gravidez e de transmissão de várias ISTs, ao contrário dos métodos hormonais.","Todos os métodos contraceptivos, por impedirem a fecundação, previnem ISTs."],3,"D: o preservativo é barreira física e reduz o risco de gravidez e de várias ISTs; métodos hormonais não protegem contra ISTs. A erra: a pílula não protege contra HIV. B erra: o DIU atua no útero e não forma barreira entre os parceiros. C ignora o papel do preservativo na prevenção de ISTs. E generaliza de forma incorreta: impedir a fecundação não impede a transmissão de agentes infecciosos."],
"Eutrofização":["Eutrofização é o enriquecimento de corpos d'água com nutrientes, como nitrogênio e fósforo, vindos de esgoto doméstico e adubos agrícolas. Isso favorece a proliferação de algas e cianobactérias; ao morrerem, são decompostas por bactérias aeróbias que consomem o oxigênio dissolvido, e peixes e outros organismos podem morrer por falta de O<sub>2</sub>.",["Excesso de N e P → proliferação de algas","Decomposição aeróbia → queda do O<sub>2</sub> dissolvido","Consequência: mortandade de peixes e perda de biodiversidade"],"A mortandade de peixes na eutrofização se deve à falta de oxigênio consumido na decomposição, e não ao excesso de algas em si.","Um lago próximo a uma área agrícola e a um bairro sem tratamento de esgoto passou a ter a água esverdeada no verão. Algumas semanas depois, muitos peixes apareceram mortos na margem, embora não tenha havido lançamento de substâncias tóxicas.","A mortandade de peixes está relacionada principalmente ao(à):",["enriquecimento da água com nutrientes, proliferação de algas e consumo do oxigênio dissolvido durante a decomposição.","aumento da quantidade de oxigênio na água, que se torna tóxico para os peixes.","diminuição das algas, que deixam os peixes sem alimento imediato.","diminuição da temperatura da água causada pelas algas, que provoca choque térmico.","ação direta de bactérias que liberam gás oxigênio e provocam embolia nos peixes."],0,"A: o excesso de nutrientes (esgoto e adubos) leva à proliferação de algas; sua morte e decomposição por bactérias aeróbias consomem o oxigênio dissolvido, e os peixes morrem por falta de O<sub>2</sub>. B inverte o processo: o oxigênio diminui. C contraria o texto, que descreve água esverdeada, isto é, muitas algas. D e E atribuem causas sem relação com o processo descrito."],
"Resíduos sólidos e destinação adequada":["Resíduos sólidos urbanos podem ter destinação adequada em aterros sanitários (solo impermeabilizado, com tratamento do chorume e dos gases), compostagem (resíduos orgânicos viram adubo) e reciclagem (papel, vidro, metais e plásticos voltam à produção). Lixões a céu aberto contaminam solo e água subterrânea, atraem vetores e liberam gases.",["Aterro sanitário: solo impermeabilizado; chorume e gases tratados","Lixão: sem controle; contamina solo e águas","Compostagem: resíduos orgânicos → composto; reciclagem: materiais secos"],"A ordem de prioridade é reduzir, reutilizar e reciclar; a disposição final só deve receber o que não puder ser aproveitado.","Um município descartava seus resíduos em um lixão a céu aberto, onde se acumulava um líquido escuro (chorume) que escorria para o solo. Após uma mudança, passou a enviar os resíduos para um aterro sanitário e a separar os restos de alimentos para a produção de adubo.","As mudanças adotadas reduzem os impactos ambientais porque:",["o aterro sanitário elimina totalmente a produção de resíduos e a compostagem produz combustíveis fósseis.","o aterro sanitário impermeabiliza o solo e trata o chorume e os gases, e a compostagem transforma resíduos orgânicos em adubo.","o lixão e o aterro sanitário são equivalentes, e a compostagem apenas aumenta o volume de lixo.","o aterro sanitário queima o lixo a céu aberto, evitando o acúmulo de chorume.","a compostagem utiliza resíduos plásticos e metais, que se decompõem rapidamente em adubo."],1,"B: o aterro sanitário protege solo e água ao impermeabilizar a base e tratar chorume e gases, e a compostagem aproveita a matéria orgânica. A é falsa: o aterro recebe resíduos, não os elimina, e a compostagem não gera combustíveis fósseis. C ignora as diferenças de controle. D é falsa: não há queima a céu aberto em aterro sanitário. E é falsa: plásticos e metais não se decompõem rapidamente."],
"Esquistossomose e saneamento básico":["A esquistossomose é causada pelo platelminto <i>Schistosoma mansoni</i>. Os ovos eliminados nas fezes de pessoas infectadas chegam à água; as larvas infectam caramujos do gênero <i>Biomphalaria</i> e, depois, larvas (cercárias) liberadas na água penetram na pele de pessoas em contato com lagoas e rios. A prevenção envolve saneamento básico e evitar o contato com água de focos.",["Agente: platelminto <i>Schistosoma mansoni</i>","Hospedeiro intermediário: caramujo <i>Biomphalaria</i>","Infecção: cercárias penetram na pele em água contaminada","Prevenção: saneamento básico e tratamento de esgoto"],"Se aparecer ciclo com caramujo, pense em esquistossomose; a medida estrutural é o saneamento básico.","Em uma comunidade ribeirinha sem rede de esgoto, vários moradores que se banhavam em uma lagoa tiveram esquistossomose. Verificou-se que o esgoto da vila corria para a lagoa, onde havia caramujos.","Qual medida atua de forma mais direta na interrupção do ciclo de transmissão?",["Administrar vacina contra o verme antes do banho na lagoa.","Ferver a água de beber, pois o verme é transmitido por ingestão.","Lavar as mãos antes das refeições, já que as cercárias penetram pelo aparelho digestivo.","Implantar tratamento de esgoto para que os ovos não cheguem à lagoa e evitar o contato com água de focos.","Eliminar mosquitos, pois eles transportam as larvas entre as pessoas."],3,"D: tratar o esgoto impede que os ovos cheguem à água e infectem os caramujos, e evitar a água de focos impede a penetração das cercárias. A é falsa: não há vacina contra o verme. B e C erram a via de infecção, que é a pele. E erra o vetor: a transmissão envolve caramujos, não mosquitos."],
"Homologia, analogia e convergência evolutiva":["Órgãos homólogos têm a mesma origem embrionária, mesmo com funções diferentes (braço humano, asa de morcego, nadadeira de baleia) e indicam ancestral comum. Órgãos análogos têm a mesma função, mas origens diferentes (asa de inseto e asa de ave), e resultam de convergência evolutiva, em que pressões ambientais semelhantes selecionam características semelhantes.",["Homologia: mesma origem, funções podem diferir → ancestral comum","Analogia: mesma função, origem diferente → convergência","Convergência: pressões seletivas semelhantes em linhagens distintas"],"Mesma origem = homólogo; mesma função = análogo.","Golfinhos (mamíferos) e tubarões (peixes cartilaginosos) têm corpo hidrodinâmico e nadadeiras semelhantes, apesar de pertencerem a grupos distantes. Já os ossos do membro anterior de um golfinho são organizados de forma semelhante aos do braço humano.","Considerando o texto, é correto afirmar que:",["as nadadeiras de golfinhos e tubarões são homólogas, pois têm a mesma função e a mesma origem.","o membro anterior do golfinho e o braço humano são análogos, pois têm funções diferentes.","a semelhança entre golfinhos e tubarões indica que ambos descendem de um ancestral aquático recente.","a semelhança no formato do corpo de golfinhos e tubarões prova que um grupo deu origem ao outro.","a forma semelhante de golfinhos e tubarões resulta de convergência (analogia), e os ossos do membro anterior do golfinho e do braço humano são homólogos."],4,"E: a forma semelhante em grupos distantes vem de pressões do ambiente aquático (convergência, analogia); a organização óssea semelhante ao braço humano indica ancestral comum (homologia). A erra: as nadadeiras têm origens diferentes, logo são análogas. B inverte: mesma origem indica homologia, mesmo com funções distintas. C erra: o ancestral dos mamíferos do grupo era terrestre, e a semelhança não indica ancestral comum recente. D é falsa: não há relação de origem entre os dois grupos."],
"Código genético e síntese de proteínas":["A informação do DNA é transcrita em RNA mensageiro (mRNA) e traduzida em proteínas nos ribossomos. Na transcrição, a fita molde do DNA é copiada em mRNA com pareamento A–U, T–A, C–G e G–C. Na tradução, cada códon (trinca de bases) especifica um aminoácido; AUG é o códon de iniciação (metionina) e UAA, UAG e UGA são códons de parada.",["Transcrição: DNA → mRNA (fita molde: A→U, T→A, C→G, G→C)","Tradução: códon (3 bases do mRNA) → aminoácido","AUG: início (Met); UAA, UAG, UGA: parada"],"Primeiro monte o mRNA pareando com a fita molde; só depois separe os códons a partir do AUG.","Um trecho da fita molde de um gene foi sequenciado e escrito no sentido 3′ → 5′: TAC CCT GGA ATC. Considere os códons do mRNA (5′ → 3′) e seus significados: AUG = metionina (Met), GGA = glicina (Gly), CCU = prolina (Pro), UAC = tirosina (Tyr), AUC = isoleucina (Ile), UAG = parada.","Ao final da tradução do mRNA formado a partir desse trecho, qual peptídeo é produzido?",["Tyr-Pro-Gly-Ile","Met-Pro-Gly","Met-Gly-Pro","Met-Gly-Pro-Ile","Gly-Pro"],2,"A fita molde 3′-TACCCTGGAATC-5′ gera o mRNA 5′-AUGGGACCUUAG-3′, com códons AUG GGA CCU UAG: Met-Gly-Pro, e a tradução termina em UAG (C). A lê a fita molde como se fosse o mRNA (trocando T por U) em vez de pareá-la; B inverte a ordem dos dois últimos aminoácidos; D acrescenta isoleucina, mas o último códon (UAG) é de parada; E ignora a metionina, mas a tradução começa no AUG."],
"Sistema digestório e digestão química":["A digestão química quebra macromoléculas em moléculas pequenas absorvíveis, por ação de enzimas: a amilase (salivar e pancreática) digere o amido; a pepsina, no estômago ácido, e a tripsina, no intestino, digerem proteínas; as lipases digerem lipídios, com ajuda da bile, que emulsifica as gorduras. A absorção ocorre principalmente no intestino delgado, cujas vilosidades aumentam a superfície.",["Amido → maltose/glicose (amilase)","Proteínas → aminoácidos (pepsina, tripsina)","Lipídios → ácidos graxos + glicerol (lipases; bile emulsifica)","Absorção: intestino delgado (vilosidades)"],"A bile não é enzima: ela emulsifica as gorduras, aumentando a ação das lipases.","Uma estudante fez uma refeição composta por pão (amido), ovo (proteínas) e manteiga (lipídios). Ela quer entender onde e como cada nutriente é digerido e absorvido.","Qual afirmação descreve corretamente esse processo?",["A bile, produzida pelo fígado, é uma enzima que digere as proteínas do ovo no estômago.","As lipases digerem os lipídios, com ajuda da bile, que emulsifica as gorduras e aumenta a superfície de ação das enzimas.","O amido é digerido exclusivamente no estômago, pela ação da pepsina.","A maior parte da absorção de nutrientes ocorre no estômago, pois suas paredes têm vilosidades.","As proteínas são digeridas na boca, pela amilase salivar, e absorvidas no esôfago."],1,"B: a bile emulsifica as gorduras e as lipases as digerem. A erra: a bile não contém enzimas e atua no intestino, sobre lipídios. C erra: a digestão do amido começa na boca (amilase salivar) e continua no intestino; a pepsina digere proteínas. D erra: a absorção principal ocorre no intestino delgado, que tem as vilosidades. E erra: a amilase atua sobre o amido, e o esôfago apenas conduz o alimento."],
"Sistema endócrino e controle da glicemia":["Hormônios são mensageiros químicos produzidos por glândulas endócrinas e transportados pelo sangue. No controle da glicemia, a insulina, produzida pelo pâncreas, estimula a captação de glicose pelas células e seu armazenamento como glicogênio, reduzindo a glicemia; o glucagon estimula a quebra do glicogênio no fígado, elevando a glicemia.",["Insulina: reduz a glicemia (glicose → células; glicogênio)","Glucagon: eleva a glicemia (quebra do glicogênio no fígado)","Regulação por retroalimentação negativa"],"Insulina e glucagon têm efeitos opostos: a insulina abaixa a glicemia; o glucagon a eleva.","Após uma refeição rica em carboidratos, a concentração de glicose no sangue de uma pessoa saudável aumenta e, algumas horas depois, retorna aos valores normais. Em um jejum prolongado, a glicemia se mantém dentro de limites estreitos.","Sobre a regulação da glicemia nessas duas situações, é correto afirmar que:",["após a refeição, aumenta a secreção de glucagon, que promove a entrada de glicose nas células.","no jejum, aumenta a secreção de insulina, que estimula a quebra do glicogênio hepático.","após a refeição, o fígado transforma o glicogênio em glicose, elevando ainda mais a glicemia.","após a refeição, o pâncreas aumenta a secreção de insulina, que reduz a glicemia, e no jejum o glucagon estimula a liberação de glicose pelo fígado.","tanto no jejum quanto após a refeição, a glicemia é controlada apenas pela insulina, que sempre aumenta a glicemia."],3,"D: a insulina reduz a glicemia após a refeição, e o glucagon a mantém no jejum ao estimular a liberação de glicose pelo fígado. A inverte o papel do glucagon. B inverte o papel da insulina. C erra: após a refeição o fígado armazena glicose como glicogênio. E erra: a insulina reduz a glicemia, e o glucagon também participa do controle."],
"Vertebrados e adaptações à vida terrestre":["A conquista do ambiente terrestre pelos vertebrados envolveu adaptações como pulmões, pele impermeável com queratina, ovo com casca e membranas extraembrionárias (como o âmnio) e fecundação interna. Os anfíbios dependem da água para a reprodução (ovos sem casca); répteis, aves e mamíferos são amniotas, com embrião protegido pelo âmnio.",["Anfíbios: pele úmida e permeável; ovos sem casca, postos na água","Amniotas (répteis, aves, mamíferos): âmnio e independência da água","Répteis e aves: ovo com casca; mamíferos: glândulas mamárias"],"O âmnio é a chave: ele permitiu que o embrião se desenvolvesse fora da água.","Um zoólogo compara um sapo, um lagarto e um gavião. O sapo precisa ficar em ambientes úmidos e põe ovos em lagoas, enquanto o lagarto e o gavião põem ovos em locais secos, e seus embriões se desenvolvem protegidos.","A independência da água para a reprodução em lagartos e gaviões está associada principalmente:",["ao ovo com casca e às membranas extraembrionárias, como o âmnio, que protegem o embrião contra a desidratação.","à pele permeável, que permite trocas gasosas e retém a água do embrião.","à fecundação externa, que dispensa o contato entre machos e fêmeas.","à presença de brânquias nos embriões, que absorvem a água do solo.","à ausência de pulmões, que reduz a perda de água por evaporação."],0,"A: o ovo com casca e o âmnio protegem o embrião da desidratação em ambiente seco. B descreve a pele dos anfíbios, que perde água com facilidade. C erra: a fecundação nesses grupos é interna. D e E são falsas: os embriões não absorvem água do solo por brânquias, e lagartos e gaviões têm pulmões."],
"Transporte de seiva e transpiração":["A água absorvida pelas raízes sobe pelo xilema até as folhas. A transpiração, isto é, a perda de vapor d'água pelos estômatos, cria uma tensão que puxa a coluna de água, auxiliada pela coesão entre as moléculas de água. Os estômatos regulam a perda de água e a entrada de CO<sub>2</sub>. A seiva elaborada (açúcares) é transportada pelo floema.",["Xilema: seiva bruta (água e sais), das raízes às folhas","Floema: seiva elaborada (açúcares), das folhas aos demais órgãos","Transpiração + coesão da água → ascensão da seiva bruta","Estômatos: trocas gasosas e perda de água"],"Tempo seco e quente aumenta a transpiração; estômatos fechados reduzem a perda de água, mas também a entrada de CO<sub>2</sub>.","Em um experimento, dois ramos de uma mesma planta foram colocados em frascos com água e corante. Em um dos ramos, as folhas foram cobertas com uma película impermeável que impediu a saída de vapor d'água. Após algumas horas, o corante subiu bastante no ramo com folhas livres e pouco no ramo com folhas cobertas.","Esse resultado é explicado porque:",["o floema transporta o corante das folhas para as raízes, e a película bloqueia esse fluxo.","a película aumenta a fotossíntese, que consome a água do xilema.","a película impede a absorção de água pelas raízes, que ocorre pelas folhas.","o corante é transportado apenas pelo floema, que depende da fotossíntese.","a transpiração pelas folhas cria tensão que puxa a coluna de água pelo xilema; sem ela, a subida do corante diminui."],4,"E: a película impediu a transpiração; sem a tensão criada pela perda de vapor, a subida de água e corante pelo xilema diminui. A erra: o floema não conduz água das folhas para as raízes como explicação do resultado, e o corante subiu. B é falsa: a película não aumenta a fotossíntese. C é falsa: a água é absorvida pelas raízes. D erra: o corante subiu pelo xilema, não pelo floema."],
"Ciclo menstrual e hormônios":["O ciclo menstrual dura, em média, 28 dias e é controlado por hormônios da hipófise (FSH e LH) e dos ovários (estrógeno e progesterona). O FSH estimula o amadurecimento dos folículos; o pico de LH desencadeia a ovulação; o corpo lúteo produz progesterona, que mantém o endométrio. Se não há fecundação, o corpo lúteo regride, os hormônios caem e ocorre a menstruação.",["FSH: amadurece folículos; LH: ovulação (pico) e corpo lúteo","Estrógeno: reconstrói o endométrio; progesterona: mantém o endométrio","Sem fecundação: queda hormonal → menstruação"],"A ovulação ocorre logo após o pico de LH, aproximadamente na metade de um ciclo de 28 dias.","Em um ciclo menstrual regular de 28 dias, o primeiro dia da menstruação é contado como dia 1. Uma estudante analisa o gráfico hormonal do ciclo, em que há um pico de LH pouco antes da metade do ciclo.","O pico de LH observado desencadeia:",["a menstruação, por causar a descamação do endométrio.","a produção de FSH pela hipófise, que inicia o amadurecimento dos folículos.","a ovulação, isto é, a liberação do óvulo pelo folículo maduro.","a fecundação, que ocorre dentro do ovário.","a implantação do embrião, pois o LH estimula o útero diretamente."],2,"C: o pico de LH desencadeia a ovulação. A erra: a menstruação decorre da queda de progesterona e estrógeno, sem fecundação. B erra: o FSH age no início do ciclo, e o LH não o produz. D erra: a fecundação ocorre geralmente na tuba uterina, e depende de gametas. E erra: o pico de LH ocorre antes da ovulação, e a implantação é posterior."],
"Teorias sobre a origem da vida":["A abiogênese defendia que seres vivos surgem espontaneamente da matéria bruta; foi contestada por Redi (larvas surgiam em carne exposta a moscas) e por Pasteur (frascos de pescoço de cisne). A biogênese estabelece que todo ser vivo se origina de outro ser vivo. A hipótese atual para a Terra primitiva propõe evolução química gradual de moléculas orgânicas simples, como nos experimentos de Miller e Urey.",["Abiogênese: geração espontânea (refutada por Redi e Pasteur)","Biogênese: todo ser vivo vem de outro ser vivo","Miller e Urey: moléculas orgânicas formadas em condições simuladas da Terra primitiva"],"Redi está ligado à carne em frascos com e sem gaze; Pasteur, aos frascos de pescoço de cisne.","No século XVII, Francesco Redi colocou pedaços de carne em frascos: uns abertos, outros cobertos com gaze (que deixa passar o ar, mas não as moscas) e outros vedados. Larvas surgiram na carne dos frascos abertos; nos frascos com gaze, as moscas pousavam na gaze, mas não surgiram larvas na carne.","Esse experimento permite concluir que:",["a vida surge espontaneamente da carne em decomposição quando há ar.","o ar é a causa da formação de larvas, e por isso os frascos vedados as impediram.","as larvas se originam da própria carne, independentemente da presença de moscas.","a gaze produz larvas quando entra em contato com a carne.","as larvas não surgem espontaneamente da carne, mas resultam de ovos postos por moscas que têm acesso a ela."],4,"E: as larvas só apareceram onde as moscas puderam pôr ovos, o que refuta a geração espontânea. A e C contrariam o resultado. B é descartada pelos frascos com gaze, que deixam passar o ar e não tiveram larvas na carne. D é falsa: a gaze não produz larvas."],
"Organismos transgênicos":["Organismos transgênicos recebem um gene de outra espécie, que passa a ser expresso neles. O gene de interesse é inserido por vetores ou outras técnicas. Exemplos são milho e soja resistentes a insetos (gene Bt) ou a herbicidas e bactérias que produzem insulina humana. Cada produto passa por avaliação de biossegurança antes da liberação.",["Transgênico: recebe gene de outra espécie","Expressão: o organismo passa a produzir a proteína do gene inserido","Milho Bt: gene de <i>Bacillus thuringiensis</i> que codifica proteína tóxica a certas lagartas"],"Diferencie transgênico (gene de outra espécie) de melhoramento por cruzamento (variação da própria espécie).","Uma variedade de milho recebeu um gene da bactéria <i>Bacillus thuringiensis</i> que codifica uma proteína tóxica para lagartas que atacam a lavoura. As plantas passaram a produzir essa proteína em suas folhas.","A resistência do milho às lagartas é possível porque:",["o gene bacteriano foi incorporado ao genoma do milho e é expresso, produzindo a proteína tóxica às lagartas.","bactérias passaram a viver nas folhas e produzem a proteína sem alterar o genoma do milho.","o gene bacteriano foi inserido nas lagartas, que se tornam incapazes de se alimentar.","o milho sofreu mutação espontânea que o fez produzir a proteína, sem receber gene externo.","o milho produz a proteína apenas se for cruzado com outra variedade convencional de milho."],0,"A: o gene incorporado ao genoma do milho é transcrito e traduzido, e a planta produz a proteína. B contraria o texto: a planta recebeu o gene e produz a proteína, não bactérias. C erra o alvo: o gene foi inserido na planta, não nas lagartas. D contraria o texto, que descreve a inserção de um gene externo. E é falsa: a característica decorre do gene inserido, não de cruzamento."],
"Sistema ABO e polialelia":["O sistema ABO é um caso de alelos múltiplos (polialelia): I<sup>A</sup> e I<sup>B</sup> são codominantes e dominantes sobre <i>i</i>. Os fenótipos são A (I<sup>A</sup>I<sup>A</sup> ou I<sup>A</sup><i>i</i>), B (I<sup>B</sup>I<sup>B</sup> ou I<sup>B</sup><i>i</i>), AB (I<sup>A</sup>I<sup>B</sup>) e O (<i>ii</i>). O fator Rh é determinado por outro gene.",["Fenótipo A: I<sup>A</sup>I<sup>A</sup> ou I<sup>A</sup>i; fenótipo B: I<sup>B</sup>I<sup>B</sup> ou I<sup>B</sup>i","AB: I<sup>A</sup>I<sup>B</sup> (codominância); O: ii","Pais A e B com filho O → ambos heterozigotos (I<sup>A</sup>i × I<sup>B</sup>i)"],"Se o casal tem um filho tipo O, ambos os pais carregam ao menos um alelo i.","Um casal tem sangue tipo A e tipo B, e o primeiro filho do casal tem sangue tipo O. Considere que o gene do sistema ABO tem três alelos (I<sup>A</sup>, I<sup>B</sup> e <i>i</i>), em que I<sup>A</sup> e I<sup>B</sup> são codominantes e dominantes sobre <i>i</i>, e ignore o fator Rh.","A probabilidade de o segundo filho do casal ter sangue tipo AB é de:",["0","1/8","1/4","1/2","3/4"],2,"O filho tipo O (<i>ii</i>) mostra que os pais são I<sup>A</sup><i>i</i> × I<sup>B</sup><i>i</i>. Os gametas se combinam em 1/4 I<sup>A</sup>I<sup>B</sup> (AB), 1/4 I<sup>A</sup><i>i</i> (A), 1/4 I<sup>B</sup><i>i</i> (B) e 1/4 <i>ii</i> (O). P(AB) = 1/4 (C). A (0) supõe que o filho O impede o tipo AB; B (1/8) divide 1/4 por 2 sem motivo; D (1/2) é a chance de herdar um alelo específico de um dos pais; E (3/4) é a probabilidade de não ser AB."],
"Desmatamento e conservação da biodiversidade":["O desmatamento reduz e fragmenta habitats, o que diminui o tamanho das populações, isola grupos de indivíduos e pode causar extinções locais. Também expõe o solo à erosão, reduz a evapotranspiração e libera carbono armazenado na vegetação. Unidades de conservação e corredores ecológicos ajudam a proteger a biodiversidade e a conectar áreas fragmentadas.",["Fragmentação: habitats isolados, populações menores, perda de diversidade genética","Corredores ecológicos: conectam fragmentos","Solo exposto: erosão e perda de nutrientes"],"Em fragmentação, pense em isolamento e redução do tamanho das populações, não só em perda de árvores.","Uma região de floresta foi dividida por plantações em vários fragmentos isolados. Em um fragmento pequeno, uma espécie de ave que depende de grandes áreas de mata contínua teve sua população reduzida a poucas dezenas de indivíduos, sem contato com outras populações da espécie.","A criação de corredores ecológicos entre os fragmentos contribuiria para a conservação dessa ave porque:",["aumentaria a produção de alimentos nas plantações, reduzindo a competição com a ave.","permitiria o fluxo de indivíduos e genes entre populações, reduzindo o isolamento e o risco de extinção local.","transformaria os fragmentos em áreas de cultivo, que oferecem mais alimento.","impediria a reprodução entre populações, evitando mutações.","eliminaria a necessidade de proteger os fragmentos, pois os corredores substituem a floresta."],1,"B: corredores conectam fragmentos, permitindo o movimento de indivíduos e o fluxo gênico, o que reduz o isolamento. A e C não protegem a ave, que depende de mata. D é falsa: o fluxo gênico é desejável e não evita mutações. E é falsa: os corredores complementam a proteção dos fragmentos, não a substituem."],
"Enzimas e atividade enzimática":["Enzimas são proteínas que aumentam a velocidade das reações químicas ao diminuir a energia de ativação, sem serem consumidas. Cada enzima é específica para seu substrato, que se encaixa no sítio ativo. A atividade depende de temperatura, pH e concentração de substrato; temperaturas muito altas desnaturam a enzima, que perde sua forma e sua atividade.",["Enzima: catalisador biológico, geralmente proteína; reduz a energia de ativação","Específica para o substrato (sítio ativo)","Temperatura e pH ótimos; calor excessivo → desnaturação","Enzima não é consumida na reação"],"Em gráficos de atividade enzimática, a queda brusca em temperatura alta indica desnaturação.","Em um experimento, a atividade de uma enzima digestiva humana foi medida em diferentes temperaturas, mantendo o pH constante. A atividade aumentou até cerca de 37 °C, foi máxima nessa temperatura e caiu bruscamente a 70 °C, sem recuperação ao resfriar a amostra.","A queda de atividade a 70 °C deve-se:",["ao consumo total da enzima durante a reação, que se esgotou.","ao aumento da energia de ativação da reação, que tornou o substrato indisponível.","à transformação da enzima em substrato pelo calor.","à desnaturação da enzima, que perde sua forma tridimensional e, com ela, o encaixe com o substrato.","à mudança do pH ótimo da enzima para valores muito altos."],3,"D: o calor excessivo desnatura a proteína, que perde o sítio ativo, e a perda não se reverte ao resfriar. A erra: enzimas não são consumidas. B erra: a enzima reduz a energia de ativação, e o substrato continua disponível. C é falsa: não há transformação de enzima em substrato. E contraria o enunciado, que mantém o pH constante."],
"Sistema respiratório e trocas gasosas":["Nos pulmões, as trocas gasosas ocorrem por difusão nos alvéolos, de parede fina e muito vascularizada: o O<sub>2</sub> passa do ar para o sangue e o CO<sub>2</sub>, do sangue para o ar. Na inspiração, o diafragma se contrai e desce e as costelas se elevam, o que aumenta o volume da caixa torácica e reduz a pressão no interior dos pulmões; o ar entra por diferença de pressão.",["Inspiração: diafragma contrai; volume ↑, pressão ↓","Expiração em repouso: diafragma relaxa","Trocas gasosas por difusão nos alvéolos","O<sub>2</sub> é transportado principalmente pela hemoglobina"],"O ar não é empurrado: a pressão interna menor faz o ar externo entrar.","Durante a inspiração, o diafragma se contrai e se desloca para baixo, e as costelas se elevam.","Esse movimento favorece a entrada de ar nos pulmões porque:",["diminui o volume da caixa torácica e aumenta a pressão interna, empurrando o ar para dentro.","o diafragma bombeia o ar diretamente para dentro dos alvéolos.","os pulmões possuem músculos que se contraem e puxam o ar.","a contração do diafragma aumenta a pressão no interior dos pulmões em relação à atmosfera.","aumenta o volume da caixa torácica e reduz a pressão no interior dos pulmões, de modo que o ar externo flui para dentro."],4,"E: o aumento de volume reduz a pressão interna, e o ar flui da região de maior pressão (atmosfera) para a de menor. A e D descrevem o contrário (diminuição de volume ou aumento de pressão). B é falsa: o diafragma é um músculo e não bombeia ar. C é falsa: os pulmões não têm musculatura que os expanda ativamente."],
"Sistema nervoso e sinapse":["O neurônio conduz impulsos nervosos: o sinal elétrico percorre o axônio e, na sinapse química, é transmitido por neurotransmissores liberados na fenda sináptica, que se ligam a receptores da célula seguinte. A transmissão é unidirecional: do neurônio pré-sináptico para o pós-sináptico. O sistema nervoso central é formado pelo encéfalo e pela medula espinhal.",["Dendritos recebem; axônio conduz o impulso","Sinapse química: neurotransmissor atravessa a fenda sináptica","Sentido: pré-sináptico → pós-sináptico"],"Questões sobre substâncias que afetam o sistema nervoso quase sempre envolvem neurotransmissores e receptores na sinapse.","Um neurotransmissor é liberado na extremidade do axônio de um neurônio e se liga a receptores na superfície de outro neurônio, gerando um novo impulso. Um pesquisador observou que, se o neurotransmissor for eliminado rapidamente da fenda por enzimas, a transmissão é interrompida.","Esse processo demonstra que a transmissão do impulso entre os dois neurônios:",["é química e unidirecional: depende da liberação do neurotransmissor pelo neurônio pré-sináptico e de receptores no pós-sináptico.","é puramente elétrica e ocorre pelo contato direto entre as membranas, sem substâncias.","ocorre nos dois sentidos, pois o neurotransmissor é liberado por ambos os neurônios.","independe de receptores, bastando a presença do neurotransmissor na fenda.","ocorre pelo sangue, que leva o neurotransmissor ao neurônio seguinte."],0,"A: o texto descreve liberação de neurotransmissor e ligação a receptores, com sentido do axônio de um neurônio ao outro. B contraria o texto, que cita neurotransmissor. C contraria o texto: a liberação é feita pelo neurônio que conduz o impulso. D contraria a ligação a receptores descrita. E é falsa: a transmissão ocorre na fenda sináptica, não pelo sangue."],
"Platelmintos, nematelmintos e verminoses":["Platelmintos têm corpo achatado e incluem as tênias e o esquistossomo. Nematelmintos têm corpo cilíndrico e tubo digestório completo, como a lombriga (<i>Ascaris lumbricoides</i>), transmitida por ovos em água ou alimentos contaminados por fezes. A prevenção das verminoses depende de saneamento básico, higiene e cozimento adequado das carnes.",["Platelmintos: corpo achatado (tênia, esquistossomo)","Nematelmintos: corpo cilíndrico, tubo digestório completo","Teníase: ingestão de carne crua ou malcozida com cisticercos","Ascaridíase: ingestão de ovos em água ou alimentos contaminados"],"Pergunte como o ovo ou a larva chega ao organismo; a medida preventiva interrompe esse caminho.","Uma pessoa com teníase eliminou fezes com ovos de <i>Taenia solium</i> em uma área sem saneamento. Porcos que se alimentaram desses resíduos desenvolveram cisticercos na musculatura, e a carne foi consumida malcozida por outras pessoas.","Qual medida interrompe esse ciclo de transmissão?",["Lavar a carne de porco com água fria antes de cozinhá-la.","Aplicar inseticida nos currais, pois o verme é transmitido por insetos.","Garantir saneamento básico, para que os ovos não cheguem aos porcos, e cozinhar bem a carne de porco.","Beber apenas água fervida, pois a infecção ocorre pela água.","Eliminar mosquitos que carregam os ovos até os porcos."],2,"C: o saneamento impede que os ovos cheguem aos porcos, e o cozimento adequado mata os cisticercos na carne. A não elimina os cisticercos do interior da carne. B e E erram o mecanismo: não há inseto transmissor nesse ciclo. D erra a via descrita no texto, que é o consumo de carne malcozida."],
