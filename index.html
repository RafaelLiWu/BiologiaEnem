var C = {"1ª Lei de Mendel e heredogramas": ["A 1ª Lei de Mendel (Lei da Segregação dos Fatores) estabelece que cada característica hereditária é condicionada por um par de alelos que se separam durante a formação dos gametas (na anáfase I da meiose), de modo que cada gameta carrega apenas um alelo de cada par. Em indivíduos heterozigotos (Aa), o alelo dominante manifesta seu fenótipo tanto em homozigose (AA) quanto em heterozigose, enquanto o alelo recessivo expressa-se exclusivamente em dose dupla (aa). Na análise de heredogramas, o padrão autossômico recessivo clássico é identificado quando um casal com fenótipo normal (não afetado) gera um filho com a anomalia (Aa × Aa → aa).", ["1ª Lei de Mendel: segregação dos alelos na formação dos gametas", "Genótipo (constituição alélica) ≠ Fenótipo (característica observável)", "Cruzamento Aa × Aa: proporção genotípica 1 AA : 2 Aa : 1 aa; fenotípica 3 dominantes : 1 recessivo", "Heredograma: casal igual com filho diferente indica caráter recessivo no filho!"], "Regra de ouro de heredograma: Procure no heredograma pais com o MESMO FENÓTIPO que tenham um filho(a) com FENÓTIPO DIFERENTE. Os pais são obrigatoriamente heterozigotos (Aa) e o filho diferente é homozigoto recessivo (aa). Isso resolve 90% das questões de heredograma do ENEM!", "<p>Considere o heredograma familiar a seguir que ilustra a herança de uma anomalia metabólica autossômica em seres humanos:</p><div style='text-align:center;margin:12px 0'><svg viewBox='0 0 320 120' style='width:100%;max-width:320px;height:auto;background:var(--hi);border-radius:12px;padding:8px'><rect x='60' y='20' width='30' height='30' fill='none' stroke='var(--tx)' stroke-width='2'/><line x1='90' y1='35' x2='150' y2='35' stroke='var(--tx)' stroke-width='2'/><circle cx='165' cy='35' r='15' fill='none' stroke='var(--tx)' stroke-width='2'/><line x1='120' y1='35' x2='120' y2='65' stroke='var(--tx)' stroke-width='2'/><line x1='80' y1='65' x2='200' y2='65' stroke='var(--tx)' stroke-width='2'/><rect x='65' y='65' width='30' height='30' fill='none' stroke='var(--tx)' stroke-width='2'/><rect x='185' y='65' width='30' height='30' fill='var(--er)' stroke='var(--tx)' stroke-width='2'/><text x='75' y='15' font-size='10' font-weight='700' fill='var(--tx)'>I-1</text><text x='160' y='15' font-size='10' font-weight='700' fill='var(--tx)'>I-2</text><text x='80' y='110' font-size='10' font-weight='700' fill='var(--tx)'>II-1 (Normal)</text><text x='200' y='110' font-size='10' font-weight='700' fill='var(--er)'>II-2 (Afetado)</text></svg><br><small style='color:var(--mu)'>Legenda: Quadrados = homens; Círculos = mulheres; Símbolo preenchido = indivíduo afetado</small></div><p>O casal I-1 e I-2, ambos clinicamente normais, planeja ter um terceiro filho.</p>", "Qual a probabilidade de essa nova criança ser uma menina clinicamente saudável (não afetada pela anomalia)?", ["3/8 (37,5%)", "1/4 (25%)", "1/8 (12,5%)", "1/2 (50%)", "3/4 (75%)"], 0, "Como o casal normal (I-1 e I-2) gerou um filho afetado (II-2), a anomalia é recessiva (aa) e os pais são heterozigotos portadores (Aa × Aa). A probabilidade de gerar uma criança com fenótipo normal (AA ou Aa) é 3/4. A probabilidade de o bebê ser do sexo feminino é 1/2. Pela regra do 'e' (eventos independentes): P = P(menina) × P(normal) = 1/2 × 3/4 = 3/8 (37,5%). Alternativa correta: A. Distratores: B calcula apenas P(afetado); D calcula apenas o sexo; E calcula apenas P(normal) sem considerar o sexo feminino; A calcula P(menina e afetada) = 1/2 × 1/4 = 1/8."], "2ª Lei de Mendel e segregação independente": ["A 2ª Lei de Mendel (Lei da Segregação Independente) afirma que alelos de dois ou mais genes localizados em cromossomos homólogos distintos segregam-se de forma independente durante a formação dos gametas. Em um cruzamento entre duplo-heterozigotos (AaBb × AaBb), cada indivíduo produz quatro tipos de gametas em proporções iguais (1/4 AB, 1/4 Ab, 1/4 aB, 1/4 ab), gerando 16 combinações possíveis no quadro de Punnett com a clássica proporção fenotípica de 9 : 3 : 3 : 1 (9 duplo-dominantes, 3 dominantes/recessivos, 3 recessivos/dominantes e 1 duplo-recessivo). Essa lei não se aplica a genes em ligação gênica (linkage), que estão no mesmo cromossomo.", ["2ª Lei: segregação independente de genes em cromossomos diferentes", "Cruzamento diíbrido AaBb × AaBb: proporção fenotípica 9 : 3 : 3 : 1", "Gametas de AaBb: 1/4 AB, 1/4 Ab, 1/4 aB, 1/4 ab (iguais proporções)", "Linkage (ligação gênica): genes no mesmo cromossomo; quebram a 2ª Lei"], "Quando a questão fala em genes com segregação independente, você pode calcular a probabilidade de cada par de alelos separadamente pela 1ª Lei e depois multiplicar os resultados! Exemplo: Probabilidade de A_bb a partir de AaBb × AaBb = P(A_) × P(bb) = 3/4 × 1/4 = 3/16.", "<p>Em ervilhas-de-cheiro (<i>Pisum sativum</i>), o gene A determina sementes amarelas (dominante sobre a, verdes) e o gene B determina sementes lisas (dominante sobre b, rugosas). Ambos os genes possuem segregação independente. Realizou-se o cruzamento entre duas plantas duplo-heterozigotas (AaBb × AaBb), obtendo-se 320 sementes na progênie.</p>", "Quantas sementes com fenótipo verde e rugosa são esperadas teoricamente nessa colheita?", ["10 sementes.", "180 sementes.", "60 sementes.", "20 sementes.", "240 sementes."], 3, "O fenótipo verde e rugoso corresponde ao genótipo duplo homozigoto recessivo (aabb). No cruzamento AaBb × AaBb com segregação independente: P(aa) = 1/4 e P(bb) = 1/4. P(aabb) = 1/4 × 1/4 = 1/16. Em um total de 320 sementes: 1/16 × 320 = 20 sementes verdes e rugosas. Alternativa correta: D. Distratores: A divide por 32; C calcula sementes recombinantes simples (3/16 × 320 = 60); D calcula as amarelas e lisas (9/16 × 320 = 180); E soma amarelas e lisas de forma equivocada."], "Acidificação oceânica e branqueamento de corais": ["A absorção contínua de dióxido de carbono antropogênico (CO2) pelos oceanos reage com a água formando ácido carbônico (H2CO3), que se dissocia liberando íons H+ e reduzindo o pH oceânico em escala planetária. O excesso de prótons livres H+ reage com os íons carbonato livres (CO3 2-), convertendo-os em bicarbonato (HCO3 -) e diminuindo drasticamente a concentração de carbonato disponível para a precipitação de carbonato de cálcio (CaCO3). Organismos calcificadores como corais construtores de recifes, moluscos bivalves e foraminíferos têm sua calcificação esquelética prejudicada ou dissolvida. Concomitantemente, o aquecimento térmico das águas rompe a simbiose mutualística entre os pólipos de coral e as microalgas zooxantelas fotossintetizantes, provocando a expulsão das algas e o branqueamento e morte dos recifes.", ["CO2 + H2O → H2CO3 → H+ + HCO3- (mecanismo químico de acidificação dos mares)", "Consumo de carbonato: excesso de H+ converte CO3 2- em HCO3 -, reduzindo CaCO3 livre", "Calcificação comprometida: corais escleractíneos e conchas de moluscos sofrem fragilização", "Branqueamento de corais: estresse térmico induz a perda das algas zooxantelas mutualísticas", "Perda de biodiversidade: recifes abrigam 25% da vida marinha e protegem a linha de costa contra erosão"], "Pegadinha do ENEM: Acidificação NÃO é o mesmo que branqueamento, embora ambos decorram da queima de combustíveis fósseis! A ACIDIFICAÇÃO é dissolução química do esqueleto (CaCO3); o BRANQUEAMENTO é a expulsão térmica das algas zooxantelas.", "<p>Cientistas marinhos que monitoram a Grande Barreira de Corais constataram dois fenômenos simultâneos: a perda de coloração viva de vastas colônias de corais escleractíneos após ondas de calor oceânico e a dificuldade crescente de jovens pólipos em sintetizarem suas estruturas esqueléticas rígidas de sustentação.</p>", "A dificuldade de formação do exoesqueleto rígido desses corais está diretamente relacionada ao fato de que a acidificação das águas:", ["aumenta a disponibilidade de íons hidróxido que degradam as fibras de queratina da derme.", "bloqueia a síntese de clorofila celular nos cloroplastos citoplasmáticos dos pólipos animais.", "eleva o oxigênio dissolvido nas fossas abissais, acelerando a digestão lipídica dos pólipos.", "induz a proliferação excessiva de bactérias anaeróbias fixadoras de nitrogênio no tentáculo.", "diminui a concentração de íons carbonato disponíveis para a precipitação do carbonato de cálcio."], 4, "O dióxido de carbono dissolvido gera íons H+, que reagem com o carbonato (CO3 2-) presente na água gerando bicarbonato (HCO3 -). Isso reduz a saturação de carbonato livre na água marinha, impedindo que os corais combinem íons cálcio (Ca2+) com carbonato para produzir o carbonato de cálcio (CaCO3) de seus esqueletos calcários. Alternativa correta: E. Distratores: A menciona queratina e hidróxido; C, D e E contêm erros anatômicos e metabólicos crassos (animais não têm cloroplastos)."], "Adaptações morfofisiológicas das aves para o voo": ["A conquista do voo ativo sustentado pelas aves exigiu um conjunto integrado de extraordinárias especializações anatômicas, fisiológicas e ecológicas para reduzir a massa corporal e maximizar o rendimento bioenergético. As principais adaptações estruturais incluem: esqueleto leve com ossos pneumáticos ocos preenchidos por ar e perda de dentes (substituídos pelo bico córneo leve); esterno modificado com quilha (carena) saliente para fixação de volumosos músculos peitorais de batimento alar; membros anteriores transformados em asas providas de penas ceratínicas aerodinâmicas impermeabilizadas pelo óleo da glândula uropigiana; e ausência de bexiga urinária (o ácido úrico é expelido continuamente pela cloaca com as fezes, evitando o peso extra de urina acumulada). Fisiologicamente, possuem pulmões parabronquiais acoplados a sacos aéreos que garantem fluxo de ar unidirecional contínuo e trocas gasosas tanto na inspiração quanto na expiração, coração de quatro câmaras com circulação dupla e completa sem mistura de sangue e endotermia estável de alta taxa metabólica.", ["Ossos pneumáticos e bico córneo: redução extrema do peso corporal esquelético", "Quilha ou carena no esterno: ancoragem de potentes músculos peitorais de voo", "Sacos aéreos e pulmões tubulares: fluxo aéreo unidirecional sem volume residual de ar 'morto'", "Ausência de bexiga urinária: excreção imediata de ácido úrico pastoso (economia de peso)", "Endotermia e circulação tetracavitária completa: fornecem O₂ em alta pressão para os músculos alares"], "Por que as aves não têm dentes nem bexiga urinária? Ambas são adaptações essenciais para DIMINUIR O PESO do corpo durante o voo! Urina acumulada na bexiga pesaria centenas de gramas, tornando a decolagem mais difícil e energeticamente custosa.", "<p>O voo ativo nos vertebrados requer um equilíbrio biomecânico refinado entre sustentação aerodinâmica, minimização de peso corpóreo e alta disponibilidade de energia metabólica celular durante o batimento vigoroso das asas.</p>", "Constituem adaptações anatômicas das aves que atuam de forma combinada reduzindo o peso corporal e aumentando a ancoragem muscular para o voo, respectivamente:", ["presença de bexiga urinária volumosa e dentes incisivos esmaltados afiados.", "circulação aberta em lacunas e pulmões alveolares com diafragma muscular espesso.", "ossos pneumáticos ocos e esterno dotado de quilha (carena) proeminente.", "excreção de amônia gasosa pelas brânquias e exoesqueleto de quitina flexível.", "dupla fileira de costelas cartilaginosas e cauda longa com medula óssea pesada."], 2, "Os ossos pneumáticos contêm cavidades ocas comunicadas com os sacos aéreos, tornando o esqueleto esbelto e leve sem perder resistência mecânica à tração. Simultaneamente, o esterno desenvolveu uma crista óssea vertical achatada denominada quilha ou carena, que serve de ponto de inserção para os poderosos músculos peitorais maior e menor que tracionam as asas para baixo e para cima durante o voo batido. Alternativa correta: C. Distratores: A afirma o inverso (aves não têm dentes nem bexiga); C descreve circulação aberta e diafragma mamífero; D cita brânquias e quitina de artrópodes; E cita cauda óssea pesada de répteis fósseis."], "Anelídeos, metameria e papel ecológico das minhocas": ["O filo Annelida reúne vermes celomados, triblásticos e protostômios cujo corpo é dividido em segmentos transversais repetidos denominados metâmeros (metameria verdadeira homônoma). Cada segmento abriga cópias de estruturas orgânicas fundamentais, como pares de nefrídios excretores, gânglios nervosos da cadeia ventral e compartimentos celômicos separados por septos que operam como um esqueleto hidrostático de alta eficiência locomotora. O filo divide-se em três grupos tradicionais: oligoquetas (minhocas terrestres com poucas cerdas), poliquetas (vermes marinhos com parapódios carnosos ricos em cerdas) e hirudíneos (sanguessugas hematófagas com ventosas e sem cerdas). As minhocas desempenham papel ecológico e pedológico indispensável na biosfera: ao escavarem galerias subterrâneas contínuas, aeram profundamente o solo e facilitam a drenagem da água das chuvas; ao ingerirem terra e matéria vegetal em decomposição, digerem fungos e bactérias e excretam fezes ricas em húmus mineralizado e nutrientes assimiláveis pelas raízes vegetais.", ["Metameria verdadeira: corpo dividido em anéis/segmentos com repetição seriada de órgãos e nefrídios", "Esqueleto hidrostático: líquido celômico sob pressão pressurizado por músculos longitudinais e circulares", "Sistema circulatório fechado: sangue circula sempre no interior de vasos com pigmento hemoglobina", "Bioturbação pelas minhocas: abertura de galerias promove aeração profunda e descompactação do solo agrícola", "Produção de húmus: aceleram a ciclagem de nutrientes e a fertilidade biológica do solo fértil"], "No ENEM, minhoca é sempre amiga do agricultor! Elas realizam BIOTURBAÇÃO: descompactam a terra criando canais de ar para as raízes respirarem e produzem HÚMUS rico em nitrogênio e fósforo digeridos.", "<p>Agricultores familiares que adotam o sistema de plantio direto constataram que a manutenção contínua de palhada sobre o solo favoreceu a proliferação expressiva de populações de minhocas terrestres (oligoquetas). Após algumas safras, análises agronômicas comprovaram melhora significativa na taxa de infiltração hídrica e aumento na biodisponibilidade de cátions minerais para as raízes das culturas.</p>", "A melhoria das propriedades agronômicas do solo provocada pela atividade biológica das minhocas decorre da:", ["fixação do gás nitrogênio atmosférico mediada por nódulos radiculares na epiderme dorsal dos anelídeos.", "escavação de túneis que facilitam a drenagem e aeração, somada à produção de fezes ricas em matéria orgânica humificada.", "secreção de substâncias queratinizadas impermeáveis que impedem a evaporação da água subterrânea.", "absorção de compostos tóxicos de fósforo pelas cerdas quitinosas com esterilização química do terreno.", "eliminação de insetos pragas por predação ativa através de ventosas orais na camada superficial da terra."], 1, "As minhocas são organismos detritívoros que escavam galerias contínuas no solo (bioturbação), rompendo a compactação mecânica e aumentando a macroporosidade, o que melhora substancialmente a drenagem pluvial e a oxigenação das raízes. Além disso, ingerem matéria orgânica vegetal e solo, digerindo microrganismos e expelindo fezes (coprólitos) ricas em húmus coloidal, cálcio, magnésio e nitrogênio mineralizado prontamente absorvidos pelas plantas. Alternativa correta: B. Distratores: A descreve rizóbios em leguminosas; C, D e E trazem conceitos anatômicos e zoológicos errôneos."], "Apoptose e morte celular programada": ["A apoptose é o processo biológico ordenado e geneticamente programado de autodestruição celular essencial para a homeostase tecidual, desenvolvimento embrionário e eliminação de células anômalas ou infectadas. Diferente da necrose — que é um processo traumático e inflamatório decorrente de lise da membrana plasmática e extravasamento citoplasmático —, a apoptose ocorre sem extravasamento de conteúdo citoplasmático e sem deflagrar resposta inflamatória tecidual. Na cascata apoptótica, sinais internos (como danos irreversíveis ao DNA detectados pela proteína p53) ou externos ativam a liberação de citocromo c pelas mitocôndrias no citoplasma. O citocromo c ativa enzimas proteolíticas chamadas caspases, que clivam o citoesqueleto, fragmentam o DNA internucleossomal e induzem a formação de corpos apoptóticos, que são rapidamente fagocitados por macrófagos vizinhos.", ["Apoptose: morte celular limpa, programada, ativa (depende de ATP) e sem resposta inflamatória", "Necrose: morte patológica desordenada, com inchaço celular, ruptura de membrana e inflamação aguda", "Cascata das caspases: proteases intracelulares que degradam o núcleo e citoesqueleto", "Papel na embriogênese: eliminação da membrana interdigital na formação dos dedos humanos", "Gene supressor de tumor p53: ativa a apoptose quando mutações genéticas graves não podem ser reparadas"], "No ENEM, apoptose é cobrada em dois contextos recorrentes: no DESENVOLVIMENTO EMBRIONÁRIO (desaparecimento das membranas interdigitais dos dedos e cauda do girino) e na SUPRESSÃO DO CÂNCER (quando o p53 muta e perde a capacidade de matar a célula defeituosa).", "<p>Durante o desenvolvimento das extremidades nos embriões humanos, as mãos e os pés surgem inicialmente como estruturas maciças em forma de pá ou remo. Por volta da oitava semana de gestação, as células situadas nos tecidos interdigitais ativam genes específicos que deflagram a quebra do citoesqueleto e condensação da cromatina, culminando na separação perfeita dos cinco dedos individuais sem que ocorra inflamação tecidual.</p>", "O mecanismo fisiológico responsável pelo remodelamento da anatomia dos dedos no embrião é o(a):", ["apoptose programada das células interdigitais seguida de fagocitose por macrófagos.", "necrose tecidual isquêmica provocada por hipóxia transitória nas polpas digitais.", "hiperplasia mitótica compensatória das células epiteliais da derme periungueal.", "diferenciação das células germinativas mesodérmicas em osteoblastos policlonais.", "migração ameboide de neutrófilos ativados que digerem quimicamente a epiderme distal."], 0, "A individualização dos dedos decorre da apoptose (morte celular programada) do tecido interdigital. Trata-se de um evento regulado em que as células ativam caspases que desmancham as estruturas intracelulares de forma organizada, gerando corpos apoptóticos absorvidos silenciosamente por macrófagos sem liberar mediadores inflamatórios. Alternativa correta: A. Distratores: A é necrose com inflamação; C, D e E não guardam relação com apoptose tecidual."], "Arboviroses emergentes: Zika e Chikungunya": ["As arboviroses emergentes transmitidas por mosquitos do gênero Aedes (especialmente Aedes aegypti e Aedes albopictus) tornaram-se prioridade crítica em saúde coletiva nas Américas com a recente introdução dos vírus Chikungunya (CHIKV, da família Togaviridae) e Zika (ZIKV, da família Flaviviridae). Embora compartilhem o mesmo mosquito vetor com o vírus da dengue, cada patógeno desencadeia repercussões clínicas e patológicas singulares. A febre Chikungunya caracteriza-se por artralgia bilateral intensa, incapacitante e poliarticular nas articulações periféricas, que frequentemente cronifica por meses ou anos com dor articular severa. Já a infecção pelo vírus Zika apresenta tipicamente sintomas mais brandos de febre baixa e exantema cutâneo pruriginoso, porém possui acentuado neurotropismo fetal: ao atravessar a barreira transplacentária em gestantes, infecta e destrói progenitores neurais no córtex cerebral embrionário, deflagrando a síndrome congênita do Zika com microcefalia grave e artrogripose.", ["Vetor comum: mosquito Aedes aegypti (fêmea hematófaga com hábitos diurnos e água parada)", "Chikungunya: febre com dores articulares (artralgias) severas e crônicas debilitantes", "Zika e microcefalia: atravessa a placenta, ataca células-tronco neurais do feto e bloqueia o desenvolvimento cerebral", "Transmissão sexual do Zika: além do mosquito vetor, o ZIKV pode ser transmitido pelo sêmen", "Controle vetorial integrado: eliminação de criadouros de água limpa e estagnada, telas e biotecnologia (mosquitos estéreis ou Wolbachia)"], "O grande diferencial do vírus Zika no ENEM é a sua capacidade TERATOGÊNICA: ele atravessa a placenta em gestantes e destrói células neurais embrionárias (neurotropismo), causando MICROCEFALIA e paralisia no recém-nascido.", "<p>Durante o surto de arboviroses no Nordeste do Brasil, obstetras e neuropediatras constataram correlação direta entre episódios de febre branda e manchas avermelhadas na pele de gestantes no primeiro trimestre de gravidez e o posterior nascimento de bebês com perímetro cefálico significativamente inferior à média da idade gestacional.</p>", "Essa complicação neurológica fetal congênita decorre da capacidade do vírus Zika de:", ["estimular a calcificação precoce das epífises ósseas longas do fêmur embrionário.", "degradar as imunoglobulinas presentes no leite materno impedindo a sucção neonatal.", "ultrapassar a barreira placentária materna e infectar seletivamente células precursoras do tecido neural fetal.", "bloquear a respiração celular na mitocôndria dos macrófagos alveolares da placenta.", "induzir mutações dominantes de linhagem germinativa no cromossomo sexual materno."], 2, "O vírus Zika exibe expressivo neurotropismo e permeabilidade transplacentária. Ao penetrar na circulação fetal, infecta diretamente as células-tronco neurais e neuroblastos em plena proliferação no córtex encefálico do embrião, deflagrando apoptose e supressão da neurogênese, resultando em microcefalia congênita irreversível. Alternativa correta: C. Distratores: A afeta ossos longos; C refere-se à amamentação pós-natal; D e E formulam hipóteses infundadas."], "Artrópodes e importância ecológica e médica": ["O filo Arthropoda é o mais abundante e biodiverso do planeta, englobando mais de 80% das espécies animais conhecidas. O extraordinário sucesso adaptativo desse filo deve-se a inovações anatômicas marcantes: exoesqueleto rígido de quitina impermeável (que protege contra predadores e impede a dessecação em terra firme), apêndices articulados adaptados para locomoção, predação e mastigação, e crescimento por ecdises (mudas periódicas controladas pelo hormônio ecdisona). Os insetos possuem corpo dividido em cabeça, tórax e abdome, 3 pares de patas torácicas e respiração traqueal direta. Os aracnídeos têm cefalotórax e abdome, 4 pares de patas, quelíceras e pedipalpos (sem antenas). Crustáceos possuem cefalotórax e abdome, 2 pares de antenas e respiração branquial. Na ecologia e saúde pública, insetos destacam-se como polinizadores insubstituíveis e vetores de graves epidemias.", ["Exoesqueleto de quitina: suporte mecânico e impermeabilização vital em terra", "Ecdise (muda): crescimento descontínuo em degraus estimulado pela ecdisona", "Insetos: 3 tagmas (cabeça/tórax/abdome), 3 pares de patas, 1 par de antenas, respiração traqueal", "Aracnídeos: cefalotórax + abdome, 4 pares de patas, quelíceras (SEM antenas!)", "Crustáceos: cefalotórax + abdome, 2 pares de antenas, brânquias aquáticas"], "O gráfico de crescimento dos artrópodes NÃO é uma curva contínua e suave como nos humanos: ele tem formato de 'escadinha' (degraus)! O animal só cresce em tamanho logo após abandonar o exoesqueleto antigo durante a muda (ecdise), antes que a nova cutícula endureça com quitina e carbonato de cálcio.", "<p>Em uma feira de ciências escolar, alunos montaram uma caixa entomológica para identificar animais encontrados no jardim da escola. Um espécime capturado apresentava o corpo dividido em duas partes distintas (cefalotórax e abdome), quatro pares de pernas locomotoras torácicas e ausência total de antenas na região cefálica, portando ainda um par de quelíceras inoculadoras de veneno.</p>", "As características morfológicas descritas enquadram esse animal na classe dos:", ["Insetos (como os percevejos fitófagos).", "Diplópodes (como os piolhos-de-cobra).", "Crustáceos decápodes (como os caranguejos de mangue).", "Quilópodes (como as centopeias terrestres).", "Aracnídeos (como as aranhas e escorpiões)."], 4, "A presença de corpo dividido em cefalotórax (prosoma) e abdome (opistossoma), quatro pares de patas marchadoras (oito pernas locomotoras), ausência de antenas (áceros) e presença de quelíceras pré-orais são caracteres diagnósticos exclusivos dos artrópodes da classe Arachnida (como aranhas, escorpiões, ácaros e carrapatos). Alternativa correta: E. Distratores: A erra pois insetos possuem 3 pares de patas e antenas; C erra pois crustáceos possuem 2 pares de antenas; D e E possuem corpo longo multissegmentado com dezenas de patas."], "Bactérias, infecções e resistência aos antibióticos": ["As bactérias são organismos unicelulares procariontes pertencentes ao domínio Bacteria. Apresentam parede celular de peptideoglicano, membrana plasmática, citosol com ribossomos 70S, nucleoide com DNA circular único sem histonas e, frequentemente, plasmídeos (pequenas moléculas circulares de DNA extracromossômico). Os plasmídeos frequentemente contêm genes de resistência a antibióticos e podem ser transmitidos horizontalmente entre bactérias por conjugação (via pili sexual), transformação ou transdução viral. O uso indiscriminado, incompleto ou excessivo de antibióticos na medicina humana e na agropecuária atua como potente pressão seletiva, eliminando as bactérias sensíveis e selecionando linhagens mutantes resistentes (superbactérias).", ["Procariontes: sem carioteca, sem organelas membranosas, ribossomos 70S", "Parede celular de peptideoglicano (alvo de antibióticos como penicilina)", "Plasmídeos: transmitem resistência bacteriana por conjugação sexual", "Seleção natural de bactérias resistentes: o antibiótico SELECIONA, NÃO induz a mutação!", "Doenças bacterianas clássicas: tétano, tuberculose, cólera, sífilis, leptospirose"], "Cuidado com a pegadinha lamarckista do ENEM: o antibiótico NÃO 'faz a bactéria ficar resistente' e NÃO 'ensina a bactéria a se defender'! As mutações ocorrem ao acaso antes do contato; o antibiótico atua apenas como agente seletivo darwiniano, matando as sensíveis e permitindo a proliferação das resistentes pré-existentes.", "<p>A Organização Mundial da Saúde (OMS) classifica a resistência bacteriana aos antibióticos como uma das maiores ameaças à saúde pública global contemporânea. Em hospitais, cepas de <i>Staphylococcus aureus</i> multirresistentes (MRSA) sobrevivem a doses maciças de betalactâmicos que outrora curavam infecções em poucos dias.</p>", "Sob a ótica da Teoria Neodarwinista da Evolução, o surgimento e a proliferação dessas linhagens de superbactérias são explicados porque:", ["o antibiótico induz mutações adaptativas orientadas no DNA da bactéria para ela resistir ao calor febril.", "as bactérias aprendem a digerir o fármaco após repetidas exposições ao medicamento.", "o antibiótico transforma bactérias patogênicas em vírus bacteriófagos de ciclo lisogênico protetor.", "as bactérias ativam voluntariamente a síntese de anticorpos no seu complexo golgiense para expelir o remédio.", "o uso contínuo de antibióticos seleciona bactérias resistentes pré-existentes portadoras de mutações vantajosas aleatórias."], 4, "Mutações genéticas e transferências de plasmídeos de resistência ocorrem espontaneamente e ao acaso no universo microbiano. Quando um antibiótico é administrado de forma inadequada ou continuada, ele elimina todas as bactérias sensíveis, eliminando a competição e deixando via livre para que as poucas bactérias mutantes previamente resistentes sobrevivam e se proliferem (seleção natural direcional). Alternativa correta: E. Distratores: A e B expressam visões finalistas/lamarckistas errôneas; D cita anticorpos e Golgi inexistentes em bactérias; E descreve transformação impossível entre domínios biológicos."], "Bioacumulação e magnificação trófica": ["Bioacumulação é a absorção e retenção progressiva de uma substância química no corpo de um organismo ao longo do tempo, em velocidade superior à sua capacidade de excreção ou metabolização. Quando essa substância é lipossolúvel, não biodegradável e persistente (como metais pesados — mercúrio e chumbo — e pesticidas organoclorados como o DDT), ela se concentra de forma crescente a cada nível trófico da cadeia alimentar, fenômeno denominado magnificação trófica ou biomagnificação. Por essa razão, os predadores de topo acumulam as maiores concentrações relativas do contaminante por unidade de massa corpórea.", ["Bioacumulação: acúmulo no indivíduo ao longo da sua vida", "Magnificação trófica: aumento progressivo da concentração ao longo dos níveis tróficos", "Substâncias críticas: lipossolúveis e não biodegradáveis (DDT, Hg, Pb)", "Vítima mais afetada na teia: consumidor do topo trófico"], "Lembre-se da diferença crucial: a ENERGIA DIMINUI ao longo da cadeia alimentar (pirâmide direta); já a CONCENTRAÇÃO de poluentes não biodegradáveis AUMENTA em direção ao topo da cadeia alimentar!", "<p>Em uma bacia hidrográfica contaminada pelo garimpo ilegal de ouro, o mercúrio metálico utilizado na amalgamação foi metilado por bactérias aquáticas em metilmercúrio, uma forma altamente tóxica e solúvel em lipídios. Analisou-se uma cadeia alimentar local composta por: fitoplâncton, lambaris (herbívoros/planctófagos), traíras (peixes carnívoros) e lontras (mamíferos predadores de peixes).</p>", "Com base nos princípios da biomagnificação trófica, a maior concentração de metilmercúrio por quilograma de tecido corporal será detectada no(s):", ["fitoplâncton, por realizar contato superficial direto com a água contaminada.", "lambaris, por consumirem continuamente produtores primários ricos em lipídios.", "traíras exclusivamente, por possuírem taxa metabólica superior à dos mamíferos.", "lontras, por ocuparem o nível trófico superior dessa cadeia alimentar aquática.", "decompositores apenas, visto que metais pesados não são absorvidos por vertebrados."], 3, "O metilmercúrio é lipossolúvel, persistente e não biodegradável. Ao transitar pelos níveis tróficos, cada consumidor ingere grandes quantidades de biomassa do nível anterior sem conseguir excretar o metal acumulado. Consequentemente, o predador do topo (a lontra, consumidora terciária) acumula a maior concentração tecidual relativa da toxina (magnificação trófica). Alternativa correta: D. Distratores: A e B confundem volume total com concentração biológica acumulada; D ignora a posição superior da lontra; E erra ao afirmar que vertebrados não absorvem metais pesados."], "Biogênese versus Abiogênese e o experimento de Pasteur": ["A consolidação do princípio da Biogênese (segundo o qual todo ser vivo se origina exclusivamente de outro ser vivo pré-existente por meio da reprodução) exigiu séculos de debates e refutações científicas contra a teoria da Geração Espontânea ou Abiogênese (que defendia que seres vivos podiam surgir espontaneamente da matéria bruta inanimada dotada de um 'princípio ativo' ou 'força vital'). Francesco Redi demonstrou no século XVII que vermes em carne em decomposição nasciam de ovos de moscas, e não da própria carne putrefata. Em 1862, Louis Pasteur sepultou definitivamente a abiogênese com o célebre experimento dos frascos com 'pescoço de cisne': fervendo caldos nutritivos em balões de vidro com gargalos longos e curvados em 'S', permitiu o contato contínuo com o oxigênio do ar, mas as partículas de poeira e microrganismos ficavam retidos na curva úmida do gargalo, mantendo o caldo estéril e provando que os microrganismos vêm do ar exterior, e não de geração espontânea.", ["Abiogênese: seres vivos surgem da matéria inanimada por força vital (Aristóteles, Needham)", "Biogênese: vida gera vida por reprodução (Redi, Spallanzani, Pasteur)", "Experimento do pescoço de cisne (Pasteur, 1862): caldo estéril mesmo em contato com o oxigênio do ar", "A poeira com esporos/bactérias fica retida na curvatura do gargalo", "Quando o gargalo é quebrado, o caldo contamina-se em 24h, refutando a força vital"], "O golpe de mestre do experimento de Pasteur com o frasco de pescoço de cisne foi que ele NÃO tampou o frasco! Os defensores da abiogênese diziam que Spallanzani impedia a vida porque tapava o frasco e faltava ar; Pasteur deixou o ar entrar livremente, mas barrou a poeira mecânica na curva do vidro, provando a Biogênese.", "<p>Em 1862, Louis Pasteur apresentou à Academia de Ciências de Paris os resultados de seus experimentos com frascos de vidro contendo caldo nutritivo fervido, cujos gargalos foram esticados no fogo e curvados em formato de 'S' (pescoço de cisne). Os caldos permaneceram transparentes e estéreis por meses, mesmo com a extremidade do gargalo aberta para a atmosfera.</p>", "O aspecto metodológico crucial desse experimento que permitiu a Pasteur refutar em definitivo a teoria da geração espontânea foi:", ["a utilização de vácuo absoluto no interior do balão, eliminando todo o gás oxigênio necessário à vida.", "manter o caldo em contato direto com o ar enquanto a curvatura do gargalo aprisionava poeira e microrganismos invasores.", "a adição de antibióticos sintéticos de largo espectro que destruíram a parede celular bacteriana.", "o resfriamento do frasco a temperaturas inferiores ao zero absoluto para paralisar as moléculas.", "a substituição do caldo orgânico por água destilada saturada de ácido sulfúrico concentrado."], 1, "Os opositores da biogênese alegavam que ferver e fechar hermeticamente os recipientes (como fizera Spallanzani) destruía o 'princípio ativo' ou impedia o oxigênio indispensável para a geração espontânea da vida. Ao criar o gargalo em pescoço de cisne, Pasteur permitiu o fluxo livre de ar e oxigênio para dentro do frasco, mas as partículas de poeira carregando bactérias e fungos ficavam depositadas na curva inferior do tubo. Como a esterilidade se manteve com o ar presente e o caldo só contaminou após a quebra do gargalo, comprovou-se que a vida microbiana provém de microrganismos preexistentes suspensos no ar. Alternativa correta: B. Distratores: A, C, D e E contrariam a montagem experimental histórica de Pasteur."], "Biomas brasileiros": ["O Brasil abriga seis grandes biomas continentais com características ecológicas e adaptações morfofisiológicas singulares. A Amazônia é a maior floresta tropical do planeta, caracterizada por clima equatorial quente e úmido e solo pobre com rápida ciclagem de serrapilheira. O Cerrado, a savana brasileira, destaca-se por troncos retorcidos, casca espessa corticosa, raízes profundas e adaptações ao fogo natural sazonal. A Caatinga, único bioma exclusivamente brasileiro, apresenta vegetação xerofítica com folhas reduzidas a espinhos, caules suculentos acumuladores de água (cactáceas) e queda de folhas na estiagem. A Mata Atlântica possui altíssimo endemismo e biodiversidade, hoje reduzida a fragmentos. O Pantanal é a maior planície alagável contínua do globo, e o Pampa é dominado por vegetação campestre no sul do país.", ["Cerrado: solo ácido e profundo, troncos tortuosos, casca grossa, fogo sazonal", "Caatinga: xerofitismo, cactos, perda de folhas (caducifólia), clima semiárido", "Amazônia: floresta pluvial densa, solo frágil e arenoso, serrapilheira vital", "Mata Atlântica: hotspot mundial de biodiversidade com grande fragmentação histórica", "Pantanal: pulso de inundação periódico e rica fauna de vertebrados"], "Atenção para o Cerrado: a tortuosidade dos galhos NÃO se deve primariamente à falta de água (as raízes são profundas e atingem o lençol freático!), mas sim à acidez do solo, toxidez por alumínio e aos efeitos de gemas apicais destruídas pelo fogo.", "<p>Durante uma expedição botânica pelo interior do Nordeste brasileiro em pleno período de seca, pesquisadores catalogaram plantas com cutícula foliar espessa, folhas modificadas em espinhos, caules verdes fotossintetizantes e tecidos aquíferos volumosos capazes de armazenar água por longos meses de estiagem.</p>", "As adaptações vegetais observadas são típicas de qual bioma brasileiro e têm como principal finalidade fisiológica:", ["Caatinga; minimizar a perda de água por transpiração e garantir reserva hídrica.", "Pantanal; flutuar sobre a lâmina d'água durante os períodos de cheia sazonal.", "Cerrado; resistir à queima das sementes sob altas temperaturas do fogo.", "Mata Atlântica; captar luz solar abundante no sub-bosque sombreado da mata.", "Pampa; suportar o congelamento celular durante as geadas frequentes de inverno."], 0, "As características descritas (folhas reduzidas a espinhos, caules fotossintetizantes com parênquima aquífero desenvolvido e cutícula cerosa espessa) compõem a síndrome xerofítica clássica da vegetação da Caatinga, adaptada ao clima semiárido com chuvas escassas e irregulares. Alternativa correta: A. Distratores: A confunde Caatinga com Cerrado; B confunde xerófitas com hidrófitas do Pantanal; D e E associam adaptações de seca com ambientes úmidos de floresta e campos frios."], "Biorremediação e fitorremediação de ambientes degradados": ["A biorremediação é uma biotecnologia ambiental que utiliza o potencial metabólico de microrganismos (bactérias, arqueias e fungos) ou plantas (fitorremediação) para neutralizar, degradar ou imobilizar contaminantes tóxicos em solos e águas subterrâneas. No derramamento de petróleo no mar ou manguezais, utiliza-se a bioestimulação (adição de nutrientes minerais de nitrogênio e fósforo na água para acelerar a multiplicação de bactérias hidrocarbonoclásticas nativas degradadoras de óleo) ou o bioaumento (introdução de linhagens bacterianas selecionadas). Na fitorremediação, espécies vegetais hiperacumuladoras toleram e extraem metais pesados tóxicos do solo (como cádmio, chumbo e zinco), acumulando-os em seus tecidos aéreos para posterior incineração controlada em cinzas seguras.", ["Biorremediação: uso de seres vivos para descontaminar ecossistemas poluídos", "Bioestimulação: adição de fertilizantes (N e P) para estimular bactérias consumidoras de óleo", "Fitorremediação: plantas hiperacumuladoras que extraem metais pesados do solo", "Vantagem: método sustentável in situ com menor impacto ambiental e custo que obras físicas"], "No caso de vazamento de óleo no mar, adubar a água com fertilizantes nitrogenados e fosfatados estimula as bactérias nativas a degradarem o petróleo muito mais rápido, pois o óleo tem muito carbono, mas pouco nitrogênio e fósforo para os microrganismos.", "<p>Após um acidente com navio petroleiro na costa brasileira, manchas de óleo cru atingiram praias e manguezais. Técnicos ambientais borrifaram sobre o óleo soluções fertilizantes ricas em sais inorgânicos de nitrogênio e fósforo para acelerar a degradação biológica das frações de hidrocarbonetos pesados.</p>", "Essa intervenção ecológica baseada na bioestimulação acelera a remoção do óleo porque:", ["desnatura quimicamente as moléculas de hidrocarboneto transformando-as em cristais de sílica.", "fornece nutrientes minerais limitantes que estimulam a multiplicação de bactérias consumidoras de petróleo.", "bloqueia a transpiração das folhas de mangue impedindo a absorção de radiação solar.", "evapora a água salgada do mar convertendo o óleo cru em gás oxigênio puro.", "induz a mutação de peixes carnívoros em moluscos filtradores despoluidores."], 1, "O petróleo cru é riquíssimo em carbono e energia química, mas extremamente deficiente em nitrogênio e fósforo. Para sintetizarem proteínas, enzimas e ácidos nucleicos necessários para se dividirem e metabolizarem o petróleo, as bactérias hidrocarbonoclásticas precisam desses nutrientes. O aporte mineral quebra o fator limitante (bioestimulação), permitindo uma proliferação explosiva da biomassa bacteriana degradadora do poluente. Alternativa correta: B. Distratores: A, C, D e E formulam proposições absurdas."], "CRISPR e células-tronco": ["As células-tronco são células indiferenciadas dotadas de capacidade de autorrenovação e diferenciação em linhagens celulares especializadas. Classificam-se em totipotentes (capazes de formar todo o embrião e anexos extraembrionários, encontradas no zigoto e blastômeros iniciais), pluripotentes/embrionárias (originam todos os tecidos dos três folhetos embrionários, mas não a placenta, obtidas do maciço celular interno do blastocisto) e multipotentes/adultas (diferenciam-se em tipos restritos do seu tecido de origem, como as células-tronco hematopoiéticas da medula óssea). A revolucionária técnica de edição genética CRISPR-Cas9 baseia-se em um mecanismo imunológico bacteriano contra vírus: um RNA-guia sintético direciona a endonuclease Cas9 com precisão micrométrica a uma sequência-alvo no genoma, permitindo cortar, deletar, corrigir ou inserir genes em doenças genéticas.", ["Totipotentes: zigoto e primeiras clivagens (formam embrião + placenta)", "Pluripotentes (embrionárias): blastocisto (formam todos os tecidos embrionários, sem placenta)", "Multipotentes (adultas): medula óssea (formam linhagens específicas, ex: hemácias/leucócitos)", "CRISPR-Cas9: edição precisa de DNA guiada por fita complementar de RNA", "Terapia celular e gênica: tratamento potencial de anemias falciformes e distrofias"], "Células-tronco do cordão umbilical e da medula óssea de adultos NÃO são pluripotentes! Elas são MULTIPOTENTES adultas, ou seja, são capazes de originar principalmente células sanguíneas e do sistema imune, mas não neurônios ou músculo cardíaco com facilidade espontânea.", "<p>Em 2020, o Prêmio Nobel de Química foi concedido às pesquisadoras Emmanuelle Charpentier e Jennifer Doudna pelo desenvolvimento do método CRISPR-Cas9 de edição genômica. A tecnologia utiliza uma fita curta de RNA desenhada sob medida em laboratório para acoplar-se a uma sequência específica do DNA celular, servindo de guia para a enzima Cas9 efetuar o corte preciso na molécula.</p>", "A precisão cirúrgica de localização do ponto exato de clivagem do DNA cromossômico pela ferramenta CRISPR-Cas9 decorre do:", ["bloqueio da glicólise anaeróbia por endonucleases de restrição viral.", "reconhecimento eletrostático das caudas de colesterol da membrana nuclear.", "aquecimento térmico induzido pela hidrólise de lipídios mitocondriais.", "surgimento espontâneo de ribossomos mutantes na cromatina interfásica.", "pareamento complementar de bases nitrogenadas entre o RNA-guia e o DNA-alvo."], 4, "O sistema CRISPR-Cas9 guia a endonuclease Cas9 até o local exato do genoma graças ao pareamento complementar de bases nitrogenadas entre a molécula de RNA-guia (sintetizada com a sequência de interesse) e a fita correspondente de DNA cromossômico (adenina com timina/uracila e guanina com citosina). Isso permite modificar genes pontuais com altíssima especificidade. Alternativa correta: E. Distratores: B cita colesterol que não guia ácidos nucleicos; C, D e E formulam proposições sem correlação com o mecanismo molecular do CRISPR."], "Cadeias e teias alimentares": ["As cadeias alimentares representam sequências lineares e unidirecionais de transferência de matéria e energia entre os seres vivos de um ecossistema. Na natureza, entretanto, essas relações são interligadas e formam teias alimentares complexas, nas quais um mesmo organismo pode ocupar diferentes níveis tróficos dependendo do recurso consumido. Os produtores constituem a base autótrofa, enquanto os consumidores (herbívoros, carnívoros e onívoros) são heterótrofos. Os decompositores (bactérias e fungos) atuam em todos os elos tróficos, convertendo a matéria orgânica em nutrientes inorgânicos reutilizáveis pelos produtores.", ["Produtores (autótrofos): base da teia (fotossíntese/quimiossíntese)", "Consumidores: primários (herbívoros), secundários, terciários", "Onívoro: ocupa múltiplos níveis tróficos na mesma teia", "Decompositores: fungos e bactérias fecham o ciclo da matéria", "Cadeia linear vs. Teia alimentar em rede interconectada"], "Cuidado: um mesmo animal pode ser consumidor primário e secundário simultaneamente em uma teia alimentar (por exemplo, uma ave que come sementes e insetos). Sempre identifique o nível trófico seguindo o caminho da seta na teia específica.", "<p>Em um fragmento de Mata Atlântica, pesquisadores mapearam as relações tróficas entre cinco espécies: árvores frutíferas nativas, besouros herbívoros, sabiás-laranjeira (que se alimentam de frutos e também dos besouros), serpentes jararacas (que predam os sabiás) e gaviões-carcarás (que consomem tanto sabiás quanto serpentes).</p>", "Nessa teia alimentar, a espécie de sabiá-laranjeira ocupa, respectivamente, quais níveis tróficos?", ["Produtor e consumidor primário.", "Consumidor primário e consumidor secundário.", "Consumidor secundário e consumidor terciário.", "Consumidor primário e decompositor.", "Exclusivamente consumidor terciário."], 1, "Ao se alimentar diretamente de frutos das árvores (produtores), o sabiá atua como consumidor primário (2º nível trófico). Ao se alimentar de besouros herbívoros (consumidores primários), o sabiá atua como consumidor secundário (3º nível trófico). Logo, a alternativa correta é a B. Distratores: A erra pois o sabiá é heterótrofo, nunca produtor; C erra pois considera o fruto como consumidor primário; D confunde consumo de frutos com decomposição saprófaga; E desconsidera o caráter onívoro do sabiá."], "Ciclo do nitrogênio e do carbono": ["Os ciclos biogeoquímicos garantem a reciclagem da matéria na biosfera. No ciclo do carbono, a fotossíntese sequestra CO₂ atmosférico incorporando-o em moléculas orgânicas, enquanto a respiração celular, a decomposição e a queima de combustíveis fósseis devolvem carbono à atmosfera. No ciclo do nitrogênio, o gás N₂ do ar é fixado biologicamente por bactérias (como Rhizobium em leguminosas e cianobactérias em meio aquático), transformando-se em amônia (NH₃/NH₄⁺). Bactérias nitrificantes realizam a nitrosação (Nitrosomonas gerando nitrito NO₂⁻) e a nitratação (Nitrobacter gerando nitrato NO₃⁻, forma assimilável pelas plantas). Por fim, bactérias desnitrificantes convertem nitrato novamente em N₂, fechando o ciclo.", ["Fixação biológica: N₂ → NH₃ (Rhizobium, cianobactérias)", "Nitrosação: NH₃ → NO₂⁻ (bactérias Nitrosomonas)", "Nitratação: NO₂⁻ → NO₃⁻ (bactérias Nitrobacter)", "Desnitrificação: NO₃⁻ → N₂ (Pseudomonas desnitrificantes)", "Associação leguminosa-Rhizobium: adubação verde sustentável"], "O ENEM adora a prática agrícola da 'adubação verde' e rotação de culturas com leguminosas (soja, feijão, ervilha, tremoço). O segredo biológico está nos nódulos radiculares com bactérias fixadoras de nitrogênio, reduzindo a necessidade de fertilizantes químicos sintéticos.", "<p>A técnica da rotação de culturas alternando o cultivo de milho (gramínea) com feijão (leguminosa) é amplamente recomendada na agricultura sustentável para recuperação de solos empobrecidos, reduzindo o uso de fertilizantes nitrogenados sintéticos de alto impacto ambiental.</p><div style='text-align:center;margin:12px 0'><svg viewBox='0 0 340 100' style='width:100%;max-width:340px;height:auto;background:var(--hi);border-radius:12px;padding:8px'><text x='170' y='20' text-anchor='middle' font-size='11' font-weight='700' fill='var(--tx)'>N₂ (ar) → [Fixação] → NH₄⁺ → [Nitrosação] → NO₂⁻ → [Nitratação] → NO₃⁻</text><text x='170' y='50' text-anchor='middle' font-size='10' fill='var(--mu)'>Rhizobium em nódulos radiculares de leguminosas</text><path d='M 30,70 L 310,70' stroke='var(--ac)' stroke-width='2' stroke-dasharray='4'/><text x='170' y='85' text-anchor='middle' font-size='10' font-weight='600' fill='var(--ok)'>Desnitrificação: NO₃⁻ → N₂ gasoso devolvido à atmosfera</text></svg></div>", "O benefício ecológico direto proporcionado pela introdução do feijoeiro nessa rotação decorre da presença de:", ["fungos micorrízicos capazes de sintetizar nitrato diretamente a partir da luz solar.", "bactérias do gênero Rhizobium em nódulos radiculares que realizam fixação biológica do N₂.", "algas unicelulares nos estômatos das folhas que convertem uréia em amônia.", "bactérias desnitrificantes nos caules que impedem a perda de água por transpiração.", "vírus bacteriófagos que quebram a celulose do solo liberando fosfato inorgânico."], 1, "As raízes das leguminosas formam associações mutualísticas com bactérias do gênero Rhizobium (nódulos radiculares). Essas bactérias possuem a enzima nitrogenase, capaz de romper a tripla ligação do N₂ atmosférico e produzir compostos amoniacais que enriquecem o solo após a colheita ou incorporação vegetal. Alternativa correta: B. Distratores: A erra pois fungos não sintetizam nitrato pela luz; B é biologicamente absurda; D confunde desnitrificação com contenção hídrica; E cita vírus e fosfato sem qualquer relação com o ciclo nitrogenado."], "Ciclos biogeoquímicos do nitrogênio e fósforo": ["Os ciclos biogeoquímicos garantem a circulação contínua dos elementos químicos essenciais entre a biosfera e o ambiente físico. No ciclo do nitrogênio, bactérias fixadoras (como <i>Rhizobium</i> em leguminosas) convertem N₂ atmosférico em amônia (NH₄⁺), bactérias nitrificantes realizam a nitrificação gerando nitritos e nitratos assimiláveis pelas plantas, e bactérias desnitrificantes devolvem N₂ à atmosfera. No ciclo do fósforo, ao contrário do nitrogênio e carbono, não há fase gasosa atmosférica relevante: o fósforo circula lentamente a partir do intemperismo de rochas fosfatadas, sendo absorvido pelas raízes na forma de fosfato (PO₄³⁻) para síntese de ácidos nucleicos, fosfolipídios e ATP, retornando ao solo e sedimentos aquáticos pela decomposição.", ["Nitrogênio: fixação biológica (Rhizobium), nitrificação e desnitrificação", "Fósforo: ciclo sedimentar SEM fase gasosa atmosférica significativa", "Fosfato (PO₄³⁻): componente estrutural de ATP, DNA, RNA e membranas", "Adubação fosfatada e nitrogenada: motores primários de eutrofização aquática"], "O ciclo do fósforo é exclusivamente sedimentar (não passa pelo ar como gás). O fósforo é frequentemente o fator limitante primário para a produtividade primária em ecossistemas aquáticos continentais.", "<p>Diferentemente dos ciclos do carbono e do nitrogênio, que possuem amplos reservatórios gasosos na atmosfera, o ciclo biogeoquímico do fósforo possui como reservatório primário as rochas da litosfera.</p>", "A ausência de uma fase gasosa atmosférica significativa no ciclo do fósforo implica que a disponibilidade desse nutriente nos ecossistemas terrestres depende primordialmente do(a):", ["respiração celular anaeróbia de protozoários ciliados de água doce.", "fixação fotoquímica de fosfato gasoso durante tempestades de raios cósmicos.", "intemperismo físico e químico de rochas fosfatadas e posterior absorção radicular.", "condensação de vapor d'água rico em fosfina na estratosfera polar.", "evaporação da água dos oceanos com transporte de cristais iônicos pelo vento."], 2, "Como o fósforo não possui fase gasosa sob condições biológicas usuais, sua entrada nas cadeias tróficas depende da erosão, intemperismo e dissolução de rochas fosfatadas, liberando íons fosfato (PO₄³⁻) no solo e na água para absorção pelas plantas e fitoplâncton. Alternativa correta: C. Distratores: A cita protozoários sem relação com minerais; C e D inventam fases gasosas; E descreve transporte marinho ineficaz para fósforo."], "Circulação comparada nos vertebrados": ["O sistema cardiovascular dos vertebrados sofreu marcantes transformações evolutivas na transição da respiração aquática para a pulmonar terrestre. Nos peixes, o coração possui apenas duas câmaras (um átrio e um ventrículo) e a circulação é simples e completa: pelo coração passa exclusivamente sangue venoso desoxigenado impulsionado para as brânquias e daí para o corpo. Nos anfíbios, o coração tem três câmaras (dois átrios e um ventrículo único) e a circulação é dupla e incompleta, ocorrendo mistura parcial de sangue venoso e arterial no ventrículo. Na maioria dos répteis, o coração possui três câmaras com septação ventricular parcial (septo de Sabatier), exceto nos crocodilianos que possuem quatro câmaras (mistura pelo forame de Panizza). Em aves e mamíferos, o coração possui quatro câmaras totalmente separadas (dois átrios e dois ventrículos), septo interventricular completo e circulação dupla e completa (sem mistura de sangue), permitindo altíssima pressão sistêmica para oxigenação tecidual e sustentação da endotermia.", ["Peixes: 2 câmaras (1 átrio, 1 ventrículo); circulação simples; passa apenas sangue venoso", "Anfíbios: 3 câmaras (2 átrios, 1 ventrículo); circulação dupla e incompleta (mistura)", "Répteis não-crocodilianos: 3 câmaras com septo incompleto; dupla e incompleta", "Aves e Mamíferos: 4 câmaras totalmente separadas; dupla e completa (sem mistura de sangue)", "Vantagem da circulação completa: suporta alta taxa metabólica e homeotermia (endotermia)"], "Lembre-se da correlação evolutiva: sangue oxigenado e desoxigenado NÃO se misturam no coração de AVES e MAMÍFEROS. Isso garante que tecidos recebam sangue com máxima saturação de O₂, sustentando o calor da endotermia.", "<p>A endotermia (capacidade de manter a temperatura corpórea central constante e elevada por meio do calor metabólico interno) exige uma taxa de consumo de oxigênio celular cerca de dez vezes superior à de animais ectotérmicos de mesmo peso corporal.</p>", "Essa alta demanda metabólica em aves e mamíferos é atendida pela presença de um sistema circulatório caracterizado por:", ["coração com apenas duas câmaras que bombeia sangue arterial diretamente para as brânquias.", "veias elásticas que realizam hematose periférica sem intermédio dos capilares pulmonares.", "circulação aberta em que o sangue extravasa em lacunas corporais sem auxílio de artérias.", "ventrículo único com septação muscular espessa que direciona todo o sangue aos alvéolos.", "coração tetracavitário com separação ventricular completa, impedindo a mistura de sangue oxigenado e desoxigenado."], 4, "O coração de quatro câmaras com septo interventricular completo (dois átrios e dois ventrículos anatomicamente isolados) assegura que o sangue arterial rico em oxigênio chegue aos tecidos com pressão elevada e 100% de pureza gasosa, sem misturar-se ao sangue venoso desoxigenado, sustentando a respiração celular intensa necessária para a endotermia de aves e mamíferos. Alternativa correta: E. Distratores: A é de peixes; C descreve invertebrados; D descreve anfíbios; E cita hematose venosa impossível."], "Citoesqueleto, centrossomos e motilidade celular": ["O citoesqueleto é uma rede tridimensional dinâmica de filamentos proteicos no citosol das células eucariontes, responsável pela manutenção da forma celular, ancoragem de organelas, trânsito vesicular e motilidade. É composto por três elementos estruturais fundamentais: microtúbulos (polímeros de tubulina que formam o fuso mitótico, centríolos, cílios e flagelos, atuando como trilhos para proteínas motoras cinesina e dineína), microfilamentos de actina (envolvidos na contração muscular, ciclose citoplasmática, formação do anel contrátil na citocinese e emissão de pseudópodes na fagocitose e locomoção ameboide) e filamentos intermediários (como queratinas, conferindo resistência mecânica e sustentação a tensões de tração).", ["Microtúbulos (tubulina): fuso mitótico, centrossomos, cílios (9+2) e flagelos", "Microfilamentos (actina): ciclose citoplasmática, pseudópodes e anel contrátil da citocinese", "Filamentos intermediários: resistência mecânica e adesão celular (desmossomos)", "Proteínas motoras: cinesina e dineína transportam vesículas sobre microtúbulos"], "Cílios e flagelos eucariotos compartilham o mesmo arranjo ultraestrutural: um axonema com 9 pares de microtúbulos periféricos e 1 par central (arranjo 9+2), movido pela proteína motora dineína dependente de ATP.", "<p>Glóbulos brancos do tipo neutrófilo deslocam-se ativamente pelos tecidos corporais emitindo projeções citoplasmáticas dinâmicas denominadas pseudópodes, permitindo a transmigração pelos capilares (diapedese) e a fagocitose de bactérias patogênicas.</p>", "A formação e projeção dos pseudópodes durante a locomoção ameboide dependem primordialmente da rápida polimerização e despolimerização de:", ["fibras colágenas insolúveis da matriz extracelular epitelial.", "gotículas de triglicerídeos presentes no retículo endoplasmático liso.", "moléculas de DNA circular desprovidas de histonas no citosol.", "microfilamentos de actina pertencentes ao citoesqueleto celular.", "cristais de celulose sintetizados pelos ribossomos nucleolares."], 3, "A emissão de pseudópodes para movimentação ameboide e fagocitose celular depende da montagem e desmontagem rápida de microfilamentos de actina do citoesqueleto, que empurram a membrana plasmática em resposta a estímulos quimiotáticos. Alternativa correta: D. Distratores: A é matriz extracelular externa; C, D e E citam componentes químicos que não participam da motilidade celular."], "Coevolução, mimetismo e camuflagem": ["A seleção natural atua intensamente modelando adaptações defensivas e predatórias nas populações biológicas. A camuflagem ocorre quando a morfologia, textura ou coloração de um organismo o tornam visualmente indistinguível do substrato físico do ambiente circundante (como o bicho-pau que se confunde com gravetos ou a coruja críptica na casca da árvore), dificultando sua detecção por predadores ou presas. A coloração de aviso (aposematismo) ocorre em animais venenosos ou de sabor impalatável que exibem cores brilhantes e conspícuas (como sapos dendrobatídeos amarelos e vermelhos com toxinas mortais ou vespas listradas), advertindo predadores experientes sobre o perigo. O mimetismo ocorre quando uma espécie assemelha-se morfologicamente a outra espécie: no Mimetismo Batesiano, uma espécie inofensiva e palatável imita a coloração de uma espécie perigosa/venenosa para afastar predadores (como a falsa-coral que imita a coral-verdadeira); no Mimetismo Mülleriano, duas ou mais espécies venenosas compartilham o mesmo padrão aposemático de cores, reforçando o aprendizado de aversão dos predadores.", ["Camuflagem: o ser vivo imita o AMBIENTE físico circundante (bicho-pau, camaleão)", "Aposematismo: cores vivas de alerta exibidas por animais realmente venenosos/tóxicos", "Mimetismo Batesiano: espécie inofensiva imita uma espécie perigosa (falsa-coral imita a verdadeira)", "Mimetismo Mülleriano: duas espécies perigosas compartilham a mesma cor de alerta", "Coevolução: pressões seletivas mútuas recíprocas entre predador-presa ou planta-polinizador"], "Não confunda: CAMUFLAGEM é o animal imitando o AMBIENTE físico (folha seca, galho, areia). MIMETISMO é um animal imitando OUTRO ANIMAL (geralmente uma espécie perigosa)!", "<p>A serpente falsa-coral (<i>Oxyrhopus guibei</i>) é uma serpente ápoda desprovida de glândulas de veneno eficientes que apresenta anéis transversais vermelhos, pretos e brancos extraordinariamente semelhantes aos da serpente coral-verdadeira (<i>Micrurus corallinus</i>), que possui veneno neurotóxico letal.</p>", "Essa semelhança visual evolutiva adaptativa apresentada pela falsa-coral é classificada biologicamente como:", ["mimetismo batesiano, que confere proteção contra predadores ao simular o fenótipo de uma espécie venenosa.", "camuflagem críptica com o solo florestal úmido.", "mimetismo mülleriano, pois ambas as serpentes possuem veneno neurotóxico idêntico.", "aposematismo verdadeiro de uma espécie que causa necrose tecidual direta.", "especiação simpátrica por isolamento mecânico das escamas dorsais."], 0, "No mimetismo batesiano (descoberto pelo naturalista Henry Walter Bates na Amazônia), a espécie mimética é inofensiva e palatável, mas 'pega carona' no padrão de advertência de uma espécie modelo perigosa ou impalatável. Predadores como aves e mamíferos que aprenderam a evitar a picada letal da coral-verdadeira deixam de atacar a falsa-coral por confundirem visualmente as duas serpentes, conferindo vantagem adaptativa de sobrevivência à espécie mimética. Alternativa correta: A. Distratores: A confunde mimetismo com camuflagem; C confunde com mimetismo mülleriano (onde ambas seriam perigosas); D e E formulam hipóteses incorretas."], "Condução de seiva elaborada pelo floema e anelamento caulinar": ["A seiva elaborada (orgânica) é uma solução aquosa concentrada em sacarose, aminoácidos e hormônios, conduzida ao longo dos vasos floemáticos (líber). Diferentemente do xilema, cujos elementos são células mortas, os tubos crivados do floema são constituídos por células vivas anucleadas acopladas metabolicamente a células companheiras nucleadas. O mecanismo biofísico de transporte é explicado pela Hipótese do Fluxo por Pressão de Ernst Münch: nas fontes produtoras (folhas fotossintetizantes), a sacarose é bombeada ativamente para o interior dos tubos crivados, tornando o floema hipertônico; a água do xilema vizinho entra por osmose gerando alta pressão hidrostática. Nos drenos de consumo ou armazenamento (raízes, frutos, tubérculos), a sacarose é descarregada, a água retorna ao xilema e a diferença de pressão impulsiona o fluxo em massa da seiva elaborada.", ["Floema (líber): células vivas (tubos crivados e células companheiras)", "Seiva elaborada: sacarose, aminoácidos e fitormônios solúveis", "Modelo de Münch: fluxo por gradiente de pressão osmótica hidrostática Fonte → Dreno", "Fonte produtora (folhas): alta osmolaridade por sacarose puxa água e cria pressão", "Dreno de consumo (raízes, frutos): descarrega sacarose e alivia a pressão hidrostática"], "O pulgão (afídeo) insere seu estilete bucal microscópico com extrema precisão diretamente nos tubos crivados do floema. A pressão hidrostática interna da seiva elaborada é tão alta que o líquido adocicado é forçado para dentro do trato digestório do inseto sem que ele precise fazer esforço de sucção!", "<p>Cientistas utilizam pulgões (insetos sugadores de seiva) para analisar a composição do líquido que flui pelos vasos condutores vegetais. Ao introduzirem seus aparelhos bucais perfurantes no caule de uma planta iluminada, os pulgões atingem exatamente um tipo celular e a seiva extravasa espontaneamente para o estilete sob alta pressão mecânica.</p>", "As células condutoras perfuradas pelo estilete do pulgão e a natureza química predominante do soluto transportado são:", ["elementos de vaso mortos do xilema; íons fosfato e nitrato inorgânicos.", "células estomáticas oclusivas da epiderme; gás oxigênio dissolvido em cutina.", "elementos de tubo crivado vivos do floema; sacarose produzida na fotossíntese foliar.", "esclerócitos do esclerênquima lenhoso; celulose insolúvel e lignina polimerizada.", "células do parênquima aquífero medular; amido sólido cristalizado."], 2, "Os pulgões alimentam-se exclusivamente da seiva elaborada rica em carboidratos solúveis, perfurando seletivamente os elementos de tubo crivado do floema. Como o floema opera sob alta pressão hidrostática positiva gerada pela osmose osmótica nas fontes fotossintetizantes (Hipótese de Münch), a solução rica em sacarose jorra espontaneamente pelo bico do inseto. Alternativa correta: C. Distratores: A descreve o xilema sob pressão negativa de sucção; C, D e E citam células de sustentação ou proteção que não conduzem seiva elaborada líquida."], "Conservação da biodiversidade e desenvolvimento sustentável": ["A conservação biológica visa preservar a variabilidade genética, as espécies e os ecossistemas, garantindo o equilíbrio ecológico e os serviços ecossistêmicos indispensáveis à humanidade (como polinização, regulação hídrica e fertilidade do solo). O desenvolvimento sustentável busca conciliar o crescimento socioeconômico com a preservação ambiental, assegurando recursos para as gerações presentes e futuras. A fragmentação de habitats, provocada por estradas e expansão agropecuária, isola populações e reduz o fluxo gênico, aumentando a endogamia e o risco de extinção. Ferramentas de manejo ecológico, como corredores ecológicos e unidades de conservação, restabelecem a conectividade entre manchas florestais.", ["Corredores ecológicos: reconectam fragmentos e viabilizam fluxo gênico", "Efeito de borda: microclima e espécies invasoras alteram margens florestais", "Serviços ecossistêmicos: polinização, regulação climática e aquífera", "Unidades de Conservação: Proteção Integral vs Uso Sustentável (SNUC)"], "Corredores ecológicos são cobrados com frequência. A função biológica primária de um corredor de mata nativa unindo dois fragmentos isolados é permitir o deslocamento de animais e a dispersão de sementes, restabelecendo o fluxo gênico e combatendo a depressão endogâmica.", "<p>A construção de uma rodovia federal cortou uma vasta reserva florestal de Mata de Cocais, dividindo-a em dois blocos isolados. Para mitigar o impacto sobre populações de pequenos mamíferos e primatas nativos, órgãos ambientais exigiram a implementação de passagens subterrâneas de fauna e pontes vegetadas ligando as copas das árvores sobre a pista.</p>", "A principal justificativa biológica para a criação dessas estruturas de conectividade entre os fragmentos é:", ["promover o fluxo gênico entre subpopulações isoladas, reduzindo a consanguinidade.", "impedir a ação de decompositores nas margens da pista asfáltica.", "induzir a especiação simpátrica forçada nos mamíferos de pequeno porte.", "eliminar permanentemente a competição intraespecífica por território na floresta.", "acelerar a bioacumulação de nutrientes orgânicos no solo circundante."], 0, "O isolamento físico de fragmentos impede a migração de espécimes e a dispersão de pólen/sementes, levando à redução do tamanho efetivo da população, perda de diversidade alélica e acúmulo de mutações deletérias por endogamia (consanguinidade). As passagens de fauna e corredores restabelecem o fluxo gênico contínuo entre os dois lados. Alternativa correta: A. Distratores: B, C, D e E formulam proposições ecológicas sem fundamento; C confunde reconexão com barreira de especiação; D erra pois a competição nunca é totalmente eliminada."], "Corredores ecológicos e fragmentação de habitats": ["A fragmentação de habitats naturais provocada pela expansão agropecuária e rodovias subdivide grandes florestas em manchas isoladas, aumentando dramaticamente a proporção de bordas expostas ao vento, dessecação e espécies invasoras (efeito de borda). O efeito de borda desestabiliza o microclima florestal úmido, reduz a disponibilidade de recursos para predadores de topo e isola populações em pequenos grupos sujeitos à endogamia e deriva genética. Os corredores ecológicos são faixas contínuas de vegetação nativa conectando esses fragmentos remanescentes, restabelecendo a continuidade da paisagem. Eles viabilizam o fluxo gênico interpopulacional, a dispersão de propágulos vegetais e a livre movimentação da fauna, mitigando o risco de extinção local.", ["Fragmentação florestal: divide ecossistemas contínuos e amplia o efeito de borda prejudicial", "Efeito de borda: microclima mais seco e quente na periferia, favorecendo invasoras e queimadas", "Corredores ecológicos: faixas verdes que interligam fragmentos isolados na paisagem", "Fluxo gênico: reconexão permite cruzamentos entre populações distintas, evitando depressão endogâmica", "Espécies especialistas: animais sensíveis do interior da floresta são os mais beneficiados"], "O ENEM adora questões de conservação! A criação de corredores ecológicos NÃO aumenta a área total de floresta de forma drástica, mas SALVA espécies porque RESTABELECE O FLUXO GÊNICO e a migração entre ilhas verdes isoladas.", "<p>A construção de uma rodovia federal e o avanço da fronteira agrícola segmentaram uma extensa área de Mata Atlântica em cinco pequenos fragmentos florestais desconectados. Biólogos constataram que, após uma década, mamíferos de médio porte como o mico-leão-dourado apresentavam baixa diversidade alélica e alta incidência de anomalias congênitas por cruzamentos consanguíneos.</p>", "Para reverter esse quadro de erosão genética sem desapropriar as áreas agrícolas produtivas centrais, a medida conservacionista mais eficiente é:", ["introduzir animais predadores exóticos para regular a taxa de natalidade do mico-leão.", "pulverizar fertilizantes químicos nitrogenados no interior das matas remanescentes.", "implantar corredores ecológicos com árvores nativas interligando os fragmentos isolados.", "erguer cercas elétricas contínuas em torno de cada fragmento florestal da reserva.", "desmatar as bordas dos fragmentos para acelerar o processo de sucessão ecológica secundária."], 2, "A implantação de corredores ecológicos interliga os remanescentes florestais, restabelecendo o trânsito dos indivíduos entre diferentes populações. Isso promove o fluxo gênico, recombinação alélica e redução da homozigose deletéria decorrente da endogamia, salvaguardando a viabilidade populacional da espécie ameaçada. Alternativa correta: C. Distratores: A agravaria a perda de biodiversidade; C, D e E acentuam o isolamento reprodutivo e a degradação ambiental."], "Declínio dos polinizadores e síndrome de polinização": ["A polinização é um serviço ecossistêmico fundamental realizado por insetos, aves e morcegos, responsável pela fecundação cruzada de mais de 75% das culturas agrícolas alimentares do planeta. As síndromes de polinização referem-se ao conjunto de características florais (cor, odor, morfologia da corola e presença de néctar ou pólen) coevoluídas em resposta aos diferentes vetores animais, como a melitofilia (abelhas atraídas por flores azuis/amarelas aromáticas) e a quiropterofilia (morcegos atraídos por flores brancas noturnas com odor forte). O fenômeno do distúrbio do colapso das colmeias e o declínio global de abelhas nativas são provocados pelo uso intensivo de agrotóxicos neonicotinoides, perda de habitat natural e mudanças climáticas. Esse declínio ameaça diretamente a produtividade agrícola, a segurança alimentar mundial e a perpetuação da flora nativa.", ["Serviço ecossistêmico de polinização: transferência de pólen essencial à frutificação e sementes", "Melitofilia (abelhas): flores com guias de néctar ultravioleta, pólen rico em proteínas e néctar doce", "Quiropterofilia (morcegos) e Ornitofilia (aves): flores tubulares especializadas e volumoso néctar", "Neonicotinoides: inseticidas sistêmicos que desorientam o sistema nervoso de forrageamento das abelhas", "Insegurança alimentar: a perda de polinizadores acarreta quebra de safra de frutas, oleaginosas e legumes"], "No ENEM, polinização é associada à BIOECONOMIA e SERVIÇOS ECOSSISTÊMICOS. A redução de polinizadores afeta o bolso e o prato: menos sementes, frutos deformados e menor rendimento agrícola por hectare.", "<p>Em uma região produtora de maracujá e café, agricultores intensificaram a aplicação aérea de inseticidas neurotóxicos para controlar pragas foliares. Embora a densidade de lagartas tenha caído, os produtores registraram, nas safras seguintes, queda drástica na formação de frutos e vagens, mesmo com irrigação e adubação ideais.</p>", "A queda na produtividade agrícola observada após o uso maciço do inseticida decorreu da:", ["destruição das micorrizas radiculares responsáveis pela fixação do gás oxigênio no solo.", "inibição da fotossíntese foliar provocada pelo acúmulo excessivo de grãos de pólen nas folhas.", "indução de mutações carcinogênicas nos óvulos florais impedindo a absorção de luz solar.", "mortalidade de insetos polinizadores silvestres essenciais à fecundação das flores das culturas.", "estimulação da partenocarpia obrigatória que impede o surgimento de frutos comerciais carnDivid."], 3, "Inseticidas sistêmicos e neurotóxicos não discriminam pragas de agentes benéficos, eliminando polinizadores vitais como abelhas solitárias (mamangavas no maracujazeiro) e abelhas apis. Sem o transporte de pólen das anteras para o estigma, não ocorre fertilização da oosfera, inviabilizando a formação de sementes e o subsequente desenvolvimento hormonal do fruto. Alternativa correta: D. Distratores: A cita micorrizas fixando oxigênio (falso); C, D e E trazem aberrações conceituais fisiológicas."], "Deriva genética, efeito fundador e gargalo populacional": ["A deriva genética é um mecanismo evolutivo estocástico (aleatório) que altera as frequências alélicas de uma população ao longo das gerações devido ao acaso da amostragem de gametas e eventos fortuitos, e não por seleção natural adaptativa. Esse efeito é inversamente proporcional ao tamanho da população: em populações grandes e panmíticas, as flutuações amostrais são insignificantes; em populações pequenas, o acaso pode fixar alelos prejudiciais ou eliminar alelos vantajosos de forma drástica. Duas situações extremas catalisam a deriva: o efeito gargalo (bottleneck), quando desastres ecológicos (secas, epidemias ou caça predatória) dizimam a maioria dos indivíduos independentemente do seu genótipo, deixando poucos sobreviventes com diversidade genética reduzida; e o efeito fundador, quando um pequeno grupo pioneiro coloniza um novo ambiente isolado (como uma ilha oceânica), fundando uma população com apenas uma fração aleatória do pool gênico da população ancestral.", ["Deriva genética: alteração estocástica (ao acaso) das frequências alélicas, sem valor adaptativo prévio", "Impacto em populações pequenas: alelos raros podem desaparecer ou se fixar em poucas gerações", "Efeito gargalo (Bottleneck): colapso demográfico súbito reduz drasticamente a variabilidade genética da espécie", "Efeito fundador: colonização por poucos indivíduos gera populações com alta prevalência de alelos raros da linhagem pioneira", "Depressão por endogamia: cruzamentos consanguíneos aumentam a homozigose de alelos deletérios recessivos"], "No ENEM, diferencie SELEÇÃO NATURAL de DERIVA GENÉTICA: a Seleção Natural é DIRECIONAL e ADAPTATIVA (sobrevive quem tem vantagem ao ambiente); a Deriva é puro ACASO e SORTE (uma enchente mata 90% dos animais sem olhar se eram mais aptos ou não).", "<p>O guepardo africano (Acinonyx jubatus) sofreu dois episódios severos de colapso populacional no passado geológico — um ao final da última era glacial e outro pela ação da caça antrópica no século XX —, nos quais a espécie foi reduzida a pouquíssimos indivíduos reprodutores. Atualmente, os guepardos exibem diversidade genética quase nula, com aceitação universal de enxertos de pele entre indivíduos não aparentados e elevada taxa de espermatozoides malformados.</p>", "A extrema homogeneidade genética apresentada pela população atual de guepardos decorre da atuação do(a):", ["seleção estabilizadora contínua em ambientes savânicos perfeitamente homogêneos.", "deriva genética associada a um efeito gargalo demográfico severo na história da espécie.", "mutagênese direcionada estimulada pela dieta hipoproteica dos predadores carnívoros.", "isolamento reprodutivo pós-zigótico obrigatório impedindo o cruzamento interpopulacional.", "herança lamarckista de caracteres adquiridos ao longo da corrida em alta velocidade."], 1, "A redução drástica e abrupta no tamanho populacional do guepardo forçou a espécie a passar por um severo 'efeito gargalo'. O número reduzido de sobreviventes continha apenas uma minúscula fração do pool gênico original da espécie, e a deriva genética operou eliminando a maioria dos alelos polimórficos e fixando loci em homozigose, o que explica a quase total identidade imunogenética entre os indivíduos atuais. Alternativa correta: B. Distratores: A descreve seleção natural; C, D e E violam princípios básicos da biologia evolutiva."], "Desmatamento, queimadas e perda de biodiversidade": ["O desmatamento e o uso desordenado do fogo na agropecuária promovem a destruição direta de ecossistemas naturais, liberação massiva de CO₂ e material particulado na atmosfera e fragmentação florestal severa. As queimadas destroem a microbiota do solo e a camada fértil de serrapilheira, reduzem a infiltração de água e aceleram a erosão e o assoreamento de rios. A perda de habitat é a principal causa da crise contemporânea de extinção de espécies biológicas. A fragmentação gera o efeito de borda: as margens da floresta sofrem ressecamento por ventos, aumento de temperatura e invasão por gramíneas exóticas altamente inflamáveis, ampliando a suscetibilidade a novos incêndios florestais catastróficos.", ["Perda de habitat: causa primária de declínio e extinção da biodiversidade global", "Queimadas: destroem serrapilheira, volatilizam nitrogênio e geram emissão de CO₂ e fuligem", "Efeito de borda: microclima seco nas margens de fragmentos facilita novos incêndios", "Assoreamento: erosão de solo desprotegido entope leitos de rios e lagoas"], "No Cerrado e Pantanal, o fogo natural em pequenas escalas faz parte da dinâmica ecológica histórica; no entanto, queimadas antrópicas frequentes e em épocas de estiagem extrema ultrapassam a capacidade de resiliência dos biomas, dizimando fauna e flora.", "<p>A derrubada de florestas tropicais para expansão de pastagens no arco do desmatamento promove alterações microclimáticas severas. Medições ecológicas demonstram que fragmentos florestais isolados apresentam maior temperatura média e menor umidade relativa nas suas bordas do que em seu interior protegido.</p>", "Essa alteração ecológica conhecida como 'efeito de borda' impacta negativamente a biodiversidade nativa porque:", ["elimina a síntese de clorofila nas copas das árvores centrais do fragmento.", "bloqueia a atração gravitacional do solo sobre as sementes dispersas pelo vento.", "induz a autofecundação forçada de grandes felinos predadores de topo.", "altera o microclima periférico, facilitando a dessecação e a invasão por espécies exóticas oportunistas.", "converte os rios em cursos d'água perenes com pH alcalino saturado de calcário."], 3, "Nas bordas de fragmentos florestais, a maior incidência de vento e radiação solar altera temperatura e umidade (efeito de borda), desfavorecendo espécies umbrófilas nativas e favorecendo gramíneas exóticas invasoras inflamáveis, aumentando o risco de queimadas e reduzindo o tamanho efetivo da mata primária. Alternativa correta: D. Distratores: A, B, C e E formulam hipóteses descabidas ou contraditórias com a biologia de fragmentação."], "Destino dos folhetos embrionários: ecto, meso e endoderme": ["Durante a gastrulação no desenvolvimento embrionário dos animais triblásticos, a blastocela é substituída pelo arquêntero e as células da blastocisto diferenciam-se nos três folhetos germinativos fundamentais: ectoderme, mesoderme e endoderme. Cada folheto embrionário possui um destino biológico estrito na organogênese, dando origem a tecidos e órgãos corporais específicos. A ectoderme (folheto externo) origina toda a epiderme e seus anexos queratinizados (pelos, unhas, penas e glândulas sebáceas/sudoríparas), o esmalte dos dentes e todo o sistema nervoso central e periférico (encéfalo, medula espinhal, nervos e retina). A mesoderme (folheto intermediário) origina os tecidos conjuntivos (ósseo, cartilaginoso, adiposo e sanguíneo), a derme profunda da pele, os tecidos musculares (estriado esquelético, estriado cardíaco e liso), o sistema cardiovascular, o sistema urogenital (rins e gônadas) e as cavidades serosas celômicas. A endoderme (folheto interno) forma o epitélio de revestimento interno do trato gastrointestinal e respiratório (traqueia e pulmões), além das glândulas associadas (fígado e pâncreas) e tireoide.", ["Ectoderme: Epiderme da pele, esmalte dentário e todo o Sistema Nervoso (neurônios e gliócitos)", "Mesoderme: Músculos, Ossos, Sangue, Vasos sanguíneos, Rins, Gônadas e Derme profunda", "Endoderme: Epitélio interno do tubo digestório e respiratório, Fígado, Pâncreas e Tireoide", "Tubo neural: dobra-se da ectoderme dorsal sob indução da notocorda mesodérmica", "Somitos: blocos de mesoderme ao longo do dorso que originam vértebras esqueléticas e musculatura axial"], "Cuidado com a casca de banana do ENEM: A PELE é mista! A EPIDERME (camada superficial) vem da ECTODERME; mas a DERME (camada profunda vascularizada e com colágeno) vem da MESODERME!", "<p>E
