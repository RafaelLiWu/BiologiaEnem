splicing alternativo de íntrons.", "Invariabilidade dos ribossomos frente a variações térmicas do meio."], 1, "O código genético é universal: uma trinca de bases (códon) no RNAm (como o códon UUU codificando fenilalanina ou AUG codificando metionina) codifica o mesmo aminoácido tanto em uma bactéria procarionte quanto em uma célula humana eucarionte. Essa universalidade é uma evidência contundente da origem evolutiva comum de todos os seres vivos da Terra e permite a tecnologia do DNA recombinante. Alternativa correta: B. Distratores: A cita ambiguidade inexistente; C erra pois o código é universal e a degeneração não é exclusividade humana; D erra pois bactérias comuns não realizam splicing; E cita estabilidade ribossômica irrelevante para a tradução do códon."], "Métodos contraceptivos e prevenção de ISTs": ["Os métodos contraceptivos classificam-se em comportamentais (tabelinha, coito interrompido — de baixíssima eficácia), de barreira (camisinha externa e interna, diafragma), hormonais (pílulas, injeções, implantes, anéis vaginais), intrauterinos (DIU de cobre e hormonal) e cirúrgicos definitivos (laqueadura tubária na mulher e vasectomia no homem). A vasectomia consiste no seccionamento e ligadura dos ductos deferentes, impedindo a passagem dos espermatozoides para o esperma, sem afetar a produção de testosterona pelos testículos nem a ereção e ejaculação de líquidos glandulares. É fundamental destacar que os preservativos (camisinhas masculina e feminina) são os ÚNICOS métodos que protegem concomitantemente contra a gravidez indesejada e contra Infecções Sexualmente Transmissíveis (ISTs), como HIV/AIDS, sífilis, gonorreia, HPV e hepatite B.", ["Camisinha (preservativo): ÚNICO método que previne ISTs e gravidez simultaneamente", "Vasectomia: corte dos ductos deferentes; o homem continua ejaculando e produzindo testosterona normal!", "Laqueadura: ligadura das tubas uterinas; impede o encontro do espermatozoide com o ovócito", "DIU de cobre: espermicida/inflamatório local; não impede a ovulação", "ISTs bacterianas (sífilis/gonorreia) tratadas com antibióticos; virais (HIV/HPV) não"], "O homem vasectomizado CONTINUA EJACULANDO normalmente! O sêmen ejaculado é composto por mais de 95% de secreções da próstata e vesículas seminais. A vasectomia apenas impede que os espermatozoides saiam do epidídimo, e não altera a produção hormonal de testosterona nem o desejo sexual.", "<p>Em uma consulta de planejamento familiar no posto de saúde, um homem manifestou receio de realizar a vasectomia, temendo perder a masculinidade, parar de produzir testosterona e ficar impotente para relações sexuais.</p>", "A orientação médica correta que esclarece a anatomofisiologia da vasectomia deve informar que o procedimento cirúrgico:", ["remove integralmente os testículos, porém preserva a ereção peniana por reflexo medular.", "interrompe apenas os ductos deferentes, mantendo intactos a síntese de testosterona e o volume do líquido ejaculado.", "bloqueia os vasos sanguíneos da próstata, impedindo a transmissão do vírus da hepatite C.", "cauteriza as tubas uterinas masculinas, evitando a maturação de corpúsculos polares.", "extirpa a uretra peniana e canaliza o esperma diretamente para o cólon descendente."], 1, "A vasectomia é uma pequena cirurgia ambulatorial na qual são seccionados e suturados os ductos deferentes no saco escrotal. Os testículos continuam produzindo normalmente a testosterona (que é lançada diretamente nos capilares sanguíneos, e não pelos ductos) e a próstata e vesículas seminais continuam produzindo o líquido seminal normal. O homem continua ejaculando com volume seminal praticamente inalterado, apenas sem espermatozoides (azoospermia). Alternativa correta: B. Distratores: A descreve castração testicular; C, D e E formulam proposições anatômicas absurdas ou fantasiosas."], "Níveis tróficos e pirâmides ecológicas": ["As pirâmides ecológicas são representações gráficas da estrutura trófica de um ecossistema e podem ser de números, de biomassa ou de energia. A pirâmide de energia é SEMPRE direta e jamais invertida, pois o fluxo de energia é unidirecional e decrescente a cada nível trófico devido à perda na forma de calor e metabolismo celular. As pirâmides de números e de biomassa podem apresentar conformações invertidas, como em ecossistemas marinhos onde uma biomassa pequena de fitoplâncton, dotada de altíssima taxa de renovação, sustenta uma biomassa maior de zooplâncton em um determinado instante.", ["Pirâmide de Energia: SEMPRE direta (2ª Lei da Termodinâmica)", "Pirâmide de Biomassa marinha: pode ser invertida (alta taxa de turnover do fitoplâncton)", "Pirâmide de Números: pode ser invertida (uma árvore sustenta milhares de insetos)", "Fluxo unidirecional: energia não se recicla, dissipa como calor"], "Memorize sem hesitar: PIRÂMIDE DE ENERGIA NUNCA É INVERTIDA. Se a questão mostrar uma pirâmide invertida, só pode ser de biomassa (marinha) ou de números (parasitas ou árvore/insetos).", "<p>Considere o esquema a seguir de uma pirâmide ecológica marinha amostrada em um instante no oceano aberto:</p><div style='text-align:center;margin:12px 0'><svg viewBox='0 0 320 130' style='width:100%;max-width:320px;height:auto;background:var(--hi);border-radius:12px;padding:8px'><rect x='100' y='75' width='120' height='35' rx='6' fill='var(--ac)' opacity='0.85'/><text x='160' y='97' text-anchor='middle' font-size='11' font-weight='700' fill='var(--bt)'>Fitoplâncton (4 g/m²)</text><rect x='50' y='25' width='220' height='35' rx='6' fill='var(--ac)' opacity='0.98'/><text x='160' y='47' text-anchor='middle' font-size='11' font-weight='700' fill='var(--bt)'>Zooplâncton (21 g/m²)</text></svg><br><small style='color:var(--mu)'>Figura esquemática: Amostragem instantânea de biomassa fitoplâncton vs zooplâncton</small></div><p>Um estudante de biologia estranhou o fato de a base da pirâmide ser menor do que o topo, questionando a viabilidade termodinâmica do ecossistema.</p>", "A configuração representada é biologicamente sustentável no ambiente pelágico marinho porque o fitoplâncton apresenta:", ["taxa de reprodução e renovação de biomassa extremamente rápida.", "capacidade de absorver calor emitido pelo zooplâncton.", "menor gasto metabólico basal que os produtores terrestres.", "modo de nutrição saprófita facultativa em águas profundas.", "eficiência energética de 100% sem perdas por respiração."], 0, "O fitoplâncton possui ciclo de vida curto e taxa de divisão celular altíssima (elevado turnover). Embora a biomassa instantânea amostrada seja pequena, a produtividade contínua gera matéria orgânica suficiente para alimentar o zooplâncton. Alternativa correta: A. Distratores: A não explica a sustentação de maior biomassa consumidora; B viola a termodinâmica; D é incorreto (fitoplâncton é fotoautótrofo); E viola a 2ª Lei da Termodinâmica, pois sempre há perda respiratória."], "Núcleo celular, cromatina e condensação cromossômica": ["O núcleo é o centro de controle genético das células eucariontes, delimitado pelo envoltório nuclear (carioteca, dupla membrana com poros nucleares para tráfego molecular com o citosol) e contendo o nucleoplasma, a matriz nuclear e o nucléolo (onde se processam os RNAr e se montam as subunidades ribossômicas). O DNA genômico linear encontra-se associado a proteínas histonas, formando octâmeros proteicos ao redor dos quais a fita dupla se enrola originando os nucleossomos. Na intérfase, a cromatina apresenta-se em dois estados funcionais: Eucromatina (regiões descondensadas e ativas na transcrição gênica para síntese de RNA) e Heterocromatina (regiões altamente condensadas e transcricionalmente silenciosas, como nos centrômeros, telômeros e no corpúsculo de Barr em fêmeas mamíferas). Durante a divisão celular mitótica, toda a cromatina se hipercondensa originando os cromossomos clássicos visíveis ao microscópio óptico.", ["Carioteca: dupla membrana com poros nucleares que regulam a passagem de macromoléculas", "Nucléolo: síntese de RNA ribossômico (RNAr) e montagem de subunidades de ribossomos", "Eucromatina: descondensada, ativa na transcrição (genes sendo expressos)", "Heterocromatina: condensada, densa e inativa geneticamente (silenciada)", "Corpúsculo de Barr: cromossomo X condensado inativo (compensação de dose feminina)"], "Cromatina e cromossomo são a MESMA coisa em momentos diferentes do ciclo celular! Cromatina é o DNA desespiralado na intérfase (trabalhando na síntese proteica). Cromossomo é o DNA hipercondensado na divisão celular (empacotado para não quebrar durante a separação das cromátides).", "<p>Em imagens de microscopia eletrônica de transmissão de um neurônio metabolicamente muito ativo, o núcleo apresenta o nucléolo evidente e a maior parte do material genético disperso em uma rede filamentosa clara, com poucas áreas densas e escuras restritas à periferia nuclear.</p>", "O predomínio dessa conformação filamentosa clara e descondensada da cromatina é biologicamente compatível com o fato de que a célula está:", ["em metáfase mitótica com o fuso acromático desintegrado pela ação de centríolos.", "realizando intensa transcrição de genes na forma de eucromatina para manter sua síntese proteica.", "em meiose II com crossing-over contínuo de suas cromátides-irmãs homólogas.", "degradando todo o seu DNA por apoptose ativada por enzimas lisossômicas.", "sintetizando grandes quantidades de celulose no interior do complexo de Golgi."], 1, "As regiões nucleares claras e frouxas ao microscópio eletrônico correspondem à eucromatina, onde as fitas de DNA estão abertas e acessíveis para a ação da RNA polimerase na transcrição de RNA mensageiro e ribossômico. Neurônios são células interfásicas diferenciadas que sustentam elevadíssima taxa de síntese de proteínas e neurotransmissores, mantendo a maior parte do seu genoma na forma de eucromatina descondensada. Alternativa correta: B. Distratores: A cita metáfase (onde a cromatina está em máxima condensação cromossômica); C erra pois neurônios não sofrem meiose; D e E formulam absurdos."], "Organelas citoplasmáticas e suas funções": ["As células eucariontes possuem compartimentação citoplasmática por organelas membranosas especializadas. O retículo endoplasmático rugoso (granuloso), com ribossomos aderidos, sintetiza e processa proteínas de exportação e membrana. O retículo liso (não granuloso) atua na síntese de lipídios (como fosfolipídios e hormônios esteroides) e na desintoxicação de drogas e álcool nos hepatócitos. O complexo golgiense modifica, empacota e secreta substâncias em vesículas, além de originar os lisossomos (vesículas ricas em enzimas hidrolíticas para digestão intracelular autofágica e heterofágica). As mitocôndrias realizam a respiração celular e os cloroplastos a fotossíntese. Peroxissomos contêm catalase para decompor peróxido de hidrogênio (H₂O₂).", ["Retículo rugoso: síntese de proteínas para exportação (ribossomos aderidos)", "Retículo liso: síntese de lipídios e desintoxicação celular (hepatócitos)", "Complexo de Golgi: secreção celular, formação do acrossomo e lisossomos", "Lisossomos: digestão intracelular (autofagia e fagocitose)", "Peroxissomos: degradação de H₂O₂ pela enzima catalase"], "Pessoas que consomem álcool ou medicamentos de forma crônica desenvolvem tolerância porque as células do fígado (hepatócitos) proliferam ativamente o seu RETÍCULO ENDOPLASMÁTICO LISO, acelerando a taxa de desintoxicação e degradação hepática.", "<p>Considere o esquema representativo simplificado da rota de secreção celular em uma célula glandular acinar do pâncreas humano:</p><div style='text-align:center;margin:12px 0'><svg viewBox='0 0 340 120' style='width:100%;max-width:340px;height:auto;background:var(--hi);border-radius:12px;padding:8px'><rect x='20' y='35' width='80' height='50' rx='8' fill='var(--ac)' opacity='0.7'/><text x='60' y='63' text-anchor='middle' font-size='10' font-weight='700' fill='var(--bt)'>R. E. Rugoso</text><path d='M 105,60 L 130,60' stroke='var(--tx)' stroke-width='2' marker-end='arrow'/><rect x='135' y='30' width='85' height='60' rx='8' fill='var(--ac)' opacity='0.9'/><text x='177' y='63' text-anchor='middle' font-size='10' font-weight='700' fill='var(--bt)'>Compl. Golgi</text><path d='M 225,60 L 250,60' stroke='var(--tx)' stroke-width='2' marker-end='arrow'/><circle cx='275' cy='60' r='16' fill='var(--ok)'/><text x='275' y='64' text-anchor='middle' font-size='8' font-weight='700' fill='var(--bt)'>Vesícula</text><path d='M 295,60 L 325,60' stroke='var(--tx)' stroke-width='2'/></svg><br><small style='color:var(--mu)'>Via biossintética secretória: RER → Complexo Golgiense → Vesículas de Secreção (Exocitose)</small></div><p>Para sintetizar e secretar ativamente a enzima amilase pancreática na luz intestinal, uma célula acinar exige a cooperação integrada dessas organelas citoplasmáticas.</p>", "Nesse processo secretório, o papel biológico desempenhado especificamente pelo Complexo de Golgi é:", ["sintetizar o RNA mensageiro a partir da fita molde de DNA cromossômico.", "promover a digestão autofágica de ribossomos para obtenção de calor térmico.", "realizar a fotólise da água com liberação de gás oxigênio livre.", "quebrar a molécula de glicose em duas moléculas de ácido pirúvico.", "modificar, empacotar e direcionar as proteínas em vesículas secretoras."], 4, "O retículo endoplasmático rugoso sintetiza os polipeptídios precursores e os envia em vesículas de transição ao Complexo de Golgi. No complexo golgiense, as proteínas sofrem modificações pós-traducionais (como glicosilação e clivagens proteolíticas), são ordenadas e acondicionadas em vesículas de secreção que migram para a membrana para exocitose. Alternativa correta: E. Distratores: A é função nuclear (transcrição); B é função lisossômica; D descreve a glicólise citosólica; E descreve a fase clara da fotossíntese vegetal."], "Osmorregulação comparada em peixes ósseos e cartilaginosos": ["A manutenção do balanço osmótico de água e sais em ambientes aquáticos impõe desafios biofísicos opostos para animais marinhos e de água doce. Os peixes ósseos de água doce (dulcícolas) são hiperosmóticos em relação ao meio circundante hipo-osmótico: tendem a ganhar água continuamente por osmose pelas brânquias e perder sais por difusão. Para compensar, praticamente não bebem água, reabsorvem ativamente íons (Na⁺ e Cl⁻) pelas células de cloreto das brânquias e produzem grande volume de urina muito diluída. Em contrapartida, os peixes ósseos marinhos são hipo-osmóticos em relação ao mar: perdem água por osmose e ganham sais em excesso; para não desidratarem, bebem ativamente muita água salgada, excretam o excesso de íons por transporte ativo nas brânquias e eliminam pouca urina concentrada. Já os peixes cartilaginosos marinhos (tubarões e raias) retêm grandes concentrações de ureia e óxido de trimetilamina (TMAO) no sangue, tornando-se ligeiramente hiperosmóticos em relação à água do mar, evitando a perda de água corporal.", ["Peixe ósseo dulcícola: meio HIPOtônico → ganha água por osmose → NÃO bebe água, urina muito e diluído", "Peixe ósseo marinho: meio HIPERtônico → perde água por osmose → BEBE água salgada, urina pouco e concentrado", "Tubarões/Raias (cartilaginosos): acumulam ureia no sangue para equilibrar com o mar (uremia fisiológica)", "Células de cloreto nas brânquias: bombeiam íons para dentro (água doce) ou para fora (água salgada)"], "Memorize a regra dos peixes ósseos: O peixe do RIO está cercado de água doce, então a água entra nele o tempo todo por osmose (ele vive com medo de inchar): por isso NÃO bebe água e urina litros de xixi diluído. O peixe do MAR perde água pro sal o tempo todo: tem que BEBER água do mar o tempo todo e urinar o mínimo possível!", "<p>Para sobreviver em um aquário de água doce com água límpida e baixa salinidade, um peixe ósseo teleósteo dulcícola enfrenta o desafio de estar em um meio intensamente hipotônico em relação aos seus fluidos corporais internos.</p>", "A estratégia osmorreguladora adotada por esse peixe de água doce para manter sua homeostase hídrica e salina consiste em:", ["beber grandes volumes de água do aquário e excretar urina concentrada em sais minerais.", "respirar por pulmões rudimentares para evitar contato com a água do aquário.", "eliminar todo o seu sangue pelas brânquias para reduzir a osmolaridade celular.", "acumular grandes quantidades de sal marinho nas escamas para igualar a densidade da água.", "não beber água ativamente, absorver sais ativamente pelas brânquias e excretar urina volumosa e diluída."], 4, "Como os fluidos corporais do peixe dulcícola possuem maior concentração de solutos do que a água doce do rio/aquário (hiperosmótico), a água penetra espontaneamente por osmose através das superfícies semipermeáveis das brânquias e mucosa oral. Para evitar o inchaço celular osmótico, o peixe não bebe água voluntariamente e seus rins eliminam grandes volumes de urina muito aquosa e diluída, enquanto células especializadas nas brânquias bombeiam ativamente sais escassos da água para o sangue contra o gradiente químico. Alternativa correta: E. Distratores: A é a estratégia de peixes marinhos; C, D e E formulam proposições absurdas."], "Peroxissomos e degradação de radicais livres": ["Os peroxissomos são organelas citoplasmáticas esféricas delimitadas por membrana única, abundantes em células com alta taxa metabólica como hepatócitos e células dos túbulos renais. Sua principal função bioquímica consiste na oxidação de ácidos graxos de cadeia longa por beta-oxidação, auxiliando na produção de precursores lipídicos como os plasmalogênios e ácidos biliares. Durante essas reações oxidativas catalisadas por oxidases, elétrons são transferidos ao oxigênio molecular, gerando peróxido de hidrogênio (H2O2) — uma espécie reativa de oxigênio altamente oxidante e citotóxica. Para evitar o estresse oxidativo e lesão às membranas e ao DNA celular, os peroxissomos contêm altas concentrações da enzima catalase, que decompõe instantaneamente o peróxido de hidrogênio em água (H2O) e oxigênio molecular (O2).", ["Enzima Catalase: decompõe 2 H2O2 → 2 H2O + O2, neutralizando o peróxido tóxico", "Beta-oxidação de ácidos graxos de cadeia longa: quebra lipídios fornecendo acetil-CoA", "Detoxificação de substâncias: oxidação de etanol em acetaldeído no fígado humano", "Glioxissomos em plantas: peroxissomos especializados em sementes que convertem lipídios em açúcares", "Proteção contra estresse oxidativo: atua em conjunto com a superóxido dismutase na neutralização de radicais livres"], "No experimento clássico de laboratório que o ENEM adora citar: colocar água oxigenada (H2O2) sobre um pedaço de fígado cru ou batata produz efervescência imediata! As bolhas formadas são de OXIGÊNIO GASOSO (O2) liberado pela ação rápida da enzima CATALASE peroxissômica.", "<p>Em uma aula prática de biologia no laboratório escolar, um estudante adicionou algumas gotas de água oxigenada comercial (solução de peróxido de hidrogênio a 3%) sobre um fragmento de fígado bovino cru colocado em um tubo de ensaio. Imediatamente observou-se intensa efervescência com liberação vigorosa de gás, fenômeno que não ocorreu quando o fragmento de fígado havia sido previamente fervido a 100 ºC.</p>", "A efervescência observada na amostra crua e sua ausência na amostra fervida explicam-se, respectivamente, pela:", ["desnaturação da hemoglobina e pela condensação de gás carbônico no retículo endoplasmático.", "evaporação espontânea do peróxido de hidrogênio catalisada por ribossomos bacterianos vivos.", "produção de nitrogênio molecular pelas mitocôndrias e pelo congelamento dos peroxissomos.", "liberação de gás oxigênio pela enzima catalase e pela desnaturação térmica dessa proteína.", "síntese de ozônio atmosférico mediada pelos lisossomos rompidos durante o corte tecidual."], 3, "A enzima catalase, contida nos peroxissomos, catalisa a reação de decomposição do peróxido de hidrogênio em água e oxigênio gasoso (2 H2O2 → 2 H2O + O2), gerando as bolhas de efervescência. Sendo a catalase uma enzima (proteína globular), o aquecimento a 100 ºC desnatura sua estrutura terciária tridimensional, destruindo o sítio ativo e anulando completamente sua atividade catalítica no fígado cozido. Alternativa correta: D. Distratores: A, C, D e E citam gases e estruturas biológicas incorretas."], "Pleiotropia, penetrância gênica e anemia falciforme": ["A pleiotropia é o fenômeno genético no qual uma única mutação em um único par de genes desencadeia múltiplos efeitos fenotípicos fenotípicos simultâneos e aparentemente desconexos em tecidos e sistemas orgânicos distintos do corpo. O exemplo mais paradigmático na genética médica e no ENEM é a anemia falciforme: a substituição pontual de um único nucleotídeo (troca de adenina por timina no códon do gene da globina beta da hemoglobina) substitui o aminoácido ácido glutâmico por valina na posição 6 da cadeia polipeptídica. Essa hemoglobina anormal (HbS) polimeriza-se sob baixas tensões de O2, deformando as hemácias em foice. Esse defeito primário gera uma cascata pleiotrópica de consequências clínicas: vaso-oclusão de capilares com dores isquêmicas ósseas intensas, hemólise intravascular acelerada gerando anemia e hiperbilirrubinemia (icterícia), infartos esplênicos que levam à autoesplenectomia funcional (reduzindo a imunidade contra bactérias encapsuladas) e insuficiência renal crônica. Outro conceito relacionado é a penetrância, que mede a porcentagem de indivíduos com dado genótipo que de fato expressam o fenótipo esperado.", ["Pleiotropia: 1 único gene mutado → múltiplos fenótipos distintos em vários órgãos corporais", "Anemia falciforme (HbS): troca de 1 aminoácido (Glu → Val) deforma a hemácia sob hipóxia", "Cascata pleiotrópica na foice: anemia, icterícia, dores ósseas isquêmicas, infartos e falência renal", "Vantagem do heterozigoto (HbA/HbS): confere resistência natural contra malária letal na África", "Penetrância vs Expressividade: penetrância é tudo-ou-nada (% que manifesta); expressividade é o grau de severidade"], "Cuidado para não confundir no ENEM: POLIGENIA (herança quantitativa) são VÁRIOS genes determinando 1 característica (ex: cor da pele). PLEIOTROPIA é o oposto: 1 ÚNICO gene causando VÁRIOS efeitos corporais (ex: anemia falciforme)!", "<p>A análise clínica de pacientes portadores de anemia falciforme homozigota (HbS/HbS) revela que uma alteração em um único par de bases do gene da beta-globina resulta em um conjunto heterogêneo de manifestações: deformidade das hemácias em meia-lua, fortes dores articulares e abdominais por microtromboses, esplenomegalia, atraso no desenvolvimento físico e danos progressivos no parênquima renal.</p>", "Em genética, a ocorrência de múltiplas alterações fenotípicas sistêmicas originadas da mutação de um único locus gênico é classificada como:", ["herança poligênica quantitativa com dominância incompleta entre alelos múltiplos.", "inativação lyonizada do cromossomo somático autossômico em células endoteliais.", "epistasia dominante em que um alelo suprime a transcrição de cromossomos homólogos.", "ligação gênica com permutação obrigatória na meiose gamética materna.", "pleiotropia, na qual a expressão de um único gene afeta diversas vias fisiológicas do organismo."], 4, "A pleiotropia ocorre quando um único gene influencia duas ou mais características fenotípicas fenotípicas não relacionadas. Na anemia falciforme, a deformação falciforme da hemácia e sua fragilidade mecânica geram anemia, obstrução vascular em diversos órgãos, necrose isquêmica, suscetibilidade a infecções e alterações esqueléticas — todos desdobramentos clínicos de uma única mutação pontual na beta-globina. Alternativa correta: E. Distratores: A é o inverso da pleiotropia; C, D e E descrevem outros fenômenos genéticos."], "Polinização e dispersão de sementes nas teias ecológicas": ["A manutenção da biodiversidade em florestas tropicais depende criticamente de interações mutualísticas planta-animal para polinização e dispersão de sementes. A zoocoria é a dispersão mediada por animais, compreendendo a endozoocoria (animais frugívoros como aves, morcegos e macacos ingerem os frutos carnosos e defecam as sementes intactas longe da planta-mãe, quebrando sua dormência no trato digestório), a epizoocoria (sementes dotadas de ganchos ou cerdas pegajosas aderem aos pelos ou penas de animais) e a mirmecocoria (dispersão mediada por formigas atraídas por elaiossomos ricos em lipídios). A dispersão a longas distâncias reduz a competição intraespecífica perto da árvore parental e diminui a predação de sementes por fungos e insetos da serrapilheira.", ["Endozoocoria: ingestão de frutos carnosos por vertebrados; quebra de dormência fecal", "Epizoocoria: sementes carrapicho com ganchos aderentes à pelagem/penas", "Anemocoria (vento) e Hidrocoria (água): dispersão abiótica", "Serviço ecossistêmico: dispersores regeneram florestas desmatadas e mantêm fluxo gênico"], "Se uma área desmatada perde suas aves e mamíferos de grande porte por caça (defaunação), árvores de sementes grandes (como castanheiras e jatobás) deixam de se dispersar e correm risco de extinção local, alterando a composição florestal para espécies pioneiras de sementes pequenas dispersas pelo vento.", "<p>A perda de mamíferos frugívoros de grande porte (como antas, macacos-muriquis e tucanos) em remanescentes de Mata Atlântica vem provocando o fenômeno da defaunação. Árvores nativas produtoras de grandes frutos e sementes volumosas perdem seus dispersores primários e passam a acumular todas as sementes caídas diretamente sob a copa da planta-mãe.</p>", "A principal consequência ecológica de longo prazo para as populações dessas árvores nativas em florestas defaunadas é a:", ["redução do recrutamento de novas plântulas decorrente da intensa predação e competição sob a planta parental.", "transformação espontânea de suas raízes em estruturas de reprodução assexuada tuberosa.", "mutação acelerada das sementes para germinarem no interior dos frutos sem contato com a terra.", "conversão da folhagem das árvores adultas em alimento exclusivo para formigas cortadeiras.", "duplicação do fluxo gênico entre fragmentos distantes promovida por correntes de ar térmicas."], 0, "Sem os grandes frugívoros endozoocóricos para transportar as sementes para longe, todas as sementes caem no solo imediatamente abaixo da árvore-mãe. Nessa área sombreada, a altíssima densidade de sementes atrai besouros e roedores granívoros e favorece patógenos fúngicos da serrapilheira (Hipótese de Janzen-Connell), além de gerar competição intraespecífica severa entre as poucas plântulas que germinam, reduzindo o recrutamento e a variabilidade genética da população. Alternativa correta: A. Distratores: A e C inventam processos reprodutivos anômalos; D e E contrariam a realidade ecológica de fragmentação."], "Poluição atmosférica, chuva ácida e inversão térmica": ["A queima de combustíveis fósseis em indústrias e motores veiculares lança na atmosfera poluentes como óxidos de enxofre (SO₂ e SO₃) e óxidos de nitrogênio (NOx). Em contato com o vapor d'água atmosférico, esses gases formam ácidos fortes (ácido sulfúrico H₂SO₄ e ácido nítrico HNO₃), precipitando como chuva ácida (pH < 5,0), que corrói monumentos, lixivia nutrientes do solo e acidifica lagos, matando a vida aquática. A inversão térmica é um fenômeno meteorológico natural frequente no inverno, em que uma camada de ar quente sobrepõe-se a uma camada de ar frio superficial, bloqueando as correntes de convecção ascendentes e aprisionando poluentes tóxicos junto ao solo habitado.", ["Chuva ácida: SO₂ e NOx da queima fóssil reagem com água formando H₂SO₄ e HNO₃", "Consequências da chuva ácida: lixiviação de minerais do solo e acidificação aquática", "Inversão térmica: camada de ar quente impede convecção do ar frio superficial", "Smog fotoquímico: reação de hidrocarbonetos e NOx sob luz solar gerando ozônio troposférico (tóxico)"], "Não confunda: a inversão térmica é um fenômeno METEOROLÓGICO NATURAL que se torna um problema de saúde pública apenas quando ocorre em cidades com alta emissão de poluentes atmosféricos, pois impede a dispersão da fumaça.", "<p>Nos meses de inverno em grandes metrópoles brasileiras cercadas por serras, o ar frio superficial não consegue subir por estar mais denso que a camada de ar quente imediatamente superior. Essa estagnação atmosférica forma uma espessa faixa acinzentada de fumaça visível no horizonte, provocando aumento imediato nas internações por bronquite e asma.</p>", "O fenômeno meteorológico retratado e o motivo pelo qual ele agrava problemas respiratórios na população urbana são:", ["Efeito estufa anômalo; liberação de vapor d'água superaquecido pelo asfalto.", "Depleção do ozônio estratosférico; incidência direta de radiação gama sobre os pulmões.", "Chuva ácida torrencial; dissolução de monóxido de carbono nas vias aéreas superiores.", "Inversão térmica; bloqueio da circulação de convecção com retenção de poluentes perto do solo.", "Ciclone extratropical; dispersão acelerada de aerossóis para a troposfera superior."], 3, "A inversão térmica ocorre quando o solo esfria rapidamente na madrugada de inverno e resfria a camada de ar adjacente, que fica aprisionada sob uma camada de ar mais quente. Como o ar frio não sobe, cessa a convecção térmica vertical, aprisionando fuligem, material particulado e gases tóxicos na altura da respiração humana. Alternativa correta: D. Distratores: A confunde com efeito estufa; C confunde com chuva ácida; D e E citam fenômenos climáticos e atmosféricos não relacionados ao bloqueio de convecção local."], "Poluição por plásticos, microplásticos e lixo marinho": ["A poluição por resíduos plásticos nos oceanos tornou-se uma das crises ambientais mais severas da biosfera, com milhões de toneladas de polímeros sintéticos descartados anualmente nos corpos hídricos. Sob a ação mecânica das ondas, radiação ultravioleta solar e degradação biológica, macroplásticos fragmentam-se em microplásticos (partículas inferiores a 5 milímetros) e nanoplásticos microscópicos. Devido ao seu caráter hidrofóbico e alta área superficial, essas partículas adsorvem poluentes orgânicos persistentes tóxicos presentes na água, como agrotóxicos clorados e PCBs. Ao serem ingeridos por animais filtradores, peixes e aves marinhas, os microplásticos causam obstrução gastrointestinal, desnutrição e transferem contaminantes tóxicos ao longo da teia alimentar, atingindo inclusive os seres humanos.", ["Microplásticos (< 5 mm): gerados por fragmentação solar/física ou adicionados em cosméticos e fibras sintéticas", "Adsorção de poluentes: microplásticos atraem e concentram poluentes orgânicos persistentes (POPs)", "Ingestão equivocada: animais marinhos confundem partículas flutuantes com plâncton e presas", "Bioacumulação na cadeia: compostos tóxicos e disruptores endócrinos sobem os níveis tróficos", "Estratégias de mitigação: bioeconomia circular, proibição de descartáveis e substituição por bioplásticos biodegradáveis"], "O perigo do microplástico no ENEM é duplo: dano FÍSICO direto (falsa saciedade e perfuração no trato digestório) e dano QUÍMICO (atua como 'esponja' adsorvendo pesticidas e metais pesados transferidos pela teia alimentar).", "<p>Em pesquisas oceanográficas no Atlântico Sul, biólogos constataram que aves marinhas costeiras e peixes pelágicos estavam ingerindo fragmentos microscópicos de polímeros sintéticos. Análises laboratoriais revelaram que esses fragmentos continham elevadas concentrações de dioxinas e bifenilas policloradas (PCBs) adsorvidas em sua superfície hidrofóbica.</p>", "A absorção desses poluentes e sua ingestão pela fauna marinha representam grave ameaça ecológica porque:", ["promovem a fotólise imediata da água doce nos estuários costeiros.", "induzem a bioacumulação de toxinas e distúrbios hormonais nos consumidores das teias tróficas.", "bloqueiam a respiração branquial por excesso de nitratos dissolvidos nas brânquias.", "estimulam a reprodução assexuada desenfreada de mamíferos marinhos topo de cadeia.", "convertem os peixes herbívoros em organismos autótrofos produtores de biomassa celulósica."], 1, "Microplásticos com substâncias tóxicas adsorvidas são ingeridos por zooplâncton e peixes pequenos, que não conseguem metabolizar nem eliminar os poluentes persistentes. Conforme esses organismos são predados por níveis tróficos superiores, as toxinas acumulam-se progressivamente nos tecidos adiposos dos animais (bioacumulação e magnificação trófica), acarretando distúrbios imunológicos e endócrinos severos. Alternativa correta: B. Distratores: A, B, D e E descrevem disparates conceituais biológicos."], "Protozooses (malária, doença de Chagas e leishmaniose)": ["Os protozoários são eucariontes unicelulares heterótrofos pertencentes ao reino Protista/Protozoa. Diversas espécies são agentes etiológicos de graves endemias tropicais. A malária é causada por protozoários do gênero <i>Plasmodium</i>, transmitidos pela picada da fêmea do mosquito <i>Anopheles</i>; o parasita rompe hemácias sincronicamente, liberando hemozoína e causando acessos febris intermitentes. A doença de Chagas é causada pelo flagelado <i>Trypanosoma cruzi</i>, transmitido pelas fezes do percevejo triatomíneo ('barbeiro') depositadas durante o repasto sanguíneo (ou ingestão de açaí contaminado), provocando cardiomegalia e megacólon. As leishmanioses são causadas por <i>Leishmania</i> e transmitidas pelo mosquito-palha (gênero <i>Lutzomyia</i>). A amebíase e a giardíase são transmitidas pela ingestão de água e alimentos com cistos fecais.", ["Malária (<i>Plasmodium</i>): vetor mosquito-prego (<i>Anopheles</i>) → febre cíclica e hemólise", "Doença de Chagas (<i>T. cruzi</i>): transmissão pelas FEZES do barbeiro (não pela picada!)", "Leishmaniose (<i>Leishmania</i>): vetor mosquito-palha (<i>Lutzomyia</i>)", "Toxoplasmose (<i>Toxoplasma gondii</i>): fezes de felinos contaminadas", "Giardíase e Amebíase: fecal-oral (cistos na água/alimentos sem saneamento)"], "Pegadinha clássica do barbeiro (Doença de Chagas): o parasita NÃO é transmitido pela saliva na picada! O barbeiro pica, defeca ao lado da picada e, quando a pessoa coça o local, empurra as FEZES com o protozoário para dentro do ferimento ou mucosas.", "<p>Em uma comunidade ribeirinha na região Norte do Brasil, agentes de saúde pública investigaram um surto de síndrome febril com calafrios que se repetiam rigorosamente a cada 48 horas (febre terçã benigna), acompanhados de palidez e anemia hemolítica progressiva em dezenas de moradores ribeirinhos.</p>", "O quadro clínico cíclico relatado é característico de qual protozoose e decorre diretamente de qual evento biológico?", ["Doença de Chagas; necrose dos discos intercalares dos cardiomiócitos atriais.", "Amebíase; perfuração mecânica das válvulas cardíacas por trofozoítos ciliados.", "Leishmaniose visceral; ulceração da mucosa cartilaginosa do septo nasal.", "Toxoplasmose; colonização de neurônios medulares por cistos hepáticos de platelmintos.", "Malária; lise sincronizada de hemácias com liberação de merozoítos e toxinas no plasma sanguíneo."], 4, "A febre em acessos periódicos a cada 48 horas (terçã, causada por <i>Plasmodium vivax</i>) é sintoma patognomônico da malária. Após multiplicação nos hepatócitos (esquizogonia hepática), os merozoítos invadem as hemácias (esquizogonia eritrocitária). O rompimento sincrônico de milhares de hemácias a cada ciclo de 48 horas libera toxinas pirogênicas e restos celulares na circulação, disparando calafrios seguidos de febre intensa e anemia. Alternativa correta: E. Distratores: A, C, D e E citam protozooses com fisiopatologias distintas ou atribuem sintomas cardíacos/nasais desconexos dos acessos febris periódicos."], "Radiação adaptativa versus convergência evolutiva": ["A radiação adaptativa (ou divergência evolutiva) e a convergência evolutiva são dois dos padrões macroevolutivos mais notáveis moldados pela seleção natural nos ecossistemas do planeta. Na radiação adaptativa, uma única espécie ancestral coloniza diversos ambientes ecológicos novos desocupados (com nichos ecológicos vagos) e, sob diferentes pressões seletivas ambientais em cada habitat, diversifica-se em múltiplas espécies morfofisiologicamente distintas através de especiação, compartilhando estruturas homólogas (como os tentilhões de Galápagos de Darwin ou os mamíferos placentários). Em contrapartida, na convergência evolutiva (ou evolução convergente), espécies filogeneticamente distantes que habitam nichos ecológicos ecológicos semelhantes desenvolvem, de forma independente, adaptações morfológicas análogas para resolver o mesmo desafio ambiental, como a forma hidrodinâmica fusiforme compartilhada por tubarões (peixes cartilaginosos), ictiossauros (répteis extintos) e golfinhos (mamíferos aquáticos).", ["Radiação adaptativa: 1 ancestral comum → múltiplas linhagens divergentes adaptadas a diferentes nichos", "Homologia: mesma origem embrionária e plano estrutural básico herdado de ancestral comum (órgãos homólogos)", "Convergência evolutiva: linhagens sem parentesco próximo desenvolvem formas similares por pressões idênticas", "Analogia: órgãos análogos têm origens embrionárias distintas, mas desempenham a mesma função ecológica", "Exemplo clássico de convergência: asas de morcegos (mamíferos), aves (dinossauros terópodes) e insetos (artrópodes)"], "Mnemônico clássico do ENEM: DIVERGÊNCIA = órgãos HOMÓLOGOS (mesma origem embrionária, funções diferentes). CONVERGÊNCIA = órgãos ANÁLOGOS (origens diferentes, mesma função devido ao mesmo ambiente).", "<p>Ao comparar a anatomia de um golfinho (mamífero com pulmões e pelos residuais) e a de um tubarão (peixe cartilaginoso com brânquias e fendas branquiais), biólogos constatam que ambos apresentam corpo fusiforme hidrodinâmico, nadadeiras peitorais estabilizadoras e coloração dorsal escura com ventre claro, apesar de pertencerem a classes de vertebrados que divergiram há centenas de milhões de anos.</p>", "A semelhança morfológica externa compartilhada entre o tubarão e o golfinho é resultado de um processo de:", ["radiação adaptativa a partir de um ancestral mamífero com respiração branquial obligada.", "deriva genética estocástica que alterou as frequências de alelos recessivos em lagoas doces.", "hibridização interespecífica fértil entre classes distintas de gnatostomados pelágicos.", "convergência evolutiva moldada por pressões seletivas similares no meio aquático com órgãos análogos.", "coevolução mutualística obrigatória na qual uma espécie fornece ectoparasitas à outra."], 3, "Tubarões e golfinhos pertencem a linhagens filogenéticas distantes que evoluíram independentemente no mesmo ambiente aquático marinho. As restrições físicas da água impuseram pressões seletivas semelhantes, selecionando alelos que favorecem a forma hidrodinâmica e apêndices estabilizadores locomotores. Trata-se de convergência evolutiva, gerando estruturas análogas adaptadas à natação eficiente. Alternativa correta: D. Distratores: A sugere mamífero ancestral com brânquias; C, D e E apresentam equívocos ecológicos e reprodutivos graves."], "Relações ecológicas interespecíficas": ["As relações ecológicas entre espécies distintas (interespecíficas) podem ser harmônicas (+/+, +/0), quando não há prejuízo para nenhum participante, ou desarmônicas (+/−, −/−), quando ao menos uma espécie é prejudicada. São relações harmônicas o mutualismo (obrigatório para sobrevivência, como líquens e micorrizas), a protocooperação (benéfica mas facultativa, como pássaro-palito e crocodilo) e o comensalismo (uma espécie obtém alimento sem afetar a outra, como peixe-rêmora e tubarão). Entre as desarmônicas destacam-se a predação, o parasitismo (o parasita retira nutrientes do hospedeiro vivo), a competição interespecífica (disputa por nicho ecológico sobreposto) e o amensalismo.", ["Mutualismo (+/+): obrigatório para sobrevivência de ambas", "Protocooperação (+/+): benéfico mas não obrigatório", "Comensalismo (+/0): comensal se beneficia sem prejudicar o hospedeiro", "Inquilinismo (+/0): moradia/suporte físico (epífitas como orquídeas em árvores)", "Competição (−/−): espécies disputam os mesmos recursos limitados"], "Atenção para as orquídeas e bromélias sobre árvores: trata-se de EPIFITISMO (inquilinismo, +/0), não parasitismo! Elas não sugam a seiva da árvore, usam o tronco apenas como suporte para receber mais luz solar.", "<p>Em uma floresta tropical úmida, bromélias e orquídeas fixam suas raízes na casca de galhos altos das copas de grandes árvores, alcançando maior luminosidade sem perfurar os tecidos condutores nem retirar nutrientes do vegetal hospedeiro. No mesmo ambiente, carrapatos aderem à pele de capivaras, alimentando-se de seu sangue e transmitindo patógenos.</p>", "As relações ecológicas estabelecidas entre as plantas epífitas e as árvores, e entre os carrapatos e as capivaras são classificadas, respectivamente, como:", ["Inquilinismo e parasitismo.", "Parasitismo e predação.", "Mutualismo obrigatório e comensalismo.", "Competição interespecífica e inquilinismo.", "Protocooperação e amensalismo."], 0, "O epifitismo das orquídeas e bromélias é uma modalidade de inquilinismo (+/0): a planta epífita obtém suporte físico sem prejudicar ou nutrir-se dos tecidos da árvore. Já o carrapato retira alimento (sangue) do hospedeiro vivo sem matá-lo imediatamente, caracterizando parasitismo (+/−). Alternativa correta: A. Distratores: A confunde epifitismo com parasitismo; C assume benefício mútuo inexistente na epífita; D e E usam categorias incompatíveis com a descrição biológica."], "Respiração celular aeróbia e fermentação": ["A respiração celular aeróbia degrada completamente a glicose em CO₂ e H₂O com alto rendimento de ATP, compreendendo três etapas: Glicólise (no citosol, anaeróbia, gerando 2 piruvatos, 2 ATP e 2 NADH), Ciclo de Krebs / Ciclo do Ácido Cítrico (na matriz mitocondrial, descarboxilando o piruvato em acetil-CoA e liberando CO₂, NADH, FADH₂ e ATP) e Fosforilação Oxidativa (nas cristas mitocondriais, onde elétrons passam pela cadeia respiratória impulsionando a ATP sintase por quimiosmose; o O₂ é o aceptor final de elétrons, formando água). Na ausência de O₂, a célula realiza fermentação (láctica ou alcoólica) no citosol apenas para reoxidar o NADH em NAD⁺, com rendimento líquido de apenas 2 ATP por glicose.", ["Glicólise (citosol): glicose → 2 piruvatos + 2 NADH + 2 ATP (líquidos)", "Ciclo de Krebs (matriz mitocondrial): libera CO₂ e gera transportadores de elétrons", "Cadeia respiratória (cristas): o oxigênio (O₂) é o ACEPTOR FINAL de elétrons, gerando H₂O", "ATP sintase: impulsionada pelo gradiente de prótons H⁺ (quimiosmose)", "Fermentação (láctica/alcoólica): regenera NAD⁺ no citosol em anaerobiose (2 ATP)"], "O aceptor final de hidrogênios e elétrons na respiração aeróbia é o GÁS OXIGÊNIO (O₂). Ao receber os elétrons no fim da cadeia respiratória junto aos prótons H⁺, ele forma H₂O (água). Venenos como o cianeto bloqueiam o citocromo c oxidase da cadeia, paralisando a produção de ATP.", "<p>O cianeto de potássio é uma toxina celular fulminante que se liga com altíssima afinidade ao ferro do citocromo oxidase na membrana interna das mitocôndrias, inibindo irreversivelmente a transferência de elétrons ao oxigênio livre.</p>", "A consequência bioquímica direta da intoxicação por cianeto que conduz à morte celular rápida é a:", ["paralisação da síntese mitocondrial de ATP por colapso do gradiente protônico na cadeia respiratória.", "conversão explosiva de toda a glicose citosólica em ácidos graxos saturados.", "ruptura imediata das paredes celulares de celulose dos tecidos musculares.", "liberação descontrolada de gás hélio pelas cristas mitocondriais.", "transformação do oxigênio molecular em dióxido de carbono no interior dos peroxissomos."], 0, "O bloqueio do citocromo oxidase impede a transferência final de elétrons para o oxigênio na fosforilação oxidativa. Com a cadeia respiratória estagnada, os complexos deixam de bombear prótons (H⁺) para o espaço intermembranas, colapsando o gradiente eletroquímico indispensável para girar a ATP sintase. As células sofrem depleção imediata de ATP e entram em colapso metabólico. Alternativa correta: A. Distratores: B, D e E trazem hipóteses químicas absurdas; C erra pois células animais humanas não possuem parede de celulose."], "Resíduos sólidos urbanos, compostagem e aterros sanitários": ["A gestão integrada dos resíduos sólidos urbanos (RSU) no Brasil é regida pela Política Nacional de Resíduos Sólidos (Lei nº 12.305/2010), que estabelece a hierarquia de não geração, redução, reutilização, reciclagem, tratamento e disposição final ambientalmente adequada dos rejeitos. Nos grandes centros urbanos, a matéria orgânica (restos de alimentos, podas e resíduos de feiras) compõe mais de 50% da massa de lixo descartada. Quando encaminhada incorretamente a lixões a céu aberto, essa fração sofre decomposição anaeróbia descontrolada gerando gás metano (CH4, potente gás de efeito estufa), proliferação de vetores de doenças e chorume altamente poluidor que contamina lençóis freáticos. A compostagem aeróbia é a biotecnologia de valorização orgânica que converte restos alimentares em composto fertilizante rico em húmus através da respiração aeróbia de bactérias termofílicas e fungos, poupando a vida útil dos aterros sanitários (que possuem impermeabilização de solo com geomembrana, drenagem de chorume e queima/aproveitamento do biogás).", ["Compostagem: decomposição aeróbia controlada (O2 presente) transformando restos orgânicos em adubo húmico", "Aterro sanitário vs Lixão: o aterro possui geomembrana impermeável, dreno de chorume e queima/biometano", "Chorume: efluente líquido escuro de alta DBO com ácidos orgânicos e metais que contamina aquíferos se vazar", "Biogás de aterro: mistura de CH4 (metano) e CO2 produzida por bactérias metanogênicas anaeróbias", "Hierarquia dos resíduos: reciclagem mecânica de secos (plásticos, metais, papel) e compostagem de orgânicos"], "No ENEM, o lixão a céu aberto é crime ambiental! O aterro sanitário protege o solo e a água subterrânea porque tem MANTA IMPERMEABILIZANTE (PEAD) e captação de chorume e biogás (CH4 para energia limpa).", "<p>Em um município de médio porte, a prefeitura substituiu um antigo lixão desativado por um moderno aterro sanitário e implantou um programa de coleta seletiva com pátio de compostagem aeróbia para os resíduos orgânicos das feiras livres e restaurantes locais.</p>", "A principal vantagem ambiental e biogeoquímica da compostagem aeróbia em relação à deposição dos resíduos orgânicos em aterros convencionais é:", ["eliminar por completo a necessidade de oxigênio molecular na reciclagem de polímeros sintéticos.", "induzir a síntese de clorofila nas bactérias anaeróbias presentes no chorume concentrado.", "gerar radiação ultravioleta esterilizante capaz de inativar metais pesados no solo superficial.", "converter as cinzas alcalinas de incineração em sulfato de cobre hidrossolúvel para lavouras.", "reciclar nutrientes orgânicos em adubo estável e reduzir a emissão descontrolada de gás metano nos aterros."], 4, "A compostagem é um processo biológico oxidativo aeróbio no qual bactérias e fungos consomem carbono orgânico e liberam primariamente CO2 e água, produzindo adubo rico em nutrientes que retorna à agricultura. Ao desviar resíduos orgânicos dos aterros sanitários, evita-se a decomposição anaeróbia que produz grandes volumes de gás metano (CH4, com potencial de aquecimento global cerca de 28 vezes maior que o CO2) e chorume nos aterros. Alternativa correta: E. Distratores: A, C, D e E contêm erros grotescos de biologia e química."], "Ritmo circadiano, melatonina e glândula pineal": ["O ritmo circadiano é a oscilação biológica endógena com periodicidade de aproximadamente 24 horas que coordena os ciclos de sono-vigília, temperatura corporal, secreção hormonal, pressão arterial e apetite nos animais. No cérebro humano, o relógio mestre circadiano é o núcleo supraquiasmático (NSQ) do hipotálamo, que recebe informações luminosas diretas dos olhos através do trato retinohipotalâmico por meio de células ganglionares fotossensíveis que contêm melanopsina. Durante o dia, a luz inibe os disparos neurais do circuito que estimula a glândula pineal (epífise). Ao anoitecer, a ausência de luz cessa a inibição, permitindo que a glândula pineal converta o neurotransmissor serotonina em melatonina, hormônio indutor do sono que atinge pico de secreção na escuridão noturna. A exposição excessiva à luz azul emitida por telas de smartphones e computadores antes de dormir inibe a secreção de melatonina, deflagrando insônia, distúrbios cognitivos e desregulação metabólica crônica.", ["Núcleo Supraquiasmático (NSQ): marcapasso circadiano mestre situado no hipotálamo", "Glândula pineal (epífise): produz o hormônio melatonina no escuro a partir do aminoácido triptofano", "Melatonina: promove a sonolência, reduz a temperatura corporal e sincroniza os ritmos biológicos", "Luz azul de telas (smartphones e LEDs): comprimento de onda que estimula a melanopsina e suprime a melatonina", "Consequências do descompasso: jet lag, insônia, aumento do cortisol noturno e resistência periférica à insulina"], "No ENEM, o hormônio do sono é a MELATONINA, produzida pela PINEAL no ESCURO. Usar celular na cama com tela brilhante engana o hipotálamo simulando 'meio-dia', inibindo a melatonina e destruindo o ciclo do sono.", "<p>Estudantes universitários que habitualmente utilizam telas de computadores portáteis e smartphones sem filtros de luz em ambientes escuros até altas horas da madrugada relatam frequentemente dificuldade prolongada para adormecer (latência do sono aumentada), sonolência diurna e declínio na retenção mnemônica de conteúdos de estudo.</p>", "Essa disfunção no ciclo biológico sono-vigília provocada pelo uso noturno de telas eletrônicas decorre da:", ["degradação da adrenalina na medula suprarrenal estimulada por fótons de luz infravermelha.", "estimulação parassimpática da tireoide acelerando o consumo de glicogênio nos neurônios motores.", "superprodução de insulina pancreática deflagrada pelo reflexo pupilar autônomo simpático.", "liberação de ocitocina pela neuro-hipófise bloqueando a transmissão nas sinapses noradrenérgicas.", "inibição da secreção noturna de melatonina pela glândula pineal decorrente do estímulo luminoso nas retinas."], 4, "A luz visível emitida por dispositivos digitais contém comprimento de onda na faixa azul (460-480 nm), que estimula fortemente as células ganglionares retinianas fotossensíveis. Esses impulsos chegam ao núcleo supraquiasmático do hipotálamo, que envia sinais inibitórios à glândula pineal, suprimindo a síntese e a secreção de melatonina no sangue e impedindo que o cérebro entre nos estágios naturais de sono profundo. Alternativa correta: E. Distratores: A, C, D e E citam glândulas e hormônios não relacionados à fotossincronização do sono."], "Saneamento básico e saúde coletiva": ["O saneamento básico engloba o conjunto de serviços de abastecimento de água potável, esgotamento sanitário, limpeza urbana, manejo de resíduos sólidos e drenagem de águas pluviais urbanas. A ausência ou precariedade dessas estruturas está diretamente correlacionada à incidência de doenças de veiculação hídrica e fecal-oral (como cólera, hepatite A, febre tifoide, giardíase, amebíase e ascaridíase). O acúmulo de lixo a céu aberto atrai vetores sinantrópicos (ratos transmissores da bactéria da leptospirose pela urina, baratas e moscas transportadoras de patógenos). Medidas de saúde coletiva incluem vigilância epidemiológica, imunização universal pelo SUS, educação em saúde e controle integrado de vetores biológicos.", ["Saneamento básico: água tratada, esgoto coletado/tratado, lixo e drenagem pluvial", "Doenças de transmissão hídrica/fecal: cólera, hepatite A, verminoses, amebíase", "Leptospirose: bactéria eliminada na urina de ratos que penetra em enchentes/alagamentos", "Vigilância sanitária e vacinação pública: prevenção de surtos e epidemias populacionais", "Aterros sanitários impermeabilizados: evitam contaminação do lençol freático por chorume"], "Em épocas de fortes chuvas e inundações urbanas no Brasil, o ENEM sempre cobra LEPTOSPIROSE: infecção causada por bactéria espiroqueta (<i>Leptospira</i>) eliminada na urina de roedores misturada à água das enchentes, penetrando ativamente pela pele humana.", "<p>Após um período de temporais severos que inundaram áreas periféricas de uma metrópole brasileira sem rede de drenagem pluvial eficiente, postos de saúde atenderam dezenas de pessoas que caminharam com água até a cintura. Os pacientes apresentavam febre alta súbita, mialgias intensas (especialmente na panturrilha), icterícia e hemorragias conjuntivais.</p>", "O agente etiológico e o mecanismo epidemiológico de transmissão dessa infecção típica de enchentes são:", ["um protozoário ciliado transmitido pela picada de mosquitos anofelinos atraídos pela lama.", "um vírus envelopado ingerido por meio do consumo de peixes marinhos migratórios.", "uma bactéria espiroqueta presente na urina de ratos que penetra ativamente na pele humana em águas contaminadas.", "um fungo ascomiceto filamentoso que se replica nas brânquias de caramujos de água doce.", "um platelminto trematódeo transmitido por secreções respiratórias de animais domésticos vacinados."], 2, "O quadro descrito é típico de leptospirose, causada pela bactéria espiroqueta <i>Leptospira interrogans</i>. Ratos de esgoto (como <i>Rattus norvegicus</i>) são os principais reservatórios urbanos, eliminando a bactéria viva em sua urina. Durante as inundações, a urina mistura-se às águas de enchente e o microrganismo penetra na pele humana (mesmo sem feridas aparentes caso haja contato prolongado) ou mucosas. A dor intensa nas panturrilhas e icterícia compõem a clássica síndrome de Weil. Alternativa correta: C. Distratores: A cita protozoário e picada de mosquito; C confunde com viroses marinhas; D e E atribuem a etiologia a fungos ou platelmintos de transmissão aérea."], "Sistema ABO, fator Rh e transfusões": ["O sistema ABO é um caso clássico de alelos múltiplos e codominância condicionado pelos alelos Iᴬ, Iᴮ e i. Os alelos Iᴬ e Iᴮ são codominantes entre si e ambos dominam sobre o alelo recessivo i. Os indivíduos do grupo A possuem aglutinogênio (antígeno) A nas hemácias e aglutinina (anticorpo) anti-B no plasma; grupo B tem antígeno B e anti-A; grupo AB possui ambos os antígenos e nenhuma aglutinina (receptor universal no sistema ABO); grupo O não possui antígenos A nem B e apresenta anti-A e anti-B no plasma (doador universal no ABO). No sistema Rh, a presença do antígeno D confere Rh positivo (R_), e a ausência confere Rh negativo (rr). Na eritroblastose fetal (DHRN), mãe Rh⁻ sensibilizada produz anticorpos anti-Rh (IgG) que atravessam a placenta e destroem hemácias de um segundo feto Rh⁺.", ["Alelos ABO: Iᴬ = Iᴮ > i (codominância entre Iᴬ e Iᴮ)", "Doador universal geral de hemácias: O negativo (O Rh⁻)", "Receptor universal geral de hemácias: AB positivo (AB Rh⁺)", "Eritroblastose fetal: Mãe Rh⁻ com feto Rh⁺ (sensibilização prévia)"], "Atenção total na transfusão: quem RECEBE não pode ter anticorpos contra as hemácias do DOADOR! Sangue O tem anticorpos anti-A e anti-B no plasma, mas suas hemácias lavadas não possuem antígenos, podendo ser doadas para todos.", "<p>Em um hospital de trauma, uma vítima grave necessitou de transfusão imediata de concentrado de hemácias antes da conclusão da tipagem laboratorial. O banco de sangue liberou bolsas de sangue O negativo para o procedimento emergencial de suporte.</p>", "As hemácias do tipo O negativo são universalmente compatíveis para transfusão de emergência porque:", ["possuem todos os tipos de aglutininas plasmáticas que neutralizam antígenos bacterianos.", "apresentam aglutinogênios A, B e Rh integrados à hemoglobina citoplasmática.", "estimulam a medula óssea a cessar a produção de anticorpos leucocitários.", "são células anucleadas com capacidade de secretar interferon gama defensivo.", "carecem de antígenos de superfície A, B e fator Rh (D) na membrana de seus eritrócitos."], 4, "As hemácias do sangue O negativo não expressam em sua membrana nem os carboidratos antigênicos A ou B, nem a proteína antigênica Rh (antígeno D). Portanto, ao serem infundidas em qualquer receptor (A, B, AB ou O; Rh⁺ ou Rh⁻), não são reconhecidas como corpúsculos estranhos pelas aglutininas (anticorpos circulantes) do paciente, minimizando o risco de reação hemolítica imune aguda. Alternativa correta: E. Distratores: A refere-se a componentes do plasma (que são retirados no concentrado de hemácias) e confunde com defesa antibacteriana; B afirma o oposto; D e E inventam propriedades fisiológicas incompatíveis com eritrócitos."], "Sistema auditivo, cóclea e equilíbrio no labirinto vestibular": ["O aparelho vestíbulo-coclear do ouvido humano é o órgão sensorial mecanorreceptor responsável pela transdução de estímulos de audição sonora e pelo equilíbrio postural estático e dinâmico. Anatomicamente, divide-se em orelha externa (pavilhão e meato acústico), orelha média (membrana timpânica e cadeia de ossículos martelo, bigorna e estribo, que amplificam ondas sonoras e equalizam pressão pela tuba auditiva) e orelha interna (labirinto membranoso). Na orelha interna, a cóclea abriga o órgão espiral de Corti, no qual células ciliadas mecanorreceptoras flexionam seus estereocílios contra a membrana tectória sob a vibração da endolinfa líquida, abrindo canais iônicos de potássio que despolarizam a membrana e geram potenciais de ação no nervo auditivo até o córtex cerebral temporal. O equilíbrio dinâmico e a percepção de aceleração angular são detectados pelos canais semicirculares do labirinto vestibular (preenchidos por endolinfa com cristas ampolares), enquanto o equilíbrio estático e a gravidade linear são monitorados pelo sáculo e utrículo, que contêm otólitos calcários de carbonato de cálcio sobre células ciliadas.", ["Tímpano e ossículos (martelo, bigorna, estribo): amplificação mecânica de ondas sonoras no ar", "Cóclea e Órgão de Corti: células ciliadas mecanorreceptoras convertem ondas de pressão em impulsos elétricos", "Canais semicirculares: três arcos perpendiculares que detectam movimentos de rotação cefálica (equilíbrio dinâmico)", "Utrículo e Sáculo com otólitos: cristais calcários que detectam gravidade linear e inclinação da cabeça (equilíbrio estático)", "Tuba auditiva (de Eustáquio): comunica a orelha média à faringe, equilibrando as pressões atmosféricas interna e externa"], "No ENEM: a cóclea cuida da AUDIÇÃO (som). Os canais semicirculares e o labirinto cuidam do EQUILÍBRIO (labirintite e tontura ao girar decorrem do movimento da endolinfa nos canais semicirculares!).", "<p>Durante um teste em simulador de voo para pilotos da Força Aérea, um instrutor aplicou giros rápidos em múltiplos eixos e paradas bruscas. Ao sair da cápsula rotatória, o cadete relatou sensação ilusória de que a sala continuava girando continuamente (vertigem aguda) e perda temporária da estabilidade postural ereta.</p>", "A sensação fisiológica de vertigem sentida pelo piloto após cessar a rotação decorre da:", ["proliferação acelerada de bactérias simbióticas no tímpano timpânico médio.", "calcificação súbita dos cristais de hidroxiapatita nos neurônios do córtex motor frontal.", "inércia do líquido endolinfático nos canais semicirculares do labirinto vestibular estimulando células ciliadas.", "destruição das sinapses químicas nos axônios colinérgicos dos nervos ópticos da retina.", "queda abrupta na síntese de hemoglobina provocada pela alta pressão parcial de oxigênio."], 2, "Ao girar a cabeça, a endolinfa contida nos três canais semicirculares do labirinto da orelha interna movimenta-se por inércia, defletindo as cúpulas gelatinosas e os estereocílios das células ciliadas mecanorreceptoras. Quando o movimento cessa abruptamente, a endolinfa continua em movimento inercial por alguns segundos, enviando disparos errôneos ao encéfalo de que o corpo ainda está girando, gerando a vertigem e perda de equilíbrio. Alternativa correta: C. Distratores: A, B, D e E formulam proposições descabidas e anatomicamente incorretas."], "Sistema circulatório e ciclo cardíaco": ["O sistema cardiovascular humano é fechado, duplo e completo. O coração atua como bomba muscular de quatro câmaras: dois átrios e dois ventrículos. Na pequena circulação (circulação pulmonar), o ventrículo direito bombeia sangue venoso pelas artérias pulmonares até os pulmões para ser oxigenado, retornando ao átrio esquerdo pelas veias pulmonares como sangue arterial. Na grande circulação (circulação sistêmica), o ventrículo esquerdo bombeia sangue arterial com alta pressão pela artéria aorta para todos os tecidos do corpo, retornando rico em CO₂ ao átrio direito pelas veias cavas. As artérias conduzem sangue que sai do coração; as veias conduzem sangue que chega ao coração.", ["Pequena circulação: VD → artérias pulmonares → pulmões → veias pulmonares → AE", "Grande circulação: VE → artéria aorta → corpo → veias cavas → AD", "Regra de ouro vascular: Artéria SAI do coração; Veia CHEGA ao coração", "Sístole = contração muscular; Diástole = relaxamento e enchimento", "Circulação humana: fechada, dupla e completa (sem mistura de sangue)"], "Nem toda artéria carrega sangue arterial e nem toda veia carrega sangue venoso! A artéria pulmonar carrega sangue VENOSO (pobre em O₂), e as veias pulmonares carregam sangue ARTERIAL (rico em O₂).", "<p>Um cateterismo cardíaco realizado com contraste radiopaco acompanhou o fluxo sanguíneo a partir do momento em que o sangue rico em gás carbônico entrou no coração proveniente da veia cava superior.</p>", "A trajetória correta e sequencial descrita por essas hemácias até saírem rumo aos pulmões para a hematose é:", ["Átrio esquerdo → Ventrículo esquerdo → Artéria aorta.", "Átrio esquerdo → Ventrículo direito → Veia cava inferior.", "Ventrículo direito → Átrio direito → Veias pulmonares.", "Átrio direito → Ventrículo esquerdo → Artéria carótida.", "Átrio direito → Ventrículo direito → Artérias pulmonares."], 4, "O sangue venoso trazido pelas veias cavas entra no átrio direito, passa pela válvula tricúspide para o ventrículo direito e, durante a sístole ventricular direita, é ejetado nas artérias pulmonares em direção aos alvéolos pulmonares (pequena circulação). Alternativa correta: E. Distratores: A descreve a via esquerda do sangue arterial; C inverte o fluxo atrioventricular e cita veias pulmonares; D e E misturam câmaras direitas e esquerdas, que são septadas e não se comunicam no coração adulto saudável."], "Sistema digestório e enzimas digestivas": ["O sistema digestório humano é responsável pela digestão mecânica e química dos alimentos e pela absorção de nutrientes e água. A digestão do amido inicia-se na boca pela ação da ptialina (amilase salivar) em pH neutro (~7). No estômago, o suco gástrico rico em ácido clorídrico (HCl) propicia pH fortemente ácido (~2) ideal para a ação da pepsina na clivagem inicial de proteínas. No duodeno (intestino delgado), o pH é alcalinizado pelo bicarbonato do suco pancreático e da bile (produzida no fígado e armazenada na vesícula biliar). A bile não contém enzimas: sua função essencial é emulsificar gorduras, aumentando a área superficial para a lipase pancreática. A maior parte da absorção ocorre no jejuno-íleo, revestido por vilosidades e microvilosidades.", ["Boca (pH ~7): amilase salivar (ptialina) digere amido", "Estômago (pH ~2): pepsina digere proteínas ativada por HCl", "Duodeno (pH ~8): suco pancreático e bile emulsionante", "Bile: NÃO tem enzimas; atua como detergente (emulsão de lipídios)", "Microvilosidades intestinais: maximizam a área de absorção de nutrientes"], "O ENEM ama perguntar a função da BILE: ela NÃO digere quimicamente e NÃO tem enzimas digestivas! Ela atua como um 'detergente biológico', emulsionando as gotas de gordura em gotículas microscópicas para que a lipase pancreática consiga agir com eficiência.", "<p>Um paciente submetido à colecistectomia (remoção cirúrgica da vesícula biliar) recebeu alta médica com a recomendação expressa de evitar refeições ricas em frituras e gorduras saturadas, sob risco de diarreia esteatorreica (fezes gordurosas).</p>", "Essa restrição alimentar decorre do fato de que, na ausência da vesícula biliar, o organismo:", ["deixa de produzir a enzima lipase pelas células acinares do pâncreas.", "perde a capacidade de produzir bile pelos hepatócitos do fígado.", "interrompe a absorção de glicose e aminoácidos pelas microvilosidades do íleo.", "perde o reservatório de armazenamento e liberação concentrada de bile no duodeno.", "bloqueia a síntese de ácido clorídrico nas células parietais do estômago."], 3, "A bile é produzida continuamente no fígado pelos hepatócitos, mas é armazenada e concentrada na vesícula biliar para liberação maciça durante refeições gordurosas. Sem a vesícula, a bile drena de forma contínua e diluída para o duodeno, resultando em emulsificação insuficiente de grandes sobrecargas lipídicas alimentares. Alternativa correta: D. Distratores: A erra pois o pâncreas continua sintetizando lipase normalmente; B erra pois a bile continua sendo produzida no fígado; C e E citam processos alheios à fisiologia da vesícula."], "Sistema endócrino e regulação hormonal": ["O sistema endócrino integra e regula as respostas fisiológicas por meio de hormônios transportados pela corrente sanguínea, operando majoritariamente por retroalimentação negativa (feedback negativo). O pâncreas atua como glândula mista endócrina e exócrina: as ilhotas de Langerhans secretam insulina (células beta) e glucagon (células alfa). A insulina é hipoglicemiante: promove a captação celular de glicose e a síntese de glicogênio hepático e muscular (glicogênese). O glucagon é hiperglicemiante: estimula a quebra do glicogênio (glicogenólise) e a formação de glicose (gliconeogênese) em jejum. O eixo hipotálamo-hipófise controla a tireoide (TSH/T3/T4) e as suprarrenais (ACTH/cortisol/adrenalina).", ["Insulina (células beta): reduz glicemia (armazena glicogênio no fígado)", "Glucagon (células alfa): eleva glicemia (glicogenólise no jejum)", "Feedback negativo: o produto final inibe a liberação do estímulo inicial", "Tireoide: T3 e T4 estimulam o metabolismo basal (dependem de iodo)", "Diabetes mellitus tipo 1 (autoimune/falta de insulina) vs tipo 2 (resistência insulínica)"], "Memorize a dupla do pâncreas: após o almoço, a glicemia sobe e o pâncreas libera INSULINA para estocar glicose; após horas em jejum, a glicemia desce e o pâncreas libera GLUCAGON para quebrar o glicogênio do fígado e manter o cérebro alimentado.", "<p>Um indivíduo saudável ingeriu um almoço com feijão, arroz, mandioca frita e suco de uva. Duas horas depois, exames de sangue demonstraram aumento temporário na secreção de um hormônio pancreático chave, seguido pelo retorno da glicemia para os níveis de repouso (cerca de 90 mg/dL).</p>", "Qual hormônio foi secretado em maior quantidade nesse período pós-prandial e qual foi sua ação predominante nos hepatócitos?", ["Glucagon; estimulou a quebra de glicogênio em glicose livre.", "Adrenalina; bloqueou a absorção de monossacarídeos pelo epitélio gástrico.", "Tiroxina (T4); provocou a degradação de proteínas contráteis musculares.", "Insulina; estimulou a captação de glicose e a síntese de glicogênio (glicogênese).", "Aldosterona; reduziu a excreção renal de sódio e bicarbonato."], 3, "A digestão dos carboidratos eleva a taxa de glicose no sangue (hiperglicemia pós-prandial). As células beta pancreáticas detectam esse aumento e secretam insulina na circulação. A insulina ativa receptores hepáticos e musculares, promovendo o influxo de glicose via transportadores GLUT e estimulando a síntese de glicogênio de reserva (glicogênese), normalizando a glicemia. Alternativa correta: D. Distratores: A erra pois o glucagon atua no jejum; B, D e E citam hormônios que não participam da regulação primária pós-prandial da glicose."], "Sistema excretor e formação da urina": ["O sistema excretor humano é composto por rins, ureteres, bexiga urinária e uretra, desempenhando papel crucial na osmorregulação e eliminação de excretas nitrogenadas (principalmente ureia). O néfron é a unidade morfofuncional do rim. O processo de formação da urina compreende três etapas fundamentais: filtração glomerular (onde a alta pressão hidrostática na cápsula renal força água, glicose, sais e ureia para o túbulo, retendo células e proteínas plasmáticas grandes), reabsorção tubular (ao longo do túbulo contorcido proximal e alça de Henle, recuperando 100% da glicose e grande parte de água e sais) e secreção tubular ativa de íons e toxinas. Hormônios como o ADH (vasopressina) aumentam a permeabilidade dos ductos coletores à água, concentrando a urina.", ["Filtração glomerular: líquido sem proteínas grandes nem hemácias", "Reabsorção tubular: glicose e aminoácidos reabsorvidos quase a 100%", "Alça de Henle e ducto coletor: concentração osmótica de urina", "ADH (vasopressina): reabsorve água; inibido pelo álcool etílico", "Aldosterona: reabsorve Na⁺ e secreta K⁺ no túbulo distal"], "O consumo de bebidas alcoólicas inibe a secreção de ADH pela neuroipófise. Sem ADH, os ductos coletores reabsorvem menos água, gerando micção frequente de urina diluída e levando à desidratação e à famosa ressaca.", "<p>Em um indivíduo jovem e saudável, exames laboratoriais de rotina constataram urina com densidade normal e ausência de sangue. Em situações normais, substâncias como glicose e aminoácidos estão presentes no filtrado glomerular inicial dentro da cápsula renal, porém estão totalmente ausentes na urina final excretada na bexiga.</p>", "A ausência fisiológica de glicose na urina de uma pessoa saudável é explicada pelo processo de:", ["oxidação imediata da glicose por bactérias simbiontes da bexiga.", "bloqueio mecânico da passagem de monossacarídeos pelos poros dos glomérulos renais.", "conversão da glicose em ureia e amônia pelas células endoteliais dos ureteres.", "reabsorção tubular ativa completa ocorrida no túbulo contorcido proximal do néfron.", "degradação da molécula de glicose em gás oxigênio no interior da alça néfrica."], 3, "A glicose atravessa livremente a barreira de filtração glomerular devido ao seu baixo peso molecular, compondo o filtrado primário. No entanto, transportadores de cotransporte Na⁺/glicose localizados no túbulo contorcido proximal realizam a reabsorção ativa de praticamente 100% da glicose de volta para os capilares peritubulares. Glicosúria (glicose na urina) só ocorre quando a glicemia excede o limiar de saturação renal, como no diabetes mellitus descompensado. Alternativa correta: D. Distratores: A e D criam reações inexistentes; B erra pois a glicose é filtrada; E viola a bioquímica básica."], "Sistema imunológico, vacinas e soros": ["A resposta imunológica humana divide-se em inata (inespecífica, como barreiras físicas, fagócitos e febre) e adaptativa (específica, mediada por linfócitos T e B). Os linfócitos B diferenciam-se em plasmócitos produtores de anticorpos (imunoglobulinas) e células de memória imunológica. A vacina é uma imunização ativa e preventiva: introduz antígenos atenuados, inativados ou fragmentos de RNAm para que o próprio corpo produza anticorpos e células de memória duradouras. Já o soro terapêutico (como o antiofídico) é uma imunização passiva e curativa de urgência: injeta anticorpos prontos produzidos em outro organismo (ex.: cavalo) para neutralizar toxinas com efeito imediato, sem gerar memória imune.", ["Vacina = imunização ATIVA e PREVENTIVA: antígeno atenuado → gera memória imune", "Soro = imunização PASSIVA e CURATIVA: anticorpo pronto → ação imediata, sem memória", "Antígeno = molécula estranha que induz resposta imune", "Anticorpo = proteína defensiva específica (imunoglobulina) produzida por plasmócitos", "Células de memória: resposta secundária muito mais rápida e potente"], "O campeão de erros no ENEM: confundir SORO com VACINA! Soroterapia: 'picada de cobra, precisa de anticorpo PRONTO agora' (passiva/curativa). Vacinação: 'campanha antes da gripe ou sarampo para CRIAR memória' (ativa/preventiva).", "<p>Um trabalhador rural foi picado por uma serpente jararaca (<i>Bothrops jararaca</i>) durante o manejo de um cafezal. Encaminhado imediatamente ao pronto-socorro com dor intensa e inchaço no local da picada, o médico plantonista prescreveu a administração intravenosa do imunobiológico adequado para reverter o quadro toxicológico.</p>", "O tipo de imunobiológico administrado nessa emergência e a justificativa fisiológica para sua escolha são:", ["Soro antibotrópico, por fornecer anticorpos heterólogos prontos capazes de neutralizar o veneno circulante de imediato.", "Vacina antibotrópica, para estimular a síntese endógena de anticorpos ao longo das semanas seguintes.", "Antibiótico de largo espectro, para impedir a replicação do vírus da jararaca na corrente sanguínea.", "Vacina profilática atenuada, para garantir imunidade permanente contra novos acidentes ofídicos.", "Soro fisiológico glicosado exclusivamente, pois o veneno de serpentes é decomposto apenas pelo suco gástrico."], 0, "O acidente ofídico exige a imediata neutralização das toxinas circulantes antes que causem lesão tecidual e hemorragias graves. Para isso administra-se o soro antibotrópico (imunização passiva), que contém imunoglobulinas prontas produzidas em equinos imunizados. A vacina não teria eficácia terapêutica na urgência, pois leva semanas para induzir títulos protetores de anticorpos. Alternativa correta: A. Distratores: A e D indicam vacinas em situação aguda de envenenamento; C classifica erroneamente veneno como infecção viral; E ignora a toxicidade sistêmica do veneno inoculado."], "Sistema linfático e circulação da linfa": ["O sistema linfático é um circuito vascular auxiliar aberto essencial para a homeostase tecidual e para a imunidade humoral e celular. Nos capilares sanguíneos, a pressão hidrostática força a saída contínua de água, íons e pequenas proteínas para o interstício (espaço entre as células); cerca de 90% desse líquido intersticial retorna diretamente por pressão coloidosmótica aos capilares venosos, mas os 10% restantes são drenados pelos capilares linfáticos de fundo cego, passando a ser denominados linfa. Vasos linfáticos dotados de válvulas unidirecionais conduzem a linfa através de linfonodos (gânglios linfáticos), onde macrófagos e linfócitos filtram e fagocitam bactérias, vírus e células tumorais metastáticas. A linfa purificada desemboca nas veias subclávias de volta à circulação sanguínea. Obstruções na drenagem linfática provocam acúmulo de líquido nos tecidos e inchaço crônico (edema e linfedema, como na filariose/elefantíase).", ["Linfa: excesso de líquido intersticial drenado por capilares linfáticos de fundo cego", "Linfonodos: filtros biológicos ricos em linfócitos e macrófagos que detectam antígenos", "Absorção de gorduras: quilíferos das vilosidades intestinais transportam quilomícrons pela linfa", "Filariose (elefantíase): verme nematoide <i>Wuchereria bancrofti</i> obstrui vasos linfáticos gerando edema monstruoso"], "Íngua inchada no pescoço ou virilha é um linfonodo aumentado! Quando há infecção na região, os linfócitos do linfonodo se multiplicam intensamente para combater os germes que a linfa drenou daquele local, provocando dor e inchaço temporário.", "<p>A filariose linfática (elefantíase), endemia transmitida pela picada do mosquito <i>Culex quinquefasciatus</i> infectado com o nematoide <i>Wuchereria bancrofti</i>, caracteriza-se pelo acúmulo extremo de líquido e hipertrofia tecidual severa em pernas ou órgãos genitais externos.</p>", "O edema característico dessa parasitose crônica decorre da:", ["paralisação da filtração glomerular no interior das cápsulas renais de Bowman.", "destruição das paredes musculares da artéria aorta por enzimas bacterianas intestinais.", "obstrução mecânica da drenagem dos vasos linfáticos pelos vermes adultos, impedindo o retorno do líquido intersticial ao sangue.", "conversão da linfa em gás nitrogênio livre no interior dos alvéolos pulmonares.", "perda maciça de hemoglobina pelas fezes decorrente da necrose gástrica."], 2, "Os vermes adultos de <i>Wuchereria bancrofti</i> alojam-se nos vasos e ductos linfáticos, provocando inflamação crônica e fibrose obstrutiva mecânica. Com os canais linfáticos bloqueados, o líquido intersticial não consegue ser drenado de volta para a circulação venosa, acumulando-se patologicamente nos membros e gerando o linfedema e elefantíase. Alternativa correta: C. Distratores: B, C, D e E citam processos alheios à fisiopatologia da obstrução linfática."], "Sistema nervoso autônomo simpático e parassimpático": ["O sistema nervoso periférico visceral ou autônomo (SNA) regula involuntariamente as funções vegetativas dos órgãos internos, músculos lisos, músculo cardíaco e glândulas, mantendo a homeostase corpórea. Divide-se em duas divisões com ações antagônicas e complementares: a Divisão Simpática (toracolombar), que prepara o organismo para situações de emergência, perigo, estresse ou exercício intenso ('luta ou fuga'), utilizando a noradrenalina e adrenalina para desencadear taquicardia (aumento da frequência cardíaca), broncodilatação (facilita o fluxo de ar nos pulmões), midríase (dilatação das pupilas para entrada de luz), inibição da salivação e da digestão gastrintestinal e glicogenólise hepática; e a Divisão Parassimpática (craniossacral), mediada pelo nervo vago e acetilcolina, que predomina em estados de calma, digestão e repouso ('descansar e digerir'), promovendo bradicardia, broncoconstrição, miose (constrição pupilar) e estímulo intenso ao peristaltismo e secreções digestivas.", ["Simpático (Luta ou Fuga): noradrenalina; taquicardia, broncodilatação, midríase, inibe digestão", "Parassimpático (Repouso e Digestão): acetilcolina; bradicardia, broncoconstrição, miose, ativa digestão", "Ação antagônica integrada: mantém os órgãos corporais sob ajuste fino homeostático contínuo", "Dilatação da pupila = midríase (simpático); contração da pupila = miose (parassimpático)"], "Simpático = acelerador para fugir do perigo (adrenalina faz o coração disparar e a pupila abrir). Parassimpático = freio de mão após o almoço no sofá (faz a digestão funcionar e o coração bater devagar).", "<p>Ao deparar-se inesperadamente com uma onça-pintada em uma trilha na floresta, um ecoturista sentiu o coração disparar no peito, a boca ficar seca, as pupilas dilatarem e a respiração tornar-se rápida e ofegante, preparando o seu corpo para correr e escapar do perigo iminente.</p>", "Essa reação fisiológica integrada de 'luta ou fuga' foi desencadeada primariamente pela ativação da:", ["divisão parassimpática craniana, que secreta acetilcolina para estimular o peristaltismo intestinal.", "glândula tireoide, que absorve todo o oxigênio alveolar impedindo a contração cardíaca.", "medula espinhal somática, que paralisa os músculos esqueléticos para diminuir o gasto de glicose.", "hipófise posterior, que libera ocitocina para reduzir a pressão arterial e induzir o sono.", "divisão simpática do sistema nervoso autônomo, mediada pela liberação de noradrenalina e adrenalina."], 4, "Frente a um perigo agudo, o hipotálamo ativa a divisão simpática do sistema nervoso autônomo e a medula da glândula suprarrenal. A descarga maciça de noradrenalina e adrenalina na circulação provoca aumento da frequência e força das contrações cardíacas (taquicardia), dilatação dos brônquios (broncodilatação para captar mais O₂), dilatação das pupilas (midríase para melhorar a visão no perigo) e desvio do fluxo sanguíneo dos órgãos digestivos para os músculos esqueléticos esqueléticos, configurando o reflexo clássico de luta ou fuga. Alternativa correta: E. Distratores: A é a resposta parassimpática de repouso; C, D e E citam mecanismos incorretos ou contrários à
