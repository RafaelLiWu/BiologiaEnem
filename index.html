"Hormônios vegetais":["Hormônios vegetais regulam crescimento e desenvolvimento. A auxina promove o alongamento das células do caule e está ligada ao fototropismo: ela se concentra no lado sombreado, que cresce mais, curvando o caule em direção à luz. O etileno promove o amadurecimento dos frutos; as giberelinas estimulam a germinação e o crescimento do caule; o ácido abscísico atua na dormência e no fechamento dos estômatos.",["Auxina: alongamento celular; fototropismo do caule","Etileno: amadurecimento de frutos","Giberelinas: germinação e alongamento","Ácido abscísico: dormência e fechamento dos estômatos"],"Fruto verde ao lado de frutos maduros amadurece mais rápido: o etileno é um gás.","Uma planta foi colocada próxima a uma janela. Depois de alguns dias, o caule se curvou em direção à luz. Medidas mostraram que as células do lado do caule oposto à janela eram mais longas do que as do lado voltado para ela.","Esse comportamento é explicado porque:",["a luz estimula a produção de auxina no lado iluminado, que passa a crescer mais.","a auxina se concentra no lado sombreado do caule, estimulando o alongamento celular e curvando o caule para a luz.","o etileno se acumula no lado iluminado, que amadurece mais rápido.","as giberelinas inibem o crescimento no lado sombreado, curvando o caule.","o ácido abscísico estimula a divisão celular no lado iluminado, que passa a crescer mais."],1,"B: o lado sombreado, com mais auxina, tem células mais longas, o que curva o caule para a luz, como mostram as medidas. A contraria os dados: o lado mais longo é o oposto à janela. C descreve o papel do etileno no amadurecimento, não no crescimento do caule. D inverte o papel das giberelinas, que estimulam o crescimento. E atribui ao ácido abscísico, associado à dormência, o papel da auxina."],
"Organelas celulares":["Mitocôndrias realizam a respiração celular e produzem a maior parte do ATP; cloroplastos realizam fotossíntese; o retículo endoplasmático rugoso, com ribossomos, participa da síntese de proteínas e o liso, da de lipídios; o complexo golgiense modifica, empacota e secreta substâncias; os lisossomos têm enzimas digestivas. Células procariontes não têm organelas membranosas, como mitocôndrias.",["Mitocôndria: respiração celular (ATP)","Cloroplasto: fotossíntese","RER: proteínas; REL: lipídios","Golgi: modificação e secreção; lisossomo: digestão intracelular"],"Células que secretam proteínas têm RER e Golgi desenvolvidos; as de alto gasto de energia têm muitas mitocôndrias.","Dois tipos celulares foram analisados ao microscópio eletrônico. A célula X apresentava retículo endoplasmático rugoso e complexo golgiense muito desenvolvidos. A célula Y tinha grande número de mitocôndrias e pouco retículo.","É coerente com essas observações que:",["X seja uma célula muscular, que precisa de muito ATP, e Y secrete proteínas.","X realize fotossíntese intensa e Y armazene amido.","ambas realizem a mesma função, pois possuem as mesmas organelas.","X seja especializada em secretar proteínas e Y tenha alta demanda de energia.","Y seja procarionte, pois possui mitocôndrias."],3,"D: RER e Golgi desenvolvidos indicam síntese e secreção de proteínas; muitas mitocôndrias indicam alta produção de ATP. A inverte as funções. B atribui fotossíntese a X sem cloroplastos citados. C ignora as diferenças descritas. E é falsa: procariontes não têm mitocôndrias."],
"Segunda Lei de Mendel":["A segunda lei de Mendel (segregação independente) afirma que alelos de genes em cromossomos diferentes segregam-se independentemente na formação dos gametas. Um diíbrido AaBb produz quatro tipos de gameta (AB, Ab, aB, ab) em proporções iguais, e o cruzamento AaBb × AaBb gera a proporção fenotípica 9:3:3:1.",["AaBb → gametas AB, Ab, aB, ab (1/4 cada)","AaBb × AaBb → 9 A_B_ : 3 A_bb : 3 aaB_ : 1 aabb","Genes independentes: multiplique as probabilidades"],"Resolva cada gene separadamente e multiplique: 3/4 (A_) × 1/4 (bb) = 3/16.","Em ervilhas, o alelo A (semente amarela) é dominante sobre a (verde), e o alelo B (semente lisa) é dominante sobre b (rugosa). Os genes estão em cromossomos diferentes. Cruzam-se plantas AaBb × AaBb.","A probabilidade de nascer uma planta de semente amarela e rugosa é de:",["1/16","9/16","1/4","3/16","3/8"],3,"Gene A: Aa × Aa → 3/4 amarelas; gene B: Bb × Bb → 1/4 rugosas. Genes independentes: 3/4 × 1/4 = 3/16 (D). A (1/16) é a probabilidade de aabb; B (9/16) é a de amarela e lisa; C (1/4) considera só a semente rugosa; E (3/8) soma amarela-rugosa e verde-lisa (3/16 + 3/16)."],
"Teorias de Lamarck e Darwin":["Lamarck propôs que o uso e o desuso modificam os órgãos e que essas características adquiridas são herdadas, ideia não sustentada pela genética. Darwin propôs que indivíduos de uma população variam, que a variação é hereditária, que há competição por recursos e que os mais bem adaptados deixam mais descendentes (seleção natural). A teoria sintética incorporou a genética: a variação vem de mutação e recombinação.",["Lamarck: uso e desuso + herança de características adquiridas","Darwin: variação + herança + seleção natural","Teoria sintética: genética + seleção natural"],"Frases como “por necessidade” ou “esticou o pescoço e passou aos filhos” indicam lamarckismo.","Duas explicações foram propostas para o pescoço longo das girafas. A explicação 1 afirma que, ao esticar o pescoço para alcançar folhas altas, os animais o alongavam e transmitiam esse alongamento aos filhotes. A explicação 2 afirma que, em populações ancestrais, havia variação hereditária no comprimento do pescoço e que os animais de pescoço mais longo sobreviviam e se reproduziam mais quando as folhas baixas eram escassas.","As explicações 1 e 2 correspondem, respectivamente, a:",["darwinismo e lamarckismo, pois ambos defendem a herança de características adquiridas.","lamarckismo e lamarckismo, pois ambas dependem do uso e desuso.","darwinismo e darwinismo, pois ambas consideram o ambiente.","lamarckismo e criacionismo, pois a segunda nega a variação.","lamarckismo, baseado no uso e na herança de características adquiridas, e darwinismo, baseado em variação hereditária e seleção natural."],4,"E: a explicação 1 apresenta uso e herança de características adquiridas (lamarckismo); a 2, variação hereditária e reprodução diferencial (seleção natural). A inverte as ideias. B ignora que a 2 não trata de uso e desuso. C ignora que a 1 não envolve seleção. D é falsa: a explicação 2 afirma a existência de variação e não é criacionista."],
"Vírus e viroses":["Vírus são parasitas intracelulares obrigatórios, formados por material genético (DNA ou RNA) envolvido por um capsídeo de proteínas, às vezes com envelope lipídico. Não têm metabolismo próprio e dependem da maquinaria da célula hospedeira para se replicar. Como não são bactérias, antibióticos não agem contra vírus. Vacinas e medidas de prevenção são as principais formas de controle de muitas viroses.",["Vírus: ácido nucleico + capsídeo (parasita intracelular obrigatório)","Replicação usa a maquinaria da célula hospedeira","Antibióticos não atuam sobre vírus"],"Para explicar por que antibiótico não age em gripe ou dengue: o vírus não tem metabolismo próprio nem as estruturas bacterianas que o antibiótico ataca.","Um paciente com gripe perguntou se um antibiótico resolveria a infecção. A médica explicou que a gripe é causada por um vírus de RNA e que antibióticos não têm efeito sobre ele.","Qual explicação sustenta a afirmação da médica?",["O vírus não tem metabolismo próprio e se replica dentro das células, e os antibióticos agem sobre estruturas e processos de bactérias, que o vírus não possui.","Os antibióticos destroem apenas organismos eucariontes, e o vírus é procarionte.","O vírus é um organismo unicelular que vive fora das células, onde o antibiótico não chega.","O vírus produz antibióticos que anulam o efeito do medicamento.","O RNA viral é digerido pelos antibióticos, mas se regenera rapidamente."],0,"A: vírus são parasitas intracelulares sem metabolismo próprio, e os antibióticos atuam em estruturas e processos bacterianos. B é falsa: antibióticos atuam sobre bactérias (procariontes) e o vírus não é procarionte. C erra: o vírus se replica dentro de células e não é unicelular. D e E são falsas e sem base científica."],
"Camada de ozônio e CFCs":["O ozônio (O<sub>3</sub>) na estratosfera absorve grande parte da radiação ultravioleta (UV) do Sol. Compostos como os clorofluorcarbonos (CFCs) liberam cloro, que destrói o ozônio, reduzindo a camada e aumentando a radiação UV na superfície, o que eleva o risco de danos à pele e aos olhos e prejudica ecossistemas. O Protocolo de Montreal reduziu o uso desses compostos.",["O<sub>3</sub> estratosférico absorve UV","CFCs liberam cloro, que destrói o O<sub>3</sub>","Protocolo de Montreal: eliminação progressiva dos CFCs","Camada de ozônio ≠ efeito estufa"],"O ozônio estratosférico protege; o ozônio ao nível do solo é poluente.","Medições por satélite mostraram redução sazonal da concentração de ozônio sobre a Antártida. O fenômeno foi associado ao uso, durante décadas, de gases CFC em aerossóis e refrigeradores.","A redução do ozônio preocupa porque:",["o ozônio absorve a radiação infravermelha, e sua perda aumenta o efeito estufa de forma direta e exclusiva.","o ozônio estratosférico absorve parte da radiação ultravioleta, e sua redução aumenta a radiação UV que atinge a superfície.","o ozônio produz o oxigênio que respiramos, e sua perda reduz a quantidade de O<sub>2</sub> do ar.","o ozônio filtra a luz visível, necessária à fotossíntese.","o ozônio retém o CO<sub>2</sub> na atmosfera, e sua redução provoca chuva ácida."],1,"B: a camada de ozônio filtra parte da radiação UV, e sua redução aumenta a exposição à radiação na superfície. A confunde o problema com o efeito estufa. C é falsa: o O<sub>2</sub> do ar vem principalmente da fotossíntese. D é falsa: o ozônio absorve UV, não luz visível. E é falsa: o ozônio não retém CO<sub>2</sub>, e a chuva ácida decorre de óxidos de enxofre e nitrogênio."],
"Tecidos animais":["Os tecidos animais são o epitelial (reveste superfícies e forma glândulas), o conjuntivo (une, sustenta e preenche; inclui sangue, osso e cartilagem), o muscular (contração: liso, estriado esquelético e estriado cardíaco) e o nervoso (condução de impulsos). O tecido epitelial é avascular e se nutre por difusão a partir do conjuntivo.",["Epitelial: revestimento e secreção; avascular","Conjuntivo: sustentação, preenchimento, transporte (sangue)","Muscular: liso (involuntário); estriado esquelético (voluntário); estriado cardíaco (involuntário)","Nervoso: neurônios e células da glia"],"Sangue, osso e cartilagem são tecidos conjuntivos.","Em uma aula de histologia, um estudante observou três lâminas: (1) células justapostas, com pouca matriz, revestindo a parede interna do intestino; (2) células espalhadas em abundante matriz extracelular mineralizada; (3) células alongadas, estriadas, que se contraem de forma voluntária.","Os tecidos observados em 1, 2 e 3 são, respectivamente:",["conjuntivo, epitelial e muscular liso.","epitelial, nervoso e muscular liso.","epitelial, conjuntivo (ósseo) e muscular estriado esquelético.","muscular, conjuntivo e epitelial.","nervoso, epitelial e conjuntivo."],2,"C: (1) é epitélio de revestimento; (2) é tecido ósseo, conjuntivo com matriz mineralizada; (3) é músculo estriado esquelético, de contração voluntária. A troca epitelial por conjuntivo e o músculo liso (involuntário e sem estrias) contraria o texto. B e E trazem tecido nervoso, que não tem as características descritas. D inverte a lâmina 1 e a lâmina 3."],
"Gametogênese":["A espermatogênese forma, por meiose, quatro espermatozoides haploides funcionais a partir de cada célula germinativa diploide. A ovogênese origina, a partir de cada célula germinativa diploide, apenas um óvulo funcional e corpos polares, que degeneram; isso concentra citoplasma e reservas no óvulo.",["Espermatogênese: 1 célula 2n → 4 espermatozoides n","Ovogênese: 1 célula 2n → 1 óvulo + corpos polares","Corpos polares degeneram"],"Compare o número de gametas funcionais: 4 por célula no homem e 1 por célula na mulher.","Um laboratório estuda 100 células germinativas diploides de um homem e 100 de uma mulher. Considere que todas completem a meiose sem falhas e que, no sexo feminino, cada célula origina um óvulo funcional e três corpos polares.","Quantos gametas funcionais (espermatozoides ou óvulos) se formam, respectivamente, nos dois casos?",["400 espermatozoides e 100 óvulos.","100 espermatozoides e 400 óvulos.","400 espermatozoides e 400 óvulos.","200 espermatozoides e 100 óvulos.","100 espermatozoides e 100 óvulos."],0,"Homem: 100 células × 4 = 400 espermatozoides. Mulher: 100 células × 1 = 100 óvulos funcionais (A). B inverte os sexos. C supõe que os corpos polares sejam funcionais. D considera apenas a primeira divisão da meiose no homem. E supõe um gameta por célula também no homem."],
"Clonagem e células-tronco":["Na clonagem por transferência nuclear (como a da ovelha Dolly), o núcleo de uma célula somática do doador é transferido para um óvulo sem núcleo, e o embrião resultante tem o genoma nuclear do doador. Células-tronco podem se diferenciar em vários tipos celulares, o que as torna importantes na pesquisa biomédica.",["Clonagem: núcleo da célula somática → óvulo sem núcleo","Clone: genoma nuclear igual ao do doador do núcleo","Células-tronco: capazes de se diferenciar"],"Pergunte de quem veio o núcleo: gestar um embrião não transmite genes nucleares.","Em um laboratório, o núcleo de uma célula da glândula mamária da ovelha A foi inserido em um óvulo sem núcleo da ovelha B. O embrião formado foi gestado pela ovelha C, e um cordeiro nasceu.","O genoma nuclear do cordeiro é idêntico ao da:",["ovelha B, que doou o óvulo.","ovelha C, que gestou o embrião.","ovelha A, que doou o núcleo.","ovelha B e da ovelha C, em partes iguais.","ovelha A e da ovelha B, em partes iguais."],2,"C: o genoma nuclear vem do núcleo transferido, da ovelha A. A erra: o óvulo da ovelha B teve o núcleo retirado, e só contribui com citoplasma (incluindo DNA mitocondrial). B erra: a gestação não transfere genes nucleares. D e E supõem mistura de genomas, o que não ocorre na transferência nuclear."],
"Bacterioses e prevenção":["Bactérias causam doenças como tuberculose, cólera, leptospirose e tétano. A cólera é transmitida por água e alimentos contaminados; a tuberculose, por gotículas do ar; a leptospirose, pelo contato com água de enchente contaminada com urina de ratos; o tétano, pela entrada de esporos em ferimentos, prevenido por vacina. Antibióticos atuam contra bactérias, mas devem ser usados com orientação médica, para evitar resistência.",["Cólera: água e alimentos contaminados","Leptospirose: água de enchente com urina de ratos","Tuberculose: gotículas do ar","Tétano: ferimentos contaminados; prevenção por vacina"],"Associe a doença à via de transmissão para escolher a medida preventiva.","Após uma enchente em um bairro, vários moradores que caminharam pela água apresentaram febre e dores musculares, e os exames confirmaram leptospirose.","Qual medida preventiva se relaciona diretamente à via de transmissão da leptospirose?",["Vacinar as pessoas contra o tétano antes da enchente.","Usar máscaras para evitar gotículas respiratórias de pessoas infectadas.","Eliminar criadouros de água parada para controlar mosquitos.","Ferver a água de beber e lavar bem os alimentos, pois a transmissão ocorre apenas pela ingestão.","Evitar o contato da pele e das mucosas com água de enchente e controlar roedores, pois a bactéria é eliminada na urina de ratos."],4,"E: a bactéria é eliminada na urina de ratos e penetra por pele e mucosas em contato com água contaminada. A trata de outra doença (tétano). B descreve a via de doenças respiratórias, como a tuberculose. C descreve o controle da dengue. D é falsa: a transmissão não ocorre apenas por ingestão."],
"Heredogramas":["Heredogramas representam o parentesco e a ocorrência de uma característica na família. Pais sem a característica com um filho afetado indicam herança recessiva e pais heterozigotos. Em um cruzamento Aa × Aa, a chance de filho aa é 1/4, e a probabilidade de cada sexo é 1/2. Eventos independentes: multiplicam-se as probabilidades.",["Pais normais com filho afetado → herança recessiva; pais Aa","Aa × Aa → 1/4 aa","Sexo: 1/2 para cada; multiplique com o fenótipo"],"Identifique primeiro se a herança é dominante ou recessiva e se é autossômica.","Em um heredograma, um casal sem uma doença genética teve um filho com a doença. Considere que a doença é determinada por um alelo autossômico recessivo e ignore mutações.","A probabilidade de o próximo filho do casal ser uma menina com a doença é de:",["1/2","1/4","3/4","1/8","3/8"],3,"O casal é Aa × Aa. P(aa) = 1/4 e P(menina) = 1/2; 1/4 × 1/2 = 1/8 (D). A (1/2) é só a probabilidade de ser menina; B (1/4) é a de ser afetado, sem o sexo; C (3/4) é a de não ser afetado; E (3/8) é a de ser menina sem a doença (3/4 × 1/2)."],
"Especiação e isolamento reprodutivo":["Espécie biológica é um conjunto de populações que se cruzam e geram descendentes férteis, isoladas reprodutivamente de outras. Na especiação alopátrica, uma barreira geográfica separa populações, que passam a acumular diferenças por mutação, deriva e seleção até o isolamento reprodutivo. O isolamento pode ser anterior à formação do zigoto (como na época de reprodução) ou posterior (como em híbridos estéreis).",["Barreira geográfica → especiação alopátrica","Isolamento reprodutivo = critério da espécie biológica","Mula: híbrido estéril (isolamento pós-zigótico)"],"Se a pergunta cita barreira geográfica, pense em especiação alopátrica.","Duas populações de uma espécie de roedor vivem em lados opostos de um rio que se formou há milhares de anos e que esses animais não conseguem atravessar. Hoje, em laboratório, indivíduos das duas populações não se acasalam entre si, mesmo quando colocados juntos.","O processo que levou à situação descrita é:",["a mutação direcionada pelo rio, que induz isolamento reprodutivo.","a especiação alopátrica: a barreira geográfica interrompeu o fluxo gênico, e as populações divergiram até o isolamento reprodutivo.","o cruzamento entre as populações, que forma híbridos férteis e reúne as duas espécies.","a simpatria, pois as populações sempre viveram juntas.","a seleção artificial, pois o ser humano escolheu quais animais acasalar."],1,"B: o rio isolou as populações, que divergiram até não se cruzarem mais. A é falsa: o rio não induz mutações direcionadas. C contraria o texto: não há acasalamento. D contraria o texto: vivem em lados opostos do rio. E não é mencionada no texto."],
"Estrutura do DNA e replicação":["O DNA é uma dupla-hélice de duas fitas antiparalelas de nucleotídeos (desoxirribose, fosfato e base nitrogenada), com pareamento A–T e C–G por pontes de hidrogênio. Por isso, A = T e C = G (regras de Chargaff). A replicação é semiconservativa: cada molécula-filha tem uma fita original e uma nova, sintetizada pela DNA-polimerase.",["A = T e C = G","Replicação semiconservativa","DNA-polimerase sintetiza a nova fita"],"Some A + T, subtraia de 100% e divida por dois para obter G e C.","Em uma amostra de DNA de fita dupla de uma bactéria, a análise mostrou que 30% das bases nitrogenadas são adenina.","Considerando o pareamento de bases do DNA, a porcentagem de citosina na amostra é de:",["20%","30%","40%","70%","60%"],0,"A = T = 30%, então A + T = 60%. Restam 40% para G + C, e como G = C, cada uma tem 20% (A). B iguala a citosina à adenina; C (40%) é a soma G + C; D (70%) é 100% − 30%; E (60%) é a soma A + T."],
"Poluição do ar e chuva ácida":["A queima de combustíveis fósseis e atividades industriais liberam óxidos de enxofre (SO<sub>2</sub>) e de nitrogênio (NO<sub>x</sub>), que reagem com a água da atmosfera e formam ácidos (sulfúrico e nítrico), causando chuva ácida. Ela acidifica solos e corpos d'água, danifica florestas e corrói construções e monumentos de calcário e mármore. A inversão térmica dificulta a dispersão de poluentes nas cidades.",["SO<sub>2</sub> e NO<sub>x</sub> + água → chuva ácida","CO<sub>2</sub> e CH<sub>4</sub> → efeito estufa (fenômeno distinto)","Inversão térmica: poluentes retidos perto do solo"],"Chuva ácida (SO<sub>2</sub>, NO<sub>x</sub>) e efeito estufa (CO<sub>2</sub>, CH<sub>4</sub>) são fenômenos diferentes.","Em uma cidade industrial, estátuas de mármore (principalmente carbonato de cálcio) apresentaram corrosão acelerada nas últimas décadas, e lagos próximos tiveram queda de pH. Uma usina próxima queima carvão com alto teor de enxofre.","A principal causa desses danos é:",["o aumento do CO<sub>2</sub>, que intensifica o efeito estufa e dissolve diretamente o mármore.","a destruição da camada de ozônio, que permite a passagem de radiação UV que corrói rochas.","a emissão de óxidos de enxofre, que formam ácidos na atmosfera e acidificam a chuva, corroendo o mármore e acidificando os lagos.","a eutrofização dos lagos, que também corrói estátuas de mármore.","o excesso de oxigênio emitido pela usina, que oxida o mármore."],2,"C: o enxofre do carvão gera SO<sub>2</sub>, que forma ácidos e acidifica chuva e lagos; os ácidos reagem com o carbonato de cálcio do mármore. A confunde o efeito estufa com a chuva ácida. B é falsa: a radiação UV não é a causa descrita. D é falsa: a eutrofização não corrói estátuas. E é falsa: a usina não libera excesso de oxigênio que corroa o mármore."],
"Anexos embrionários":["Os anexos embrionários protegem e nutrem o embrião: o âmnio forma a cavidade com líquido que protege contra choques e desidratação; o saco vitelínico guarda as reservas nutritivas (vitelo); o alantoide acumula excretas e, em aves e répteis, participa das trocas gasosas; o cório envolve o embrião e, nos mamíferos placentários, forma a placenta com o endométrio.",["Âmnio: líquido que protege e evita desidratação","Saco vitelínico: reservas nutritivas","Alantoide: acúmulo de excretas","Placenta: trocas entre mãe e feto"],"O âmnio é o anexo que tornou o embrião independente da água externa.","Um embrião de ave se desenvolve dentro de um ovo com casca, em ambiente seco, e é nutrido por uma reserva interna de vitelo. Os resíduos nitrogenados do embrião se acumulam em uma bolsa dentro do ovo.","Quais anexos embrionários desempenham, respectivamente, as funções de proteção contra a desidratação, nutrição pelo vitelo e acúmulo de excretas?",["Alantoide, âmnio e saco vitelínico.","Saco vitelínico, alantoide e âmnio.","Âmnio, alantoide e saco vitelínico.","Placenta, âmnio e alantoide.","Âmnio, saco vitelínico e alantoide."],4,"E: o âmnio protege contra a desidratação, o saco vitelínico guarda o vitelo e o alantoide acumula excretas. A, B e C trocam as funções entre os anexos. D cita a placenta, que não existe no ovo de aves."],
"Sistema excretor e homeostase":["Os rins filtram o sangue e formam a urina, eliminando excretas (como a ureia) e regulando a água e os sais do corpo. No néfron, o glomérulo realiza a filtração e os túbulos reabsorvem água, glicose e sais. O hormônio antidiurético (ADH) aumenta a reabsorção de água, tornando a urina mais concentrada e em menor volume.",["Filtração no glomérulo; reabsorção nos túbulos","ADH: ↑ reabsorção de água → urina concentrada","Ureia: principal excreta nitrogenada humana"],"Pouca água e muito suor → mais ADH → urina escura e em menor volume.","Em um dia muito quente, uma atleta perdeu muita água pelo suor e bebeu pouco líquido. No fim do dia, sua urina estava escura e em pequeno volume.","Essa alteração é explicada porque:",["a atleta deixou de filtrar o sangue, e os rins pararam de produzir urina.","a secreção de ADH diminuiu, aumentando a reabsorção de água nos túbulos.","o glomérulo passou a reabsorver mais glicose, que escurece a urina.","o aumento da secreção de ADH elevou a reabsorção de água nos rins, produzindo urina mais concentrada e em menor volume.","a ureia deixou de ser produzida, e a urina concentrou outros pigmentos."],3,"D: a desidratação aumenta o ADH, que eleva a reabsorção de água e reduz o volume urinário. A contraria o texto: houve urina, ainda que pouca. B é contraditória: menos ADH reduziria a reabsorção de água. C erra: a reabsorção de glicose ocorre nos túbulos e não explica a cor. E é falsa: a ureia continua sendo produzida e excretada."],
"Reprodução das angiospermas":["A flor é o órgão reprodutivo das angiospermas. O grão de pólen, formado nas anteras, é levado ao estigma (polinização) pelo vento, por insetos, aves ou morcegos. Ocorre dupla fecundação: um gameta masculino forma o zigoto e o outro, o endosperma. Normalmente, o ovário se desenvolve em fruto e o óvulo, em semente.",["Polinização: pólen da antera → estigma","Fecundação: zigoto + endosperma (dupla)","Ovário → fruto; óvulo → semente"],"Fruto vem do ovário, geralmente após a fecundação; semente vem do óvulo.","Em uma plantação de maracujá, a produtividade caiu depois que o uso de inseticidas reduziu a população de abelhas mamangavas na região. As flores continuaram abrindo normalmente, mas muitos frutos não se formaram.","A queda na produção de frutos ocorreu porque:",["as abelhas produzem o óvulo das flores, e sem elas não há sementes.","as abelhas são polinizadoras: sem a transferência do pólen ao estigma não ocorre fecundação, e muitos frutos não se formam.","as abelhas fazem fotossíntese nas flores, fornecendo alimento aos frutos.","as abelhas transformam o endosperma em fruto ao visitá-lo.","o inseticida impede a formação das anteras, e por isso as flores não abrem."],1,"B: as abelhas transferem o pólen das anteras ao estigma; sem polinização não há fecundação e o ovário não se desenvolve em fruto. A é falsa: o óvulo é formado pela flor. C é falsa: abelhas não fazem fotossíntese. D é falsa: abelhas não transformam o endosperma em fruto. E contraria o texto, que diz que as flores continuaram abrindo."],
"Aves e adaptações ao voo":["As aves têm adaptações ao voo: penas, ossos leves e com cavidades de ar (pneumáticos), esterno com quilha onde se prendem os músculos peitorais potentes, bico sem dentes e metabolismo elevado, pois são endotérmicas (mantêm a temperatura corporal constante). Os sacos aéreos ligados aos pulmões tornam a ventilação mais eficiente. Põem ovos com casca e têm fecundação interna.",["Ossos pneumáticos e bico sem dentes → corpo mais leve","Quilha no esterno → músculos peitorais do voo","Endotermia: temperatura constante e alto gasto de energia"],"Adaptação ao voo = menos massa + músculos fortes + muita oferta de O<sub>2</sub> e energia.","Um biólogo compara o esqueleto de um pombo e o de um rato de tamanho semelhante. O pombo tem ossos leves, com cavidades de ar, e um osso peitoral com uma crista proeminente; o rato não tem essas características.","Essas características do pombo estão relacionadas ao voo porque:",["reduzem a massa do corpo e oferecem ampla área para fixação dos músculos que movem as asas.","aumentam o peso do corpo, o que facilita a sustentação no ar.","armazenam água, que é eliminada durante o voo para reduzir o peso.","substituem os músculos peitorais, que são pequenos nas aves.","protegem os ovos durante o voo."],0,"A: ossos pneumáticos diminuem a massa, e a quilha fornece área para os músculos peitorais. B inverte a lógica: o voo exige menos peso. C é falsa: as cavidades contêm ar, não água. D é falsa: os músculos peitorais são grandes nas aves. E não tem relação com as estruturas descritas."],
"Ciclo celular e câncer":["O ciclo celular tem interfase (G1, S, em que o DNA é duplicado, e G2) e divisão (mitose). Pontos de checagem verificam danos ao DNA e impedem a divisão de células alteradas. O câncer envolve mutações em genes que controlam o ciclo (como supressores de tumor e genes que estimulam a divisão), levando à multiplicação descontrolada de células. Fatores como radiação ultravioleta e componentes do tabaco aumentam o risco de mutações.",["Interfase: G1, S (duplicação do DNA), G2; depois mitose","Pontos de checagem: bloqueiam a divisão se há dano","Câncer: mutações em genes de controle → divisão descontrolada"],"A duplicação do DNA ocorre no período S da interfase, antes da mitose.","Uma célula da pele sofreu danos no DNA por exposição excessiva à radiação ultravioleta. Normalmente, os pontos de checagem do ciclo celular detectam o dano e interrompem a divisão até o reparo ou induzem a morte da célula. Em um tumor, porém, esses controles estão alterados por mutações.","A multiplicação descontrolada das células do tumor ocorre porque:",["as células do tumor deixam de duplicar o DNA e se dividem sem material genético.","mutações em genes que controlam o ciclo celular fazem as células ignorar os pontos de checagem e continuar se dividindo.","a radiação ultravioleta transforma o DNA em RNA, que se multiplica sozinho.","as células tumorais realizam meiose continuamente, o que aumenta seu número.","os pontos de checagem estimulam a divisão celular sempre que há dano no DNA."],1,"B: mutações nos genes de controle desativam a checagem e mantêm a divisão. A é falsa: a divisão exige duplicação do DNA. C é falsa: a radiação não converte DNA em RNA. D é falsa: a multiplicação de células somáticas ocorre por mitose. E inverte a função dos pontos de checagem, que bloqueiam a divisão em caso de dano."],
"Mutações e alterações cromossômicas":["Mutações são alterações no material genético, que podem ser transmitidas se ocorrerem em células germinativas. As gênicas alteram a sequência de bases do DNA; as cromossômicas alteram a estrutura ou o número de cromossomos. Na síndrome de Down, em geral há três cópias do cromossomo 21 (trissomia), por não disjunção dos cromossomos na formação dos gametas, e o cariótipo tem 47 cromossomos.",["Mutação gênica: alteração de bases do DNA","Trissomia: 2n + 1 (ex.: 47 cromossomos)","Mutação em célula germinativa é herdável; somática, não"],"Na espécie humana, 2n = 46; trissomia do 21 → 47 cromossomos.","Em um exame de cariótipo de uma criança, observou-se um total de 47 cromossomos, com três cópias do cromossomo 21. Os pais têm 46 cromossomos cada.","A alteração observada na criança é explicada por:",["uma mutação gênica de troca de uma base no cromossomo 21, que aumenta o número de cromossomos.","uma alteração somática ocorrida depois do nascimento, que se transmite aos filhos.","um erro na separação dos cromossomos 21 (não disjunção) na formação de um dos gametas dos pais, resultando em uma cópia extra.","a fecundação de um óvulo por dois espermatozoides normais, o que gera um cromossomo extra.","a perda de um cromossomo 21 no zigoto, que reduz o número para 45."],2,"C: a não disjunção produz um gameta com 24 cromossomos (duas cópias do 21); com o gameta normal (23), o zigoto tem 47. A é falsa: troca de base não altera o número de cromossomos. B é falsa: a trissomia já estava presente desde o zigoto. D geraria triploidia (69), não 47. E reduziria o total para 45, contrariando o enunciado."],
"Evolução humana":["Os seres humanos modernos (<i>Homo sapiens</i>) e os demais primatas compartilham ancestrais; humanos e chimpanzés não descendem um do outro, mas de um ancestral comum. A linhagem humana inclui <i>Australopithecus</i> (bípedes, cérebro pequeno) e <i>Homo</i> (cérebro maior, uso de ferramentas). O bipedalismo antecedeu o grande aumento do cérebro. A evolução humana não é linear: várias espécies de hominíneos coexistiram.",["Humanos e chimpanzés: ancestral comum, não descendência direta","Bipedalismo antecede o grande aumento do cérebro","Evolução ramificada, não linear"],"Desconfie de “o homem veio do macaco”: o correto é ancestral comum.","Fósseis de <i>Australopithecus afarensis</i>, com cerca de 3,2 milhões de anos, mostram bacia e membros inferiores adaptados à locomoção bípede, com volume cerebral pequeno, semelhante ao de chimpanzés.","Esses fósseis sustentam a hipótese de que, na linhagem humana:",["o aumento do cérebro antecedeu o bipedalismo.","os humanos modernos descendem diretamente dos chimpanzés atuais.","a evolução foi linear, com uma única espécie em cada período.","o bipedalismo surgiu antes do grande aumento do volume cerebral.","o grande volume cerebral já existia no gênero <i>Australopithecus</i>."],3,"D: os fósseis mostram bipedalismo com cérebro ainda pequeno. A inverte a ordem. B é falsa: humanos e chimpanzés têm ancestral comum. C é falsa: várias espécies de hominíneos coexistiram. E contraria o texto, que descreve cérebro pequeno."],
"Protozoários e protozooses":["Protozoários são eucariontes unicelulares. A malária é causada por <i>Plasmodium</i> e transmitida pela picada da fêmea do mosquito <i>Anopheles</i>; a doença de Chagas, causada por <i>Trypanosoma cruzi</i>, é transmitida pelas fezes do barbeiro, eliminadas perto do local da picada, além de alimentos contaminados e transfusão; a amebíase e a giardíase são transmitidas por água e alimentos contaminados com cistos. O controle envolve combater vetores, melhorar moradias e fazer saneamento.",["Malária: <i>Plasmodium</i> / mosquito <i>Anopheles</i>","Chagas: <i>Trypanosoma cruzi</i> / barbeiro","Amebíase e giardíase: cistos em água e alimentos"],"Na doença de Chagas, o barbeiro não injeta o parasito: as fezes entram pela pele lesionada ou por mucosas.","Em uma região rural, casas de pau a pique com frestas nas paredes abrigavam grande população de barbeiros, e vários moradores desenvolveram doença de Chagas.","Qual medida atua mais diretamente sobre a transmissão da doença nessa região?",["Tratar a água de beber com cloro, já que a transmissão ocorre pela ingestão de cistos.","Eliminar criadouros de água parada, que abrigam as larvas do vetor.","Usar antibióticos nos moradores para eliminar o vírus transmitido pelos barbeiros.","Vacinar os moradores contra a malária.","Melhorar as moradias, vedando frestas, e combater os barbeiros, que abrigam o protozoário e o eliminam nas fezes."],4,"E: o barbeiro abriga <i>T. cruzi</i> e o elimina nas fezes; casas sem frestas reduzem o contato com o vetor. A descreve a via das amebas e giárdias. B descreve o controle de mosquitos. C erra: o agente é um protozoário, não um vírus. D erra: a vacina contra malária não protege contra a doença de Chagas."],
"PCR e amplificação de DNA":["A PCR (reação em cadeia da polimerase) amplifica um trecho específico de DNA em ciclos repetidos de desnaturação (separação das fitas por aquecimento), anelamento dos primers e extensão pela DNA-polimerase termoestável. A cada ciclo, o número de cópias do trecho dobra; após n ciclos há N × 2<sup>n</sup> cópias, em condições ideais. É usada em diagnóstico, perícia e testes de paternidade.",["Ciclo: desnaturação → anelamento → extensão","Cópias após n ciclos: N × 2<sup>n</sup> (condições ideais)","DNA-polimerase termoestável (resiste ao calor)"],"Cada ciclo dobra as moléculas: 10 ciclos multiplicam por 1 024.","Um laboratório de perícia recuperou uma amostra com apenas 100 moléculas de um trecho de DNA humano. Para analisá-lo, aplicou-se uma PCR de 10 ciclos, com eficiência de 100% (o número de moléculas dobra em cada ciclo).","Ao final da reação, o número de cópias do trecho é de:",["1 000","2 000","102 400","10 000","200"],2,"100 × 2<sup>10</sup> = 100 × 1 024 = 102 400 (C). A (1 000) soma o número de ciclos como se fosse multiplicação; B (2 000) multiplica por 2 dez vezes sem acumular; D (10 000) multiplica por 100; E (200) considera apenas um ciclo."],
"Fontes de energia e impactos ambientais":["Fontes renováveis (solar, eólica, hídrica, biomassa) se repõem na escala de tempo humana; combustíveis fósseis (petróleo, carvão, gás natural) são finitos e emitem CO<sub>2</sub> ao serem queimados. Toda fonte tem impactos: hidrelétricas alagam áreas e alteram ecossistemas aquáticos; biocombustíveis podem ocupar terras agrícolas; solar e eólica emitem pouco CO<sub>2</sub> na operação.",["Renováveis: solar, eólica, hídrica, biomassa","Fósseis: finitos e emitem CO<sub>2</sub> ao queimar","Toda fonte tem impactos: compare vantagens e desvantagens"],"Biocombustível não é “emissão zero”: o balanço de carbono é menor que o dos fósseis, mas há impactos de uso do solo.","Para ampliar a oferta de eletricidade, uma região discute três opções: uma usina termelétrica a carvão, parques eólicos e uma usina hidrelétrica com grande reservatório.","Qual afirmação compara corretamente os impactos das opções?",["A termelétrica emite CO<sub>2</sub> e poluentes ao queimar carvão; os parques eólicos emitem pouco CO<sub>2</sub> na operação, mas ocupam terreno e podem afetar aves; a hidrelétrica alaga áreas e altera ecossistemas aquáticos.","Os parques eólicos queimam combustível e emitem mais CO<sub>2</sub> que a termelétrica.","A hidrelétrica não causa impactos ambientais por usar a água, que é renovável.","O carvão é renovável, pois se forma continuamente em escala de anos.","A energia eólica depende de combustíveis fósseis para funcionar, e por isso é equivalente à termelétrica."],0,"A apresenta corretamente as vantagens e os impactos de cada opção. B é falsa: parques eólicos não queimam combustível. C é falsa: o reservatório alaga áreas e altera ecossistemas. D é falsa: o carvão é fóssil e leva milhões de anos para se formar. E é falsa: a eólica converte a energia do vento."],
"Nicho ecológico e habitat":["Habitat é o local onde uma espécie vive; nicho ecológico é o conjunto de recursos, condições e interações que a espécie usa e exerce (alimentação, horário de atividade, abrigo). Espécies com nichos muito semelhantes competem, e o princípio da exclusão competitiva prevê que, em condições estáveis, uma tende a excluir a outra ou a diferenciar seu nicho. Espécies distintas podem dividir um habitat com nichos diferentes.",["Habitat = onde vive; nicho = como vive e o que usa","Nichos muito sobrepostos → competição","Exclusão competitiva ou divisão de recursos"],"Habitat é o endereço; nicho é a função da espécie no ecossistema.","Em uma mesma árvore, duas espécies de aves insetívoras convivem: uma forrageia na copa e a outra, no tronco, e ambas se alimentam de insetos, mas de tamanhos diferentes.","A coexistência das duas espécies é explicada porque:",["elas ocupam habitats e nichos idênticos, o que elimina a competição.","elas compartilham o mesmo habitat, mas diferenciam seus nichos (local e tipo de presa), reduzindo a competição.","uma das espécies é parasita da outra, o que permite a convivência.","ambas possuem o mesmo nicho, pois comem insetos.","o habitat é o mesmo que o nicho, e por isso não há diferença entre elas."],1,"B: o habitat é compartilhado, mas as aves usam locais e presas diferentes, o que reduz a competição. A seria um caso de forte competição. C não é mencionada no texto. D ignora as diferenças de local e de presa. E confunde os conceitos de habitat e nicho."],
"Fecundação e gemelaridade":["Gêmeos monozigóticos (idênticos) originam-se de um único zigoto que se divide em dois embriões, portanto têm o mesmo genótipo e o mesmo sexo. Gêmeos dizigóticos (fraternos) originam-se de dois óvulos fecundados por dois espermatozoides diferentes e são geneticamente tão semelhantes quanto irmãos comuns, podendo ter sexos diferentes. A fecundação ocorre geralmente na tuba uterina.",["Monozigóticos: 1 zigoto; mesmo genótipo; mesmo sexo","Dizigóticos: 2 óvulos + 2 espermatozoides; genótipos diferentes","Fecundação: geralmente na tuba uterina"],"Gêmeos de sexos diferentes só podem ser dizigóticos.","Um casal teve gêmeos: um menino e uma menina.","Pode-se concluir que os gêmeos:",["são monozigóticos, pois nasceram ao mesmo tempo.","são monozigóticos, com o mesmo genótipo, e a diferença de sexo decorre do ambiente uterino.","são dizigóticos formados por um único óvulo fecundado por dois espermatozoides.","são dizigóticos, originados de dois óvulos fecundados por dois espermatozoides, e geneticamente tão semelhantes quanto irmãos comuns.","são idênticos, pois os dois são filhos do mesmo casal."],3,"D: sexos diferentes indicam dois zigotos, portanto dizigóticos. A e E confundem nascer juntos ou ter os mesmos pais com ser idêntico. B é falsa: monozigóticos têm o mesmo genótipo e o mesmo sexo. C é falsa: um óvulo fecundado por dois espermatozoides não gera dois embriões viáveis."],
"Hipótese endossimbiótica":["A hipótese endossimbiótica propõe que mitocôndrias e cloroplastos se originaram de bactérias ancestrais (aeróbias e fotossintetizantes) englobadas por células hospedeiras, passando a viver em simbiose. Evidências: essas organelas têm dupla membrana, DNA próprio e circular, ribossomos semelhantes aos bacterianos e se dividem de forma independente.",["Mitocôndria ← bactéria aeróbia; cloroplasto ← cianobactéria","Evidências: DNA próprio circular, ribossomos tipo bacteriano, dupla membrana","Duplicação independente da divisão celular"],"O DNA próprio da organela é a evidência mais citada nas questões.","Pesquisadores sequenciaram o DNA de mitocôndrias humanas e constataram que ele é circular, pequeno e semelhante, em organização, ao DNA de certas bactérias. Observaram ainda que as mitocôndrias se dividem por um processo semelhante à divisão bacteriana.","Esses resultados são interpretados como evidência de que:",["as mitocôndrias são vírus incorporados ao núcleo celular.","as bactérias atuais descendem das mitocôndrias humanas.","as mitocôndrias surgiram por mutações no DNA nuclear.","o DNA mitocondrial é cópia exata do DNA do núcleo.","as mitocôndrias descendem de bactérias aeróbias incorporadas por células ancestrais, que passaram a viver em simbiose com elas."],4,"E: DNA circular e divisão semelhante à bacteriana sustentam origem a partir de bactérias endossimbiontes. A é falsa: vírus não são citados. B inverte a relação de ancestralidade. C e D contrariam os dados: o DNA mitocondrial difere do nuclear e tem organização bacteriana."],
"Moluscos e anelídeos":["Moluscos (caramujos, lesmas, mexilhões, polvos) têm corpo mole, geralmente com manto e muitos com concha de carbonato de cálcio. Anelídeos (minhocas, sanguessugas) têm corpo segmentado em anéis (metameria); as minhocas aeram o solo ao cavar galerias e fragmentam matéria orgânica, favorecendo a fertilidade. Os dois grupos têm tubo digestório completo.",["Moluscos: corpo mole, manto, muitos com concha de CaCO<sub>3</sub>","Anelídeos: corpo segmentado em anéis (metameria)","Minhocas: aeram e enriquecem o solo","Esquistossomose: o caramujo é hospedeiro intermediário"],"Segmentação em anéis → anelídeo; corpo mole e concha calcária → molusco.","Um agricultor observou que, em áreas com muitas minhocas, a terra era mais solta e fértil. Ao examinar uma minhoca, notou que seu corpo é dividido em anéis semelhantes. Em outra área, havia caramujos com concha rígida e corpo mole.","Qual afirmação classifica e explica corretamente as observações?",["A minhoca é anelídeo (corpo em anéis), cava galerias que aeram o solo e fragmenta matéria orgânica; o caramujo é molusco, com corpo mole protegido por concha calcária.","A minhoca é molusco, e o caramujo é anelídeo, pois os dois têm corpo mole.","A minhoca e o caramujo são artrópodes, pois têm exoesqueleto de quitina.","A minhoca é nematelminto, de corpo cilíndrico não segmentado, e o caramujo é equinodermo.","A minhoca é platelminto, de corpo achatado, e piora a aeração do solo ao escavar."],0,"A: o corpo em anéis caracteriza os anelídeos, e as galerias das minhocas aeram o solo; o caramujo tem corpo mole e concha calcária, típicos dos moluscos. B inverte os grupos. C erra: nenhum dos dois tem exoesqueleto de quitina. D erra: a minhoca tem corpo segmentado e o caramujo não é equinodermo. E erra: a minhoca não é achatada e a escavação melhora a aeração."],
"Fotoperiodismo":["Fotoperiodismo é a resposta das plantas à duração relativa do dia e da noite, sobretudo no controle da floração. Plantas de dia curto florescem quando a noite é mais longa que um valor crítico; plantas de dia longo, quando a noite é mais curta. O que a planta mede é a duração contínua do escuro. Uma breve iluminação no meio da noite pode impedir a floração de plantas de dia curto.",["Planta de dia curto: floresce com noites longas","Planta de dia longo: floresce com noites curtas","A planta mede a duração contínua da noite","Luz no meio da noite inibe a floração de plantas de dia curto"],"O fator decisivo é o comprimento da noite, não o do dia.","Um produtor cultiva crisântemos, que florescem com noites longas. Em uma estufa, ele acendeu lâmpadas por alguns minutos no meio da noite, durante o outono, e observou que as plantas não floresceram, embora o número total de horas de luz do dia fosse pequeno.","A ausência de floração é explicada porque:",["o crisântemo é planta de dia longo, e a luz noturna diminuiu a duração do dia.","o crisântemo é planta de dia curto, e a interrupção da noite pela luz impediu o período contínuo de escuro necessário à floração.","a luz noturna aumentou a temperatura da estufa, o que impede a floração de qualquer planta.","a luz noturna estimulou a produção de etileno, que amadurece as flores antes da abertura.","o crisântemo não responde à duração da noite, e a falta de floração foi por acaso."],1,"B: o crisântemo floresce com noites longas (dia curto), e a luz no meio da noite interrompeu o período contínuo de escuro. A erra a classificação: o texto diz que ele floresce com noites longas. C generaliza de forma incorreta. D atribui ao etileno um efeito sem relação com o texto. E contraria o experimento, que mostra efeito da luz noturna."],
"Sistema sensorial: visão":["Na retina, os bastonetes funcionam com pouca luz (visão sem cores) e os cones, com boa iluminação, e são responsáveis pela visão de cores. A luz atravessa a córnea, o humor aquoso, o cristalino e o humor vítreo até a retina. A íris regula a abertura da pupila: com muita luz, ela se contrai; com pouca, se dilata. O cristalino muda de curvatura para focalizar objetos a diferentes distâncias (acomodação). Na miopia, a imagem se forma antes da retina.",["Cones: cores e luz intensa; bastonetes: pouca luz, sem cores","Pupila: contrai com muita luz, dilata com pouca","Miopia: imagem antes da retina; hipermetropia: depois da retina","Acomodação: o cristalino muda de curvatura"],"No escuro vemos sem cores porque só os bastonetes funcionam bem.","Ao entrar em um cinema escuro, uma pessoa inicialmente enxerga pouco, mas, depois de alguns minutos, passa a distinguir as poltronas, embora sem perceber bem as cores. Ao sair para a rua ensolarada, ela fecha os olhos de início e, depois, sua pupila fica pequena.","Qual explicação descreve corretamente esses fenômenos?",["No escuro, os cones assumem a visão e percebem melhor as cores; ao sol, a pupila se dilata para entrar mais luz.","No escuro, a pupila se contrai e os bastonetes deixam de funcionar; ao sol, os cones deixam de funcionar.","No escuro, a pupila se dilata e os bastonetes, sensíveis a pouca luz, permitem enxergar sem cores; ao sol, a pupila se contrai, reduzindo a entrada de luz.","O cristalino muda de cor no escuro e no sol, o que explica as diferenças.","A íris produz as imagens no escuro, e a córnea, ao sol."],2,"C: no escuro a pupila se dilata e os bastonetes dominam, sem percepção de cores; ao sol, a pupila se contrai. A inverte o papel dos cones e a resposta da pupila. B inverte a resposta da pupila e as funções dos fotorreceptores. D e E atribuem funções sem base: o cristalino focaliza e a imagem se forma na retina."],
"Ligação gênica e recombinação":["Genes no mesmo cromossomo tendem a ser herdados juntos (ligação gênica). O crossing-over na prófase I pode separá-los e originar gametas recombinantes. A frequência de recombinação (FR) é o número de recombinantes dividido pelo total de descendentes e é proporcional à distância entre os genes: 1% de recombinação equivale a 1 unidade de mapa. No cruzamento-teste, a proporção de cada classe revela os gametas do duplo-heterozigoto.",["FR (%) = recombinantes ÷ total × 100","1% de FR = 1 unidade de mapa","Maior distância → maior FR (máximo de 50%)","Classes mais numerosas = parentais"],"Os gametas mais frequentes são os parentais; os menos frequentes, os recombinantes.","Em um cruzamento-teste entre um indivíduo duplo-heterozigoto AaBb, com genes ligados no arranjo AB/ab, e um duplo-recessivo ab/ab, foram obtidos 1 000 descendentes: 440 AB, 440 ab, 60 Ab e 60 aB.","A frequência de recombinação entre os genes A e B é de:",["6%","44%","88%","12%","24%"],3,"Parentais: AB (440) e ab (440). Recombinantes: Ab (60) e aB (60). FR = (60 + 60) / 1 000 = 12% (D). A (6%) usa só uma classe recombinante; B (44%) é a fração de uma classe parental; C (88%) é a fração dos parentais; E (24%) dobra o valor correto."],
"Fungos":["Fungos são eucariontes heterótrofos com parede celular de quitina; absorvem nutrientes após a digestão extracorpórea por enzimas. Podem ser decompositores (reciclam matéria orgânica), parasitas (como os que causam micoses) ou formar associações mutualísticas (liquens e micorrizas). Leveduras fermentam açúcares, produzindo etanol e CO<sub>2</sub>, usados em pães, cervejas e etanol combustível.",["Parede de quitina; heterótrofos por absorção","Decompositores: reciclam nutrientes","Micorrizas e liquens: mutualismo","Levedura: fermentação → etanol + CO<sub>2</sub>"],"A massa de pão cresce pelo CO<sub>2</sub> da fermentação das leveduras.","Uma padeira misturou fermento biológico (leveduras), farinha, água e açúcar e deixou a massa descansar em local morno. Após uma hora, o volume da massa aumentou muito, e ela passou a ter leve cheiro de álcool.","O aumento de volume da massa se deve:",["à fotossíntese das leveduras, que produz O<sub>2</sub> a partir da luz.","à reprodução de bactérias, que liberam gás nitrogênio.","à absorção de água pelo amido, que incha sem produzir gases.","ao crescimento das hifas, que ocupam todo o espaço da massa sem liberar gases.","à fermentação dos açúcares pelas leveduras, que libera CO<sub>2</sub>, retido na massa, e etanol."],4,"E: as leveduras fermentam os açúcares e liberam CO<sub>2</sub> (que expande a massa) e etanol (cheiro alcoólico). A é falsa: leveduras são fungos e não fazem fotossíntese. B é falsa: o agente é o fermento, de leveduras. C ignora a produção de gás e o cheiro de álcool. D ignora os produtos da fermentação."],
"Fases do desenvolvimento embrionário":["Após a fecundação, o zigoto sofre clivagens (mitoses sem aumento do tamanho total), formando a mórula (massa maciça de células) e depois a blástula (esfera com cavidade). Na gastrulação, formam-se os folhetos embrionários e o arquêntero (futuro tubo digestório); na neurulação, forma-se o tubo neural, que origina o sistema nervoso. Nos mamíferos placentários, a blástula (blastocisto) se implanta no endométrio.",["Zigoto → mórula → blástula → gástrula → nêurula","Clivagens: mitoses sem crescimento","Gástrula: folhetos e arquêntero","Nêurula: tubo neural"],"Ordem: mórula (maciça) → blástula (oca) → gástrula (folhetos).","Um estudante recebeu quatro imagens de embriões em fases diferentes: (1) esfera maciça de células; (2) esfera com cavidade interna cheia de líquido; (3) embrião com três folhetos e uma abertura que forma o tubo digestório; (4) embrião com um tubo dorsal que dará origem ao sistema nervoso.","A ordem cronológica correta de desenvolvimento dessas fases é:",["1, 2, 3, 4.","2, 1, 3, 4.","1, 3, 2, 4.","4, 3, 2, 1.","3, 1, 2, 4."],0,"(1) é a mórula; (2), a blástula; (3), a gástrula; (4), a nêurula; logo, 1, 2, 3, 4 (A). B inverte mórula e blástula; C coloca a gastrulação antes da blástula; D inverte toda a ordem; E coloca a gástrula antes das fases iniciais."],
"Vacinas e imunização coletiva":["Vacinas apresentam ao sistema imune antígenos que estimulam resposta e memória sem causar a doença: agentes inativados ou atenuados, partes do agente (subunidades) ou ácidos nucleicos, como o RNA mensageiro, que levam as células a produzir temporariamente o antígeno sem alterar o DNA. Quando uma alta proporção da população é imune, a circulação do agente diminui e protege também quem não pode ser vacinado (imunidade coletiva). Vacinas previnem; não tratam a doença instalada.",["Atenuada: agente vivo enfraquecido; inativada: agente morto","RNA mensageiro: instrução temporária, sem integração ao DNA","Imunidade coletiva protege quem não pode ser vacinado"],"Vacina previne; soro age sobre o que já está no corpo.","Uma cidade registrou, em poucos anos, queda da cobertura vacinal contra o sarampo de 95% para 70%. Depois surgiu um surto da doença, atingindo principalmente crianças não vacinadas e pessoas com defesas reduzidas, que não podem ser vacinadas.","O surto está relacionado:",["à vacina contra o sarampo, que passou a causar a doença em pessoas vacinadas.","à queda da proporção de imunes na população, que facilitou a circulação do vírus e reduziu a proteção coletiva, inclusive de quem não pode ser vacinado.","à mutação do vírus provocada pela vacina, que o tornou mais transmissível.","ao aumento de bactérias resistentes, já que o sarampo é bacteriano.","à imunidade passiva dos vacinados, que desaparece em dias e exige soro."],1,"B: com menos imunes, o vírus circula mais e a proteção coletiva diminui, afetando também quem não pode se vacinar. A e C atribuem à vacina efeitos sem base. D erra: o sarampo é viral. E erra: a vacina induz imunidade ativa, com memória."],
"Poluição da água e tratamento de esgoto":["O esgoto doméstico sem tratamento contamina rios com matéria orgânica, nutrientes e microrganismos patogênicos. A matéria orgânica é decomposta por microrganismos aeróbios, que consomem o O<sub>2</sub> dissolvido; a DBO (demanda bioquímica de oxigênio) indica a quantidade de matéria orgânica biodegradável. O tratamento de esgoto remove sólidos, decompõe a matéria orgânica com microrganismos e reduz os patógenos.",["Esgoto sem tratamento → matéria orgânica + patógenos","DBO alta = muita matéria orgânica biodegradável","Decomposição aeróbia consome O<sub>2</sub>","Tratamento: remove sólidos, degrada matéria orgânica e reduz patógenos"],"Rio poluído por esgoto: pouco O<sub>2</sub> dissolvido e DBO alta.","Dois rios foram comparados: o rio X recebe esgoto sem tratamento de uma cidade, e o rio Y recebe esgoto tratado. No rio X, a concentração de oxigênio dissolvido é muito baixa e a DBO é alta.","Esses resultados indicam que, no rio X:",["a falta de matéria orgânica reduz a vida aquática e o oxigênio.","o excesso de oxigênio produzido por algas elevou a DBO.","a grande quantidade de matéria orgânica é decomposta por microrganismos aeróbios, que consomem o oxigênio dissolvido, prejudicando peixes e outros organismos.","o tratamento de esgoto aumentou a DBO e reduziu o oxigênio.","a água tem alto teor de oxigênio e baixa matéria orgânica."],2,"C: DBO alta indica muita matéria orgânica, e sua decomposição aeróbia consome o oxigênio dissolvido. A contraria a DBO alta. B contraria o oxigênio baixo. D contraria o texto: o rio X recebe esgoto sem tratamento. E contraria os dados."],
"Filogenia e cladogramas":["Cladogramas representam relações de parentesco evolutivo: cada nó é um ancestral comum, e grupos que compartilham um ancestral comum mais recente são mais próximos entre si. A leitura é pela proximidade dos ramos, não pela ordem em que as espécies aparecem nas pontas. Um grupo monofilético inclui um ancestral e todos os seus descendentes.",["Nó = ancestral comum","Mais próximos = ancestral comum mais recente","A ordem das pontas pode girar sem mudar o parentesco","Monofilético: ancestral + todos os descendentes"],"Gire os ramos em torno de um nó: o parentesco não muda; só importa o ancestral comum.","Um cladograma foi descrito em notação de parênteses: (peixe-pulmonado, (sapo, (lagarto, ser humano))). Cada par de parênteses representa um ancestral comum dos grupos que ele contém.","De acordo com o cladograma, é correto afirmar que:",["o sapo é mais próximo do ser humano que o lagarto.","o peixe-pulmonado é mais próximo do lagarto que do sapo.","o ser humano descende do lagarto atual.","o lagarto e o ser humano compartilham um ancestral comum mais recente do que o compartilhado com o sapo.","o sapo e o peixe-pulmonado formam o grupo mais próximo ao ser humano."],3,"D: lagarto e ser humano estão no par de parênteses mais interno, ou seja, têm o ancestral comum mais recente. A e E invertem a proximidade. B erra: o peixe-pulmonado é o ramo mais distante de todos. C erra: um cladograma indica ancestral comum, não descendência entre espécies atuais."],
"Sistema locomotor e contração muscular":["O sistema locomotor é formado por ossos, articulações e músculos esqueléticos. Os músculos esqueléticos (estriados, de contração voluntária) movem os ossos, aos quais se ligam por tendões, e atuam em pares antagônicos, como bíceps e tríceps. A contração ocorre pelo deslizamento dos filamentos de actina e miosina, com gasto de ATP e participação de íons cálcio. Em esforço intenso e com pouco O<sub>2</sub>, a célula muscular pode produzir ATP por fermentação láctica.",["Músculo esquelético: estriado, voluntário","Tendão: une músculo a osso; ligamento: une osso a osso","Pares antagônicos: um contrai, o outro relaxa","Contração: actina e miosina; usa ATP e Ca<sup>2+</sup>"],"Quando o flexor se contrai, o extensor (antagonista) relaxa.","Para dobrar o braço, o bíceps se contrai e o antebraço se aproxima do braço. Ao esticar o braço, o tríceps se contrai.","Sobre o movimento descrito, é correto afirmar que:",["o bíceps e o tríceps se contraem ao mesmo tempo, em qualquer movimento do cotovelo.","os músculos se ligam aos ossos por ligamentos, que se contraem para gerar o movimento.","o movimento depende da contração de músculos lisos, que são voluntários.","os músculos produzem movimento sem gasto de energia, pois apenas relaxam e se estiram.","o bíceps e o tríceps atuam como músculos antagônicos: enquanto um se contrai, o outro relaxa, e a contração usa ATP e envolve actina e miosina."],4,"E: bíceps e tríceps são antagônicos, e a contração depende de ATP e dos filamentos de actina e miosina. A contraria o movimento descrito, em que cada músculo se contrai em um momento. B erra: músculos se ligam a ossos por tendões, e ligamentos unem ossos. C erra: músculos lisos são involuntários. D erra: a contração consome ATP."],
"Peixes e adaptações à vida aquática":["Os peixes respiram por brânquias, onde o sangue troca gases com a água. As lamelas branquiais são muito vascularizadas, e o sangue flui em sentido oposto ao da água (contracorrente), o que aumenta a eficiência da absorção de O<sub>2</sub>. Têm coração com duas cavidades (um átrio e um ventrículo) e circulação simples: o sangue passa uma vez pelo coração em cada volta. A bexiga natatória dos peixes ósseos auxilia o controle da flutuação.",["Respiração branquial; fluxo em contracorrente","Circulação simples: coração com 1 átrio e 1 ventrículo","Bexiga natatória: flutuação (peixes ósseos)"],"Coração de peixe: 2 cavidades; de anfíbio: 3; de mamífero: 4.","A água de um lago tem concentração de O<sub>2</sub> dissolvido bem menor que o ar. Mesmo assim, peixes conseguem obter O<sub>2</sub> suficiente. Observou-se que, nas brânquias, a água passa em sentido oposto ao do sangue nas lamelas.","Esse arranjo em sentidos opostos favorece a respiração porque:",["faz o sangue sempre ter mais O<sub>2</sub> que a água, impedindo a entrada de gás.","mantém um gradiente de concentração de O<sub>2</sub> entre a água e o sangue ao longo de toda a lamela, aumentando a absorção do gás.","impede que o CO<sub>2</sub> seja eliminado pelas brânquias.","faz a água parar nas brânquias, aumentando seu aquecimento.","elimina a necessidade de o sangue circular pelo corpo."],1,"B: o fluxo em contracorrente mantém a água sempre com mais O<sub>2</sub> que o sangue adjacente, e o gás continua se difundindo ao longo de toda a lamela. A inverte o efeito: o arranjo favorece a entrada de O<sub>2</sub>. C é falsa: o CO<sub>2</sub> também é eliminado pelas brânquias. D e E não têm relação com o arranjo descrito."],
"Cnidários e poríferos":["Poríferos (esponjas) são animais aquáticos sésseis, sem tecidos verdadeiros, que filtram a água por poros e se alimentam de partículas, com ajuda de células chamadas coanócitos. Cnidários (águas-vivas, anêmonas e corais) têm tecidos, simetria radial e cnidócitos (células urticantes). Os corais vivem em mutualismo com algas (zooxantelas) que fazem fotossíntese e fornecem compostos orgânicos; o estresse, como o aquecimento da água, leva o coral a expulsar as algas (branqueamento).",["Poríferos: sem tecidos verdadeiros; filtradores (coanócitos)","Cnidários: simetria radial; cnidócitos","Corais + zooxantelas: mutualismo","Branqueamento: expulsão das algas por estresse"],"O branqueamento é a perda das algas simbiontes, não a morte imediata do coral.","Em um recife de coral, após um período de águas anormalmente quentes, os corais ficaram esbranquiçados. Pesquisadores observaram que os pólipos expulsaram as algas que viviam em seus tecidos.","O branqueamento prejudica os corais porque:",["as algas expulsas passam a se alimentar dos pólipos, que ficam esbranquiçados.","o coral é um porífero que filtra a água, e a água quente reduz a filtração.","os corais dependem, em grande parte, dos compostos orgânicos produzidos pela fotossíntese das algas, e sem elas ficam enfraquecidos e mais sujeitos à morte.","os corais são vegetais, e o branqueamento é a perda de clorofila por falta de luz.","as algas se transformam em cnidócitos que liberam toxinas contra o coral."],2,"C: o coral recebe compostos orgânicos das algas simbiontes, e a perda delas o enfraquece. A contraria o texto: as algas foram expulsas. B erra: o coral é cnidário. D erra: corais são animais. E é falsa: cnidócitos são células do próprio animal."],
"Tecidos vegetais":["Os tecidos vegetais dividem-se em meristemáticos (células que se dividem: meristemas apicais, que alongam raiz e caule, e laterais, que engrossam) e permanentes. Entre os permanentes estão a epiderme (revestimento, com estômatos), os parênquimas (preenchimento, reserva e fotossíntese), o colênquima e o esclerênquima (sustentação) e os condutores (xilema e floema).",["Meristemas: divisão celular (crescimento)","Parênquima clorofiliano: fotossíntese","Colênquima e esclerênquima: sustentação","Xilema: seiva bruta; floema: seiva elaborada"],"Crescimento em comprimento: meristema apical; em espessura: meristema lateral (câmbio).","Em uma árvore, o tronco aumenta de diâmetro ao longo dos anos, formando anéis de crescimento visíveis em corte transversal. Os anéis resultam da atividade de um tecido que produz xilema novo a cada estação de crescimento.","O aumento de diâmetro do tronco ocorre pela atividade:",["do meristema apical, que forma as folhas.","do parênquima de reserva, que se divide continuamente.","do esclerênquima, que produz novas células por mitose.","do câmbio (meristema lateral), que produz xilema e floema novos e aumenta a espessura.","da epiderme, que acumula camadas de células mortas a cada ano."],3,"D: o câmbio é um meristema lateral e produz novo xilema e floema, o que aumenta o diâmetro e forma os anéis. A erra: o meristema apical aumenta o comprimento. B e C erram: parênquima de reserva e esclerênquima são tecidos permanentes, com pouca ou nenhuma divisão. E erra: a epiderme não forma os anéis."],
"Membrana plasmática e transporte ativo":["A membrana plasmática é formada por uma bicamada de fosfolipídios com proteínas (modelo do mosaico fluido) e é seletivamente permeável: gases como O<sub>2</sub> e CO<sub>2</sub> atravessam a bicamada por difusão simples; íons e moléculas polares dependem de proteínas transportadoras ou canais (difusão facilitada e transporte ativo). No transporte ativo, a substância é movida contra o gradiente, com gasto de energia metabólica (ATP). Na endocitose e na exocitose, vesículas transportam partículas grandes.",["Bicamada de fosfolipídios + proteínas (mosaico fluido)","Gases e moléculas apolares: difusão simples","Íons e moléculas polares: proteínas de membrana","Transporte ativo: contra o gradiente, com gasto de energia"],"Se a substância passa de onde há menos para onde há mais, com gasto de energia, é transporte ativo.","Uma célula do intestino mantém dentro dela uma concentração de glicose maior do que a do meio externo e, ainda assim, absorve mais glicose do lúmen intestinal. Verificou-se que, ao bloquear a produção de ATP, essa absorção contra o gradiente cessa.","Esse resultado indica que a absorção de glicose contra o gradiente ocorre por:",["difusão simples pela bicamada lipídica, a favor do gradiente.","osmose, pois a glicose é uma molécula de água.","difusão facilitada, que ocorre sem gasto de energia.","fagocitose, em que a célula engloba a glicose com pseudópodes.","transporte ativo, realizado por proteínas de membrana e dependente de energia do metabolismo (ATP), que move a glicose contra o gradiente."],4,"E: o movimento contra o gradiente e a dependência de ATP caracterizam o transporte ativo. A e C são processos a favor do gradiente e não dependem de ATP. B erra: osmose se refere à água. D erra: fagocitose é a ingestão de partículas grandes, não de uma molécula pequena como a glicose."],
"Gravidez, placenta e parto":["Após a implantação do embrião no endométrio, forma-se a placenta, que permite trocas de gases, nutrientes e excretas entre mãe e feto sem mistura direta do sangue. A placenta também produz hormônios, como a progesterona e o hCG, que mantém o corpo lúteo no início da gestação. No parto, a ocitocina estimula as contrações do útero; depois, a prolactina estimula a produção de leite e a ocitocina, sua ejeção. O leite materno fornece nutrientes e anticorpos.",["Placenta: trocas mãe-feto sem mistura de sangue","hCG mantém o corpo lúteo no início; progesterona mantém o endométrio","Ocitocina: contrações e ejeção do leite; prolactina: produção de leite"],"Anticorpos que passam pela placenta e pelo leite dão ao bebê imunidade passiva natural.","Durante a gestação, o sangue da mãe e o do feto circulam próximos na placenta, separados por membranas finas. Nutrientes e O<sub>2</sub> passam da mãe para o feto, e CO<sub>2</sub> e excretas, do feto para a mãe.","Essa organização permite as trocas porque:",["as substâncias se difundem pelas membranas da placenta sem que haja mistura direta entre o sangue materno e o fetal.","o sangue da mãe passa diretamente para as artérias do feto pelo cordão umbilical.","a placenta produz sangue novo, que substitui o do feto a cada hora.","o feto respira pelos pulmões, que recebem O<sub>2</sub> do líquido amniótico.","os nutrientes entram no feto pela boca, pois o líquido amniótico é digerido no estômago do feto."],0,"A: as trocas ocorrem por difusão e transporte através das membranas da placenta, sem mistura direta de sangue. B contraria o texto, que fala em sangue separado por membranas. C é falsa: a placenta não produz sangue para substituir o do feto. D é falsa: os pulmões do feto não realizam trocas gasosas. E é falsa: o feto recebe nutrientes pela placenta."],
"Resposta imune: anticorpos e linfócitos":["Na resposta imune adaptativa, os linfócitos B, ao reconhecerem um antígeno, originam plasmócitos, que secretam anticorpos específicos, e células de memória. Linfócitos T auxiliares coordenam a resposta, e os T citotóxicos destroem células infectadas. A primeira exposição a um antígeno gera a resposta primária, mais lenta e de menor intensidade; em novo contato, a resposta secundária é mais rápida e intensa, por causa das células de memória.",["Linfócito B → plasmócito → anticorpos","Linfócito T citotóxico: destrói células infectadas","Resposta primária lenta; secundária rápida e intensa (memória)"],"Anticorpos são produzidos por plasmócitos, derivados de linfócitos B.","Um gráfico mostra a concentração de anticorpos contra um antígeno X no sangue de uma pessoa: no primeiro contato, o aumento é lento e baixo; em um segundo contato, semanas depois, a concentração sobe rapidamente e atinge valores bem maiores.","A diferença entre as duas respostas é explicada pela:",["produção de anticorpos pelos linfócitos T no primeiro contato e pelas hemácias no segundo.","diminuição de células de defesa após o primeiro contato, o que torna a segunda resposta mais forte.","digestão dos anticorpos pelo estômago no primeiro contato.","ação de antibióticos, que aumentam o número de anticorpos.","formação de células de memória após o primeiro contato, que reconhecem o antígeno e geram plasmócitos mais rapidamente no segundo contato."],4,"E: as células de memória formadas no primeiro contato aceleram e ampliam a produção de anticorpos no segundo. A erra: os anticorpos vêm de plasmócitos, e as hemácias não os produzem. B é contraditória: menos células tornaria a resposta mais fraca. C é falsa: os anticorpos circulam no sangue. D é falsa: antibióticos não produzem anticorpos."],
"Poluição por plásticos e microplásticos":["Os plásticos são polímeros sintéticos, em geral derivados do petróleo, muito resistentes e lentos para se degradar. Quando descartados de forma inadequada, chegam a rios e oceanos e se fragmentam em microplásticos (menores que 5 mm), que podem ser ingeridos por organismos aquáticos e entrar na cadeia alimentar. Reduzir o consumo, reutilizar, reciclar e descartar corretamente diminuem os impactos.",["Plástico: polímero de degradação muito lenta","Microplásticos: fragmentos menores que 5 mm","Reduzir, reutilizar, reciclar e descartar corretamente"],"A ordem de prioridade é reduzir e reutilizar antes de reciclar.","Pesquisadores encontraram fragmentos de plástico no estômago de peixes e de aves marinhas coletados em diferentes regiões do oceano. Alguns fragmentos tinham dimensão menor que 5 mm.","A presença desses fragmentos nos animais indica que:",["o plástico descartado de forma inadequada persiste no ambiente e se fragmenta em partículas pequenas, que são ingeridas pelos animais e entram na cadeia alimentar.","os plásticos se decompõem rapidamente no mar e se transformam em nutrientes para os peixes.","apenas os animais carnívoros podem ingerir plástico.","os fragmentos são produzidos pelos próprios peixes durante a digestão.","o plástico no oceano é benéfico, pois serve como alimento complementar."],0,"A: o plástico é persistente e se fragmenta em partículas que podem ser ingeridas, como mostram os achados. B é falsa: a degradação é muito lenta e não gera nutrientes. C é falsa: o texto cita peixes e aves de diferentes regiões, sem restrição a carnívoros. D é falsa: não há produção de plástico por organismos. E é falsa: a ingestão de plástico pode causar danos."],
"Controle biológico de pragas":["O controle biológico usa inimigos naturais (predadores, parasitoides e patógenos) para reduzir populações de pragas agrícolas, diminuindo o uso de agrotóxicos. Exemplos: joaninhas que predam pulgões e vespas que parasitam lagartas. Exige estudo prévio: a introdução de uma espécie exótica sem avaliação pode torná-la invasora e prejudicar espécies nativas. O uso excessivo de agrotóxicos pode eliminar inimigos naturais e polinizadores e selecionar pragas resistentes.",["Controle biológico: predadores, parasitoides, patógenos","Risco: espécie exótica introduzida sem avaliação","Agrotóxico em excesso: elimina inimigos naturais e seleciona resistência"],"Pragas que sobrevivem ao agrotóxico se reproduzem mais: é seleção natural.","Em uma plantação de laranja, uma praga de pulgões foi controlada pela liberação de joaninhas, que se alimentam deles. Em seguida, o agricultor reduziu o uso de inseticidas de amplo espectro, que matavam as joaninhas.","Essa estratégia de controle se baseia:",["na competição entre pulgões e joaninhas pelo mesmo alimento.","no mutualismo entre pulgões e joaninhas.","no parasitismo das joaninhas sobre as laranjeiras.","na predação das joaninhas sobre os pulgões, e a redução de inseticidas de amplo espectro preserva os inimigos naturais.","na ação de vírus que matam os pulgões."],3,"D: as joaninhas são predadoras dos pulgões, e reduzir inseticidas de amplo espectro preserva esses inimigos naturais. A erra: a relação descrita é de predação. B erra: os pulgões são presas, e não parceiros. C erra: as joaninhas se alimentam dos pulgões, não das laranjeiras. E não é mencionada no texto."],
"Fermentação e rendimento de ATP":["Na respiração aeróbia, a glicose é oxidada por completo, com O<sub>2</sub> como aceptor final de elétrons, e rende cerca de 30 a 32 ATP por glicose. Na fermentação, a oxidação é parcial: a glicólise rende 2 ATP por glicose, e o piruvato é convertido em etanol e CO<sub>2</sub> (alcoólica) ou em lactato (láctica). Por isso, a fermentação consome muito mais glicose para a mesma quantidade de ATP.",["Aeróbia: cerca de 30 ATP por glicose","Fermentação: 2 ATP por glicose (glicólise)","Alcoólica: etanol + CO<sub>2</sub>; láctica: lactato"],"Fermentar gasta muita glicose para pouco ATP.","Uma levedura pode obter ATP por respiração aeróbia ou por fermentação alcoólica. Considere que a respiração aeróbia rende 30 ATP por molécula de glicose e a fermentação rende 2 ATP por molécula de glicose.","Para produzir 60 ATP, o número de moléculas de glicose consumidas por respiração aeróbia e por fermentação é, respectivamente:",["30 e 2","2 e 30","2 e 15","15 e 30","30 e 60"],1,"Aeróbia: 60 / 30 = 2 glicoses. Fermentação: 60 / 2 = 30 glicoses (B). A inverte os processos; C usa 4 ATP por glicose na fermentação; D usa 4 ATP por glicose na respiração aeróbia; E divide por 2 na respiração aeróbia e por 1 na fermentação."],
"Núcleo, cromossomos e cariótipo":["O núcleo contém o material genético, organizado em cromatina (DNA associado a proteínas, as histonas), que se condensa em cromossomos na divisão celular. O cariótipo é o conjunto de cromossomos de uma célula, organizado por tamanho e forma. Na espécie humana, as células somáticas têm 46 cromossomos (23 pares: 22 pares de autossomos e 1 par de cromossomos sexuais, XX ou XY); os gametas têm 23. O nucléolo produz subunidades de ribossomos.",["Humanos: 2n = 46; gametas n = 23","22 pares de autossomos + 1 par sexual (XX ou XY)","Cromatina → cromossomos na divisão","Nucléolo: produção de subunidades de ribossomos"],"Gameta humano: 23 cromossomos; célula somática: 46.","O cariótipo de uma célula somática de um homem foi analisado. A análise mostra os cromossomos organizados em pares e identifica um par com cromossomos de tamanhos muito diferentes entre si.","Sobre esse cariótipo, é correto afirmar que:",["tem 23 cromossomos no total, e o par desigual é um par de autossomos.","tem 46 cromossomos, sendo 23 pares de cromossomos sexuais XY.","tem 46 cromossomos, e o par de tamanhos diferentes é o par sexual XY, enquanto os outros 22 pares são autossomos.","tem 44 cromossomos sexuais e 2 autossomos.","tem 48 cromossomos, pois cada cromossomo tem duas cromátides contadas separadamente."],2,"C: o homem tem 46 cromossomos, e o par XY é heteromórfico (X maior que Y); os outros 22 pares são autossomos. A erra: 23 é o número de um gameta. B erra: só um par é sexual. D inverte as quantidades. E erra: as cromátides-irmãs contam como um único cromossomo."],
"Deriva genética e fluxo gênico":["Além da seleção natural, outros fatores alteram as frequências alélicas: a deriva genética (mudanças ao acaso, mais intensas em populações pequenas), o fluxo gênico (migração de indivíduos entre populações, que torna suas frequências mais parecidas), as mutações e os cruzamentos não aleatórios. O efeito do gargalo (redução drástica da população) e o efeito fundador (população formada por poucos indivíduos) reduzem a variabilidade genética.",["Deriva: mudança ao acaso das frequências alélicas; mais forte em populações pequenas","Fluxo gênico: migração que troca alelos entre populações","Gargalo e efeito fundador: perda de variabilidade"],"Mudança ao acaso em população pequena é deriva; mudança por vantagem adaptativa é seleção.","Uma doença genética recessiva rara afeta cerca de 1 em 100 000 pessoas na população geral, mas atinge 1 em 500 em uma pequena comunidade isolada, fundada por cerca de 30 pessoas, entre as quais havia um portador do alelo.","A maior frequência da doença nessa comunidade é explicada principalmente por:",["efeito fundador, um caso de deriva genética: a população formada por poucos indivíduos carregou o alelo em frequência maior que a da população de origem.","seleção natural a favor do alelo da doença, que traz vantagem a todos.","mutações induzidas pelo isolamento, que só ocorrem nessa comunidade.","fluxo gênico intenso com populações vizinhas, que introduz o alelo.","aumento da pressão do ambiente, que faz o alelo surgir por necessidade."],0,"A: poucos fundadores, entre eles um portador, elevaram por acaso a frequência do alelo (efeito fundador). B é falsa: o alelo de uma doença não traz vantagem geral. C é falsa: o isolamento não induz mutações. D contraria o texto: a comunidade é isolada. E expressa ideia lamarckista, não sustentada."],
"Edição genômica e terapia gênica":["A edição genômica, como a técnica CRISPR-Cas9, usa uma enzima (Cas9) guiada por um RNA para cortar o DNA em uma sequência específica, o que permite remover, inserir ou corrigir trechos de genes. É usada em pesquisa e em aplicações em plantas, animais e células humanas. Alterações em células germinativas ou em embriões podem ser herdadas, o que gera debates éticos e exige regulamentação; alterações em células somáticas afetam apenas o indivíduo tratado.",["CRISPR-Cas9: a Cas9 corta o DNA no local indicado por um RNA-guia","Edição somática: não passa aos descendentes","Edição germinativa: herdável; debate ético e regulação"],"O RNA-guia é o endereço; a Cas9 é a tesoura.","Pesquisadores usaram a técnica CRISPR-Cas9 para corrigir, em células da pele cultivadas em laboratório, uma mutação em um gene. Um RNA-guia complementar à sequência-alvo conduz a enzima Cas9 até o local, onde ela corta o DNA.","Nessa técnica, a especificidade da edição é garantida:",["pela Cas9, que reconhece qualquer sequência de DNA e escolhe o local ao acaso.","pelo RNA-guia, complementar à sequência-alvo, que conduz a Cas9 até o ponto do DNA a ser cortado.","pelo DNA da célula, que se divide em fragmentos de tamanho igual.","pelo ribossomo, que corta o DNA no código de parada.","pelo aumento da temperatura, que separa as bases A–T e C–G."],1,"B: o RNA-guia, complementar à sequência-alvo, direciona a Cas9. A contraria o texto: o local não é escolhido ao acaso. C, D e E descrevem processos sem relação com a técnica: o ribossomo participa da tradução, e a separação das fitas por calor é usada na PCR."],
