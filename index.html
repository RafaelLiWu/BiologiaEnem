 resposta de estresse."], "Sistema nervoso e sinapses": ["O sistema nervoso coordena as funções orgânicas por meio de sinais elétricos e químicos. O neurônio é a célula condutora básica, composta por dendritos, corpo celular e axônio. O potencial de ação é um impulso elétrico despolarizante desencadeado pela abertura de canais de sódio (Na⁺) dependentes de voltagem (influxo de Na⁺), seguido por repolarização mediada pelo efluxo de potássio (K⁺). A bainha de mielina (feita por células de Schwann ou oligodendrócitos) atua como isolante elétrico e viabiliza a condução saltatória nos nódulos de Ranvier. Na sinapse química, a despolarização terminal abre canais de cálcio (Ca²⁺), estimulando a exocitose de neurotransmissores na fenda sináptica.", ["Potencial de ação: despolarização (influxo de Na⁺) e repolarização (efluxo de K⁺)", "Bomba Na⁺/K⁺ ATPase: mantém o potencial de repouso negativo (~ -70 mV)", "Bainha de mielina: condução saltatória ultra-rápida nos nódulos de Ranvier", "Sinapse química: influxo de Ca²⁺ provoca liberação de neurotransmissores"], "O sentido de condução do impulso nervoso dentro do neurônio é UNIDIRECIONAL: Dendrito → Corpo celular → Axônio. E na sinapse química, o neurotransmissor vai da terminação pré-sináptica para os receptores da membrana pós-sináptica.", "<p>Considere o esquema simplificado de uma sinapse química entre o terminal axônico de um neurônio motor e a membrana de uma fibra muscular esquelética:</p><div style='text-align:center;margin:12px 0'><svg viewBox='0 0 320 120' style='width:100%;max-width:320px;height:auto;background:var(--hi);border-radius:12px;padding:8px'><path d='M 40,30 Q 120,30 160,50 Q 200,30 280,30 L 280,10 L 40,10 Z' fill='var(--ac)' opacity='0.3'/><circle cx='100' cy='35' r='5' fill='var(--ac)'/><circle cx='130' cy='40' r='5' fill='var(--ac)'/><circle cx='190' cy='40' r='5' fill='var(--ac)'/><text x='160' y='25' text-anchor='middle' font-size='10' font-weight='700' fill='var(--tx)'>Vesículas sinápticas (Acetilcolina)</text><rect x='30' y='80' width='260' height='25' rx='6' fill='var(--ln)'/><text x='160' y='97' text-anchor='middle' font-size='10' font-weight='700' fill='var(--tx)'>Membrana pós-sináptica com receptores de canal</text><path d='M 160,48 L 160,78' stroke='var(--ok)' stroke-width='2' stroke-dasharray='3' marker-end='arrow'/></svg><br><small style='color:var(--mu)'>Liberação de neurotransmissores na fenda sináptica estimulada por influxo de Ca²⁺</small></div><p>Certas toxinas naturais, como o curare e o veneno de serpentes do gênero Micrurus (coral-verdadeira), bloqueiam competitivamente os receptores nicotínicos de acetilcolina na placa motora muscular.</p>", "A consequência neuromuscular direta da ação dessas toxinas no organismo atingido é a:", ["hiperpolarização explosiva com contração muscular tetânica involuntária contínua.", "destruição das pontes de hidrogênio dos lipídios da bainha de mielina central.", "abertura espontânea e irreversível dos canais de sódio voltagem-dependentes.", "paralisia flácida e parada respiratória por impossibilidade de despolarização da fibra muscular.", "secreção desordenada de bile e tripsina para o espaço sináptico periférico."], 3, "Ao bloquear os receptores pós-sinápticos de acetilcolina, a toxina impede a abertura dos canais iônicos da placa motora e a consequente entrada de Na⁺ na fibra muscular esquelética. Sem despolarização muscular, o músculo não gera potencial de ação nem contração, resultando em paralisia muscular flácida que atinge os músculos respiratórios (diafragma), levando ao óbito por asfixia caso não haja ventilação assistida. Alternativa correta: D. Distratores: A descreveria toxinas tetânicas ou inibidores de acetilcolinesterase; B, D e E citam ações incompatíveis com o bloqueio do receptor."], "Sistema respiratório e trocas gasosas": ["A respiração humana envolve a ventilação pulmonar (inspiração e expiração) e a hematose nos alvéolos pulmonares. A hematose é a troca gasosa por difusão simples a favor do gradiente de concentração: o O₂ passa do ar alveolar para os capilares sanguíneos, enquanto o CO₂ difunde-se do sangue venoso para a luz alveolar. O oxigênio é transportado predominantemente ligado à hemoglobina nos eritrócitos (oxiemoglobina). O gás carbônico é transportado majoritariamente na forma de íons bicarbonato (HCO₃⁻) dissolvidos no plasma sanguíneo. O bulbo raquidiano regula a frequência respiratória detectando variações no pH do sangue: aumento de CO₂ gera ácido carbônico, reduz o pH e estimula a hiperventilação.", ["Hematose alveolar: difusão passiva de O₂ e CO₂ a favor de gradientes", "Transporte de O₂: ~98% ligado à hemoglobina (oxiemoglobina)", "Transporte de CO₂: ~70% na forma de bicarbonato (HCO₃⁻) no plasma", "Equilíbrio carbônico: CO₂ + H₂O ⇄ H₂CO₃ ⇄ H⁺ + HCO₃⁻", "Controle bulbar: queda no pH sanguíneo (acidose) estimula a respiração"], "O monóxido de carbono (CO), expelido por escapamentos e queima incompleta, liga-se à hemoglobina de forma estável e irreversível (carboxiemoglobina), com afinidade 200 vezes maior que a do O₂, impedindo a entrega de oxigênio aos tecidos e causando asfixia química silenciosa.", "<p>Durante uma corrida de alta intensidade em pista de atletismo, os músculos esqueléticos de um competidor aumentaram bruscamente o consumo de glicose e a produção de CO₂. Minutos depois, seu ritmo respiratório acelerou de maneira involuntária, mesmo sem comando consciente do atleta.</p>", "O aumento reflexo da frequência respiratória coordenado pelo bulbo raquidiano foi desencadeado pela:", ["elevação do pH sanguíneo provocada pelo consumo acelerado de íons H⁺ nos pulmões.", "redução da pressão osmótica decorrente da retenção excessiva de ureia no córtex renal.", "queda do pH plasmático em decorrência da formação de ácido carbônico a partir do excesso de CO₂.", "liberação de glucagon pelas células beta do pâncreas diretamente nos alvéolos pulmonares.", "diminuição da temperatura corporal central causada pelo atrito mecânico das fibras musculares."], 2, "O exercício intenso gera excesso de CO₂ celular, que no plasma reage com a água (sob catálise da anidrase carbônica) formando ácido carbônico (H₂CO₃), o qual se dissocia em H⁺ e HCO₃⁻. O acúmulo de íons H⁺ reduz o pH plasmático (acidose metabólica/respiratória). Quimiorreceptores no bulbo e nos corpos carotídeos detectam essa acidez e enviam impulsos nervosos para acelerar o diafragma e músculos intercostais, expulsando mais CO₂. Alternativa correta: C. Distratores: A inverte o efeito no pH; C, D e E citam mecanismos inexistentes ou incompatíveis com a regulação ventilatória."], "Sucessão ecológica": ["A sucessão ecológica é o processo ordenado e gradual de colonização e modificação de uma comunidade biológica ao longo do tempo. Quando ocorre em áreas estéreis nunca antes habitadas (como rochas nuas, dunas recém-formadas ou lavas vulcânicas resfriadas), denomina-se sucessão primária, iniciada por espécies pioneiras pioneiras (ecese), como líquens e musgos. Quando ocorre em áreas anteriormente povoadas que sofreram perturbação (como queimadas, áreas desmatadas ou campos agrícolas abandonados), denomina-se sucessão secundária. Com o avanço das etapas serais (sere), a biomassa total, a biodiversidade e a complexidade das teias alimentares aumentam até atingir o clímax ecológico, momento em que a produção bruta se iguala ao consumo respiratório total (P/R = 1).", ["Sucessão primária: substrato virgem estéril (rocha, lava)", "Sucessão secundária: solo previamente estruturado (queimada, clareira)", "Comunidade pioneira (ecese): líquens, musgos, gramíneas rústicas", "Comunidade clímax: máxima biomassa e biodiversidade estável (P/R ≈ 1)"], "No clímax ecológico, a Produtividade Primária Líquida (PPL) tende a ZERO porque quase toda a matéria orgânica produzida pela fotossíntese bruta é consumida pela respiração de toda a comunidade (plantas, animais e decompositores).", "<p>Uma área de pastagem abandonada no interior de Minas Gerais passou por monitoramento ecológico durante 40 anos. Observou-se o surgimento inicial de capins rústicos, seguido pelo estabelecimento de arbustos pioneiros e, décadas depois, a consolidação de um dossel florestal contínuo com árvores de madeira de lei e fauna diversificada.</p>", "Ao longo desse processo de sucessão ecológica, a relação entre a produtividade primária bruta (P) e a respiração total da comunidade (R) sofreu qual modificação?", ["Iniciou com P menor que R e finalizou com extinção da biomassa vegetal.", "Iniciou com P muito maior que R e aproximou-se gradativamente de P igual a R no clímax.", "Manteve-se com P rigorosamente igual a R durante todas as etapas temporais.", "Iniciou no clímax e regrediu para uma comunidade pioneira de menor porte.", "Apresentou P nula em decorrência da ausência de fotossíntese nas fases serais intermediárias."], 1, "Nas fases iniciais e intermediárias de uma sucessão, a produção de matéria orgânica bruta (P) supera a respiração da comunidade (R), permitindo o acúmulo contínuo de biomassa (P/R > 1). Conforme a comunidade amadurece e alcança o estágio clímax, o gasto metabólico e respiratório de todos os níveis tróficos aumenta até estabilizar em equilíbrio dinâmico, onde P ≈ R (PPL próxima de zero). Alternativa correta: B. Distratores: A implicaria regressão e morte da comunidade; C ignora o ganho de biomassa necessário para o crescimento vegetal; D inverte o sentido cronológico da sucessão; E erra ao anular a fotossíntese."], "Síntese proteica (transcrição e tradução)": ["A síntese proteica é o dogma central da biologia molecular: a informação flui do DNA para o RNA e deste para a proteína (DNA → RNA → Proteína). Na transcrição, a RNA polimerase utiliza uma das fitas do DNA no núcleo como molde para sintetizar o pré-RNAm, obedecendo ao pareamento complementar (A com U, T com A, C com G, G com C). Em eucariontes, o pré-RNAm passa pelo processamento (splicing), onde os íntrons (sequências não-codificantes) são excisados e os éxons (sequências codificantes) são unidos. O splicing alternativo permite que um único gene gere múltiplas isoformas de proteínas distintas. O RNAm maduro migra para o citoplasma, onde ocorre a tradução nos ribossomos: moléculas de RNA transportador (RNAt) contendo anticódons específicos pareiam com os códons do RNAm, ligando aminoácidos sucessivos por ligações peptídicas.", ["Transcrição: DNA fita molde → RNAm pela RNA polimerase (núcleo eucarionte)", "Splicing: remoção de íntrons e junção de éxons (splicing alternativo gera várias proteínas)", "Tradução: leitura do RNAm nos ribossomos com pareamento de anticódons do RNAt", "Ligação peptídica: união catalisada pelo ribozima ribossômico entre aminoácidos"], "O genoma humano tem apenas cerca de 20 mil genes, mas nosso corpo produz mais de 100 mil proteínas diferentes! O 'segredo' biológico dessa diversidade proteica é o SPLICING ALTERNATIVO, que combina diferentes éxons de um mesmo pré-RNAm.", "<p>A estreptomicina é um antibiótico aminoglicosídeo que se liga irreversivelmente à subunidade menor (30S) dos ribossomos de bactérias patogênicas, distorcendo sua conformação espacial e impedindo o reconhecimento correto dos códons do RNA mensageiro.</p>", "A administração desse medicamento debela a infecção bacteriana porque atua diretamente inibindo a:", ["duplicação semiconservativa do DNA bacteriano na mitocôndria.", "tradução de proteínas essenciais à sobrevivência do microrganismo.", "fagocitose de nutrientes pelo complexo golgiense da bactéria.", "oxidação de glicose durante a fermentação alcoólica nas leveduras.", "transcrição reversa do RNA mensageiro em lipídios de membrana."], 1, "Os ribossomos são as estruturas celulares responsáveis pela tradução do RNA mensageiro em cadeias polipeptídicas (síntese proteica). Ao inibir ou desestruturar os ribossomos 70S bacterianos, o antibiótico impede a síntese de proteínas estruturais e enzimáticas indispensáveis ao patógeno, levando-o à morte sem afetar os ribossomos 80S das células humanas do hospedeiro. Alternativa correta: B. Distratores: A erra pois bactérias não possuem mitocôndrias; C erra pois bactérias não fagocitam nem possuem Golgi; D e E citam processos alheios à fisiologia antibiótica descrita."], "Tecido cartilaginoso e ossificação endocondral": ["O tecido cartilaginoso é uma forma especializada de tecido conjuntivo de sustentação mecânica flexível, amortecimento de impactos e revestimento de superfícies articulares, caracterizado pela total ausência de vasos sanguíneos (avascular), vasos linfáticos e nervos. É formado por células jovens ativas que secretam matriz denominadas condroblastos e por células maduras alojadas em lacunas na matriz denominadas condrócitos. A matriz extracelular é abundante em proteoglicanos hidratados (condroitinossulfato) associados a fibrilas de colágeno, garantindo rigidez elástica contra compressões mecânicas. Por ser avascular, a nutrição e oxigenação das cartilagens dependem inteiramente da difusão de nutrientes a partir dos capilares do pericôndrio (envoltório conjuntivo vascularizado vizinho), o que confere ao tecido cartilaginoso baixíssima capacidade de cicatrização e regeneração espontânea. No embrião, o esqueleto é inicialmente todo cartilaginoso (cartilagem hialina), sendo gradualmente substituído por tecido ósseo ao longo do processo de ossificação endocondral.", ["Avascular: sem vasos sanguíneos; nutrientes chegam por difusão a partir do pericôndrio", "Regeneração muito lenta e deficiente devido ao suprimento nutricional por difusão", "Condroblastos (síntese ativa) e Condrócitos (células adultas em lacunas da matriz)", "Cartilagem hialina: discos epifisários de crescimento em ossos longos e superfícies articulares", "Ossificação endocondral: o molde cartilaginoso embrionário é degradado e substituído por trabéculas ósseas mineralizadas"], "No ENEM, lesões no menisco ou nas articulações do joelho demoram meses para cicatrizar (ou exigem cirurgia) exatamente porque o tecido cartilaginoso é AVASCULAR: sem sangue direto, a divisão celular e o aporte de proteínas são mínimos.", "<p>Atletas profissionais de alto rendimento frequentemente sofrem lesões articulares nos meniscos e na cartilagem hialina que reveste a epífise do fêmur no joelho. Médicos ortopedistas explicam aos pacientes que essas lesões apresentam tempo de recuperação cirúrgica e fisioterápica significativamente mais prolongado e regeneração espontânea muito inferior à de fraturas puramente ósseas.</p>", "Essa notável lentidão na regeneração espontânea do tecido cartilaginoso decorre fundamentalmente da sua condição de tecido:", ["anucleado e destituído de matriz colágena fibrosa de sustentação.", "rico em canais de Havers mineralizados que impedem o fluxo de glóbulos brancos.", "composto exclusivamente por adipócitos uniloculares sem síntese de ATP.", "inervado por fibras somáticas que bloqueiam a proliferação dos condroblastos.", "avascular, cuja nutrição e oxigenação dependem da difusão lenta de solutos pelo pericôndrio."], 4, "Diferente do tecido ósseo (que é intensamente vascularizado por vasos nos canais de Havers e Volkmann), o tecido cartilaginoso é completamente avascular. O oxigênio e a glicose precisam difundir-se lentamente através da densa matriz de proteoglicanos a partir dos vasos do tecido conjuntivo periférico (pericôndrio), o que restringe severamente a taxa metabólica, a síntese de nova matriz e a proliferação celular durante o reparo de lesões. Alternativa correta: E. Distratores: A, C, D e E descrevem disparates anatômicos e histológicos."], "Tecido conjuntivo propriamente dito e cicatrização": ["O tecido conjuntivo propriamente dito (TCPD) é o tecido de preenchimento, sustentação mecânica, vascularização e cicatrização mais amplamente distribuído pelo corpo humano, situado sob epitélios e entre os órgãos. É composto por abundante matriz extracelular (formada por substância fundamental amorfa hidratada rica em glicosaminoglicanos e fibras proteicas de colágeno resistente à tração e elastina elástica) e por células especializadas com funções distintas: fibroblastos (sintetizam ativamente as fibras colágenas e a matriz), macrófagos (fagocitam restos celulares e antígenos na defesa), mastócitos (possuem grânulos de histamina, que causa vasodilatação na inflamação e alergia, e heparina anticoagulante) e plasmócitos (produtores de anticorpos). Divide-se em frouxo (flexível, com proporções equilibradas de células e fibras, preenchendo espaços e nutrindo epitélios) e denso (com predominância esmagadora de feixes colágenos, podendo ser modelado em tendões e ligamentos resistentes à tração unidirecional, ou não-modelado na derme profunda). Na cicatrização de ferimentos, os fibroblastos migram e proliferam no local, depositando colágeno cicatricial.", ["Fibroblastos: sintetizam o colágeno, a elastina e a matriz extracelular (cicatrização tecidual)", "Mastócitos: secretam histamina (mediador inflamatório e alérgico) e heparina (anticoagulante)", "Macrófagos teciduais: fagocitose de corpos estranhos e apresentação de antígenos aos linfócitos", "TCPD Frouxo (apoia epitélios) vs Denso Modelado (tendões e ligamentos resistentes à tração)", "Quelóide: cicatrização anômala por superprodução descontrolada de fibras colágenas"], "Na reação alérgica aguda (como rinite ou picada de abelha), a coceira, o inchaço e a vermelhidão decorrem da desgranulação dos MASTÓCITOS, que liberam HISTAMINA nos tecidos conjuntivos, provocando vasodilatação e aumento da permeabilidade capilar.", "<p>Ao sofrer um corte acidental profundo na pele da mão durante o preparo de um alimento, um indivíduo passa pelas etapas fisiológicas de hemostasia, inflamação e reparo tecidual. Dias após a lesão, células fusiformes locais proliferam intensamente na derme, sintetizando e secretando feixes densos de fibras colágenas que reconstituem a integridade mecânica do tecido na cicatriz.</p>", "As células conjuntivas responsáveis pela síntese e deposição do colágeno durante o processo de cicatrização são os:", ["adipócitos uniloculares ricos em triglicerídeos de reserva.", "neurônios pseudounipolares do córtex encefálico motor somático.", "eritrócitos anucleados responsáveis pelo transporte de gás oxigênio na linfa.", "osteoclastos multinucleados que reabsorvem sais de fosfato de cálcio na derme.", "fibroblastos ativos, especializados na produção da matriz extracelular e fibras teciduais."], 4, "Os fibroblastos são as células primordiais do tecido conjuntivo propriamente dito, dotadas de retículo endoplasmático rugoso e complexo de Golgi extremamente desenvolvidos para a síntese e exocitose de pró-colágeno e proteoglicanos da substância fundamental amorfa. Durante o reparo de feridas dérmicas, citocinas inflamatórias estimulam os fibroblastos a proliferarem e produzirem densas malhas de colágeno tipo I e III que preenchem a lesão, formando a cicatriz fibrosa de sustentação. Alternativa correta: E. Distratores: A é célula de gordura; C são glóbulos vermelhos; D são células de reabsorção óssea; E são células nervosas encefálicas."], "Tecido epitelial e especializações": ["O tecido epitelial caracteriza-se por células justapostas intimamente unidas por complexos juncionais (desmossomos, zônulas de oclusão e junções comunicantes), com escassa substância intercelular e ausência de vasos sanguíneos (tecido avascular, nutrido por difusão a partir do tecido conjuntivo subjacente através da lâmina basal). Divide-se em epitélios de revestimento (monoestratificado, pluriestratificado ou pseudoestratificado, como na traqueia ciliada) e epitélios glandulares secretores (glândulas exócrinas, que lançam produtos por ductos em cavidades ou superfície, e endócrinas, que secretam hormônios diretamente no sangue). Especializações de membrana como microvilosidades apicais aumentam drasticamente a superfície de absorção de nutrientes no enterócito intestinal.", ["Avascular: sem vasos próprios; nutrido por difusão pelo conjuntivo através da lâmina basal", "Células justapostas: desmossomos e junções oclusivas garantem vedação e coesão", "Microvilosidades: dobras apicais da membrana para absorção máxima de nutrientes (intestino)", "Cílios: batimento rítmico para transporte de muco e partículas (vias aéreas)", "Glândula exócrina (com ducto, ex: suor/saliva) vs endócrina (sem ducto, hormônio no sangue)"], "A pele humana é impermeável e resistente ao atrito graças à sua camada córnea superficial de células mortas repletas de QUERATINA (proteína insolúvel e impermeabilizante). Abaixo da epiderme avascular fica a derme rica em vasos sanguíneos e colágeno.", "<p>A doença celíaca é uma enteropatia inflamatória autoimune deflagrada pela ingestão de glúten (proteína presente no trigo, cevada e centeio). Em pacientes celíacos não tratados, a resposta inflamatória crônica na mucosa do intestino delgado provoca o achatamento e atrofia severa das vilosidades e a perda das microvilosidades apicais dos enterócitos.</p>", "A manifestação clínica de desnutrição e emagrecimento progressivo observada nesses pacientes decorre diretamente da:", ["redução drástica da área superficial de contato destinada à absorção de nutrientes pelo epitélio.", "paralisação da síntese de bile pelo parênquima hepático decorrente da carência de glúten.", "destruição das glândulas salivares parótidas por acúmulo de anticorpos anti-lipase.", "obstrução das artérias coronárias por cristais insolúveis de ácido lático luminal.", "conversão do epitélio de revestimento intestinal em cartilagem hialina avascular calcificada."], 0, "As microvilosidades do epitélio intestinal são especializações de membrana (evaginações digitiformes sustentadas por feixes de actina) que ampliam em centenas de vezes a área útil de absorção de monossacarídeos, aminoácidos, lipídios e vitaminas. Com o achatamento das vilosidades e perda dessas microvilosidades na doença celíaca, a capacidade absortiva do enterócito cai drasticamente, resultando em má absorção intestinal, esteatorreia e desnutrição. Alternativa correta: A. Distratores: B erra pois o fígado continua produzindo bile; C, D e E formulam hipóteses anatômicas e patológicas descabidas."], "Tecido sanguíneo e elementos figurados": ["O tecido sanguíneo é um conjuntivo especializado de consistência líquida formado pelo plasma (cerca de 55% do volume, constituído por água, proteínas plasmáticas como albumina e anticorpos, glicose e sais) e pelos elementos figurados (cerca de 45%). Os eritrócitos (hemácias) são anucleados em mamíferos, com formato bicôncavo e repletos de hemoglobina para transporte de O₂ dos pulmões aos tecidos. Os leucócitos (glóbulos brancos) atuam na imunidade e dividem-se em granulócitos (neutrófilos para fagocitose bacteriana primária, eosinófilos contra parasitas e alergias, basófilos liberadores de histamina e heparina) e agranulócitos (linfócitos B e T na imunidade adaptativa específica e monócitos que originam os macrófagos teciduais). As plaquetas (trombócitos) são fragmentos celulares de megacariócitos medulares indispensáveis para a coagulação sanguínea.", ["Hemácias (eritrócitos): transporte de O₂ via hemoglobina; anucleadas em mamíferos", "Plaquetas: fragmentos de megacariócitos; tamponamento e cascata de coagulação", "Neutrófilos: primeira linha de defesa por fagocitose em infecções bacterianas agudas", "Linfócitos: produção de anticorpos (linfócitos B) e imunidade celular (linfócitos T)", "Eosinófilos: defesa contra helmintos parasitários e reações de hipersensibilidade alérgica"], "Interpretação de hemograma no ENEM: Neutrófilos aumentados = infecção bacteriana aguda. Linfócitos aumentados = infecção viral. Eosinófilos aumentados = parasitose intestinal por vermes ou alergia. Plaquetas muito baixas = risco de sangramentos e hemorragias (como na dengue hemorrágica).", "<p>Um paciente residente em área endêmica de parasitoses procurou a Unidade Básica de Saúde com queixa de dores abdominais e fraqueza. Seu hemograma completo revelou contagem normal de eritrócitos e plaquetas, mas demonstrou leucocitose com aumento desproporcional e expressivo de uma linhagem específica de leucócitos granulócitos caracterizada por grânulos citoplasmáticos alaranjados com afinidade por corantes ácidos.</p>", "O tipo de leucócito cujo número se elevou no sangue desse paciente e a condição clínica a ele associada são:", ["Basófilo; intoxicação crônica por mercúrio metálico inalado.", "Hemácia anucleada; hiperglicemia pós-prandial associada a diabetes tipo 1.", "Eosinófilo; resposta imune contra infecções por vermes helmintos e reações alérgicas.", "Linfócito B; cicatrização de fraturas ósseas com proliferação de osteoblastos.", "Plaqueta; hemólise eritrocitária autoimune em altitudes elevadas."], 2, "Os eosinófilos são leucócitos granulócitos cujos grânulos específicos coram-se intensamente pela eosina (corante ácido). Sua função biológica primordial é atuar na defesa contra patógenos multicelulares (helmintos/vermes parasitários) desgranulando proteínas básicas principais e enzimas citotóxicas sobre a cutícula dos vermes, além de modular processos inflamatórios em reações alérgicas. A eosinofilia no sangue periférico é marcador diagnóstico clássico de verminoses intestinais. Alternativa correta: C. Distratores: A cita basófilos e intoxicação por mercúrio; C confunde hemácias com leucócitos e erra o quadro; D e E associam células a funções desconexas."], "Tecido ósseo, canais de Havers e mineralização": ["O tecido ósseo é o tecido conjuntivo de sustentação esquelética mais resistente e rígido dos vertebrados, exercendo funções essenciais na proteção de órgãos nobres (como encéfalo e coração), sustentação postural, inserção da musculatura estriada na locomoção, abrigo da medula óssea hematopoética e reserva primária de íons cálcio e fosfato do organismo. Sua matriz extracelular é composta por uma porção orgânica (cerca de 35%, predominantemente fibras de colágeno tipo I que conferem tenacidade e flexibilidade mecânica) e por uma densa porção inorgânica mineralizada (cerca de 65%, cristais de hidroxiapatita de fosfato de cálcio que conferem dureza contra esmagamento). No tecido ósseo compacto dos ossos longos, a matriz organiza-se em unidades cilíndricas microscópicas chamadas sistemas de Havers (ou ósteons), compostos por lamelas ósseas concêntricas em torno de um canal de Havers central longitudinal por onde trafegam vasos sanguíneos capilares e nervos, comunicados transversalmente pelos canais perfurantes de Volkmann.", ["Matriz óssea: orgânica (colágeno flexível) + inorgânica (cristais de hidroxiapatita/fosfato de cálcio rígidos)", "Sistemas de Havers (ósteons): lamelas concêntricas de matriz com canais vasculares longitudinais", "Canais de Volkmann: canais perfurantes transversais que comunicam os canais de Havers com o periósteo", "Osteócitos em canalículos: células ósseas maduras comunicam-se por junções comunicantes (gap) trocando nutrientes", "Periósteo: membrana conjuntiva densa vascularizada que envolve o osso externamente, rica em células osteoprogenitoras"], "Se descalcificarmos um osso em ácido, ele perde a parte mineral (hidroxiapatita) e fica flexível como borracha (sobra só o colágeno). Se queimarmos o osso, perde o colágeno e vira um giz quebradiço (sobra só a parte mineral). O ENEM adora essa experiência!", "<p>Em um experimento demonstrativo clássico de histologia, um fêmur de ave foi submetido à imersão contínua em solução ácida diluída de ácido clorídrico por três semanas. Ao final do período, o osso manteve sua morfologia e contorno externos originais inalterados, porém adquiriu consistência extremamente maleável e elástica, podendo ser dobrado e atado em nó sem sofrer qualquer fratura mecânica.</p>", "A flexibilidade elástica adquirida pelo osso submetido ao tratamento ácido resultou da:", ["eliminação da derme conjuntiva superficial mediada pela expansão dos canais de Volkmann.", "destruição das fibras elásticas com multiplicação acelerada de cristais de fosfato de cálcio.", "dissolução química da fração mineral inorgânica com preservação da matriz colágena orgânica.", "transformação dos osteoclastos multinucleados em condrócitos hipertróficos hialinos.", "precipitação de carbonato de magnésio desidratado no interior dos canalículos de Havers."], 2, "A rigidez mecânica do tecido ósseo decorre da mineralização de cristais de fosfato de cálcio (hidroxiapatita) interligados às fibras de colágeno. O banho ácido solubiliza e dissolve os sais minerais inorgânicos de cálcio e fosfato, restando intacta a fração orgânica de colágeno tipo I, que é naturalmente maleável, tenaz e flexível como uma corda. Alternativa correta: C. Distratores: A, C, D e E contêm explicações bioquímicas inverossímeis."], "Tecidos conjuntivos (ósseo, cartilaginoso e adiposo)": ["Os tecidos conjuntivos têm origem mesodérmica e caracterizam-se por abundância de matriz extracelular (composta por substância fundamental amorfa e fibras proteicas de colágeno, elastina e reticulina) e grande diversidade celular. O tecido adiposo armazena triglicerídeos em adipócitos, atuando como reserva de energia, isolante térmico contra o frio e amortecedor de impactos mecânicos. O tecido cartilaginoso (condrócitos e condroblastos em matriz rígida e hidratada) é avascular e alinfático, nutrido pelo pericôndrio, conferindo suporte flexível em articulações e vias aéreas. O tecido ósseo é vascularizado e mineralizado por fosfato de cálcio (hidroxiapatita) e colágeno tipo I; osteoblastos sintetizam matriz nova, osteócitos mantêm a nutrição celular em lacunas e canalículos, e osteoclastos realizam a reabsorção e remodelação óssea sob controle de calcitonina e paratormônio (PTH).", ["Matriz extracelular abundante: colágeno (resistência à tração) e elastina (elasticidade)", "Tecido adiposo: reserva calórica de triglicerídeos e isolante térmico indispensável", "Tecido cartilaginoso: AVASCULAR (regeneração lenta, difusão via pericôndrio)", "Células ósseas: osteoblasto (CONSTRÓI matriz), osteócito (mantém), osteoclasto (REABSORVE)", "Remodelação óssea: PTH (retira Ca²⁺ do osso para o sangue) e Calcitonina (fixa Ca²⁺ no osso)"], "Cuidado com o tecido cartilaginoso: por ser AVASCULAR (sem vasos sanguíneos), ele cicatriza e regenera com extrema lentidão e dificuldade quando lesado (como em rompimentos de meniscos articulares do joelho).", "<p>Em mulheres na pós-menopausa, a queda brusca na produção ovariana de estrogênios pode desequilibrar a homeostase do tecido ósseo, elevando a atividade relativa dos osteoclastos em relação à dos osteoblastos. Com o tempo, esse desbalanço metabólico acarreta osteoporose com afinamento das trabéculas ósseas e alto risco de fraturas espontâneas de fêmur e vértebras.</p>", "A fragilidade óssea característica da osteoporose é consequência direta do(a):", ["prevalência da reabsorção da matriz óssea mineralizada sobre a sua deposição e síntese.", "despolarização dos nódulos de Ranvier no interior da substância fundamental amorfa.", "calcificação excessiva das fibras de elastina nas cartilagens de conjugação epifisárias.", "acúmulo de gordura saturada no interior dos canalículos dos osteócitos quiescentes.", "síntese de hemoglobina mutante no interior da cavidade articular do quadril."], 0, "O tecido ósseo passa por constante renovação e remodelação dinâmica. Os osteoblastos sintetizam e mineralizam matriz orgânica nova, enquanto os osteoclastos (células gigantes multinucleadas fagocitárias derivadas de macrófagos) reabsorvem e degradam matriz óssea antiga. Quando a taxa de reabsorção osteoclástica supera a taxa de deposição osteoblástica (frequente com a redução de estrogênios protetores), a densidade mineral óssea diminui progressivamente, configurando osteopenia e osteoporose. Alternativa correta: A. Distratores: A descreve processo inverso de calcificação; B cita estruturas exclusivas do tecido nervoso; D e E citam processos sem relevância fisiopatológica."], "Tecidos muscular e nervoso": ["O tecido muscular é especializado na contração e movimentação, composto por células alongadas ricas em filamentos proteicos de actina e miosina. Divide-se em três tipos histológicos: Muscular Estriado Esquelético (fibras cilíndricas multinucleadas com núcleos periféricos, estriações transversais evidentes e contração rápida e voluntária sob controle do sistema nervoso somático), Muscular Estriado Cardíaco (miocárdio, com células ramificadas com um ou dois núcleos centrais, estrias, discos intercalares para condução elétrica célere e contração rápida e involuntária com automatismo pelo nó sinoatrial) e Muscular Liso / Não-Estriado (células fusiformes mononucleadas sem sarcômeros transversais, contração lenta e involuntária nas vísceras e vasos). O tecido nervoso é composto por neurônios (condução) e células da glia (astrócitos de suporte e barreira hematoencefálica, micróglia fagocitária e oligodendrócitos/células de Schwann mielinizantes).", ["Estriado esquelético: contração rápida, forte e VOLUNTÁRIA (ligado aos ossos)", "Estriado cardíaco: contração rápida, rítmica e INVOLUNTÁRIA (discos intercalares)", "Muscular liso: contração lenta e INVOLUNTÁRIA (tubo digestório, vasos sanguíneos)", "Sarcômero: unidade funcional contrátil (deslizamento de filamentos de actina sobre miosina via Ca²⁺)", "Glia: astrócitos (nutrição e barreira hematoencefálica), micróglia (fagocitose/defesa)"], "A contração muscular depende de dois elementos essenciais: ATP (energia para desfazer e refazer a ligação da cabeça da miosina com a actina) e ÍONS CÁLCIO (Ca²⁺, liberados do retículo sarcoplasmático para desobstruir o sítio ativo da actina). Sem ATP após a morte, a musculatura fica permanentemente rígida (rigor mortis).", "<p>O músculo estriado cardíaco humano possui características funcionais e histológicas únicas que permitem que as quatro câmaras do coração se contraiam de maneira sincronizada e vigorosa cerca de 100 mil vezes por dia, sem fadiga tetânica ao longo de toda a vida.</p>", "A estrutura microscópica presente nas fibras musculares cardíacas que viabiliza a rápida transmissão dos impulsos elétricos de uma célula para as células vizinhas imediatas é denominada:", ["microvilosidade com zônula de oclusão epitelial.", "bainha de mielina com estrato de colágeno periósteo.", "disco intercalar com junções comunicantes (gap junctions).", "parede celular calcificada por hidroxiapatita.", "fuso mitótico com microtúbulos de queratina."], 2, "Os discos intercalares são complexos juncionais especializados que conectam as extremidades ramificadas dos cardiomiócitos adjacentes. Eles contêm desmossomos e fáscias de adesão para resistir à tensão mecânica das contrações contínuas e, crucialmente, junções comunicantes (gap junctions), canais iônicos de baixa resistência elétrica que permitem a passagem direta de íons despolarizantes de uma célula para outra, fazendo o tecido atuar como um sincício funcional elétrico integrado. Alternativa correta: C. Distratores: A é do epitélio de revestimento; C é do tecido nervoso; D e E misturam tecidos e organelas sem qualquer coerência anatômica."], "Teoria Endossimbiótica": ["A Teoria da Endossimbiose Sequencial, consolidada por Lynn Margulis na década de 1960, postula que mitocôndrias e cloroplastos das células eucariontes originaram-se a partir de procariontes primitivos de vida livre que foram fagocitados por uma célula hospedeira ancestral anaeróbia e estabeleceram uma relação de simbiose mutualística intracelular estável. As mitocôndrias teriam derivado de bactérias aeróbias ancestrais (alfaproteobactérias) capazes de respiração celular eficiente, enquanto os cloroplastos descenderam de cianobactérias fotossintetizantes ancestrais. As robustas evidências que corroboram essa teoria incluem o fato de mitocôndrias e cloroplastos possuírem seu próprio DNA circular bicatenário desprovido de histonas (semelhante ao bacteriano), ribossomos 70S próprios, dupla membrana (a interna com lipídios bacterianos e a externa derivada da vesícula endocítica) e capacidade de autoduplicação binária independente do núcleo celular.", ["Endossimbiose: mitocôndrias (bactérias aeróbias) e cloroplastos (cianobactérias)", "DNA próprio circular sem histonas (análogo ao cromossomo bacteriano)", "Ribossomos 70S bacterianos no interior da organela (sensíveis a antibióticos)", "Dupla membrana lipoproteica (a externa derivada da fagocitose celular ancestral)", "Autoduplicação independente por fissão binária simples"], "O DNA mitocondrial em seres humanos é de HERANÇA MATERNA EXCLUSIVA! Durante a fecundação, apenas o núcleo do espermatozoide penetra no ovócito secundário; as mitocôndrias do flagelo do espermatozoide se degradam no citoplasma materno, de modo que todas as nossas mitocôndrias descendem do óvulo materno.", "<p>Em testes laboratoriais de triagem farmacológica, constatou-se que certos antibióticos que inibem a síntese proteica ligando-se a ribossomos 70S de bactérias patogênicas também reduzem significativamente a síntese de proteínas no interior das mitocôndrias de células humanas, sem interferir com os ribossomos 80S do citoplasma celular.</p>", "Essa semelhança funcional e estrutural entre os ribossomos mitocondriais e os bacterianos constitui evidência biológica que sustenta a:", ["geração espontânea das organelas por coagulação de sais minerais citosólicos.", "transformação reversa de organelas animais em cromossomos circulares de vírus.", "hipótese autotrófica pura de surgimento do núcleo celular em fungos filamentosos.", "capacidade de bactérias realizarem digestão autofágica mediada por lisossomos.", "Teoria Endossimbiótica sobre a origem das mitocôndrias a partir de procariontes aeróbios."], 4, "A presença de ribossomos do tipo 70S e de DNA circular bicatenário no interior das mitocôndrias e cloroplastos, bem como sua sensibilidade seletiva aos mesmos antibióticos que atacam ribossomos de procariontes, constitui uma das provas moleculares mais contundentes da Teoria Endossimbiótica de Lynn Margulis, demonstrando a ancestralidade bacteriana dessas organelas energéticas. Alternativa correta: E. Distratores: A resgata a abiogênese refutada por Pasteur; C, D e E formulam proposições sem respaldo científico ou fora do escopo da biogênese organelar."], "Teoria Sintética da Evolução (Neodarwinismo)": ["Darwin não soube explicar em sua época qual era a origem da variabilidade entre os indivíduos nem como as características eram transmitidas hereditariamente. No século XX, a síntese evolutiva moderna (Neodarwinismo) integrou a seleção natural darwiniana aos conhecimentos da genética mendeliana, da biologia molecular e da citogenética. Estabeleceu-se que os fatores que geram variabilidade genética nova na população são as mutações gênicas e cromossômicas (única fonte primária de alelos novos) e a recombinação gênica (crossing-over meiótico e segregação independente). Por outro lado, a seleção natural, a deriva genética (flutuação aleatória de frequências alélicas, marcante em populações pequenas) e as migrações atuam orientando ou alterando essas frequências ao longo do tempo.", ["Neodarwinismo: Darwinismo + Genética mendeliana e Biologia molecular", "Fonte primária de variabilidade nova: MUTAÇÃO ao acaso (DNA)", "Recombinação gênica: crossing-over meiótico e fecundação sexuada", "Seleção natural: orienta a evolução favorecendo os mais aptos ao ambiente", "Deriva genética: alterações estocásticas aleatórias (efeito gargalo e do fundador)"], "A mutação ocorre AO ACASO e de forma espontânea! A seleção natural NÃO é ao acaso: ela atua filtrando de forma direcional, estabilizadora ou disruptiva as variantes que conferem maior sucesso reprodutivo no contexto ecológico local.", "<p>Durante o século XIX, na Inglaterra industrializada, a queima massiva de carvão pelas fábricas cobriu os troncos das árvores de fuligem escura, eliminando os líquens claros. Pesquisadores registraram que a mariposa <i>Biston betularia</i>, anteriormente abundante na sua forma clara salpicada, passou a ter uma frequência esmagadora de mariposas pretas melanotípicas nas regiões fabris (melanismo industrial).</p>", "De acordo com a síntese evolutiva moderna, a alteração na proporção de mariposas claras e escuras ao longo das décadas fabris ocorreu porque:", ["a fuligem impregnada na pele das mariposas induziu a conversão direta de seus genes em alelos de melanina.", "as mariposas escuras aprenderam a se esconder na fumaça tóxica para fugir da poluição ácida.", "as mariposas claras migraram para o interior das chaminés para se protegerem da chuva ácida.", "os pássaros predadores tornaram-se daltônicos devido à inalação de enxofre e passaram a capturar apenas mariposas claras.", "a mutação para a cor escura, já presente na população, conferiu camuflagem contra pássaros predadores nos troncos escurecidos, elevando a sobrevivência das mariposas melânicas."], 4, "O alelo que confere coloração melânica escura já existia na população prévia em baixa frequência por mutação aleatória. Com o escurecimento dos troncos pela fuligem fabril, as mariposas claras perderam sua camuflagem natural e tornaram-se presas fáceis para as aves insetívoras, enquanto as escuras ficaram crípticas. Com maior sobrevivência e reprodução diferencial (seleção natural), as mariposas escuras transmitiram seus alelos com maior frequência às gerações seguintes. Alternativa correta: E. Distratores: A é lamarckismo por indução química; B é finalismo teleológico; D e E formulam hipóteses fantasiosas sem suporte biológico."], "Terapia gênica, testes de DNA e bioética": ["A aplicação das tecnologias de DNA revolucionou a medicina diagnóstica, forense e terapêutica. Nos testes de DNA para identificação criminal ou determinação de paternidade, não se sequenciam genomas inteiros: analisam-se regiões polimórficas não-codificantes repetitivas denominadas STRs (Short Tandem Repeats / microssatélites) e VNTRs; os fragmentos são amplificados por PCR e separados por eletroforese em gel de agarose ou poliacrilamida segundo a massa molecular e carga elétrica, revelando padrões de bandas únicos para cada indivíduo (impressão digital genética / DNA fingerprinting). Metade das bandas da criança obrigatoriamente coincide com a mãe biológica e a outra metade com o pai biológico. A terapia gênica visa tratar doenças genéticas hereditárias inserindo alelos funcionais normais nas células do paciente via vetores virais modificados (como adenovírus e lentivírus) ou por edição direcionada por CRISPR-Cas9, levantando importantes debates bioéticos sobre alterações em células da linhagem germinativa humana.", ["Teste de paternidade: bandas de DNA (STRs) do filho vêm 50% da mãe e 50% do pai biológico", "Eletroforese em gel: fragmentos menores de DNA correm mais rápido rumo ao polo positivo (ânodo)", "Terapia gênica somática: corrige genes em tecidos do paciente sem passar para os descendentes", "Terapia gênica germinativa: altera óvulos/espermatozoides/zigotos (passa para gerações futuras; dilema ético)", "DNA forense: probabilidade estatística de coincidência em múltiplos loci STR é menor que 1 em bilhões"], "No teste de DNA em gel de eletroforese: cada banda presente no perfil do filho que NÃO veio da mãe tem que ter vindo obrigatoriamente do PAI BIOLÓGICO! Se o suposto pai não tiver essa banda correspondente, a paternidade é sumariamente excluída.", "<p>Em uma perícia forense criminal, peritos recolheram uma amostra de sangue do agressor deixada na cena do crime. O DNA foi extraído, os loci de microssatélites (STRs) foram amplificados por PCR e a eletroforese em gel revelou o perfil genético do criminoso, comparado ao de três suspeitos detidos pela polícia.</p>", "A técnica de eletroforese separa os fragmentos de DNA ao longo do gel fundamentando-se primordialmente no fato de que o DNA possui:", ["carga líquida positiva decorrente dos íons de ferro presentes nas pontes de hidrogênio.", "lipídios saturados no interior da fita dupla que repelem a água do tampão salino.", "carga neutra que se move exclusivamente pela atração da força gravitacional da Terra.", "carga líquida negativa conferida pelos grupamentos fosfato, migrando em direção ao polo positivo com velocidade inversamente proporcional ao tamanho molecular dos fragmentos.", "capacidade de emitir radiação gama espontânea que derrete o gel de agarose."], 3, "O esqueleto de açúcares e fosfatos do DNA confere à molécula carga elétrica líquida fortemente negativa em pH neutro ou alcalino (devido aos grupos PO₄³⁻). Submetido a um campo elétrico, o DNA migra do polo negativo (cátodo) para o polo positivo (ânodo). A matriz do gel atua como uma peneira molecular: fragmentos menores de DNA encontram menor atrito e correm mais depressa, enquanto fragmentos maiores ficam retidos atrás, separando as bandas por tamanho. Alternativa correta: D. Distratores: A erra a carga e cita ferro inexistente; C, D e E formulam absurdos químicos."], "Termorregulação e homeostase": ["A homeostase é a capacidade do organismo vivo de manter seu meio interno em relativo equilíbrio dinâmico frente às oscilações do meio externo. Aves e mamíferos são animais endotérmicos (homeotérmicos): regulam sua temperatura corpórea central em patamares constantes por meio do calor metabólico interno. O hipotálamo atua como o centro termostático do encéfalo. Em resposta ao calor excessivo, o corpo desencadeia vasodilatação periférica (aumentando a irradiação de calor pela pele) e sudorese (cujo resfriamento decorre da absorção de calor latente pela evaporação da água do suor). Sob frio intenso, ocorrem vasoconstrição periférica, ereção de pelos/penas (aprisionando uma camada isolante de ar) e calafrios (contrações musculares rápidas para produzir calor metabólico).", ["Endotermia: calor gerado pelo metabolismo (aves e mamíferos)", "Ectotermia: temperatura depende de fontes externas de calor (répteis, anfíbios, peixes)", "Sudorese: o resfriamento ocorre pela evaporação da água (calor latente)", "Vasodilatação periférica: perde calor para o ambiente", "Vasoconstrição periférica: retém calor no núcleo corpóreo central"], "O suor só esfria o corpo se conseguir EVAPORAR! Em ambientes muito úmidos e quentes (como florestas equatoriais úmidas), a evaporação é lenta devido à alta umidade relativa do ar, dificultando a perda de calor e aumentando a sensação térmica e o risco de hipertermia.", "<p>Em um dia quente e seco de verão no interior de São Paulo, atletas em treinamento suam intensamente e apresentam a pele do rosto avermelhada. Biólogos explicam que esses dois mecanismos fisiológicos atuam de maneira integrada para evitar que a temperatura corpórea central ultrapasse os 37 °C.</p>", "O resfriamento corporal propiciado pela sudorese e a vermelhidão cutânea são explicados, respectivamente, por:", ["evaporação da água do suor absorvendo calor do corpo e vasodilatação dos capilares periféricos facilitando a perda de calor.", "condensação do vapor de água sobre a pele e vasoconstrição dos capilares dérmicos profundos.", "reação exotérmica de eletrólitos do suor e redução da frequência cardíaca de repouso.", "síntese de queratina impermeabilizante e relaxamento absoluto dos músculos esqueléticos.", "liberação de urina concentrada pela pele e contração dos vasos sanguíneos cerebrais."], 0, "A água do suor, ao mudar do estado líquido para o gasoso (evaporação), retira do corpo o calor latente de vaporização (~540 cal/g), resfriando a superfície cutânea. A vermelhidão da pele decorre da vasodilatação dos capilares superficiais regulada pelo sistema nervoso autônomo simpático, aumentando o fluxo sanguíneo periférico para que o calor interno seja dissipado por radiação e convecção. Alternativa correta: A. Distratores: A cita condensação (que liberaria calor) e vasoconstrição; C, D e E contrariam princípios físicos e anatômicos fundamentais."], "Transgenia, PCR e clonagem": ["A biotecnologia moderna utiliza ferramentas da engenharia genética para manipulação de ácidos nucleicos. Organismos Geneticamente Modificados (OGMs) transgênicos recebem e expressam genes funcionais de espécies filogeneticamente distintas (ex.: milho Bt com gene da bactéria <i>Bacillus thuringiensis</i> produtor de toxina contra lagartas). As enzimas de restrição atuam como tesouras moleculares cortando o DNA em sítios palindrômicos específicos, e a DNA ligase une os fragmentos em vetores plasmídicos recombinantes. A Reação em Cadeia da Polimerase (PCR) amplifica milhões de cópias de um fragmento específico de DNA <i>in vitro</i> por ciclos térmicos com DNA polimerase termoestável (Taq). A clonagem reprodutiva de mamíferos (como a ovelha Dolly) emprega a transferência nuclear de uma célula somática para um óvulo anucleado.", ["Transgênico: recebe e expressa gene funcional de outra espécie", "Enzimas de restrição (endonucleases): cortam o DNA em sequências palindrômicas específicas", "DNA ligase: sela e une fragmentos de DNA recombinante", "PCR: amplificação exponencial de fragmentos de DNA (testes de DNA, COVID-19, fósseis)", "Clonagem por transferência nuclear somática: indivíduo geneticamente idêntico ao doador do núcleo"], "Todo transgênico é um OGM, mas nem todo OGM é transgênico! Um organismo é transgênico somente quando recebe DNA de outra espécie. Se apenas um gene da própria espécie foi silenciado ou duplicado (edição gênica cisgênica), ele é OGM, mas não transgênico.", "<p>Para solucionar perdas causadas por lagartas em lavouras brasileiras, agrônomos desenvolveram cultivares de soja com inserção de sequências gênicas da bactéria de solo <i>Bacillus thuringiensis</i>. As plantas expressam em seus tecidos foliares a proteína inseticida Cry, letal para as pragas que mastigam suas folhas, sem causar toxicidade aos mamíferos que consomem os grãos.</p>", "As plantas de soja modificadas descritas no texto são classificadas como:", ["clones somáticos, por terem sido reproduzidas por enxertia tecidual.", "híbridos interespecíficos resultantes de polinização natural por abelhas nativas.", "mutantes induzidos por radiação ionizante de cobalto-60.", "espécies quimiotróficas artificiais incapazes de realizar fotossíntese.", "organismos transgênicos, por expressarem genes exógenos oriundos de um procarionte."], 4, "As plantas foram geradas pela inserção estável de um gene bacteriano (heterólogo/exógeno) em seu genoma vegetal via DNA recombinante, passando a expressar a proteína bacteriana inseticida. Essa introdução de material genético de uma espécie diferente define biologicamente um organismo transgênico. Alternativa correta: E. Distratores: A confunde clonagem com transgenia; C descreve melhoramento por mutagênese física; D é absurdo pois a soja continua fotoautótrofa; E descreve hibridização convencional sexual, impossível entre plantas e bactérias."], "Transpiração e condução de seiva nas plantas": ["O transporte de substâncias em plantas vasculares é realizado por dois tecidos condutores especializados. O xilema (lenho) é formado por células mortas lignificadas (traqueídes e elementos de vaso) que transportam a seiva bruta (água e íons inorgânicos) em sentido unidirecional ascendente, das raízes até as folhas. O motor principal dessa ascensão em grandes árvores é a Teoria da Tensão-Coesão-Adesão de Dixon: a transpiração foliar pelos estômatos cria uma pressão hidrostática negativa (tensão) que puxa a coluna contínua de água pelo xilema, mantida unida pelas pontes de hidrogênio (coesão) e pela atração à parede celular (adesão). O floema (líber) é formado por células vivas (elementos de tubo crivado e células companheiras) que transportam a seiva elaborada (orgânica, rica em sacarose) das fontes produtoras (folhas) para os drenos de consumo ou reserva (raízes, frutos, gemas) pelo modelo do fluxo de pressão de Münch.", ["Xilema (lenho): células mortas lignificadas; seiva bruta (água + sais) para cima", "Teoria de Dixon: Transpiração estomatar (tensão) + Coesão (pontes de H) + Adesão", "Floema (líber): células vivas; seiva elaborada (sacarose) multidirecional fonte → dreno", "Anel de Malpighi (cintamento): remoção de anel de casca remove o floema e mata a raiz por falta de açúcar"], "O 'Anel de Malpighi' cai com frequência: se você remover um anel da casca externa de uma árvore (cintamento), você remove o FLOEMA que fica na periferia do caule. A árvore continua puxando água pelo xilema interno, mas a raiz para de receber açúcares do floema e morre de fome semanas depois, matando a árvore inteira.", "<p>Em um experimento de fisiologia vegetal, um pesquisador removeu um anel completo da casca (cintamento ou anel de Malpighi) ao redor do tronco principal de uma árvore frutífera jovem, preservando intacto o cerne central de madeira.</p>", "Nas semanas subsequentes ao procedimento, o efeito fisiológico imediato e o desfecho biológico final observados nessa planta foram:", ["bloqueio da descida da seiva elaborada pelo floema, causando acúmulo de carboidratos acima do anel e morte lenta das raízes por inanição energética.", "interrupção imediata da condução de seiva bruta nas folhas e secamento das folhas em 24 horas.", "aumento explosivo da taxa de transpiração estomática com proliferação de flores no subsolo.", "conversão das raízes da planta em caules aéreos fotossintetizantes.", "paralisação da fotossíntese nas folhas por ausência total de gás carbônico no estroma."], 0, "O anel de Malpighi remove o córtex, a epiderme/periderme e o floema superficial, mantendo íntegro o xilema situado internamente. Com isso, a seiva bruta continua subindo pelas forças de Dixon e as folhas permanecem verdes por semanas. Entretanto, a seiva elaborada rica em sacarose produzida nas folhas não consegue descer até o sistema radicular, acumulando-se no bordo superior do anel (inchaço caulinar). Sem aporte de glicídios para a respiração de suas células não-fotossintetizantes, as raízes esgotam suas reservas e morrem por inanição, levando à morte posterior da planta como um todo. Alternativa correta: A. Distratores: A erra pois o xilema permanece funcional; C, D e E descrevem respostas fisiologicamente impossíveis."], "Tratamento de água e de esgoto sanitário": ["O saneamento ambiental exige infraestruturas distintas para tratamento de água potável (ETA) e tratamento de esgoto doméstico (ETE). Na Estação de Tratamento de Água (ETA), a água bruta captada passa por coagulação/floculação (com sulfato de alumínio para aglutinar partículas coloidais em flocos), decantação (deposição dos flocos no fundo por gravidade), filtração (em leitos de areia, cascalho e carvão ativado), cloração (desinfecção química bactericida e virucida com cloro residual protetor) e fluoretação (prevenção da cárie dentária na população). Na Estação de Tratamento de Esgoto (ETE), a matéria orgânica poluente é degradada por lodo ativado em tanques de aeração por bactérias decompositoras aeróbias, reduzindo drasticamente a Demanda Bioquímica de Oxigênio (DBO) antes do descarte no corpo hídrico receptor.", ["ETA (Água): Floculação (sulfato de alumínio) → Decantação → Filtração → Cloração → Fluoretação", "ETE (Esgoto): Redução da DBO (Demanda Bioquímica de Oxigênio) por bactérias decompositoras", "Cloração: mata microrganismos patogênicos e mantém cloro residual nas tubulações", "Fluoretação: medida de saúde pública obrigatória no Brasil para redução da cárie infantil"], "Cuidado: a água do esgoto NÃO vira água mineral de beber na saída da ETE convencional! O tratamento de esgoto tem como objetivo remover a matéria orgânica e reduzir a DBO para que o efluente possa ser devolvido ao rio sem causar a eutrofização e a morte de peixes.", "<p>Em uma Estação de Tratamento de Água (ETA) municipal, a adição de cal virgem e sulfato de alumínio à água bruta captada de uma represa promove a aglomeração de impurezas suspensas e argilas microscópicas em flocos densos e gelatinosos, os quais afundam lentamente nos tanques seguintes antes da passagem pelos filtros de areia.</p>", "Essa etapa inicial do tratamento físico-químico da água é denominada tecnicamente como:", ["cloração bactericida de contato.", "osmose reversa sob pressão hidrostática extrema.", "fluoretação preventiva contra microrganismos.", "destilação fracionada por aquecimento a vapor.", "floculação seguida de decantação."], 4, "O sulfato de alumínio atua como coagulante químico, desestabilizando as cargas elétricas das partículas suspensas na água e permitindo que se unam em flocos volumosos e densos (floculação). Na sequência, a água permanece em repouso nos decantadores, onde a força da gravidade faz os flocos decantarem no fundo do tanque, permitindo que a água sobrenadante translúcida siga para os filtros. Alternativa correta: E. Distratores: A é a desinfecção final; C é a adição de flúor; D e E são métodos industriais de dessalinização e purificação não usuais em ETAs convencionais."], "Vacinas gênicas de RNA mensageiro e vetores virais": ["As vacinas gênicas de RNA mensageiro (mRNA) e as baseadas em vetores virais recombinantes representam um marco transformador na imunização biotecnológica contra patógenos emergentes, como o coronavírus SARS-CoV-2. Diferente das vacinas convencionais — que utilizam vírus atenuados, inativados ou fragmentos proteicos sintéticos —, as vacinas de mRNA contêm a sequência nucleotídica que codifica a proteína antigênica (como a proteína Spike viral) encapsulada em nanopartículas lipídicas que protegem a molécula contra ribonucleases teciduais e facilitam a fusão com a membrana plasmática das células do hospedeiro. Uma vez no citosol, os ribossomos da própria célula humana traduzem o RNAm exógeno, sintetizando a proteína viral sem penetrar no núcleo celular nem alterar o DNA genômico do indivíduo. A proteína expressa é apresentada na superfície celular pelo complexo MHC, estimulando linfócitos T citotóxicos e linfócitos B a produzirem anticorpos neutralizantes e células de memória imunológica duradoura.", ["Mecanismo de ação: entrega da instrução genética (RNAm) para os ribossomos do hospedeiro produzirem o antígeno", "Nanopartículas lipídicas: protegem o RNAm da degradação enzimática e possibilitam a endocitose celular", "Segurança genética: o RNAm atua estritamente no citosol e se degrada rapidamente, sem integrar ao DNA nuclear", "Dupla resposta imune: induz produção de anticorpos neutralizantes (humoral) e linfócitos T CD8+ (celular)", "Vetores virais: utilizam adenovírus modificados e não-replicativos para carregar o gene do antígeno"], "No ENEM, atenção ao dogma molecular: vacina de RNA mensageiro NÃO ALTERA O DNA HUMANO! O RNAm permanece no citoplasma, é lido pelos ribossomos para produzir o antígeno viral e logo em seguida é destruído por enzimas celulares normais.", "<p>O desenvolvimento acelerado e a aplicação global de vacinas baseadas em tecnologia de RNA mensageiro (mRNA) contra a COVID-19 suscitaram discussões na sociedade civil quanto à segurança biológica dessa nova plataforma imunizante em comparação às vacinas tradicionais de vírus inativado.</p>", "A tecnologia de vacinas de mRNA confere imunidade ativa ao organismo receptor pelo fato de:", ["incorporar genes virais funcionais aos cromossomos nucleares dos linfócitos T de memória.", "fornecer a mensagem genética citosólica para que os próprios ribossomos celulares sintetizem o antígeno estimulador.", "injetar doses massivas de anticorpos prontos produzidos em cavalos imunizados em laboratório.", "induzir a divisão mitótica de bactérias mutualísticas intestinais produtoras de interferon.", "provocar infecção branda autorreplicativa no trato respiratório superior para treinar neutrófilos."], 1, "As vacinas de RNAm introduzem no citoplasma celular uma fita de RNA mensageiro sintético que é traduzida pelo maquinário ribossomal da própria célula vacinada. Os ribossomos produzem a proteína viral imunogênica (antígeno), que é exibida no complexo de histocompatibilidade principal (MHC), deflagrando a sensibilização de linfócitos e geração de memória imunológica sem risco de infecção ativa. Alternativa correta: B. Distratores: A é mito biológico (RNAm não altera DNA); C descreve soro heterólogo; D e E são absurdos fisiológicos."], "Verminoses (esquistossomose, teníase e ascaridíase)": ["As verminoses são infecções provocadas por platelmintos (vermes achatados) e nematelmintos (vermes cilíndricos). A esquistossomose ('barriga d'água') é causada pelo platelminto <i>Schistosoma mansoni</i>: ovos com espículo saem nas fezes humanas, eclodem na água doce liberando miracídios, que penetram no caramujo <i>Biomphalaria</i> (hospedeiro intermediário); deste saem cercárias móveis que penetram ativamente pela pele de banhistas. A teníase é causada por <i>Taenia solium</i> (porco) ou <i>Taenia saginata</i> (boi), adquirida ao ingerir carne malcozida com cisticercos; a cisticercose humana ocorre quando o homem ingere diretamente ovos de <i>Taenia solium</i> em água ou verduras contaminadas, alojando cisticercos no cérebro (neurocisticercose). A ascaridíase (lombriga) e a ancilostomíase (amarelão) são nematelmintoses ligadas à ausência de saneamento básico e higiene.", ["Esquistossomose: caramujo <i>Biomphalaria</i> (HI); cercária penetra na pele humana (HD)", "Teníase: ingestão de carne com cisticerco (o homem desenvolve o verme adulto no intestino)", "Cisticercose humana: ingestão de OVOS de <i>Taenia solium</i> (cisticerco nos tecidos do homem)", "Ascaridíase: ingestão de ovos embrionados de lombriga em água/alimentos", "Ancilostomíase/Necatoríase: penetração ativa de larvas filarioides pelo solo (amarelão)"], "Diferença crucial de prova: TENÍASE ≠ CISTICERCOSE! Comeu carne malcozida com 'canjiquinha' (cisticerco) → pega TENÍASE (solitária na barriga). Comeu salada ou bebeu água suja com OVOS de <i>Taenia solium</i> → pega CISTICERCOSE (larva no cérebro/músculo).", "<p>Em uma lagoa de águas calmas no interior do Nordeste, crianças costumam nadar durante as tardes quentes. Médicos locais identificaram vários casos de dermatite pruriginosa ('coceira de nadador'), seguida meses depois por hepatoesplenomegalia e ascite volumosa ('barriga d'água'). O exame parasitológico de fezes revelou ovos ovalados dotados de um nítido espículo lateral proeminente.</p>", "Para interromper eficazmente o ciclo de transmissão dessa verminose na lagoa, a medida profilática mais direta a ser adotada pelo poder público é:", ["promover a queima de pastagens para impedir a reprodução de carrapatos transmissores de ovos embrionados.", "eliminar a população de caramujos do gênero <i>Biomphalaria</i> e implantar rede coletora e tratamento de esgoto sanitário.", "vacinar em massa os suínos da região contra larvas cisticercos de tênias intestinais.", "adicionar cloro no sangue dos pacientes infectados para dissolver o tegumento dos nematoides.", "proibir o consumo de carne bovina malpassada comercializada nos açougues locais."], 1, "O quadro clínico (ovos com espículo lateral, ascite, penetração cutânea) diagnostica com precisão a esquistossomose mansônica. O ciclo requer saneamento básico para impedir que fezes humanas com ovos atinjam a água doce, e controle biológico ou químico dos caramujos pulmonados do gênero <i>Biomphalaria</i> (hospedeiro intermediário indispensável para a multiplicação e liberação de cercárias infectantes). Alternativa correta: B. Distratores: B cita carrapatos sem relação com esquistossomose; C e E tratam do complexo teníase-cisticercose; D sugere conduta médica perigosa e absurda."], "Vitaminas e distúrbios nutricionais": ["As vitaminas são compostos orgânicos heterogêneos indispensáveis ao metabolismo humano em quantidades diminutas (micronutrientes), atuando primariamente como cofatores enzimáticos (coenzimas) em reações bioquímicas vitais. Não são fontes diretas de calorias nem desempenham papéis estruturais plásticos primários. Classificam-se segundo a solubilidade em: Lipossolúveis (A, D, E e K), solúveis em lipídios e armazenadas no fígado e tecido adiposo (cujo excesso pode causar toxicidade por hipervitaminose); e Hidrossolúveis (vitamina C / ácido ascórbico e as do complexo B: B1, B2, B3, B6, B9, B12), solúveis em água, não armazenadas em grandes quantidades e prontamente excretadas na urina, exigindo reposição alimentar diária. Distúrbios por carência vitamínica (avitaminoses) causam quadros clínicos clássicos: escorbuto (falta de vitamina C, com sangramento gengival por colágeno frágil), raquitismo/osteomalácia (falta de vitamina D com ossos moles), beribéri (falta de vitamina B1/tiamina com polineurite e insuficiência cardíaca) e anemia perniciosa (falta de vitamina B12).", ["Lipossolúveis (A, D, E, K): armazenadas no fígado e gordura; absorvidas junto com lipídios", "Hidrossolúveis (C e complexo B): não armazenadas (exceto B12); excretadas na urina", "Vitamina C (ácido ascórbico): síntese do colágeno e antioxidante (falta gera escorbuto)", "Vitamina D (calciferol): absorção intestinal de cálcio; ativada pela radiação solar na pele (falta gera raquitismo)", "Vitamina B9 (ácido fólico): previne defeitos do fechamento do tubo neural (espinha bífida) no feto"], "Grávidas devem suplementar ÁCIDO FÓLICO (vitamina B9) antes e no início da gestação para evitar anencefalia e defeitos graves do fechamento do tubo neural no embrião! Essa é uma das perguntas mais recorrentes de saúde pública do ENEM.", "<p>Durante as grandes navegações dos séculos XV e XVI, marinheiros passavam meses em alto-mar alimentando-se exclusivamente de carne seca e biscoitos de trigo, sem acesso a frutas frescas ou hortaliças. Muitos desenvolviam sangramento gengival intenso, perda de dentes, hemorragias cutâneas e abertura espontânea de cicatrizes antigas.</p>", "Essa doença carencial histórica (escorbuto) decorria da privação nutricional de qual vitamina e de qual efeito metabólico direto?", ["Vitamina A; perda da capacidade mitótica de queratinócitos da córnea ocular.", "Vitamina K; destruição maciça de leucócitos fagocitários pelo ácido clorídrico gástrico.", "Vitamina D; bloqueio da absorção óssea de íons sódio e cloro na membrana alveolar.", "Vitamina C (ácido ascórbico); incapacidade de hidroxilação de prolina para a síntese correta de fibras colágenas.", "Vitamina B12; conversão descontrolada de hemoglobina em bile na vesícula biliar."], 3, "A vitamina C (ácido ascórbico) é um cofator indispensável para as enzimas prolil-hidroxilase e lisil-hidroxilase, responsáveis pela hidroxilação de resíduos de prolina e lisina durante a síntese de colágeno no retículo endoplasmático rugoso dos fibroblastos. Sem colágeno estável de tripla hélice, a parede dos capilares sanguíneos, a gengiva e o tecido conjuntivo de cicatrização perdem a resistência mecânica, provocando hemorragias capilares generalizadas e frouxidão dentária (escorbuto). Alternativa correta: D. Distratores: A descreve xeroftalmia; C, D e E formulam mecanismos bioquímicos incorretos."], "Vírus e viroses humanas (dengue, febre amarela, HIV)": ["Os vírus são agentes infecciosos acelulares compostos por material genético (DNA ou RNA) envolto por uma cápsula proteica (capsídeo) e, em alguns casos, um envelope lipoproteico derivado da membrana da célula hospedeira. São parasitas intracelulares obrigatórios, desprovidos de metabolismo próprio e de ribossomos para síntese proteica. Os retrovírus (como o HIV) possuem genoma de RNA e a enzima transcriptase reversa, que sintetiza DNA a partir do molde de RNA viral para se integrar ao genoma do hospedeiro (linfócitos T CD4+). Arboviroses como dengue, zika, chikungunya e febre amarela urbana são transmitidas pela picada da fêmea do mosquito vetor <i>Aedes aegypti</i>, exigindo combate aos criadouros de água parada como medida profilática primária.", ["Vírus: acelular, sem metabolismo próprio, parasita intracelular obrigatório", "Retrovírus (HIV): enzima transcriptase reversa (RNA → DNA)", "Arboviroses: dengue, zika, febre amarela, chikungunya (vetor <i>Aedes aegypti</i>)", "Profilaxia da dengue: eliminação de focos de reprodução do mosquito vetor", "Antibióticos NÃO funcionam contra vírus (antibióticos atuam em estruturas bacterianas)"], "O ENEM cobra muito: NUNCA tome antibiótico para tratar gripe, resfriado ou dengue! Antibióticos agem em parede celular bacteriana, ribossomos 70S ou DNA girase de bactérias. Como vírus não têm células nem parede celular, antibióticos têm eficácia ZERO contra vírus.", "<p>O vírus da imunodeficiência humana (HIV) ataca seletivamente as células do sistema imunológico, ligando-se especificamente aos receptores CD4 presentes na superfície dos linfócitos T auxiliares. No interior do citoplasma do linfócito, o vírus utiliza sua enzima transcriptase reversa para converter seu RNA de fita simples em uma molécula de DNA complementar de fita dupla, a qual é transportada para o núcleo e integrada ao cromossomo celular pela enzima integrase.</p>", "Medicamentos antirretrovirais inibidores da transcriptase reversa impedem no ciclo replicativo do HIV o(a):", ["síntese de DNA proviral a partir da fita molde de RNA viral no citoplasma celular.", "fixação mecânica das glicoproteínas do capsídeo na parede de celulose dos eritrócitos.", "tradução de ribossomos bacterianos no retículo endoplasmático liso.", "liberação de gás metano durante a mitose dos plasmócitos da linfa.", "oxidação de lisossomos por anticorpos monoclonais nos pulmões."], 0, "A transcriptase reversa é uma DNA polimerase RNA-dependente que catalisa a síntese de DNA proviral a partir do genoma de RNA do retrovírus. Fármacos inibidores dessa enzima (como a zidovudina - AZT) bloqueiam a produção desse DNA viral complementar no citoplasma do linfócito, impedindo sua posterior integração ao genoma do hospedeiro e interrompendo o ciclo de replicação. Alternativa correta: A. Distratores: A cita parede de celulose inexistente em células humanas; C, D e E formulam proposições absurdas e desconexas da virologia."], "Água, sais minerais e biomoléculas": ["A matéria viva é constituída por substâncias inorgânicas (água e sais minerais) e orgânicas (carboidratos, lipídios, proteínas, ácidos nucleicos e vitaminas). A água é o solvente universal biológico devido à sua polaridade e capacidade de formar pontes de hidrogênio, apresentando alto calor específico (atuando como estabilizador térmico) e elevado calor de vaporização. Entre os sais minerais destacam-se o cálcio (contração muscular, coagulação e ossos), ferro (grupo heme da hemoglobina), iodo (hormônios tireoidianos) e sódio/potássio (potencial elétrico celular). As proteínas são polímeros de aminoácidos com funções estruturais e catalíticas (enzimas), cuja conformação tridimensional é suscetível à desnaturação por calor e variações extremas de pH.", ["Água: molécula polar, alto calor específico, solvente biológico universal", "Ferro (Fe²⁺): componente central da hemoglobina para transporte de O₂", "Cálcio (Ca²⁺): contração muscular, sinapses e coagulação sanguínea", "Enzimas: catalisadores biológicos específicos; sofrem desnaturação térmica", "Carboidratos (glicose/amido/glicogênio) e Lipídios (reserva e membranas)"], "A febre muito alta (>41 °C) é perigosa porque provoca a DESNATURAÇÃO térmica das proteínas e enzimas do organismo, rompendo suas pontes de hidrogênio e desmanchando a conformação tridimensional ativa, paralisando o metabolismo celular.", "<p>Um cozinheiro preparou uma sobremesa adicionando pedaços frescos de abacaxi a uma solução aquosa quente de gelatina incolor de origem animal (rica em colágeno). Após horas na geladeira, a mistura permaneceu totalmente líquida e não endureceu. Em contrapartida, quando utilizou abacaxi em calda (previamente fervido em água e açúcar), a gelatina solidificou-se com consistência firme perfeita.</p>", "A incapacidade de solidificação da gelatina no primeiro preparo com abacaxi fresco ocorreu porque:", ["o ácido ascórbico do fruto fresco neutralizou a água líquida por precipitação salina.", "as enzimas proteolíticas (bromelina) do abacaxi fresco clivaram as cadeias de colágeno da gelatina.", "os lipídios insaturados da fruta fresca hidrolisaram as moléculas de glicose do colágeno.", "a celulose do fruto absorveu todo o cálcio necessário para a desnaturação da gelatina.", "o calor da geladeira congelou irreversivelmente as ligações peptídicas do caldo."], 1, "O abacaxi fresco contém bromelina, uma enzima proteolítica ativa capaz de digerir e quebrar as cadeias polipeptídicas de colágeno (proteína) da gelatina, impedindo que elas formem a rede tridimensional gelatinosa que aprisiona água. No abacaxi em calda, a fervura prévia desnaturou termicamente a bromelina, inativando seu sítio ativo e permitindo a solidificação normal da gelatina. Alternativa correta: B. Distratores: A, C, D e E formulam proposições bioquímicas incorretas (colágeno não é carboidrato e bromelina é enzima, não vitamina)."]};

/* Glossário Biológico com Busca e Copiar */
function vGlo(){
  const t=nz(st.gq.trim());
  let all=[];
  M.forEach((m,i)=>{
    SUB[i].forEach(sub=>{
      const c=C[sub.n];
      if(c&&c[1]){
        c[1].forEach(concept=>{
          if(!t||nz(concept+" "+sub.n+" "+m.n).includes(t)){
            all.push({concept,sub:sub.n,mod:m.n,i,j:SUB[i].findIndex(x=>x.n==sub.n)});
          }
        });
      }
    });
  });
  return`<h1 class="a">📖 Glossário de Conceitos Biológicos</h1><p class="a mu">Definições diretas, relações metabólicas e fórmulas conceituais cobradas na matriz do ENEM. Toque no botão para copiar qualquer conceito para suas anotações.</p><div class="srch a" style="--i:1"><input type="search" placeholder="Buscar conceito ou palavra-chave (ex: ATP, xilema, osmose, lípides...)" value="${st.gq}" oninput="st.gq=this.value;renderGlo()" autocomplete="off"></div><div id="glo-list" class="a" style="--i:2">${gloList(all)}</div>`;
}
function gloList(all){
  if(!all.length)return`<p class="mu">Nenhum conceito biológico encontrado para esta busca.</p>`;
  return`<div class="g3" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">${all.map(item=>`<div class="cd" style="padding:14px;cursor:default"><div style="font-size:12px;color:var(--mu);margin-bottom:4px">${item.mod} · <b>${item.sub}</b></div><div style="font-weight:600;font-size:14px;margin-bottom:10px;line-height:1.4">${item.concept}</div><div style="display:flex;gap:6px"><button class="bt gh" style="padding:4px 10px;font-size:12px" onclick="copyText('${item.concept.replace(/'/g,"\\'")}');showToast('Copiado para a área de transferência!')">📋 Copiar</button><button class="bt gh" style="padding:4px 10px;font-size:12px" onclick="go('s/${item.i}/${item.j}')">Ver assunto →</button></div></div>`).join("")}</div>`;
}
function renderGlo(){q("#glo-list").innerHTML=gloList(uniq(FLAT).flatMap((f)=>{const c=C[f.n];if(!c)return[];const t=nz(st.gq.trim());return c[1].filter(x=>!t||nz(x+" "+f.n+" "+M[f.i].n).includes(t)).map(concept=>({concept,sub:f.n,mod:M[f.i].n,i:f.i,j:f.j}))}))}
function copyText(txt){if(navigator.clipboard){navigator.clipboard.writeText(txt).catch(()=>{})}else{const el=document.createElement('textarea');el.value=txt;document.body.appendChild(el);el.select();document.execCommand('copy');document.body.removeChild(el)}}

/* Simulado & Quiz */
function vSim(){return`<h1 class="a">📝 Simulado de Biologia</h1><p class="a mu">Resolva blocos de questões contextualizadas no padrão ENEM com cronômetro integrado, feedback imediato e histórico de desempenho:</p><div class="g3">${[10,20,30,96].map((n,k)=>`<button class="cd sm a" style="--i:${k}" onclick="startSim(${n})"><b>${n>=96?"Completo":n}</b><span class="mu">${n>=96?"todas as 96 questões":"questões aleatórias"}</span></button>`).join("")}</div><h2 class="a">Quiz focado por módulo</h2><div class="chs a">${M.map((m,i)=>`<button class="ch" onclick="startMod(${i})">${IC[i]} ${m.n}</button>`).join("")}</div>`}
function startQuiz(list,title){Q={list,k:0,sel:null,score:0,t0:Date.now(),ans:[],title,saved:0};if(location.hash=="#/q")render();else go("q")}
const startSim=n=>startQuiz(shuf(uniq(FLAT)).slice(0,n),"Simulado · "+(n>=96?"Completo (96 questões)":n+" questões")),startMod=i=>startQuiz(shuf(SUB[i].map((x,j)=>({i,j,n:x.n}))),"Quiz · "+M[i].n);
function startRev(){const l=uniq(FLAT).filter(x=>S.wrong[x.n]);if(l.length)startQuiz(shuf(l),"Revisão de Erros")}
const redo=()=>startQuiz(shuf(Q.list.filter((x,k)=>!Q.ans[k].ok)),"Refazendo as erradas"),nextQ=()=>{Q.k++;Q.sel=null;render()};

function vQ(){if(!Q){location.replace("#/sim");return null}if(Q.k>=Q.list.length)return vRes();const it=Q.list[Q.k];
return`<div class="bc a"><a href="#/sim">← Sair do Simulado</a> · ${Q.title}</div><div class="qh a"><b>Questão ${Q.k+1} de ${Q.list.length}</b><span id="qs">✔ ${Q.score}</span><span id="qt">⏱ ${fmt(Math.floor((Date.now()-Q.t0)/1000))}</span></div>${bar(100*Q.k/Q.list.length)}<section class="bx a"><span class="bd ${SUB[it.i][it.j].l}">${M[it.i].n}</span><div id="qb">${qb(it.n,null,1)}</div></section><p class="mu">Atalhos: A–E responde · Enter ou → avança</p>`}

function vRes(){const n=Q.list.length,pc=Math.round(100*Q.score/n),by={};
if(!Q.saved){Q.saved=1;Q.sec=Math.floor((Date.now()-Q.t0)/1000);S.sims.unshift({d:Date.now(),t:Q.title,s:Q.score,n,sec:Q.sec});S.sims=S.sims.slice(0,15);sv()}
Q.ans.forEach((a,k)=>{const m=Q.list[k].i,o=by[m]||(by[m]={a:0,t:0});o.t++;if(a.ok)o.a++});const wr=n-Q.score;
